[gcode_macro _LH_XY_GUARD]
description: internal: the checks every sideways move inside a firmware macro must pass.  C=a|b marks the one carriage allowed to be lowered (in-nest moves of the eject and tip-check macros); the others must then be up or at their whole-deck travel height (B, _LH_TRAVEL_GUARD ALL=1); without C every Z must be up and the chain closed (dock macros).  EXCH=1 (exchange macros only) skips the carriage-lock check while inside the dock
gcode:
    {% set s = printer["gcode_macro _LH_STATE"] %}
    {% if not s.homed or printer.toolhead.homed_axes != "xyz" %}{action_raise_error("sideways move refused: not homed since restart/e-stop (G28)")}{% endif %}
    {% set pf = printer["gcode_macro _LH_PROFILE"] %}
    {% if s.grip == 0 and "gripper" not in pf.absent %}{action_raise_error("sideways move refused: gripper state UNKNOWN since restart")}{% endif %}
    {% if s.hold %}{action_raise_error("sideways move refused: hold %s latched" % s.hold)}{% endif %}
    {% if "dock" not in pf.absent and printer["gcode_macro _LH_DOCK"].bar != 0 %}{action_raise_error("sideways move refused: DOCK_BAR: the dock lift bar is not homed down")}{% endif %}
    {% set z = {"a": s.zpos_z_a, "b": s.zpos_z_b, "g": printer.toolhead.position.z} %}
    {% if params.C is not defined %}
    {% for c, zz in z.items() %}{% if zz > 0.01 %}{action_raise_error("sideways move refused: %s is not up" % c)}{% endif %}{% endfor %}
    {% if printer["gcode_button tools_up"].state != "PRESSED" %}{action_raise_error("sideways move refused: the all-tools-up chain is open")}{% endif %}
    {% else %}
    {% for c, zz in z.items() %}{% if c != params.C and zz > 0.01 %}
    _LH_TRAVEL_GUARD ONLY={c} ALL=1 WHO=sideways
    {% endif %}{% endfor %}
    {% endif %}
    {% if params.EXCH|default(0)|int != 1 %}
    _LH_TOOLS_LOCKED WHO=sideways
    {% endif %}

[gcode_macro _LH_MB1]
variable_b2_x: 264.0
variable_b2_y: -55.0
variable_half_x: 68.9
variable_half_y: 47.7
variable_max_speed: 10.0
variable_max_accel: 1000.0
gcode:

[gcode_macro LH_GRIPPER_LIFT]
description: Z=<mm> [SPEED=<mm/s>].  Raises the gripper Z (printer Z) to Z; while gripping over the MB-1 magnet (B4) the speed is limited to K15 (10 mm/s)
gcode:
    {% set s = printer["gcode_macro _LH_STATE"] %}
    {% set m = printer["gcode_macro _LH_MB1"] %}
    {% set g = printer["gcode_macro _LH_GEOM"] %}
    {% if not s.homed or printer.toolhead.homed_axes != "xyz" %}{action_raise_error("LH_GRIPPER_LIFT refused: not homed since restart/e-stop (G28)")}{% endif %}
    {% if params.Z|float > printer.toolhead.position.z %}{action_raise_error("LH_GRIPPER_LIFT: Z must be above the present position (use G0 Z to lower)")}{% endif %}
    {% set fx = printer.toolhead.position.x + g.axis_dx.g %}
    {% set fy = printer.toolhead.position.y + g.grip_dy %}
    {% set over_b2 = (fx - m.b2_x)|abs <= m.half_x and (fy - m.b2_y)|abs <= m.half_y %}
    {% set sp = params.SPEED|default(20)|float %}
    {% if s.grip == 2 and over_b2 %}{% set sp = [sp, m.max_speed]|min %}{% endif %}
    G90
    G0.1 Z{params.Z|float} F{sp * 60}
    M400

[gcode_macro _LH_TC_GUARD]
variable_zone_x0: -264.0
variable_zone_x1: -67.0
variable_zone_y0: -328.0
variable_zone_y1: -111.0
variable_min_tool_z: 129.0
variable_top_gripper: 341.0
gcode:
    {% set v = printer["gcode_macro _LH_TC_GUARD"] %}
    {% set d = printer["gcode_macro _LH_TOOLDEF"] %}
    {% set g = printer["gcode_macro _LH_GEOM"] %}
    {% set t = params.TOOL %}
    {% set c = params.C|default("g") %}
    {% set x = (params.X|default(printer.toolhead.position.x)|float) + g.axis_dx[c] %}
    {% set y = (params.Y|default(printer.toolhead.position.y)|float) + (g.grip_dy if c == "g" else g.noz_dy) %}
    {% set top = v.top_gripper if t == "gripper" else d.noz_top[t] - d.tip_len[d.tip[t]] %}
    {% set z_end = top - params.STROKE|float %}
    {% set over = v.zone_x0 <= x <= v.zone_x1 and v.zone_y0 <= y <= v.zone_y1 %}
    {% if over and z_end < v.min_tool_z and "thermocycler" in printer["gcode_macro _LH_PROFILE"].absent %}{action_raise_error("refused: DEVICE_ABSENT: thermocycler not fitted in build %s: the TC-1 zone (F1) stays closed below z %.1f (%s would go to z %.1f)" % (printer["gcode_macro _LH_PROFILE"].name, v.min_tool_z, t, z_end))}{% endif %}
    {% if over and z_end < v.min_tool_z and "thermocycler" not in printer["gcode_macro _LH_PROFILE"].absent and printer["gcode_button lid_parked"].state != "PRESSED" %}{action_raise_error("refused: %s would go to z %.1f over the TC-1 zone (F1) with the lid not parked" % (t, z_end))}{% endif %}

[gcode_macro LH_GRIPPER]
description: STATE=OPEN|CLOSED.  CLOSED drives to the closed position at the current limit set above.  Refused while the gripper state is UNKNOWN
gcode:
    {% set s = printer["gcode_macro _LH_STATE"] %}
    {% if not s.homed or printer.toolhead.homed_axes != "xyz" %}{action_raise_error("LH_GRIPPER refused: not homed since restart/e-stop (G28)")}{% endif %}
    {% if s.grip == 0 %}{action_raise_error("LH_GRIPPER refused: gripper state UNKNOWN since restart (a plate may be held): a person must run LH_GRIPPER_RELEASE CONFIRM=1")}{% endif %}
    {% if params.STATE|default("OPEN")|upper == "CLOSED" %}
    MANUAL_STEPPER_BASE STEPPER=gripper MOVE={params.TRAVEL|default(6.0)|float} SPEED=10 SYNC=1
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=grip VALUE=2
    {% else %}
    MANUAL_STEPPER_BASE STEPPER=gripper MOVE=0 SPEED=15 SYNC=1
    G4 P200
    M400
    _LH_GRIP_RELEASED_CHECK
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=grip VALUE=1
    {% endif %}

[gcode_macro _LH_GRIP_RELEASED_CHECK]
description: internal: after the jaws open, the NC gripped switch must read released; 'gripped' with open jaws = broken wire or jammed finger
gcode:
    {% if printer["gcode_button gripped"].state == "PRESSED" %}{action_raise_error("LH_GRIPPER: jaws open but the gripped switch still reads gripped (broken wire or jammed finger): stop")}{% endif %}

[gcode_macro LH_GRIPPER_RELEASE]
description: CONFIRM=1.  PERSON ONLY: opens the jaws to their open switch and clears the UNKNOWN state.  Run only when the gripper holds nothing or the held plate is resting on a nest
gcode:
    {% if params.CONFIRM|default(0)|int != 1 %}{action_raise_error("LH_GRIPPER_RELEASE: a person must confirm with CONFIRM=1 that releasing cannot drop a plate")}{% endif %}
    {% if not printer["gcode_macro _LH_STATE"].homed or printer.toolhead.homed_axes != "xyz" %}{action_raise_error("LH_GRIPPER_RELEASE refused: not homed since restart/e-stop (G28)")}{% endif %}
    MANUAL_STEPPER_BASE STEPPER=gripper SET_POSITION=30
    MANUAL_STEPPER_BASE STEPPER=gripper SPEED=10 MOVE=0 STOP_ON_ENDSTOP=home
    MANUAL_STEPPER_BASE STEPPER=gripper SPEED=2 MOVE=2 STOP_ON_ENDSTOP=inverted_probe
    MANUAL_STEPPER_BASE STEPPER=gripper SPEED=2 MOVE=0 STOP_ON_ENDSTOP=home
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=grip VALUE=1
    RESPOND MSG="gripper released and homed open by operator confirmation"

[gcode_macro LH_GRIPPER_ASSERT_HOLDING]
description: CONFIRM=1.  PERSON ONLY: after a restart with a plate in the jaws, declares the gripper CLOSED without moving it, so the plate can be carried to a nest and released there
gcode:
    {% if params.CONFIRM|default(0)|int != 1 %}{action_raise_error("LH_GRIPPER_ASSERT_HOLDING: a person must confirm with CONFIRM=1 that a plate is held")}{% endif %}
    {% if not printer["gcode_macro _LH_STATE"].homed or printer.toolhead.homed_axes != "xyz" %}{action_raise_error("LH_GRIPPER_ASSERT_HOLDING refused: not homed since restart/e-stop (G28)")}{% endif %}
    MANUAL_STEPPER_BASE STEPPER=gripper SET_POSITION={params.TRAVEL|default(6.0)|float}
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=grip VALUE=2

[gcode_macro PAUSE_FOR_DOOR]
gcode:
    RESPOND TYPE=error MSG="door opened: motor power (and the UV option) removed by SR2; host must stop issuing moves, then FIRMWARE_RESTART and re-home"

[gcode_macro _LH_DOCK]
variable_bar: -1.0
variable_stroke_mm: 50.0
variable_rise_mm: 31.1
variable_gap_mm: 3.0
variable_follow_mm: 13.0
variable_follow_step_mm: 1.0
variable_speed: 5.0
variable_home_speed: 5.0
variable_run_current: 1.3
variable_home_current: 0.6
variable_open_height_mm: 33.1
variable_xy_tol_mm: 0.5
variable_approach_mm: 15.0
variable_inrow_s: 302.0
gcode:

[gcode_macro _LH_EXCH_GUARD]
description: internal: C=a|b BAY=1..8 WHO=<cmd> MODE=drop|pick [TOOL=].  Refusals of LH_TOOL_PARK / LH_TOOL_PICK / LH_TOOL_EXCHANGE before the head enters the dock row (rendered after the caller's M400)
gcode:
    {% set s = printer["gcode_macro _LH_STATE"] %}
    {% set d = printer["gcode_macro _LH_TOOLDEF"] %}
    {% set k = printer["gcode_macro _LH_DOCK"] %}
    {% set c = params.C %}
    {% set n = params.BAY|int %}
    {% if not s.homed or printer.toolhead.homed_axes != "xyz" %}{action_raise_error("%s refused: not homed since restart/e-stop (G28)" % params.WHO)}{% endif %}
    {% if c not in ("a", "b") %}{action_raise_error("%s: CARRIAGE must be A or B" % params.WHO)}{% endif %}
    {% if n < 1 or n > 8 %}{action_raise_error("%s: BAY must be 1..8" % params.WHO)}{% endif %}
    {% if s.hold %}{action_raise_error("%s refused: hold %s latched" % (params.WHO, s.hold))}{% endif %}
    {% if s.grip == 0 %}{action_raise_error("%s refused: gripper state UNKNOWN" % params.WHO)}{% endif %}
    {% if s.tips_a or s.tips_b %}{action_raise_error("%s refused: TIPS on a carriage or their state UNKNOWN (no tips on EITHER carriage over the dock row: eject and observe first)" % params.WHO)}{% endif %}
    {% if printer.toolhead.position.z > 0.01 or s.zpos_z_a > 0.01 or s.zpos_z_b > 0.01 %}{action_raise_error("%s refused: every Z axis must be at 0" % params.WHO)}{% endif %}
    {% if printer["gcode_button tools_up"].state != "PRESSED" %}{action_raise_error("%s refused: the all-tools-up chain is open" % params.WHO)}{% endif %}
    {% if k.bar != 0 %}{action_raise_error("%s refused: DOCK_BAR: the dock lift bar is not homed down (%s): G28" % (params.WHO, k.bar))}{% endif %}
    {% if s.exch %}{action_raise_error("%s refused: an exchange is already in progress (exch latched): LH_HOLD_CLEAR and G28" % params.WHO)}{% endif %}
    {% if params.MODE == "drop" %}
    {% if s["mounted_" ~ c] == "" %}{action_raise_error("%s refused: carriage %s carries no tool" % (params.WHO, c))}{% endif %}
    {% if printer["gcode_button bay" ~ n].state == "PRESSED" %}{action_raise_error("%s refused: BAY_OCCUPIED: bay %d reads occupied (or its switch wire is broken)" % (params.WHO, n))}{% endif %}
    {% else %}
    {% if params.TOOL|default("") not in d.codes %}{action_raise_error("%s: unknown TOOL %s" % (params.WHO, params.TOOL|default("")))}{% endif %}
    {% if s["mounted_" ~ c] != "" %}{action_raise_error("%s refused: carriage %s already carries %s (park it first)" % (params.WHO, c, s["mounted_" ~ c]))}{% endif %}
    {% if printer["gcode_button bay" ~ n].state != "PRESSED" %}{action_raise_error("%s refused: BAY_EMPTY: bay %d reads empty" % (params.WHO, n))}{% endif %}
    {% endif %}
    _LH_TOOLS_LOCKED WHO={params.WHO}

[gcode_macro _LH_DOCK_ENTER]
description: internal: X to the row's right end at the present Y, then Y onto the bay row (all Z up, guarded)
gcode:
    {% set g = printer["gcode_macro _LH_GEOM"] %}
    {% set zs = printer["gcode_macro _LH_SIZE"] %}
    G90
    M400
    _LH_XY_GUARD
    G0.1 X{g.dock_entry_x} F{g.xy_speed * 60}
    M400
    _LH_XY_GUARD
    G0.1 Y{zs.dock_yf} F{g.xy_speed * 60}
    M400

[gcode_macro LH_DOCK_LEAVE]
description: Leave the dock row at its right end (X 465, then Y = the size file dock_exit_yf) with every Z up and the bar down.  Also the recovery route after a hold has been cleared and G28 run
gcode:
    {% set s = printer["gcode_macro _LH_STATE"] %}
    {% set g = printer["gcode_macro _LH_GEOM"] %}
    {% set zs = printer["gcode_macro _LH_SIZE"] %}
    {% if not s.homed or printer.toolhead.homed_axes != "xyz" %}{action_raise_error("LH_DOCK_LEAVE refused: not homed since restart/e-stop (G28)")}{% endif %}
    {% if s.tips_a or s.tips_b %}{action_raise_error("LH_DOCK_LEAVE refused: TIPS on a carriage (or their state UNKNOWN) inside the dock row")}{% endif %}
    G90
    M400
    _LH_XY_GUARD
    G0.1 X{g.dock_entry_x} F{g.xy_speed * 60}
    M400
    _LH_XY_GUARD
    G0.1 Y{zs.dock_exit_yf} F{g.xy_speed * 60}
    M400

[gcode_macro _LH_LIFT_HOME]
description: internal (homing and recovery): lower the dock lift bar onto its DOWN switch from an unknown height at home_current (it can only let the springs close a latch), then run current; bar = 0.  'No trigger' leaves bar = -1 (X/Y refused)
gcode:
    {% set k = printer["gcode_macro _LH_DOCK"] %}
    SET_GCODE_VARIABLE_BASE MACRO=_LH_DOCK VARIABLE=bar VALUE=-1.0
    SET_TMC_CURRENT_BASE STEPPER=dock_lift CURRENT={k.home_current}
    MANUAL_STEPPER_BASE STEPPER=dock_lift SET_POSITION={k.stroke_mm + 3.0}
    MANUAL_STEPPER_BASE STEPPER=dock_lift SPEED={k.home_speed} MOVE=-1.0 STOP_ON_ENDSTOP=home
    MANUAL_STEPPER_BASE STEPPER=dock_lift SET_POSITION=0
    SET_TMC_CURRENT_BASE STEPPER=dock_lift CURRENT={k.run_current}
    SET_GCODE_VARIABLE_BASE MACRO=_LH_DOCK VARIABLE=bar VALUE=0.0

[gcode_macro _LH_LIFT_MOVE]
description: internal (exchange steps only): TO=<mm> [SPEED=].  Raises or lowers the bar to TO (0 .. stroke) at <= the CAD speed, records it; the caller has checked the guard
gcode:
    {% set k = printer["gcode_macro _LH_DOCK"] %}
    {% set to = params.TO|float %}
    {% set v = params.SPEED|default(k.speed)|float %}
    {% if to < 0 or to > k.stroke_mm %}{action_raise_error("dock lift refused: %.2f outside 0..%.1f mm" % (to, k.stroke_mm))}{% endif %}
    {% if v <= 0 or v > k.speed %}{action_raise_error("dock lift refused: SPEED %.2f outside 0..%.1f mm/s" % (v, k.speed))}{% endif %}
    {% if k.bar < 0 %}{action_raise_error("dock lift refused: bar position UNKNOWN (G28)")}{% endif %}
    MANUAL_STEPPER_BASE STEPPER=dock_lift MOVE={to} SPEED={v} SYNC=1
    SET_GCODE_VARIABLE_BASE MACRO=_LH_DOCK VARIABLE=bar VALUE={to}

[gcode_macro _LH_LIFT_DOWN]
description: internal: lower the bar ONTO its DOWN switch (homing move from the recorded height; a missing switch ends in 'No trigger' with bar = -1)
gcode:
    {% set k = printer["gcode_macro _LH_DOCK"] %}
    SET_GCODE_VARIABLE_BASE MACRO=_LH_DOCK VARIABLE=bar VALUE=-1.0
    MANUAL_STEPPER_BASE STEPPER=dock_lift SPEED={k.speed} MOVE=-1.0 STOP_ON_ENDSTOP=home
    MANUAL_STEPPER_BASE STEPPER=dock_lift SET_POSITION=0
    SET_GCODE_VARIABLE_BASE MACRO=_LH_DOCK VARIABLE=bar VALUE=0.0

[gcode_macro _LH_HOLD_LOWERED]
description: internal: CODE=.  Latch the motion hold FIRST, then lower the bar onto its switch (the springs re-close the jaw on the stud, or on nothing) and stop: used when the latch did not open
gcode:
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=hold VALUE='"{params.CODE}"'
    RESPOND TYPE=error MSG="LH_HOLD CODE={params.CODE}: the dock lift bar is lowered (the latch re-closes on its own springs), Z stays; a person is needed (LH_HOLD_CLEAR CONFIRM=1, then G28)"
    _LH_LIFT_DOWN
    M400
    _LH_HOLD_RAISE CODE={params.CODE}

[gcode_macro _LH_LIFT_GUARD]
description: internal: C= BAY= MODE=drop|pick.  The checks before the bar may rise (head report guards): inside an exchange, bar down, head at bay BAY's centre (X and Y within 0.5 mm), Z at the step-1 stroke, bay switch made, latch LOCKED with the tool's code (drop) or CLOSED-EMPTY with code 0000 (pick), the other carriage and the gripper at s 0 with their latches closed.  Any failure LATCHES a hold (Z stays)
gcode:
    {% set s = printer["gcode_macro _LH_STATE"] %}
    {% set g = printer["gcode_macro _LH_GEOM"] %}
    {% set d = printer["gcode_macro _LH_TOOLDEF"] %}
    {% set k = printer["gcode_macro _LH_DOCK"] %}
    {% set zs = printer["gcode_macro _LH_SIZE"] %}
    {% set p = printer.toolhead.position %}
    {% set c = params.C %}
    {% set o = "b" if c == "a" else "a" %}
    {% set n = params.BAY|int %}
    {% set drop = params.MODE == "drop" %}
    {% set bx = g.bay_x0 + (n - 1) * g.bay_pitch - g.axis_dx[c] %}
    {% set want_s = g.dock_s if drop else g.dock_s - k.follow_mm %}
    {% set ns = namespace(code=0, ocode=0) %}
    {% for i in range(4) %}{% if printer["gcode_button hall_" ~ c ~ i].state == "PRESSED" %}{% set ns.code = ns.code + 2 ** i %}{% endif %}{% endfor %}
    {% set lk = "locked" if printer["gcode_button latch_" ~ c].state == "PRESSED" else ("empty" if printer["gcode_button latch_" ~ c ~ "_empty"].state == "PRESSED" else ("open" if printer["gcode_button latch_" ~ c ~ "_open"].state == "PRESSED" else "fault")) %}
    {% set lo = "locked" if printer["gcode_button latch_" ~ o].state == "PRESSED" else ("empty" if printer["gcode_button latch_" ~ o ~ "_empty"].state == "PRESSED" else ("open" if printer["gcode_button latch_" ~ o ~ "_open"].state == "PRESSED" else "fault")) %}
    {% set m = s["mounted_" ~ c] %}
    {% if not s.exch %}
    _LH_HOLD CODE=LIFT_OUTSIDE_EXCHANGE
    {% elif k.bar != 0 %}
    _LH_HOLD CODE=LIFT_BAR_NOT_DOWN
    {% elif (p.x - bx)|abs > k.xy_tol_mm or (p.y - zs.dock_yf)|abs > k.xy_tol_mm %}
    _LH_HOLD CODE=LIFT_NOT_AT_BAY
    {% elif (s["zpos_z_" ~ c] - want_s)|abs > 0.01 %}
    _LH_HOLD CODE=LIFT_NOT_AT_STROKE
    {% elif s["zpos_z_" ~ o] > 0.01 or p.z > 0.01 or lo not in ("locked", "empty") %}
    _LH_HOLD CODE=LIFT_OTHER_NOT_CLEAR
    {% elif printer["gcode_button cable_" ~ c].state != "PRESSED" %}
    _LH_HOLD CODE=CABLE
    {% elif printer["gcode_button bay" ~ n].state != "PRESSED" %}
    _LH_HOLD CODE=LIFT_NOT_SEATED
    {% elif drop and lk != "locked" %}
    _LH_HOLD CODE=LIFT_LATCH_NOT_LOCKED
    {% elif drop and (m == "" or ns.code != d.codes[m]) %}
    _LH_HOLD CODE=LIFT_CODE
    {% elif not drop and lk != "empty" %}
    _LH_HOLD CODE=LIFT_LATCH_NOT_EMPTY
    {% elif not drop and ns.code != 0 %}
    _LH_HOLD CODE=LIFT_CODE
    {% endif %}

[gcode_macro _LH_OPEN_VERIFY]
description: internal: C=.  After the bar went up (and an M400): the bar must stand at the open height (dock_bar_open made: else LIFT_STALL) and the latch read NOT CLOSED (else LATCH_NOT_OPEN).  On either, the hold is latched and the bar lowered before stopping
gcode:
    {% set c = params.C %}
    {% set lk = "locked" if printer["gcode_button latch_" ~ c].state == "PRESSED" else ("empty" if printer["gcode_button latch_" ~ c ~ "_empty"].state == "PRESSED" else ("open" if printer["gcode_button latch_" ~ c ~ "_open"].state == "PRESSED" else "fault")) %}
    {% if printer["gcode_button dock_bar_open"].state != "PRESSED" %}
    _LH_HOLD_LOWERED CODE=LIFT_STALL
    {% elif lk != "open" %}
    _LH_HOLD_LOWERED CODE=LATCH_NOT_OPEN
    {% endif %}

[gcode_macro _LH_RELEASE_VERIFY]
description: internal: C= BAY=.  Drop-off step 4 (bar down, an M400): latch CLOSED-EMPTY, code 0000, cable intact and bay still made; else HOLD (Z stays 13 mm above the seat)
gcode:
    {% set c = params.C %}
    {% set ns = namespace(code=0) %}
    {% for i in range(4) %}{% if printer["gcode_button hall_" ~ c ~ i].state == "PRESSED" %}{% set ns.code = ns.code + 2 ** i %}{% endif %}{% endfor %}
    {% set lk = "locked" if printer["gcode_button latch_" ~ c].state == "PRESSED" else ("empty" if printer["gcode_button latch_" ~ c ~ "_empty"].state == "PRESSED" else ("open" if printer["gcode_button latch_" ~ c ~ "_open"].state == "PRESSED" else "fault")) %}
    {% if printer["gcode_button cable_" ~ c].state != "PRESSED" %}
    _LH_HOLD CODE=CABLE
    {% elif lk == "fault" %}
    _LH_HOLD CODE=LATCH_WIRE
    {% elif ns.code != 0 or lk == "locked" %}
    _LH_HOLD CODE=TOOL_NOT_RELEASED
    {% elif lk == "open" %}
    _LH_HOLD CODE=LATCH_NOT_CLOSED
    {% elif printer["gcode_button bay" ~ params.BAY].state != "PRESSED" %}
    _LH_HOLD CODE=BAY_DISAGREE
    {% endif %}

[gcode_macro _LH_PICK_VERIFY]
description: internal: C= TOOL=.  Pick-up step 4 (bar down, an M400): cable intact, latch LOCKED, code == the expected tool's code; else HOLD before the tool leaves the bay pins (the tool still stands on them)
gcode:
    {% set c = params.C %}
    {% set d = printer["gcode_macro _LH_TOOLDEF"] %}
    {% set ns = namespace(code=0) %}
    {% for i in range(4) %}{% if printer["gcode_button hall_" ~ c ~ i].state == "PRESSED" %}{% set ns.code = ns.code + 2 ** i %}{% endif %}{% endfor %}
    {% set lk = "locked" if printer["gcode_button latch_" ~ c].state == "PRESSED" else ("empty" if printer["gcode_button latch_" ~ c ~ "_empty"].state == "PRESSED" else ("open" if printer["gcode_button latch_" ~ c ~ "_open"].state == "PRESSED" else "fault")) %}
    {% if printer["gcode_button cable_" ~ c].state != "PRESSED" %}
    _LH_HOLD CODE=CABLE
    {% elif lk == "fault" %}
    _LH_HOLD CODE=LATCH_WIRE
    {% elif ns.code != 0 and lk != "locked" %}
    _LH_HOLD CODE=HALF_LOCK
    {% elif lk == "locked" and ns.code == 0 %}
    _LH_HOLD CODE=MISSING_CODE
    {% elif ns.code != d.codes[params.TOOL] or lk != "locked" %}
    _LH_HOLD CODE=WRONG_TOOL
    {% endif %}

[gcode_macro _LH_BAY_EMPTY_VERIFY]
description: internal: BAY=.  After a pick-up the bay switch must read empty, else HOLD BAY_DISAGREE
gcode:
    {% if printer["gcode_button bay" ~ params.BAY].state == "PRESSED" %}
    _LH_HOLD CODE=BAY_DISAGREE
    {% endif %}

[gcode_macro _LH_INROW_GUARD]
description: internal (LH_TOOL_EXCHANGE): C= BAY=<next bay>.  Before the EMPTY carriage moves along the row at inrow_s to the next bay: latch CLOSED-EMPTY and code 0000, Z at inrow_s, the other carriage and the gripper at s 0, the head on the dock row, the bar down, the next bay occupied; else HOLD
gcode:
    {% set s = printer["gcode_macro _LH_STATE"] %}
    {% set k = printer["gcode_macro _LH_DOCK"] %}
    {% set zs = printer["gcode_macro _LH_SIZE"] %}
    {% set p = printer.toolhead.position %}
    {% set c = params.C %}
    {% set o = "b" if c == "a" else "a" %}
    {% set ns = namespace(code=0) %}
    {% for i in range(4) %}{% if printer["gcode_button hall_" ~ c ~ i].state == "PRESSED" %}{% set ns.code = ns.code + 2 ** i %}{% endif %}{% endfor %}
    {% if not s.exch or k.bar != 0 or (p.y - zs.dock_yf)|abs > k.xy_tol_mm %}
    _LH_HOLD CODE=INROW_STATE
    {% elif printer["gcode_button latch_" ~ c ~ "_empty"].state != "PRESSED" or ns.code != 0 or s["mounted_" ~ c] != "" %}
    _LH_HOLD CODE=INROW_NOT_EMPTY
    {% elif (s["zpos_z_" ~ c] - k.inrow_s)|abs > 0.01 or s["zpos_z_" ~ o] > 0.01 or p.z > 0.01 %}
    _LH_HOLD CODE=INROW_HEIGHT
    {% elif printer["gcode_button bay" ~ params.BAY].state != "PRESSED" %}
    _LH_HOLD CODE=BAY_EMPTY
    {% endif %}

[gcode_macro _LH_DROP]
description: internal: C= BAY=.  Drop-off steps 1-4 from Z 0 over bay BAY: seat, guard, bar up, verify open, 13 x (bar +1, Z -1), bar down onto its switch, verify released.  Ends with the empty carriage at dock_s - follow_mm
gcode:
    {% set g = printer["gcode_macro _LH_GEOM"] %}
    {% set k = printer["gcode_macro _LH_DOCK"] %}
    {% set c = params.C %}
    {% set up = k.rise_mm + k.gap_mm %}
    {% set nf = (k.follow_mm / k.follow_step_mm)|int %}
    MANUAL_STEPPER_BASE STEPPER=z_{c} MOVE={g.dock_s - k.approach_mm} SPEED={g.z_fast} SYNC=1
    MANUAL_STEPPER_BASE STEPPER=z_{c} MOVE={g.dock_s} SPEED={g.z_slow} SYNC=1
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=zpos_z_{c} VALUE={g.dock_s}
    M400
    _LH_LIFT_GUARD C={c} BAY={params.BAY} MODE=drop
    _LH_LIFT_MOVE TO={up}
    M400
    _LH_OPEN_VERIFY C={c}
    {% for i in range(1, nf + 1) %}
    MANUAL_STEPPER_BASE STEPPER=dock_lift MOVE={up + i * k.follow_step_mm} SPEED={k.speed} SYNC=1
    MANUAL_STEPPER_BASE STEPPER=z_{c} MOVE={g.dock_s - i * k.follow_step_mm} SPEED={g.z_slow} SYNC=1
    {% endfor %}
    SET_GCODE_VARIABLE_BASE MACRO=_LH_DOCK VARIABLE=bar VALUE={up + nf * k.follow_step_mm}
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=zpos_z_{c} VALUE={g.dock_s - nf * k.follow_step_mm}
    _LH_LIFT_DOWN
    M400
    _LH_RELEASE_VERIFY C={c} BAY={params.BAY}

[gcode_macro _LH_PICKUP]
description: internal: C= BAY= TOOL= FROM=<s now>.  Pick-up steps 1-5 over bay BAY: approach to dock_s - 13, guard, bar up, verify open, 13 x (Z +1, bar -1), bar down onto its switch, verify LOCKED with TOOL's code, Z up slowly off the bay pins and to 0, verify the bay empty
gcode:
    {% set g = printer["gcode_macro _LH_GEOM"] %}
    {% set k = printer["gcode_macro _LH_DOCK"] %}
    {% set c = params.C %}
    {% set s0 = g.dock_s - k.follow_mm %}
    {% set up = k.rise_mm + k.gap_mm + k.follow_mm %}
    {% set nf = (k.follow_mm / k.follow_step_mm)|int %}
    {% if params.FROM|float < s0 - k.approach_mm %}
    MANUAL_STEPPER_BASE STEPPER=z_{c} MOVE={s0 - k.approach_mm} SPEED={g.z_fast} SYNC=1
    {% endif %}
    MANUAL_STEPPER_BASE STEPPER=z_{c} MOVE={s0} SPEED={g.z_slow} SYNC=1
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=zpos_z_{c} VALUE={s0}
    M400
    _LH_LIFT_GUARD C={c} BAY={params.BAY} MODE=pick
    _LH_LIFT_MOVE TO={up}
    M400
    _LH_OPEN_VERIFY C={c}
    {% for i in range(1, nf + 1) %}
    MANUAL_STEPPER_BASE STEPPER=z_{c} MOVE={s0 + i * k.follow_step_mm} SPEED={g.z_slow} SYNC=1
    MANUAL_STEPPER_BASE STEPPER=dock_lift MOVE={up - i * k.follow_step_mm} SPEED={k.speed} SYNC=1
    {% endfor %}
    SET_GCODE_VARIABLE_BASE MACRO=_LH_DOCK VARIABLE=bar VALUE={up - nf * k.follow_step_mm}
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=zpos_z_{c} VALUE={s0 + nf * k.follow_step_mm}
    _LH_LIFT_DOWN
    M400
    _LH_PICK_VERIFY C={c} TOOL={params.TOOL}
    MANUAL_STEPPER_BASE STEPPER=z_{c} MOVE={g.dock_s - k.approach_mm} SPEED={g.z_slow} SYNC=1
    MANUAL_STEPPER_BASE STEPPER=z_{c} MOVE=0 SPEED={g.z_fast} SYNC=1
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=zpos_z_{c} VALUE=0
    M400
    _LH_BAY_EMPTY_VERIFY BAY={params.BAY}

[gcode_macro LH_TOOL_PARK]
description: CARRIAGE=A|B BAY=1..8.  Put the carriage's tool down in an empty bay (drop-off by the dock lift).  Reply: LH_TOOL RESULT=PARKED CARRIAGE=<c> BAY=<n> TOOL=<tool>
gcode:
    {% set c = params.CARRIAGE|default("")|lower %}
    {% set n = params.BAY|default(0)|int %}
    {% set s = printer["gcode_macro _LH_STATE"] %}
    {% set g = printer["gcode_macro _LH_GEOM"] %}
    {% set d = printer["gcode_macro _LH_TOOLDEF"] %}
    {% set t0 = s["mounted_" ~ c] if c in ("a", "b") else "" %}
    M400
    _LH_EXCH_GUARD C={c} BAY={n} WHO=LH_TOOL_PARK MODE=drop
    _LH_DOCK_ENTER
    M400
    _LH_XY_GUARD
    G0.1 X{g.bay_x0 + (n - 1) * g.bay_pitch - g.axis_dx[c]} F{g.xy_speed * 60}
    M400
    G4 P{d.settle_ms}
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=exch VALUE=1
    _LH_DROP C={c} BAY={n}
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=mounted_{c} VALUE='""'
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=nozzle_ok_{c} VALUE=0
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=contact_{c} VALUE=-1.0
    MANUAL_STEPPER_BASE STEPPER=z_{c} MOVE=0 SPEED={g.z_fast} SYNC=1
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=zpos_z_{c} VALUE=0
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=exch VALUE=0
    LH_DOCK_LEAVE
    RESPOND TYPE=command MSG="LH_TOOL RESULT=PARKED CARRIAGE={c|upper} BAY={n} TOOL={t0}"

[gcode_macro LH_TOOL_PICK]
description: CARRIAGE=A|B BAY=1..8 TOOL=<M10|M50|M300|S10|S100|S1000|SYR>.  Take the expected tool from an occupied bay onto an empty carriage (pick-up by the dock lift), verify it, find the pusher contact.  Reply: LH_TOOL RESULT=PICKED CARRIAGE=<c> BAY=<n> TOOL=<tool>
gcode:
    {% set c = params.CARRIAGE|default("")|lower %}
    {% set n = params.BAY|default(0)|int %}
    {% set t = params.TOOL|default("") %}
    {% set s = printer["gcode_macro _LH_STATE"] %}
    {% set g = printer["gcode_macro _LH_GEOM"] %}
    {% set d = printer["gcode_macro _LH_TOOLDEF"] %}
    {% set seen = ("," ~ t ~ ",") in s.nozzle_seen %}
    M400
    _LH_EXCH_GUARD C={c} BAY={n} WHO=LH_TOOL_PICK MODE=pick TOOL={t}
    _LH_DOCK_ENTER
    M400
    _LH_XY_GUARD
    G0.1 X{g.bay_x0 + (n - 1) * g.bay_pitch - g.axis_dx[c]} F{g.xy_speed * 60}
    M400
    G4 P{d.settle_ms}
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=exch VALUE=1
    _LH_PICKUP C={c} BAY={n} TOOL={t} FROM=0
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=mounted_{c} VALUE='"{t}"'
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=tips_{c} VALUE=0
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=nozzle_ok_{c} VALUE={1 if seen else 0}
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=exch VALUE=0
    LH_DOCK_LEAVE
    _LH_PUSHER_FIND C={c}
    RESPOND TYPE=command MSG="LH_TOOL RESULT=PICKED CARRIAGE={c|upper} BAY={n} TOOL={t}"

[gcode_macro LH_TOOL_EXCHANGE]
description: CARRIAGE=A|B PARK_BAY=1..8 PICK_BAY=1..8 TOOL=<tool>.  The CAD exchange in one pass: drop the carriage's tool in PARK_BAY, lift the empty carriage to inrow_s, move along the row to PICK_BAY, pick TOOL, leave.  Reply: LH_TOOL RESULT=EXCHANGED CARRIAGE=<c> PARK_BAY=<n> PICK_BAY=<m> PARKED=<tool> TOOL=<tool>
gcode:
    {% set c = params.CARRIAGE|default("")|lower %}
    {% set n = params.PARK_BAY|default(0)|int %}
    {% set m = params.PICK_BAY|default(0)|int %}
    {% set t = params.TOOL|default("") %}
    {% set s = printer["gcode_macro _LH_STATE"] %}
    {% set g = printer["gcode_macro _LH_GEOM"] %}
    {% set d = printer["gcode_macro _LH_TOOLDEF"] %}
    {% set k = printer["gcode_macro _LH_DOCK"] %}
    {% set t0 = s["mounted_" ~ c] if c in ("a", "b") else "" %}
    {% set seen = ("," ~ t ~ ",") in s.nozzle_seen %}
    {% if n == m %}{action_raise_error("LH_TOOL_EXCHANGE: PARK_BAY and PICK_BAY must differ")}{% endif %}
    {% if t not in d.codes %}{action_raise_error("LH_TOOL_EXCHANGE: unknown TOOL %s" % t)}{% endif %}
    M400
    _LH_EXCH_GUARD C={c} BAY={n} WHO=LH_TOOL_EXCHANGE MODE=drop
    _LH_EXCH_GUARD_BAY BAY={m} WHO=LH_TOOL_EXCHANGE
    _LH_DOCK_ENTER
    M400
    _LH_XY_GUARD
    G0.1 X{g.bay_x0 + (n - 1) * g.bay_pitch - g.axis_dx[c]} F{g.xy_speed * 60}
    M400
    G4 P{d.settle_ms}
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=exch VALUE=1
    _LH_DROP C={c} BAY={n}
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=mounted_{c} VALUE='""'
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=nozzle_ok_{c} VALUE=0
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=contact_{c} VALUE=-1.0
    MANUAL_STEPPER_BASE STEPPER=z_{c} MOVE={k.inrow_s} SPEED={g.z_fast} SYNC=1
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=zpos_z_{c} VALUE={k.inrow_s}
    M400
    _LH_INROW_GUARD C={c} BAY={m}
    G0.1 X{g.bay_x0 + (m - 1) * g.bay_pitch - g.axis_dx[c]} F{g.xy_speed * 60}
    M400
    G4 P{d.settle_ms}
    _LH_PICKUP C={c} BAY={m} TOOL={t} FROM={k.inrow_s}
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=mounted_{c} VALUE='"{t}"'
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=tips_{c} VALUE=0
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=nozzle_ok_{c} VALUE={1 if seen else 0}
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=exch VALUE=0
    LH_DOCK_LEAVE
    _LH_PUSHER_FIND C={c}
    RESPOND TYPE=command MSG="LH_TOOL RESULT=EXCHANGED CARRIAGE={c|upper} PARK_BAY={n} PICK_BAY={m} PARKED={t0} TOOL={t}"

[gcode_macro _LH_EXCH_GUARD_BAY]
description: internal: BAY= WHO=.  The pick bay of LH_TOOL_EXCHANGE must be 1..8 and read occupied (rendered after the caller's M400)
gcode:
    {% set n = params.BAY|int %}
    {% if n < 1 or n > 8 %}{action_raise_error("%s: PICK_BAY must be 1..8" % params.WHO)}{% endif %}
    {% if printer["gcode_button bay" ~ n].state != "PRESSED" %}{action_raise_error("%s refused: BAY_EMPTY: pick bay %d reads empty" % (params.WHO, n))}{% endif %}

[gcode_macro LH_DOCK_STATUS]
description: Reply: LH_DOCK BAR=<mm|UNKNOWN> BAR_OPEN=<0|1> LATCH_A=<LOCKED|EMPTY|OPEN|FAULT> LATCH_B=<...> EXCH=<0|1> BAYS=<8 bits, bay 1 first>
gcode:
    {% set k = printer["gcode_macro _LH_DOCK"] %}
    {% set out = {} %}
    {% for c in ["a", "b"] %}
    {% set _ = out.update({c: "LOCKED" if printer["gcode_button latch_" ~ c].state == "PRESSED" else ("EMPTY" if printer["gcode_button latch_" ~ c ~ "_empty"].state == "PRESSED" else ("OPEN" if printer["gcode_button latch_" ~ c ~ "_open"].state == "PRESSED" else "FAULT"))}) %}
    {% endfor %}
    {% set bays = [] %}{% for i in range(1, 9) %}{% set _ = bays.append("1" if printer["gcode_button bay" ~ i].state == "PRESSED" else "0") %}{% endfor %}
    RESPOND TYPE=command MSG="LH_DOCK BAR={'UNKNOWN' if k.bar < 0 else '%.1f' % k.bar} BAR_OPEN={1 if printer['gcode_button dock_bar_open'].state == 'PRESSED' else 0} LATCH_A={out.a} LATCH_B={out.b} EXCH={printer['gcode_macro _LH_STATE'].exch} BAYS={bays|join('')}"

[gcode_macro _LH_PUSHER_HOME]
description: internal: C=a|b.  Home a pusher onto its RETRACTED switch at pusher_home_current (<= 0.50 A) and <= 2 mm/s: if the switch failed the actuator would meet its internal stop 0.5 mm later at that current (maker's limit 0.57 A) and Klipper stops with 'No trigger'; back off, re-touch at 1 mm/s, restore the run current.  V2: no switch is read in this template
gcode:
    {% set d = printer["gcode_macro _LH_TOOLDEF"] %}
    {% set c = params.C %}
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=pos_{c} VALUE=-1.0
    SET_TMC_CURRENT_BASE STEPPER=pusher_{c} CURRENT={d.pusher_home_current}
    MANUAL_STEPPER_BASE STEPPER=pusher_{c} SET_POSITION={d.pusher_home_from}
    MANUAL_STEPPER_BASE STEPPER=pusher_{c} SPEED={d.pusher_home_speed} MOVE={d.pusher_home_to} STOP_ON_ENDSTOP=home
    MANUAL_STEPPER_BASE STEPPER=pusher_{c} SET_POSITION=0
    MANUAL_STEPPER_BASE STEPPER=pusher_{c} SPEED=1 MOVE=2 STOP_ON_ENDSTOP=inverted_probe
    MANUAL_STEPPER_BASE STEPPER=pusher_{c} SPEED=1 MOVE={d.pusher_home_to} STOP_ON_ENDSTOP=home
    MANUAL_STEPPER_BASE STEPPER=pusher_{c} SET_POSITION=0
    SET_TMC_CURRENT_BASE STEPPER=pusher_{c} CURRENT={d.pusher_run_current}
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=pos_{c} VALUE=0

[gcode_macro _LH_PUSHER_FIND]
description: internal: C=.  Home the pusher onto its switch (_LH_PUSHER_HOME), then step down until the contact switch trips; the contact must lie in contact_lo..contact_hi, else HOLD CONTACT.  V2: every contact read is in a macro rendered after an M400
gcode:
    {% set c = params.C %}
    {% set d = printer["gcode_macro _LH_TOOLDEF"] %}
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=contact_{c} VALUE=-1.0
    _LH_PUSHER_HOME C={c}
    M400
    _LH_PUSHER_PRECHECK C={c}
    {% for i in range(1, (d.contact_hi / 0.2)|int + 2) %}
    _LH_PUSHER_STEP C={c} POS={[i * 0.2, d.contact_hi]|min}
    {% endfor %}
    _LH_PUSHER_FIND_END C={c}

[gcode_macro _LH_PUSHER_PRECHECK]
description: internal: C=.  With the pusher retracted (after the M400) the contact switch must read open, else HOLD CONTACT (broken wire or stuck pad)
gcode:
    {% if printer["gcode_button contact_" ~ params.C].state == "PRESSED" %}
    _LH_HOLD CODE=CONTACT
    {% endif %}

[gcode_macro _LH_PUSHER_STEP]
gcode:
    {% set s = printer["gcode_macro _LH_STATE"] %}
    {% set c = params.C %}
    {% if s["contact_" ~ c] < 0 %}
    {% if printer["gcode_button contact_" ~ c].state == "PRESSED" %}
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=contact_{c} VALUE={s["pos_" ~ c]}
    {% else %}
    MANUAL_STEPPER_BASE STEPPER=pusher_{c} MOVE={params.POS|float} SPEED=1 SYNC=1
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=pos_{c} VALUE={params.POS|float}
    G4 P20
    M400
    {% endif %}
    {% endif %}

[gcode_macro _LH_PUSHER_FIND_END]
gcode:
    {% set s = printer["gcode_macro _LH_STATE"] %}
    {% set d = printer["gcode_macro _LH_TOOLDEF"] %}
    {% set k = s["contact_" ~ params.C] %}
    {% set m = s["mounted_" ~ params.C] %}
    {% set hi = d.contact_hi_tool[m] if m in d.contact_hi_tool else d.contact_hi %}
    {% if k < d.contact_lo or k > hi %}
    _LH_HOLD CODE=CONTACT
    {% endif %}

[gcode_macro _LH_PIPETTE_GUARD]
description: internal: C= TOOL= WHO=.  homed, no hold (motion and process), the carriage carries TOOL (else WRONG_TOOL refusal), the tool is armed and, if optional (SYR), commissioned, the pusher contact is known
gcode:
    {% set s = printer["gcode_macro _LH_STATE"] %}
    {% set d = printer["gcode_macro _LH_TOOLDEF"] %}
    {% if not s.homed or printer.toolhead.homed_axes != "xyz" %}{action_raise_error("%s refused: not homed since restart/e-stop (G28)" % params.WHO)}{% endif %}
    {% if params.C not in ("a", "b") %}{action_raise_error("%s: CARRIAGE must be A or B" % params.WHO)}{% endif %}
    {% if params.C not in printer["gcode_macro _LH_PROFILE"].carriages %}{action_raise_error("%s refused: CARRIAGE_ABSENT: carriage %s is not fitted in build %s" % (params.WHO, params.C|upper, printer["gcode_macro _LH_PROFILE"].name))}{% endif %}
    {% if s.hold %}{action_raise_error("%s refused: hold %s latched" % (params.WHO, s.hold))}{% endif %}
    {% if s.phold %}{action_raise_error("%s refused: process hold %s latched (no pipetting)" % (params.WHO, s.phold))}{% endif %}
    {% if s["mounted_" ~ params.C] != params.TOOL %}{action_raise_error("%s refused: WRONG_TOOL: carriage %s carries '%s', command is for %s" % (params.WHO, params.C, s["mounted_" ~ params.C], params.TOOL))}{% endif %}
    {% if params.TOOL not in d.codes %}{action_raise_error("%s refused: unknown TOOL %s" % (params.WHO, params.TOOL))}{% endif %}
    {% if s["tips_" ~ params.C] < 0 and params.WHO != "LH_PICK_TIP" %}{action_raise_error("%s refused: TIPS_UNKNOWN on carriage %s (ejected or parked, not observed): reuse blocked until LH_TIP_CHECK EXPECT=0/1 or LH_TIPS_CONFIRM" % (params.WHO, params.C))}{% endif %}
    {% if params.TOOL not in d.armed or not d.armed[params.TOOL] %}{action_raise_error("%s refused: tool %s not armed" % (params.WHO, params.TOOL))}{% endif %}
    {% if params.TOOL in d.optional and not d.commissioned[params.TOOL] %}{action_raise_error("%s refused: optional tool %s not commissioned (rig syringe tests first; _LH_TOOLDEF commissioned)" % (params.WHO, params.TOOL))}{% endif %}
    {% if s["contact_" ~ params.C] < 0 %}{action_raise_error("%s refused: pusher contact of carriage %s not found since the pick-up" % (params.WHO, params.C))}{% endif %}

[gcode_macro _LH_PUSHER_MOVE]
description: internal: C=a|b POS=mm SPEED=mm/s; the ONLY path that moves a pusher in normal work; records its position
gcode:
    {% if not printer["gcode_macro _LH_STATE"].homed or printer.toolhead.homed_axes != "xyz" %}{action_raise_error("pusher move refused: not homed since restart/e-stop (G28)")}{% endif %}
    {% if params.POS|float < 0 or params.POS|float > printer["gcode_macro _LH_TOOLDEF"].pusher_max %}{action_raise_error("pusher move refused: %.3f outside 0..35 mm" % params.POS|float)}{% endif %}
    {% if params.SPEED|float <= 0 or params.SPEED|float > printer["gcode_macro _LH_TOOLDEF"].pusher_vmax %}{action_raise_error("pusher move refused: PUSHER_SPEED %.2f mm/s outside 0..%.1f (force audit: the plunger force is met only at <= 5 mm/s)" % (params.SPEED|float, printer["gcode_macro _LH_TOOLDEF"].pusher_vmax))}{% endif %}
    MANUAL_STEPPER_BASE STEPPER=pusher_{params.C} MOVE={params.POS|float} SPEED={params.SPEED|float} SYNC=1
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=pos_{params.C} VALUE={params.POS|float}

[gcode_macro _LH_CARRIAGE_IS_UP]
description: internal: C=a|b; refuses unless that carriage's Z is at its top (0) or at its whole-deck travel height (B: the tip is then >= travel_margin_mm above every CAD item, i.e. in air)
gcode:
    {% set z = printer["gcode_macro _LH_STATE"]["zpos_z_" ~ params.C] %}
    {% if z > 0.01 %}
    _LH_TRAVEL_GUARD ONLY={params.C} ALL=1 WHO={params.WHO|default("command")}_TIP_IN_AIR
    {% endif %}

[gcode_macro LH_PREPARE]
description: CARRIAGE=A|B TOOL=<tool>.  Press the plunger to its first stop (tip in AIR)
gcode:
    _LH_PIPETTE_GUARD C={params.CARRIAGE|default("")|lower} TOOL={params.TOOL|default("")} WHO=LH_PREPARE
    _LH_CARRIAGE_IS_UP C={params.CARRIAGE|default("")|lower} WHO=LH_PREPARE
    _LH_PREPARE_DO C={params.CARRIAGE|default("")|lower} TOOL={params.TOOL|default("")}

[gcode_macro _LH_PREPARE_DO]
gcode:
    {% set d = printer["gcode_macro _LH_TOOLDEF"] %}
    _LH_PUSHER_MOVE C={params.C} POS={printer["gcode_macro _LH_STATE"]["contact_" ~ params.C] + d.first_stop[params.TOOL]} SPEED={d.default_speed_mm_s}

[gcode_macro LH_ASPIRATE]
description: CARRIAGE=A|B TOOL=<tool> UL=<uL> [SPEED=<uL/s>].  Releases the plunger by UL / ul_per_mm from at/below the first stop
gcode:
    {% for k in params %}{% if k not in ("CARRIAGE", "TOOL", "UL", "SPEED") %}{action_raise_error("LH_ASPIRATE refused: parameter %s is not allowed" % k)}{% endif %}{% endfor %}
    _LH_PIPETTE_GUARD C={params.CARRIAGE|default("")|lower} TOOL={params.TOOL|default("")} WHO=LH_ASPIRATE
    _LH_ASPIRATE_DO C={params.CARRIAGE|default("")|lower} TOOL={params.TOOL|default("")} UL={params.UL|default(0)|float}{(" SPEED=%s" % (params.SPEED|float)) if params.SPEED is defined else ""}
    {% if params.TOOL|default("") == "SYR" %}
    M400
    _LH_FOLLOW_CHECK C={params.CARRIAGE|default("")|lower}
    {% endif %}

[gcode_macro _LH_FOLLOW_CHECK]
description: internal: C=.  After an SYR fill (and an M400): the contact switch must read made (the plunger followed the pusher up on its return spring), else HOLD SYR_NOT_FOLLOWING
gcode:
    {% if printer["gcode_button contact_" ~ params.C].state != "PRESSED" %}
    _LH_HOLD CODE=SYR_NOT_FOLLOWING
    {% endif %}

[gcode_macro _LH_ASPIRATE_DO]
gcode:
    {% set c = params.C %}
    {% set t = params.TOOL %}
    {% set s = printer["gcode_macro _LH_STATE"] %}
    {% set d = printer["gcode_macro _LH_TOOLDEF"] %}
    {% set pos = s["pos_" ~ c] %}
    {% set k = s["contact_" ~ c] %}
    {% set ul = params.UL|float %}
    {% set upm = d.ul_per_mm[t] %}
    {% set speed = (params.SPEED|float / upm) if params.SPEED is defined else d.default_speed_mm_s %}
    {% if pos < 0 %}{action_raise_error("LH_ASPIRATE: pusher position unknown: home and prime first")}{% endif %}
    {% if pos > k + d.first_stop[t] + 0.01 %}{action_raise_error("LH_ASPIRATE: plunger is beyond the first stop (after a blow-out): LH_PREPARE in air first")}{% endif %}
    {% if ul <= 0 or ul > d.vmax[t] %}{action_raise_error("LH_ASPIRATE: UL=%.3f outside 0..%.1f" % (ul, d.vmax[t]))}{% endif %}
    {% set target = pos - ul / upm %}
    {% if target < k - 0.01 %}{action_raise_error("LH_ASPIRATE: not enough plunger travel left (%.3f mm needed, %.3f mm primed)" % (ul / upm, pos - k))}{% endif %}
    _LH_PUSHER_MOVE C={c} POS={target} SPEED={speed}

[gcode_macro LH_DISPENSE]
description: CARRIAGE=A|B TOOL=<tool> UL=<uL> [SPEED=<uL/s>] [BLOWOUT=1].  Presses by UL / ul_per_mm, never past the first stop; BLOWOUT=1 then goes to the blow-out stop.  Over the liquid waste (B3) both bottles must read below 80 % (WASTE_FULL)
gcode:
    {% for k in params %}{% if k not in ("CARRIAGE", "TOOL", "UL", "SPEED", "BLOWOUT") %}{action_raise_error("LH_DISPENSE refused: parameter %s is not allowed" % k)}{% endif %}{% endfor %}
    _LH_PIPETTE_GUARD C={params.CARRIAGE|default("")|lower} TOOL={params.TOOL|default("")} WHO=LH_DISPENSE
    M400
    _LH_DISPENSE_DO C={params.CARRIAGE|default("")|lower} TOOL={params.TOOL|default("")} UL={params.UL|default(0)|float} BLOWOUT={params.BLOWOUT|default(0)|int}{(" SPEED=%s" % (params.SPEED|float)) if params.SPEED is defined else ""}

[gcode_macro _LH_DISPENSE_DO]
gcode:
    {% set c = params.C %}
    {% set t = params.TOOL %}
    {% set s = printer["gcode_macro _LH_STATE"] %}
    {% set d = printer["gcode_macro _LH_TOOLDEF"] %}
    {% set g = printer["gcode_macro _LH_GEOM"] %}
    {% set pos = s["pos_" ~ c] %}
    {% set k = s["contact_" ~ c] %}
    {% set upm = d.ul_per_mm[t] %}
    {% set fs = k + d.first_stop[t] %}
    {% set speed = (params.SPEED|float / upm) if params.SPEED is defined else d.default_speed_mm_s %}
    {% set nx = printer.toolhead.position.x + g.axis_dx[c] %}
    {% set ny = printer.toolhead.position.y + g.noz_dy %}
    {% if (nx - g.waste_xy[0])|abs <= g.place_half[0] and (ny - g.waste_xy[1])|abs <= g.place_half[1] and "liquid_waste" in printer["gcode_macro _LH_PROFILE"].absent %}{action_raise_error("LH_DISPENSE refused: DEVICE_ABSENT: liquid waste (B3) not fitted in build %s" % printer["gcode_macro _LH_PROFILE"].name)}{% endif %}
    {% if (nx - g.waste_xy[0])|abs <= g.place_half[0] and (ny - g.waste_xy[1])|abs <= g.place_half[1] and "liquid_waste" not in printer["gcode_macro _LH_PROFILE"].absent and (printer["gcode_button waste1_ok"].state != "PRESSED" or printer["gcode_button waste2_ok"].state != "PRESSED") %}{action_raise_error("LH_DISPENSE refused: WASTE_FULL: a liquid-waste bottle reads >= 80 % (or its sensor/wire failed): empty it")}{% endif %}
    {% if pos < 0 %}{action_raise_error("LH_DISPENSE: pusher position unknown")}{% endif %}
    {% if params.UL|float <= 0 or params.UL|float > d.vmax[t] %}{action_raise_error("LH_DISPENSE: UL=%s outside 0..%.1f" % (params.UL, d.vmax[t]))}{% endif %}
    {% set target = pos + (params.UL|float) / upm %}
    {% if target > fs + 0.01 %}{action_raise_error("LH_DISPENSE: UL=%s would pass the first stop (%.3f > %.3f mm)" % (params.UL, target, fs))}{% endif %}
    {% if params.UL|float <= 2.0 %}
    G4 P{d.settle_ms}
    {% endif %}
    _LH_PUSHER_MOVE C={c} POS={target} SPEED={speed}
    {% if params.BLOWOUT|default(0)|int == 1 %}
    _LH_PUSHER_MOVE C={c} POS={k + d.blowout[t]} SPEED={d.default_speed_mm_s}
    {% endif %}

[gcode_macro LH_TIP_CHECK]
description: CARRIAGE=A|B TOOL=<tool> EXPECT=0|1.  Fail-safe: emitter-off reads blocked, then a clear reference reading.  Passes the tips through the gate and reports presence per channel; the result is the carriage's tip state (EXPECT=0 PASS -> none, EXPECT=1 PASS -> on, FAIL -> UNKNOWN).  NOT OBSERVED while not armed (state unchanged).  EXPECT=1 also primes the plunger (tip in air)
variable_armed: False
variable_gate_x: -174.0
variable_gate_y: -60.0
variable_gate_z: 105.0
variable_pitch_mm: 9.0
variable_tip_od_at_beam_mm: 3.0
variable_beam_aperture_mm: 1.0
variable_step_speed: 50.0
variable_settle_ms: 100
variable_z_speed: 25.0
variable_supply_off_ms: 200
variable_supply_on_ms: 400
gcode:
    {% set c = params.CARRIAGE|default("")|lower %}
    {% set t = params.TOOL|default("") %}
    {% set s = printer["gcode_macro _LH_STATE"] %}
    {% set d = printer["gcode_macro _LH_TOOLDEF"] %}
    {% set g = printer["gcode_macro _LH_GEOM"] %}
    {% set zs = printer["gcode_macro _LH_SIZE"] %}
    {% if not s.homed or printer.toolhead.homed_axes != "xyz" %}{action_raise_error("LH_TIP_CHECK refused: not homed since restart/e-stop (G28)")}{% endif %}
    {% if c in ("a", "b") and c not in printer["gcode_macro _LH_PROFILE"].carriages %}{action_raise_error("%s refused: CARRIAGE_ABSENT: carriage %s is not fitted in build %s" % ("LH_TIP_CHECK", c|upper, printer["gcode_macro _LH_PROFILE"].name))}{% endif %}
    {% if c not in ("a", "b") or s["mounted_" ~ c] != t %}{action_raise_error("LH_TIP_CHECK refused: WRONG_TOOL: carriage %s does not carry %s" % (c, t))}{% endif %}
    {% if d.tip[t] == "" %}{action_raise_error("LH_TIP_CHECK: tool %s takes no tips" % t)}{% endif %}
    {% set n = 8 if d.eight[t] else 1 %}
    {% if not armed %}
    RESPOND TYPE=command MSG="LH_TIP_CHECK CARRIAGE={c|upper} TOOL={t} EXPECT={params.EXPECT|int}: tip gate not armed (not commissioned); result NOT OBSERVED"
    {% else %}
    {% set x = gate_x - g.axis_dx[c] %}
    {% set y0 = gate_y - g.noz_dy - (n - 1) / 2.0 * pitch_mm %}
    {% set ns = namespace(top=0.0) %}{% for z in zs.zones %}{% if z[4] > ns.top %}{% set ns.top = z[4] %}{% endif %}{% endfor %}
    {% set s_up = [d.noz_top[t] - d.tip_len[d.tip[t]] - ns.top - g.travel_margin_mm, 0.0]|max|round(2) %}
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=tip_mask VALUE=0
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=gap_mask VALUE=0
    {% if s["zpos_z_" ~ c] > s_up %}
    _LH_CARRIAGE_Z C={c} Z={s_up} SPEED={z_speed} CHECK=1
    {% endif %}
    G90
    G0 X{x} Y{y0 - pitch_mm} F{g.xy_speed * 60}
    M400
    _LH_TC_GUARD TOOL={t} C={c} STROKE={d.gate_s[t]}
    _LH_CARRIAGE_Z C={c} Z={d.gate_s[t]} SPEED={z_speed} CHECK=1
    SET_PIN PIN=tip_gate_power VALUE=0
    G4 P{supply_off_ms}
    M400
    _LH_TIPGATE_SAMPLE KIND=off I=0
    SET_PIN PIN=tip_gate_power VALUE=1
    G4 P{supply_on_ms}
    M400
    _LH_TIPGATE_SAMPLE KIND=ref I=0
    {% for i in range(n) %}
    _LH_XY_GUARD C={c}
    G0.1 Y{y0 + i * pitch_mm} F{step_speed * 60}
    G4 P{settle_ms}
    M400
    _LH_TIPGATE_SAMPLE KIND=tip I={i}
    {% if i < n - 1 %}
    _LH_XY_GUARD C={c}
    G0.1 Y{y0 + (i + 0.5) * pitch_mm} F{step_speed * 60}
    G4 P{settle_ms}
    M400
    _LH_TIPGATE_SAMPLE KIND=gap I={i}
    {% endif %}
    {% endfor %}
    _LH_CARRIAGE_Z C={c} Z={s_up} SPEED={z_speed} CHECK=1
    _LH_TIPGATE_EVAL C={c} TOOL={t} N={n} EXPECT={params.EXPECT|int}
    {% endif %}
    {% if params.EXPECT|int == 1 %}
    LH_PREPARE CARRIAGE={c} TOOL={t}
    {% endif %}

[gcode_macro LH_NOZZLE_CHECK]
description: CARRIAGE=A|B TOOL=<tool> [FORCE=1].  At the first pick-up of a tool since power-up (and after power-up with a tool; later pick-ups of a tool already checked reply PASS at once unless FORCE=1): the BARE nozzle(s) must block the gate at the tool's nozzle stroke (position and type check, no tips).  Sets the carriage's nozzle_ok and remembers the tool (nozzle_seen); refused (NOT OBSERVED) while the gate is not armed.  Reply: LH_NOZZLE_CHECK RESULT=<PASS|FAIL>
gcode:
    {% set c = params.CARRIAGE|default("")|lower %}
    {% set t = params.TOOL|default("") %}
    {% set s = printer["gcode_macro _LH_STATE"] %}
    {% set d = printer["gcode_macro _LH_TOOLDEF"] %}
    {% set g = printer["gcode_macro _LH_GEOM"] %}
    {% set v = printer["gcode_macro LH_TIP_CHECK"] %}
    {% if not s.homed or printer.toolhead.homed_axes != "xyz" %}{action_raise_error("LH_NOZZLE_CHECK refused: not homed since restart/e-stop (G28)")}{% endif %}
    {% if c in ("a", "b") and c not in printer["gcode_macro _LH_PROFILE"].carriages %}{action_raise_error("%s refused: CARRIAGE_ABSENT: carriage %s is not fitted in build %s" % ("LH_NOZZLE_CHECK", c|upper, printer["gcode_macro _LH_PROFILE"].name))}{% endif %}
    {% if c not in ("a", "b") or s["mounted_" ~ c] != t or t == "" %}{action_raise_error("LH_NOZZLE_CHECK refused: WRONG_TOOL: carriage %s does not carry %s" % (c, t))}{% endif %}
    {% if s["tips_" ~ c] %}{action_raise_error("LH_NOZZLE_CHECK refused: tips on carriage %s, or their state UNKNOWN (eject and observe first)" % c)}{% endif %}
    {% if not v.armed %}{action_raise_error("LH_NOZZLE_CHECK: tip gate not armed: nozzle position NOT OBSERVED, carriage %s may not go down (commission the gate)" % c)}{% endif %}
    {% set n = 8 if d.eight[t] else 1 %}
    {% if s["nozzle_ok_" ~ c] and params.FORCE|default(0)|int != 1 %}
    RESPOND TYPE=command MSG="LH_NOZZLE_CHECK CARRIAGE={c|upper} RESULT=PASS (tool {t} checked since power-up: no new information; FORCE=1 to repeat)"
    {% else %}
    M400
    _LH_TOOLS_LOCKED WHO=LH_NOZZLE_CHECK
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=tip_mask VALUE=0
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=gap_mask VALUE=0
    {% if s["zpos_z_" ~ c] > 0.01 %}
    _LH_CARRIAGE_Z C={c} Z=0 SPEED={v.z_speed} CHECK=1
    {% endif %}
    G90
    G0 X{v.gate_x - g.axis_dx[c]} Y{v.gate_y - g.noz_dy - (n - 1) / 2.0 * v.pitch_mm - v.pitch_mm} F{g.xy_speed * 60}
    M400
    _LH_TC_GUARD TOOL={t} C={c} STROKE={d.nozzle_gate_s[t]}
    _LH_CARRIAGE_Z C={c} Z={d.nozzle_gate_s[t]} SPEED={v.z_speed} CHECK=1
    G4 P{v.settle_ms}
    M400
    _LH_TIPGATE_SAMPLE KIND=ref I=0
    {% for i in range(n) %}
    _LH_XY_GUARD C={c}
    G0.1 Y{v.gate_y - g.noz_dy - (n - 1) / 2.0 * v.pitch_mm + i * v.pitch_mm} F{v.step_speed * 60}
    G4 P{v.settle_ms}
    M400
    _LH_TIPGATE_SAMPLE KIND=tip I={i}
    {% endfor %}
    _LH_CARRIAGE_Z C={c} Z=0 SPEED={v.z_speed} CHECK=1
    _LH_NOZZLE_EVAL C={c} N={n} TOOL={t}
    {% endif %}

[gcode_macro _LH_NOZZLE_EVAL]
gcode:
    {% set s = printer["gcode_macro _LH_STATE"] %}
    {% set ok = s.tip_mask == 2 ** (params.N|int) - 1 %}
    RESPOND TYPE=command MSG="LH_NOZZLE_CHECK CARRIAGE={params.C|upper} RESULT={'PASS' if ok else 'FAIL'}"
    {% if ok %}
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=nozzle_ok_{params.C} VALUE=1
    {% if ("," ~ params.TOOL|default("") ~ ",") not in s.nozzle_seen %}
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=nozzle_seen VALUE='"{s.nozzle_seen}{params.TOOL|default("")},"'
    {% endif %}
    {% else %}
    {action_raise_error("LH_NOZZLE_CHECK: nozzle(s) of carriage %s not where expected: stop" % params.C)}
    {% endif %}

[gcode_macro _LH_TIPGATE_SAMPLE]
gcode:
    {% set s = printer["gcode_macro _LH_STATE"] %}
    {% set hit = 1 if printer["gcode_button tip_gate"].state == "PRESSED" else 0 %}
    {% if params.KIND == "off" %}
    {% if not hit %}{action_raise_error("LH_TIP_CHECK: gate reads clear with its emitter switched off (receiver output or PF9 shorted to 0 V, or TG_SW stuck on): stop")}{% endif %}
    {% elif params.KIND == "ref" %}
    {% if hit %}{action_raise_error("LH_TIP_CHECK: gate reads blocked at the clear reference position: sensor dead, unplugged or dirty: stop")}{% endif %}
    {% elif params.KIND == "tip" %}
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=tip_mask VALUE={s.tip_mask + hit * (2 ** (params.I|int))}
    {% else %}
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=gap_mask VALUE={s.gap_mask + hit * (2 ** (params.I|int))}
    {% endif %}

[gcode_macro _LH_TIPGATE_EVAL]
description: internal: C= TOOL= N= EXPECT=.  Result of one gate pass and the carriage's tip state from it (A4: the only places tip state changes besides the force-ended pick-up): EXPECT=0 PASS -> 0, EXPECT=1 PASS -> 1, FAIL -> -1 UNKNOWN (then stop).  Always replies one fixed line: LH_TIP_CHECK RESULT TOOL=<tool> EXPECT=<0|1> TIPS=<bit per channel> GAPS=<bit per gap, or -> RESOLVABLE=<0|1> SUPPLY_TEST=PASS REF_CLEAR=PASS RESULT=<PASS|FAIL>
gcode:
    {% set s = printer["gcode_macro _LH_STATE"] %}
    {% set n = params.N|int %}
    {% set e = params.EXPECT|int %}
    {% set full = 2 ** n - 1 %}
    {% set v = printer["gcode_macro LH_TIP_CHECK"] %}
    {% set geom = (v.pitch_mm - v.tip_od_at_beam_mm) > v.beam_aperture_mm %}
    {% set resolvable = geom and s.gap_mask == 0 %}
    {% set chans = [] %}
    {% for i in range(n) %}{% set _ = chans.append("1" if (s.tip_mask // (2 ** i)) % 2 == 1 else "0") %}{% endfor %}
    {% set gaps = [] %}
    {% for i in range(n - 1) %}{% set _ = gaps.append("1" if (s.gap_mask // (2 ** i)) % 2 == 1 else "0") %}{% endfor %}
    {% set g = gaps|join('') if n > 1 else "-" %}
    {% set ok = (e == 1 and s.tip_mask == full and s.gap_mask == 0 and geom) or (e == 0 and s.tip_mask == 0 and s.gap_mask == 0) %}
    RESPOND TYPE=command MSG="LH_TIP_CHECK RESULT TOOL={params.TOOL} EXPECT={e} TIPS={chans|join('')} GAPS={g} RESOLVABLE={1 if resolvable else 0} SUPPLY_TEST=PASS REF_CLEAR=PASS RESULT={'PASS' if ok else 'FAIL'}"
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=tips_{params.C|default("a")} VALUE={e if ok else -1}
    {% if not ok %}
    _LH_TIPGATE_RAISE MSG={"expected_tips_on_all_channels" if e == 1 else "expected_no_tips"} TIPS={chans|join('')} GAPS={g} RESOLVABLE={1 if resolvable else 0}
    {% endif %}

[gcode_macro _LH_TIPGATE_RAISE]
gcode:
    {action_raise_error("LH_TIP_CHECK: %s, saw TIPS=%s GAPS=%s RESOLVABLE=%s: stop (tip state UNKNOWN)" % (params.MSG|replace("_", " "), params.TIPS, params.GAPS, params.RESOLVABLE))}

[gcode_macro LH_TIPS_CONFIRM]
description: CARRIAGE=A|B TIPS=0|1 CONFIRM=1.  PERSON ONLY (while the tip gate is not commissioned, or after a failed check): declares what a person SAW on the carriage's nozzles.  Reply: LH_TIPS CARRIAGE=<c> TIPS=<0|1>
gcode:
    {% set c = params.CARRIAGE|default("")|lower %}
    {% if params.CONFIRM|default(0)|int != 1 %}{action_raise_error("LH_TIPS_CONFIRM: a person must look at the nozzles and confirm with CONFIRM=1")}{% endif %}
    {% if c not in ("a", "b") or params.TIPS|default(-1)|int not in (0, 1) %}{action_raise_error("LH_TIPS_CONFIRM: CARRIAGE=A|B TIPS=0|1")}{% endif %}
    {% if c not in printer["gcode_macro _LH_PROFILE"].carriages %}{action_raise_error("LH_TIPS_CONFIRM refused: CARRIAGE_ABSENT: carriage %s is not fitted in build %s" % (c|upper, printer["gcode_macro _LH_PROFILE"].name))}{% endif %}
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=tips_{c} VALUE={params.TIPS|int}
    RESPOND TYPE=command MSG="LH_TIPS CARRIAGE={c|upper} TIPS={params.TIPS|int} (person)"

[gcode_macro _LH_ZCUR]
variable_run_current: 0.9
variable_force_current: 1.3
variable_force_tools: ["M10", "M50", "M300"]
gcode:

[gcode_macro _LH_Z_FORCE]
description: internal: C=a|b TOOL=<tool> ON=1|0.  ON=1 raises that carriage's Z driver to force_current (eight-channel tools only), ON=0 restores run_current
gcode:
    {% set z = printer["gcode_macro _LH_ZCUR"] %}
    {% if params.TOOL in z.force_tools %}
    SET_TMC_CURRENT_BASE STEPPER=z_{params.C} CURRENT={z.force_current if params.ON|int == 1 else z.run_current}
    {% endif %}

[gcode_macro _LH_Z_NOMINAL]
description: internal: every Z driver back to run_current (cleans up after an error inside a force stroke)
gcode:
    {% set z = printer["gcode_macro _LH_ZCUR"] %}
    {% set pf = printer["gcode_macro _LH_PROFILE"] %}
    {% for ax in ([] if "gripper" in pf.absent else ["stepper_z"]) + (["z_a"] if "a" in pf.carriages else []) + (["z_b"] if "b" in pf.carriages else []) %}
    SET_TMC_CURRENT_BASE STEPPER={ax} CURRENT={z.run_current}
    {% endfor %}

[gcode_macro LH_PICK_TIP]
description: CARRIAGE=A|B TOOL=<tool> Z_START=<mm> Z_MAX=<mm> [STEP=0.2].  Lowers onto the rack from Z_START in steps until the force switch trips (or Z_MAX: error); Z_MAX - Z_START <= the tool's pick window; Z_MAX <= the place's CAD depth cap
variable_method: "switch"
variable_step_speed: 2.0
variable_settle_ms: 20
gcode:
    _LH_PIPETTE_GUARD C={params.CARRIAGE|default("")|lower} TOOL={params.TOOL|default("")} WHO=LH_PICK_TIP
    M400
    _LH_PICK_TIP_DO C={params.CARRIAGE|default("")|lower} TOOL={params.TOOL|default("")} Z_START={params.Z_START|default(-1)|float} Z_MAX={params.Z_MAX|default(-1)|float} STEP={params.STEP|default(0.2)|float}

[gcode_macro _LH_PICK_TIP_DO]
gcode:
    {% set c = params.C %}
    {% set t = params.TOOL %}
    {% set s = printer["gcode_macro _LH_STATE"] %}
    {% set d = printer["gcode_macro _LH_TOOLDEF"] %}
    {% set g = printer["gcode_macro _LH_GEOM"] %}
    {% set v = printer["gcode_macro LH_PICK_TIP"] %}
    {% set p = printer.toolhead.position %}
    {% if v.method == "none" %}{action_raise_error("LH_PICK_TIP: no force signal fitted (method none): pick-up by position only, result NOT OBSERVED")}{% endif %}
    {% if d.tip[t] == "" %}{action_raise_error("LH_PICK_TIP: tool %s takes no tips" % t)}{% endif %}
    {% if s["tips_" ~ c] != 0 %}{action_raise_error("LH_PICK_TIP refused: tips already on carriage %s, or their state is UNKNOWN (%s)" % (c, s["tips_" ~ c]))}{% endif %}
    {% if not s["nozzle_ok_" ~ c] %}{action_raise_error("LH_PICK_TIP refused: carriage %s nozzle not checked since the pick-up / power-up (LH_NOZZLE_CHECK)" % c)}{% endif %}
    {% if printer["gcode_button force_" ~ c].state == "PRESSED" %}{action_raise_error("LH_PICK_TIP refused: FORCE_SWITCH of carriage %s reads tripped before contact (broken wire or stuck rod)" % c)}{% endif %}
    {% set z0 = params.Z_START|float %}
    {% set z1 = params.Z_MAX|float %}
    {% if z1 - z0 > d.pick_window[t] or z1 <= z0 or z1 > 345.0 or z0 < 0 %}{action_raise_error("LH_PICK_TIP refused: window %.1f..%.1f outside the %s pick window (%.1f mm) or the stroke" % (z0, z1, t, d.pick_window[t]))}{% endif %}
    {% set st = params.STEP|float %}
    {% set n = ((z1 - z0) / st)|int %}
    _LH_PLACE_GUARD X={p.x + g.axis_dx[c]} Y={p.y + g.noz_dy} LINE=a WHO=LH_PICK_TIP C={c}
    _LH_DEPTH_GUARD C={c} TOOL={t} S={z1} X={p.x} Y={p.y} WHO=LH_PICK_TIP
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=seated VALUE=0
    _LH_Z_NOMINAL
    G4 P{d.settle_ms}
    _LH_CARRIAGE_Z C={c} Z={z0} SPEED={g.z_fast}
    _LH_Z_FORCE C={c} TOOL={t} ON=1
    M400
    {% for i in range(1, n + 2) %}
    _LH_PICK_STEP C={c} Z={[z0 + i * st, z1]|min} SPEED={v.step_speed}
    {% endfor %}
    _LH_Z_FORCE C={c} TOOL={t} ON=0
    _LH_PICK_END C={c}

[gcode_macro _LH_PICK_STEP]
gcode:
    {% set s = printer["gcode_macro _LH_STATE"] %}
    {% set v = printer["gcode_macro LH_PICK_TIP"] %}
    {% if s.seated == 0 %}
    {% if printer["gcode_button force_" ~ params.C].state == "PRESSED" %}
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=seated VALUE=1
    RESPOND MSG="LH_PICK_TIP carriage {params.C}: seated at Z {s['zpos_z_' ~ params.C]}"
    {% else %}
    _LH_CARRIAGE_Z C={params.C} Z={params.Z} SPEED={params.SPEED}
    G4 P{v.settle_ms}
    M400
    {% endif %}
    {% endif %}

[gcode_macro _LH_PICK_END]
gcode:
    {% if printer["gcode_macro _LH_STATE"].seated == 0 %}{action_raise_error("LH_PICK_TIP carriage %s: no force-switch trip within the window (jammed push-rod or no rack): stop" % params.C)}{% endif %}
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=tips_{params.C} VALUE=1

[gcode_macro LH_TIP_PARK]
description: CARRIAGE=A|B TOOL=M300 WELLS=<label> [SPOT=1..n].  Sets the mounted eight-channel tips down in a FREE spot of the size's tip parking (random access; SPOT or the first free one) and records the spot's owner (tool and wells).  Refused for a tool or carriage the CAD did not clear, without tips or with tips UNKNOWN, for an occupied spot, when full or unknown, until commissioned and until the strip force is measured within the limit.  Reply: LH_TIP_PARK RESULT=PARKED SPOT=<k> TOOL=<tool> WELLS=<label>
variable_armed: False
variable_parked: -1
variable_spots: []
variable_strip_force_limit_n: 174.0
variable_strip_force_measured_n: -1.0
variable_accel_restore: 2000.0
gcode:
    {% set c = params.CARRIAGE|default("")|lower %}
    {% set t = params.TOOL|default("") %}
    {% set w = params.WELLS|default("") %}
    {% set s = printer["gcode_macro _LH_STATE"] %}
    {% set d = printer["gcode_macro _LH_TOOLDEF"] %}
    {% set g = printer["gcode_macro _LH_GEOM"] %}
    {% set z = printer["gcode_macro _LH_SIZE"] %}
    {% set k = printer["gcode_macro LH_TIP_PARK"] %}
    {% set gate_armed = printer["gcode_macro LH_TIP_CHECK"].armed %}
    {% if not s.homed or printer.toolhead.homed_axes != "xyz" %}{action_raise_error("LH_TIP_PARK refused: not homed since restart/e-stop (G28)")}{% endif %}
    {% if s.hold %}{action_raise_error("LH_TIP_PARK refused: hold %s latched" % s.hold)}{% endif %}
    {% if c not in ("a", "b") or s["mounted_" ~ c] != t or t == "" %}{action_raise_error("LH_TIP_PARK refused: WRONG_TOOL: carriage %s does not carry %s" % (c, t))}{% endif %}
    {% if not z.tip_parking %}{action_raise_error("LH_TIP_PARK refused: size %s has no tip parking" % z.size)}{% endif %}
    {% set p = (z.tip_parking|list)[0] %}
    {% set v = z.tip_parking[p] %}
    {% if c not in v[4] or t not in v[5] %}{action_raise_error("LH_TIP_PARK refused: TIP_PARKING: %s (%s) takes only %s on carriage %s" % (p|upper, v[6], v[5]|join("/"), v[4]|join("/")|upper))}{% endif %}
    {% if not d.eight[t] %}{action_raise_error("LH_TIP_PARK refused: %s is not an eight-channel tool" % t)}{% endif %}
    {% if s["tips_" ~ c] != 1 %}{action_raise_error("LH_TIP_PARK refused: %s on carriage %s" % ("TIPS_UNKNOWN (not observed since the last eject, park or power-up)" if s["tips_" ~ c] < 0 else "no tips", c))}{% endif %}
    {% set okc = namespace(ok=w != "" and w|length <= 40) %}{% for ch in w %}{% if ch not in "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789:._-" %}{% set okc.ok = False %}{% endif %}{% endfor %}
    {% if not okc.ok %}{action_raise_error("LH_TIP_PARK refused: WELLS=<label> (1-40 of A-Z a-z 0-9 : . _ -) names the wells the set served (A4)")}{% endif %}
    {% if v[8] is none %}{action_raise_error("LH_TIP_PARK refused: NO_GEOMETRY: the CAD publishes no random-access spot geometry for %s (%s) in size %s" % (p|upper, v[6], z.size))}{% endif %}
    {% set geo = v[8] %}
    {% set nsp = geo.spots|length %}
    {% if k.parked < 0 or k.spots|length != nsp %}{action_raise_error("LH_TIP_PARK refused: PARKING_UNKNOWN since restart: a person empties the comb and declares it (LH_TIP_PARK_SET CONFIRM=1 SETS=0)")}{% endif %}
    {% set want = params.SPOT|default(0)|int %}
    {% set ns = namespace(i=-1) %}
    {% if want != 0 %}
    {% if want < 1 or want > nsp %}{action_raise_error("LH_TIP_PARK refused: SPOT=%d outside 1..%d" % (want, nsp))}{% endif %}
    {% if k.spots[want - 1] != "" %}{action_raise_error("LH_TIP_PARK refused: SPOT_OCCUPIED: spot %d holds %s" % (want, k.spots[want - 1]))}{% endif %}
    {% set ns.i = want - 1 %}
    {% else %}
    {% for e in k.spots %}{% if e == "" and ns.i < 0 %}{% set ns.i = loop.index0 %}{% endif %}{% endfor %}
    {% if ns.i < 0 %}{action_raise_error("LH_TIP_PARK refused: PARKING_FULL: %d of %d spots occupied at %s" % (k.parked, nsp, p|upper))}{% endif %}
    {% endif %}
    {% if not k.armed %}{action_raise_error("LH_TIP_PARK: tip parking not commissioned (set-down depth, spots and detents not measured): NOT COMMISSIONED")}{% endif %}
    {% if k.strip_force_measured_n < 0 %}{action_raise_error("LH_TIP_PARK refused: STRIP_FORCE_UNMEASURED: enter the rig's eight-tip strip force (CT-9) first")}{% endif %}
    {% if k.strip_force_measured_n > k.strip_force_limit_n %}{action_raise_error("LH_TIP_PARK refused: STRIP_FORCE_HIGH: measured %.0f N > %.0f N (coupling holding margin 1.5)" % (k.strip_force_measured_n, k.strip_force_limit_n))}{% endif %}
    {% set e = geo.spots[ns.i] %}
    {% set y = (geo.row_y - g.noz_dy)|round(2) %}
    _LH_CARRIAGE_Z C={c} Z=0 SPEED={g.z_fast}
    G90
    G0 X{(e[1] - g.axis_dx[c])|round(2)} Y{y}
    M400
    G4 P{d.settle_ms}
    _LH_CARRIAGE_Z C={c} Z={geo.s_above} SPEED={g.z_fast}
    _LH_CARRIAGE_Z C={c} Z={geo.s_slide} SPEED={geo.z_mm_s}
    M400
    _LH_XY_GUARD C={c}
    SET_VELOCITY_LIMIT_BASE ACCEL={geo.slide_accel}
    G0.1 X{(e[2] - g.axis_dx[c])|round(2)} F{geo.slide_mm_s * 60}
    SET_VELOCITY_LIMIT_BASE ACCEL={k.accel_restore}
    M400
    _LH_CARRIAGE_Z C={c} Z={geo.s_seat} SPEED={geo.z_mm_s}
    _LH_Z_FORCE C={c} TOOL={t} ON=1
    _LH_CARRIAGE_Z C={c} Z={geo.s_seat - geo.strip_mm} SPEED={geo.strip_mm_s}
    _LH_Z_FORCE C={c} TOOL={t} ON=0
    _LH_CARRIAGE_Z C={c} Z=0 SPEED={g.z_fast}
    {% set ns2 = namespace(txt="") %}{% for x in k.spots %}{% set ns2.txt = ns2.txt ~ ("," if loop.index0 else "") ~ '"' ~ ((t ~ "|" ~ w) if loop.index0 == ns.i else x) ~ '"' %}{% endfor %}
    SET_GCODE_VARIABLE_BASE MACRO=LH_TIP_PARK VARIABLE=spots VALUE='[{ns2.txt}]'
    SET_GCODE_VARIABLE_BASE MACRO=LH_TIP_PARK VARIABLE=parked VALUE={k.parked + 1}
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=tips_{c} VALUE=-1
    RESPOND TYPE=command MSG="LH_TIP_PARK RESULT=PARKED SPOT={ns.i + 1} TOOL={t} WELLS={w}"
    {% if gate_armed %}
    LH_TIP_CHECK CARRIAGE={c|upper} TOOL={t} EXPECT=0
    {% endif %}

[gcode_macro LH_TIP_UNPARK]
description: CARRIAGE=A|B TOOL=M300 WELLS=<label> [SPOT=1..n].  Re-picks the set that TOOL parked for WELLS (random access: SPOT, or the spot owned by TOOL and WELLS): bare nozzles over the spot, force-ended pick-up (LH_PICK_TIP), up out of the detent, slide to the group's entry, lift.  Refused with tips on or UNKNOWN, for an empty spot, for a set owned by another tool or other wells (A4), when unknown and until commissioned.  Reply: LH_TIP_PARK RESULT=REPICKED SPOT=<k>
gcode:
    {% set c = params.CARRIAGE|default("")|lower %}
    {% set t = params.TOOL|default("") %}
    {% set w = params.WELLS|default("") %}
    {% set k = printer["gcode_macro LH_TIP_PARK"] %}
    {% set s = printer["gcode_macro _LH_STATE"] %}
    {% set d = printer["gcode_macro _LH_TOOLDEF"] %}
    {% set g = printer["gcode_macro _LH_GEOM"] %}
    {% set z = printer["gcode_macro _LH_SIZE"] %}
    {% set gate_armed = printer["gcode_macro LH_TIP_CHECK"].armed %}
    {% if not s.homed or printer.toolhead.homed_axes != "xyz" %}{action_raise_error("LH_TIP_UNPARK refused: not homed since restart/e-stop (G28)")}{% endif %}
    {% if s.hold %}{action_raise_error("LH_TIP_UNPARK refused: hold %s latched" % s.hold)}{% endif %}
    {% if c not in ("a", "b") or s["mounted_" ~ c] != t or t == "" %}{action_raise_error("LH_TIP_UNPARK refused: WRONG_TOOL: carriage %s does not carry %s" % (c, t))}{% endif %}
    {% if not z.tip_parking %}{action_raise_error("LH_TIP_UNPARK refused: size %s has no tip parking" % z.size)}{% endif %}
    {% set p = (z.tip_parking|list)[0] %}
    {% set v = z.tip_parking[p] %}
    {% if c not in v[4] or t not in v[5] %}{action_raise_error("LH_TIP_UNPARK refused: TIP_PARKING: %s (%s) takes only %s on carriage %s" % (p|upper, v[6], v[5]|join("/"), v[4]|join("/")|upper))}{% endif %}
    {% if s["tips_" ~ c] %}{action_raise_error("LH_TIP_UNPARK refused: %s on carriage %s" % ("TIPS_UNKNOWN" if s["tips_" ~ c] < 0 else "tips already on", c))}{% endif %}
    {% if v[8] is none %}{action_raise_error("LH_TIP_UNPARK refused: NO_GEOMETRY: the CAD publishes no random-access spot geometry for %s (%s) in size %s" % (p|upper, v[6], z.size))}{% endif %}
    {% set geo = v[8] %}
    {% set nsp = geo.spots|length %}
    {% if k.parked < 0 or k.spots|length != nsp %}{action_raise_error("LH_TIP_UNPARK refused: PARKING_UNKNOWN since restart")}{% endif %}
    {% set own = t ~ "|" ~ w %}
    {% set want = params.SPOT|default(0)|int %}
    {% set ns = namespace(i=-1) %}
    {% if want != 0 %}
    {% if want < 1 or want > nsp %}{action_raise_error("LH_TIP_UNPARK refused: SPOT=%d outside 1..%d" % (want, nsp))}{% endif %}
    {% if k.spots[want - 1] == "" %}{action_raise_error("LH_TIP_UNPARK refused: SPOT_EMPTY: spot %d holds no set" % want)}{% endif %}
    {% if k.spots[want - 1] != own %}{action_raise_error("LH_TIP_UNPARK refused: SET_OWNER: spot %d was parked by %s (asked: %s)" % (want, k.spots[want - 1], own))}{% endif %}
    {% set ns.i = want - 1 %}
    {% else %}
    {% for e in k.spots %}{% if e == own and ns.i < 0 %}{% set ns.i = loop.index0 %}{% endif %}{% endfor %}
    {% if ns.i < 0 %}{action_raise_error("LH_TIP_UNPARK refused: SET_OWNER: no spot holds a set parked by %s (%s)" % (own, "nothing parked" if k.parked == 0 else "%d sets parked by others" % k.parked))}{% endif %}
    {% endif %}
    {% if not k.armed %}{action_raise_error("LH_TIP_UNPARK: tip parking not commissioned: NOT COMMISSIONED")}{% endif %}
    {% set e = geo.spots[ns.i] %}
    {% set y = (geo.row_y - g.noz_dy)|round(2) %}
    _LH_CARRIAGE_Z C={c} Z=0 SPEED={g.z_fast}
    G90
    G0 X{(e[2] - g.axis_dx[c])|round(2)} Y{y}
    M400
    G4 P{d.settle_ms}
    _LH_CARRIAGE_Z C={c} Z={geo.s_above} SPEED={g.z_fast}
    LH_PICK_TIP CARRIAGE={c|upper} TOOL={t} Z_START={geo.s_seat + geo.repick_over - d.pick_window[t]} Z_MAX={geo.s_seat + geo.repick_over}
    M400
    _LH_CARRIAGE_Z C={c} Z={geo.s_slide} SPEED={geo.z_mm_s}
    M400
    _LH_XY_GUARD C={c}
    SET_VELOCITY_LIMIT_BASE ACCEL={geo.slide_accel}
    G0.1 X{(e[1] - g.axis_dx[c])|round(2)} F{geo.slide_mm_s * 60}
    SET_VELOCITY_LIMIT_BASE ACCEL={k.accel_restore}
    M400
    _LH_CARRIAGE_Z C={c} Z={geo.s_above} SPEED={geo.z_mm_s}
    _LH_CARRIAGE_Z C={c} Z=0 SPEED={g.z_fast}
    {% set ns2 = namespace(txt="") %}{% for x in k.spots %}{% set ns2.txt = ns2.txt ~ ("," if loop.index0 else "") ~ '"' ~ ("" if loop.index0 == ns.i else x) ~ '"' %}{% endfor %}
    SET_GCODE_VARIABLE_BASE MACRO=LH_TIP_PARK VARIABLE=spots VALUE='[{ns2.txt}]'
    SET_GCODE_VARIABLE_BASE MACRO=LH_TIP_PARK VARIABLE=parked VALUE={k.parked - 1}
    RESPOND TYPE=command MSG="LH_TIP_PARK RESULT=REPICKED SPOT={ns.i + 1} TOOL={t} WELLS={w}"
    {% if gate_armed %}
    LH_TIP_CHECK CARRIAGE={c|upper} TOOL={t} EXPECT=1
    {% endif %}

[gcode_macro LH_TIP_PARK_SET]
description: CONFIRM=1 SETS=0.  PERSON ONLY: after a restart, declares the tip parking EMPTY (a person has emptied it): every spot free.  Any other count is refused: after a restart a parked set's tool and wells are not known (A4 / V7)
gcode:
    {% set z = printer["gcode_macro _LH_SIZE"] %}
    {% if params.CONFIRM|default(0)|int != 1 %}{action_raise_error("LH_TIP_PARK_SET: a person must confirm with CONFIRM=1 that the comb is empty")}{% endif %}
    {% if not z.tip_parking %}{action_raise_error("LH_TIP_PARK_SET: size %s has no tip parking" % z.size)}{% endif %}
    {% set v = z.tip_parking[(z.tip_parking|list)[0]] %}
    {% set n = params.SETS|default(-1)|int %}
    {% if n < 0 or n > v[7] %}{action_raise_error("LH_TIP_PARK_SET: SETS=%d outside 0..%d" % (n, v[7]))}{% endif %}
    {% if n != 0 %}{action_raise_error("LH_TIP_PARK_SET: SETS=%d refused: after a restart a parked set's tool and wells are not known: empty the comb and declare SETS=0" % n)}{% endif %}
    {% set nsp = v[8].spots|length if v[8] is not none else v[7] %}
    SET_GCODE_VARIABLE_BASE MACRO=LH_TIP_PARK VARIABLE=spots VALUE='[{(['""'] * nsp)|join(",")}]'
    SET_GCODE_VARIABLE_BASE MACRO=LH_TIP_PARK VARIABLE=parked VALUE=0

[gcode_macro LH_TIP_PARK_STATUS]
description: Reply: LH_TIP_PARK KNOWN=<0|1> PARKED=<n> SPOTS=<k:EMPTY|tool|wells,...>
gcode:
    {% set k = printer["gcode_macro LH_TIP_PARK"] %}
    {% set out = [] %}{% for e in k.spots %}{% set _ = out.append(loop.index ~ ":" ~ (e if e else "EMPTY")) %}{% endfor %}
    RESPOND TYPE=command MSG="LH_TIP_PARK KNOWN={0 if k.parked < 0 else 1} PARKED={k.parked} SPOTS={out|join(',') if out else 'UNKNOWN'}"

[gcode_macro LH_EJECT_TIP]
description: CARRIAGE=A|B TOOL=<tool>.  Method B: nozzle row over the B1 funnel, Z driven 12 mm ABOVE the normal top so the fixed finger presses the pipette's ejector, slowly, then back to 0.  Disarmed until commissioned.  Refused when the tip bin is full or the drawer is open
variable_armed_ejector: False
variable_ej_nest_x: -22.25
variable_ej_travel: 12.0
variable_ej_speed: 2.0
variable_ej_return_speed: 10.0
variable_ej_current: 0.9
variable_ej_dwell_ms: 300
variable_ej_pos_tol: 0.5
variable_run_current: 0.9
variable_xy_speed: 150.0
variable_z_speed: 25.0
gcode:
    {% set c = params.CARRIAGE|default("")|lower %}
    {% set t = params.TOOL|default("") %}
    {% set s = printer["gcode_macro _LH_STATE"] %}
    {% set d = printer["gcode_macro _LH_TOOLDEF"] %}
    {% set g = printer["gcode_macro _LH_GEOM"] %}
    {% if not s.homed or printer.toolhead.homed_axes != "xyz" %}{action_raise_error("LH_EJECT_TIP refused: not homed since restart/e-stop (G28)")}{% endif %}
    {% if s.hold %}{action_raise_error("LH_EJECT_TIP refused: hold %s latched" % s.hold)}{% endif %}
    {% if c in ("a", "b") and c not in printer["gcode_macro _LH_PROFILE"].carriages %}{action_raise_error("%s refused: CARRIAGE_ABSENT: carriage %s is not fitted in build %s" % ("LH_EJECT_TIP", c|upper, printer["gcode_macro _LH_PROFILE"].name))}{% endif %}
    {% if c not in ("a", "b") or s["mounted_" ~ c] != t or t == "" or d.tip[t] == "" %}{action_raise_error("LH_EJECT_TIP refused: carriage %s does not carry a tip tool %s (the over-travel is only for a coded tool that takes tips)" % (c, t))}{% endif %}
    {% if printer["gcode_button drawer"].state != "PRESSED" %}{action_raise_error("LH_EJECT_TIP refused: DRAWER_OPEN (tip drawer not fully in, or its switch wire broken)")}{% endif %}
    {% if printer["gcode_button bin_clear"].state != "PRESSED" %}{action_raise_error("LH_EJECT_TIP refused: TIP_BIN_FULL (bin-full beam blocked, sensor dead or wire broken): empty the bin")}{% endif %}
    {% if not printer["gcode_macro LH_EJECT_TIP"].armed_ejector %}{action_raise_error("LH_EJECT_TIP: method B not commissioned: set variable armed_ejector after the dry run")}{% endif %}
    {% set gate_armed = printer["gcode_macro LH_TIP_CHECK"].armed %}
    _LH_Z_NOMINAL
    _LH_CARRIAGE_Z C={c} Z=0 SPEED={z_speed}
    _LH_PUSHER_MOVE C={c} POS=0 SPEED={d.default_speed_mm_s}
    {% set ex = g.tip_xy[0] + ej_nest_x - g.axis_dx[c] %}
    {% set ey = g.tip_xy[1] - g.noz_dy %}
    G90
    G0 X{ex} Y{ey} F{xy_speed * 60}
    M400
    G4 P{d.settle_ms}
    _LH_EJECT_OVERTRAVEL C={c} X={ex} Y={ey}
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=tips_{c} VALUE=-1
    {% if gate_armed %}
    LH_TIP_CHECK CARRIAGE={c|upper} TOOL={t} EXPECT=0
    {% else %}
    RESPOND TYPE=command MSG="LH_EJECT_TIP CARRIAGE={c|upper}: tips state UNKNOWN (gate not commissioned): LH_TIPS_CONFIRM CARRIAGE={c|upper} TIPS=0 CONFIRM=1 by a person"
    {% endif %}

[gcode_macro _LH_EJECT_OVERTRAVEL]
description: internal to LH_EJECT_TIP only: re-checks the funnel position and the carriage at execution time, then the method-B over-travel and return
gcode:
    {% set v = printer["gcode_macro LH_EJECT_TIP"] %}
    {% set s = printer["gcode_macro _LH_STATE"] %}
    {% set d = printer["gcode_macro _LH_TOOLDEF"] %}
    {% if (printer.toolhead.position.x - params.X|float)|abs > v.ej_pos_tol or (printer.toolhead.position.y - params.Y|float)|abs > v.ej_pos_tol %}{action_raise_error("eject over-travel refused: nozzle row not over the B1 funnel")}{% endif %}
    {% if s["zpos_z_" ~ params.C]|abs > 0.01 %}{action_raise_error("eject over-travel refused: Z not at the normal top")}{% endif %}
    {% if s["mounted_" ~ params.C] == "" or d.tip[s["mounted_" ~ params.C]] == "" %}{action_raise_error("eject over-travel refused: no tip tool coded on carriage %s" % params.C)}{% endif %}
    SET_TMC_CURRENT_BASE STEPPER=z_{params.C} CURRENT={v.ej_current}
    MANUAL_STEPPER_BASE STEPPER=z_{params.C} MOVE={0 - v.ej_travel} SPEED={v.ej_speed} SYNC=1
    G4 P{v.ej_dwell_ms}
    MANUAL_STEPPER_BASE STEPPER=z_{params.C} MOVE=0 SPEED={v.ej_return_speed} SYNC=1
    SET_TMC_CURRENT_BASE STEPPER=z_{params.C} CURRENT={v.run_current}

[gcode_macro _LH_CARRIAGE_Z]
description: internal: C=a|b Z=<mm, 0 = up> SPEED=<mm/s> [CHECK=1].  Through the guarded MANUAL_STEPPER (CHECK=1: the gate macros only, at the tip gate, where the nozzle is not yet checked or the tips are UNKNOWN: base move after the other axes' travel-height check and the carriage lock check)
gcode:
    {% if params.CHECK|default(0)|int == 1 %}
    M400
    _LH_TRAVEL_GUARD EXCEPT={params.C} ALL=1 WHO=gate_check
    _LH_TOOLS_LOCKED WHO=gate_check
    MANUAL_STEPPER_BASE STEPPER=z_{params.C} MOVE={params.Z|float} SPEED={params.SPEED|float} SYNC=1
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=zpos_z_{params.C} VALUE={params.Z|float}
    {% else %}
    MANUAL_STEPPER STEPPER=z_{params.C} MOVE={params.Z|float} SPEED={params.SPEED|float} SYNC=1
    {% endif %}

[gcode_macro LH_ETHANOL]
description: STATE=BEGIN|END.  BEGIN refused without proven extraction airflow or with a hold latched; switches the UV option off.  Reply: LH_ETHANOL RESULT=<ACTIVE|ENDED>
gcode:
    {% set s = printer["gcode_macro _LH_STATE"] %}
    {% if params.STATE|default("")|upper == "BEGIN" %}
    {% if not s.homed %}{action_raise_error("LH_ETHANOL refused: not homed since restart/e-stop (G28)")}{% endif %}
    {% if s.hold or s.phold %}{action_raise_error("LH_ETHANOL refused: hold latched")}{% endif %}
    {% if printer["gcode_button airflow"].state != "PRESSED" %}{action_raise_error("LH_ETHANOL refused: AIRFLOW not proven (extraction fan, filter, duct or pressure switch): no ethanol step starts")}{% endif %}
    SET_PIN_BASE PIN=uv_enable VALUE=0
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=ethanol VALUE=1
    RESPOND TYPE=command MSG="LH_ETHANOL RESULT=ACTIVE"
    {% elif params.STATE|default("")|upper == "END" %}
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=ethanol VALUE=0
    RESPOND TYPE=command MSG="LH_ETHANOL RESULT=ENDED"
    {% else %}
    {action_raise_error("LH_ETHANOL: STATE must be BEGIN or END")}
    {% endif %}

[gcode_macro _LH_AIRFLOW_LOST]
description: internal (airflow button release): during an ethanol step latch the AIRFLOW process hold and tell the host to close the open ethanol; otherwise warn
gcode:
    {% if printer["gcode_macro _LH_STATE"].ethanol %}
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=phold VALUE='"AIRFLOW"'
    SET_PIN_BASE PIN=uv_enable VALUE=0
    RESPOND TYPE=error MSG="LH_HOLD CODE=AIRFLOW: extraction airflow lost during an ethanol step: pipetting stopped; host: lid the ethanol reservoir and open wash plates with the gripper, call a person"
    {% else %}
    RESPOND TYPE=error MSG="extraction airflow not proven: no ethanol step may start"
    {% endif %}

[gcode_macro LH_UV]
description: STATE=ON|OFF.  UV-C OPTION.  ON only with the option fitted, the door closed AND guard-locked, no ethanol step and no hold.  The lamp supply is also cut in hardware by the door (KM3/KM4) and the e-stop.  Reply: LH_UV RESULT=<ON|OFF>
variable_fitted: False
variable_lock_fitted: False
gcode:
    {% set s = printer["gcode_macro _LH_STATE"] %}
    {% if params.STATE|default("")|upper == "ON" %}
    {% if not printer["gcode_macro LH_UV"].fitted %}{action_raise_error("LH_UV refused: UV-C option not fitted")}{% endif %}
    {% if not printer["gcode_macro LH_UV"].lock_fitted %}{action_raise_error("LH_UV refused: no guard-locking door interlock: nobody may be able to open the door while the lamps are lit")}{% endif %}
    {% if printer["gcode_button door"].state == "PRESSED" %}{action_raise_error("LH_UV refused: DOOR_OPEN")}{% endif %}
    {% if s.ethanol %}{action_raise_error("LH_UV refused: ethanol step active (lamps off during ethanol steps)")}{% endif %}
    {% if s.hold or s.phold %}{action_raise_error("LH_UV refused: hold latched")}{% endif %}
    SET_PIN_BASE PIN=uv_enable VALUE=1
    RESPOND TYPE=command MSG="LH_UV RESULT=ON"
    {% else %}
    SET_PIN_BASE PIN=uv_enable VALUE=0
    RESPOND TYPE=command MSG="LH_UV RESULT=OFF"
    {% endif %}

[gcode_macro LH_LIGHT]
description: [DECK=0|1] [VC2=0|1].  Deck LED strip and the VC-2 backlight
gcode:
    {% if params.DECK is defined and "deck_light" in printer["gcode_macro _LH_PROFILE"].absent %}{action_raise_error("LH_LIGHT refused: DEVICE_ABSENT: deck light not fitted in build %s (VC2= only)" % printer["gcode_macro _LH_PROFILE"].name)}{% endif %}
    {% if params.DECK is defined %}
    SET_PIN_BASE PIN=deck_light VALUE={1 if params.DECK|int == 1 else 0}
    {% endif %}
    {% if params.VC2 is defined %}
    SET_PIN_BASE PIN=vc2_light VALUE={1 if params.VC2|int == 1 else 0}
    {% endif %}

[gcode_macro LH_HEAD_STATUS]
description: Reply: LH_HEAD A=<tool|EMPTY> B=<tool|EMPTY> TIPS=<a><b> NOZZLE_OK=<a><b> HOLD=<code|NONE> PHOLD=<code|NONE> AIRFLOW=<0|1> BIN=<OK|FULL> DRAWER=<IN|OUT> WASTE=<OK|FULL> BAYS=<8 bits, bay 1 first>
gcode:
    {% set s = printer["gcode_macro _LH_STATE"] %}
    {% set bays = [] %}{% for i in range(1, 9) %}{% set _ = bays.append("1" if printer["gcode_button bay" ~ i].state == "PRESSED" else "0") %}{% endfor %}
    RESPOND TYPE=command MSG="LH_HEAD A={s.mounted_a or 'EMPTY'} B={s.mounted_b or 'EMPTY'} TIPS={s.tips_a}{s.tips_b} NOZZLE_OK={s.nozzle_ok_a}{s.nozzle_ok_b} HOLD={s.hold or 'NONE'} PHOLD={s.phold or 'NONE'} AIRFLOW={1 if printer['gcode_button airflow'].state == 'PRESSED' else 0} BIN={'OK' if printer['gcode_button bin_clear'].state == 'PRESSED' else 'FULL'} DRAWER={'IN' if printer['gcode_button drawer'].state == 'PRESSED' else 'OUT'} WASTE={'OK' if printer['gcode_button waste1_ok'].state == 'PRESSED' and printer['gcode_button waste2_ok'].state == 'PRESSED' else 'FULL'} BAYS={bays|join('')}"

[gcode_macro LH_HOME_ALL]
description: Home everything except the gripper jaws (see homing_override)
gcode:
    G28

[gcode_macro LH_SIZE_STATUS]
description: Reply: LH_SIZE SIZE=<S|M|L> Y_MAX=<mm> DOCK_YF=<mm> DOCK_ZONE_YF=<mm> DOCK_EXIT_YF=<mm> PLACES=<place:connector,...> CARRIAGE_ONLY=<place:carriages,...|NONE> TIP_PARKING=<place:station:carriages:tools,...|NONE>.  The host checks it against its machine description before a run
gcode:
    {% set z = printer["gcode_macro _LH_SIZE"] %}
    {% set pl = [] %}{% for p, v in z.places.items() %}{% set _ = pl.append(p ~ ":" ~ v[2]) %}{% endfor %}
    {% set co = [] %}{% for p, v in z.carriage_only.items() %}{% set _ = co.append(p ~ ":" ~ (v[4]|join("/"))) %}{% endfor %}
    {% set tp = [] %}{% for p, v in z.tip_parking.items() %}{% set _ = tp.append(p ~ ":" ~ v[6] ~ ":" ~ (v[4]|join("/")) ~ ":" ~ (v[5]|join("/"))) %}{% endfor %}
    RESPOND TYPE=command MSG="LH_SIZE SIZE={z.size} Y_MAX={'%.1f' % z.y_max} DOCK_YF={'%.1f' % z.dock_yf} DOCK_ZONE_YF={'%.1f' % z.dock_zone_yf} DOCK_EXIT_YF={'%.1f' % z.dock_exit_yf} PLACES={pl|join(',')} CARRIAGE_ONLY={co|join(',') if co else 'NONE'} TIP_PARKING={tp|join(',') if tp else 'NONE'}"

