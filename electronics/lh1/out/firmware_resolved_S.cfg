    {% if (params.PIN|default("")|lower == "beam_emitter" and "thermocycler" in printer["gcode_macro _LH_PROFILE"].absent) or (params.PIN|default("")|lower == "deck_light" and "deck_light" in printer["gcode_macro _LH_PROFILE"].absent) %}{action_raise_error("SET_PIN refused: DEVICE_ABSENT: %s is not fitted in build %s" % (params.PIN|lower, printer["gcode_macro _LH_PROFILE"].name))}{% endif %}
    {% if params.PIN|default("")|lower not in ("beam_emitter", "tip_gate_power", "deck_light", "vc2_light") %}{action_raise_error("SET_PIN refused: unknown pin %s" % params.PIN|default(""))}{% endif %}
