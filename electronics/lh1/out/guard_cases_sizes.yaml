  - macro: LH_TIP_UNPARK
    params: *id012
    state: 'L: re-pick when parking is unknown after a restart'
    set:
      gcode_macro LH_TIP_PARK:
        armed: true
        parked: -1
        spots: []
      gcode_macro _LH_STATE:
        mounted_a: M300
        tips_a: 0
    expect: refuse
    message: PARKING_UNKNOWN
  - macro: LH_TIP_PARK_STATUS
    state: 'L: status lists each spot''s owner'
    set:
      gcode_macro LH_TIP_PARK:
        armed: true
        strip_force_measured_n: 120.0
        parked: 1
        spots: *id014
      gcode_macro _LH_STATE:
        mounted_a: M300
        tips_a: 1
    expect: accept
    emits:
    - LH_TIP_PARK KNOWN=1 PARKED=1 SPOTS=1:EMPTY,2:EMPTY,3:M300|s4:c1
  - macro: _LH_PLACE_GUARD
    params:
      X: -264.0
