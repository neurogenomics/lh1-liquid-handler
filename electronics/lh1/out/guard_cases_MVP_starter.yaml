# GENERATED by fw_render_check.py: the machine cases of guard_cases.yaml against the MVP
configs:
  mvp: firmware_resolved_MVP.cfg
printers:
  machine:
    config: mvp
    status:
      toolhead:
        position:
          x: 0.0
          y: 0.0
          z: 0.0
        homed_axes: xyz
      gcode_move:
        absolute_coordinates: true
      gcode_button tools_up:
        state: PRESSED
      gcode_button tip_gate:
        state: RELEASED
      gcode_button estop:
        state: RELEASED
      gcode_button door:
        state: RELEASED
      gcode_button force_a:
        state: RELEASED
      gcode_button contact_a:
        state: RELEASED
      gcode_button drawer:
        state: PRESSED
      gcode_button bin_clear:
        state: PRESSED
      gcode_button cab_fan_ok_1:
        state: PRESSED
    macro_variables:
      _LH_STATE:
        homed: 1
        grip: 1
        mounted_a: M300
        nozzle_ok_a: 1
        contact_a: 2.0
        pos_a: 19.0
        pos_b: 0.0
      _LH_TOOLDEF: {}
      _LH_GEOM: {}
      _LH_SIZE: {}
      _LH_TC_GUARD: {}
      _LH_PROFILE: {}
      _LH_MB1: {}
      LH_TIP_CHECK: {}
      LH_EJECT_TIP: {}
      LH_PICK_TIP: {}
      LH_TIP_PARK: {}
      _LH_DOCK:
        bar: 0.0
      LH_UV: {}
      LH_SHAKER: {}
      _LH_ZCUR: {}
      _LH_THERM: {}
      _LH_LID: {}
    let:
      zcur: printer['gcode_macro _LH_ZCUR']
      zs: printer['gcode_macro _LH_SIZE']
cases:
- printer: machine
  cases:
  - foreach:
      g:
      - G0
      - G1
    cases:
    - macro: ${g}
      params:
        X: 10
        Y: 20
      expect: accept
      emits:
      - _LH_GMOVE CMD=${g} X=10.0 Y=20.0
      emits_regex:
      - \A\s*M400\s*\n\s*_LH_GMOVE
    - macro: ${g}
      params:
        X: 10
        E: 1
      state: extra parameter E
      expect: refuse
    - macro: ${g}
      params:
        Z: -1
      state: Z below 0
      expect: refuse
    - macro: ${g}
      params:
        X: 1
        Z: 5
      state: XY and Z together
      expect: refuse
    - macro: _LH_GMOVE
      params:
        CMD: ${g}
        X: 10
        Y: 20
      expect: accept
      emits:
      - _LH_TOOLS_LOCKED WHO=${g}
      - ${g}.1 X10.0 Y20.0
      emits_regex:
      - \A(?![\s\S]*_LH_TRAVEL_GUARD)
    - macro: _LH_GMOVE
      params:
        CMD: ${g}
        Z: 50
      expect: accept
      emits:
      - _LH_TC_GUARD TOOL=gripper C=g STROKE=50.0
      - LINE=b
      - _LH_TRAVEL_GUARD EXCEPT=g
      - _LH_DEPTH_GUARD C=g TOOL=gripper S=50.0
      - ${g}.1 Z50.0
    - macro: _LH_GMOVE
      params:
        CMD: ${g}
        X: 10
      state: not homed
      set:
        gcode_macro _LH_STATE:
          homed: 0
      expect: refuse
    - macro: _LH_GMOVE
      params:
        CMD: ${g}
        X: 10
      state: Klipper homed_axes cleared (motors off)
      set:
        toolhead:
          homed_axes: z
      expect: refuse
    - macro: _LH_GMOVE
      params:
        CMD: ${g}
        X: 10
      state: all-tools-up chain open with every axis reading up
      set:
        gcode_button tools_up:
          state: RELEASED
      expect: refuse
    - macro: _LH_GMOVE
      params:
        CMD: ${g}
        X: 10
      state: 'carriage A lowered: the path is checked at its travel height'
      set:
        gcode_macro _LH_STATE:
          zpos_z_a: 5.0
      expect: accept
      emits:
      - _LH_TRAVEL_GUARD X0=0.0 Y0=0.0 X1=10.0 Y1=0.0 WHO=${g}
    - macro: _LH_GMOVE
      params:
        CMD: ${g}
        X: 10
      state: 'gripper lowered: the path is checked at its travel height'
      set:
        toolhead:
          position:
            z: 3.0
      expect: accept
      emits:
      - _LH_TRAVEL_GUARD
    - macro: _LH_GMOVE
      params:
        CMD: ${g}
        X: 10
      state: gripper UNKNOWN
      set:
        gcode_macro _LH_STATE:
          grip: 0
      expect: refuse
    - macro: _LH_GMOVE
      params:
        CMD: ${g}
        X: 10
      state: relative mode
      set:
        gcode_move:
          absolute_coordinates: false
      expect: refuse
    - macro: _LH_GMOVE
      params:
        CMD: ${g}
        Z: -1
      state: Z below 0
      expect: refuse
    - macro: _LH_GMOVE
      params:
        CMD: ${g}
        X: 1
        Z: 5
      state: XY and Z together
      expect: refuse
    - macro: _LH_GMOVE
      params:
        CMD: ${g}
        X: 10
      state: motion hold HALF_LOCK latched
      set:
        gcode_macro _LH_STATE:
          hold: HALF_LOCK
      expect: refuse
    - macro: _LH_GMOVE
      params:
        CMD: ${g}
        Y: ${zs.dock_zone_yf}
      state: target in the dock row
      expect: refuse
    - macro: _LH_GMOVE
      params:
        CMD: ${g}
        X: 10
      state: head inside the dock row (leave only by LH_DOCK_LEAVE)
      set:
        toolhead:
          position:
            y: ${zs.dock_yf}
      expect: refuse
    - macro: _LH_GMOVE
      params:
        CMD: ${g}
        Z: 50
      state: gripper over the A4 tube block (zone A3), module NOT safe for the gripper
      set:
        toolhead:
          position:
            x: 174.0
            y: -61.0
        gcode_button safe_a3_b:
          state: RELEASED
      expect: accept
      emits:
      - _LH_PLACE_GUARD X=264.0 Y=-165.0 LINE=b
    - macro: _LH_GMOVE
      params:
        CMD: ${g}
        X: 450
        Y: ${zs.dock_yf + 1.5}
      state: gripper to the shelf slot OK from the front, in the shelf window
      set:
        toolhead:
          position:
            x: 450.0
            y: ${zs.dock_zone_yf - 100}
      expect: accept
      emits:
      - ${g}.1 X450.0 Y
    - macro: _LH_GMOVE
      params:
        CMD: ${g}
        X: 450
        Y: ${zs.dock_yf + 1.5}
      state: 'diagonal into the dock row: crosses its Y left of the window'
      set:
        toolhead:
          position:
            x: 0.0
            y: ${zs.dock_zone_yf - 100}
      expect: refuse
      message: left of the shelf window
    - macro: _LH_GMOVE
      params:
        CMD: ${g}
        X: 300
        Y: ${zs.dock_yf + 1.5}
      state: dock row's Y left of the window (over the bays)
      set:
        toolhead:
          position:
            x: 300.0
            y: ${zs.dock_zone_yf - 100}
      expect: refuse
    - macro: _LH_GMOVE
      params:
        CMD: ${g}
        X: 450
        Y: ${zs.dock_yf + 1.5}
      state: into the shelf window with carriage A lowered
      set:
        toolhead:
          position:
            x: 450.0
            y: ${zs.dock_zone_yf - 100}
        gcode_macro _LH_STATE:
          zpos_z_a: 5.0
      expect: refuse
      message: SHELF_WINDOW
    - macro: _LH_GMOVE
      params:
        CMD: ${g}
        Z: 200
      state: gripper descends at OK in the window
      set:
        toolhead:
          position:
            x: 450.0
            y: ${zs.dock_yf + 1.5}
      expect: accept
      emits:
      - _LH_DEPTH_GUARD C=g TOOL=gripper S=200.0 X=450.0
    - macro: _LH_GMOVE
      params:
        CMD: ${g}
        Z: 200
      state: gripper descends over the bays
      set:
        toolhead:
          position:
            x: 100.0
            y: ${zs.dock_yf + 1.5}
      expect: refuse
  - macro: _LH_TOOLS_LOCKED
    params:
      WHO: G0
    state: A locked M300, B empty
    expect: accept
  - macro: _LH_TOOLS_LOCKED
    params:
      WHO: G0
    state: A half-locked (code present, latch out of window)
    set:
      gcode_button latch_a:
        state: RELEASED
    expect: refuse
  - macro: _LH_TOOLS_LOCKED
    params:
      WHO: G0
    state: 'A one Hall bit lost (code 4: odd weight, invalid)'
    set:
      gcode_button hall_a1:
        state: RELEASED
    expect: refuse
  - macro: _LH_TOOLS_LOCKED
    params:
      WHO: G0
    state: A reads another valid tool (code 5 M50, M300 recorded)
    set:
      gcode_button hall_a0:
        state: PRESSED
      gcode_button hall_a1:
        state: RELEASED
    expect: refuse
  - macro: _LH_TOOLS_LOCKED
    params:
      WHO: G0
    state: A dropped (code 0000, latch open) while M300 recorded
    set:
      gcode_button hall_a1:
        state: RELEASED
      gcode_button hall_a2:
        state: RELEASED
      gcode_button latch_a:
        state: RELEASED
    expect: refuse
  - macro: _LH_TOOLS_LOCKED
    params:
      WHO: G0
    state: B empty but latch reads locked (switch fault)
    set:
      gcode_button latch_b:
        state: PRESSED
    expect: refuse
  - macro: _LH_TOOLS_LOCKED
    params:
      WHO: G0
    state: B recorded empty but reads a tool
    set:
      gcode_button hall_b0:
        state: PRESSED
      gcode_button hall_b3:
        state: PRESSED
      gcode_button latch_b:
        state: PRESSED
    expect: refuse
  - macro: _LH_TOOLS_LOCKED
    params:
      WHO: G0
    state: A flat cable pulled (reads empty + cable lost)
    set:
      gcode_button cable_a:
        state: RELEASED
      gcode_button hall_a1:
        state: RELEASED
      gcode_button hall_a2:
        state: RELEASED
      gcode_button latch_a:
        state: RELEASED
    expect: refuse
  - macro: _LH_CARRIAGE_EVENT
    params:
      C: a
    state: latch change outside an exchange (DROPPED TOOL)
    expect: accept
    emits:
    - DROPPED_TOOL
    - M112
  - macro: _LH_CARRIAGE_EVENT
    params:
      C: a
    state: latch change during an exchange (expected)
    set:
      gcode_macro _LH_STATE:
        exch: 1
    expect: accept
    emits_regex:
    - \A(?![\s\S]*M112)
  - macro: _LH_POWERUP_READ
    state: A tool locked, B empty
    expect: accept
    emits:
    - VARIABLE=mounted_a VALUE='"M300"'
    - VARIABLE=tips_a VALUE=-1
    - VARIABLE=nozzle_ok_a VALUE=0
    - VARIABLE=mounted_b VALUE='""'
  - macro: _LH_POWERUP_READ
    state: power-up with a half-locked tool on A
    set:
      gcode_button latch_a:
        state: RELEASED
    expect: refuse
  - macro: _LH_POWERUP_READ
    state: power-up with an invalid code on A
    set:
      gcode_button hall_a2:
        state: RELEASED
    expect: refuse
  - macro: _LH_POWERUP_READ
    state: power-up with carriage B cable lost
    set:
      gcode_button cable_b:
        state: RELEASED
    expect: refuse
  - macro: _LH_ZBACKOFF
    params:
      C: a
    state: tool on A (Z up only)
    expect: accept
    emits:
    - homed up only
    emits_regex:
    - \A(?![\s\S]*inverted_probe)
  - macro: _LH_ZBACKOFF
    params:
      C: b
    state: B empty (back-off-and-retrigger)
    expect: accept
    emits:
    - STEPPER=z_b SPEED=2 MOVE=3 STOP_ON_ENDSTOP=inverted_probe
  - macro: MANUAL_STEPPER
    params:
      STEPPER: z_a
      MOVE: 10
    expect: accept
    emits:
    - _LH_ZMOVE STEPPER=z_a MOVE=10.0 SPEED=10.0
    emits_regex:
    - \A\s*M400\s*\n\s*_LH_ZMOVE
  - macro: MANUAL_STEPPER
    params:
      STEPPER: z_a
      MOVE: 10
      SET_POSITION: 0
    state: SET_POSITION
    expect: refuse
  - macro: MANUAL_STEPPER
    params:
      STEPPER: z_a
      MOVE: 10
      SYNC: 0
    state: SYNC=0
    expect: refuse
  - macro: MANUAL_STEPPER
    params:
      STEPPER: z_a
      MOVE: 10
      STOP_ON_ENDSTOP: home
    state: STOP_ON_ENDSTOP
    expect: refuse
  - macro: MANUAL_STEPPER
    params:
      STEPPER: z_a
      GCODE_AXIS: A
    state: GCODE_AXIS
    expect: refuse
  - macro: MANUAL_STEPPER
    params:
      STEPPER: z_a
      ENABLE: 0
    state: ENABLE
    expect: refuse
  - macro: MANUAL_STEPPER
    params:
      STEPPER: z_a
      MOVE: -1
    state: MOVE below 0
    expect: refuse
  - macro: MANUAL_STEPPER
    params:
      STEPPER: pusher_a
      MOVE: 1
    state: pusher
    expect: refuse
  - macro: MANUAL_STEPPER
    params:
      STEPPER: gripper
      MOVE: 1
    state: gripper
    expect: refuse
  - macro: MANUAL_STEPPER
    params:
      STEPPER: z_a
      MOVE: 10
      SPEED: 30
    state: faster than the Z corner speed (25 mm/s)
    expect: refuse
  - macro: _LH_ZMOVE
    params:
      STEPPER: z_a
      MOVE: 10
      SPEED: 10
      ACCEL: 300
    expect: accept
    emits:
    - _LH_TRAVEL_GUARD EXCEPT=a
    - _LH_TOOLS_LOCKED
    - _LH_TC_GUARD TOOL=M300 C=a STROKE=10.0
    - LINE=a WHO=MANUAL_STEPPER C=a
    - _LH_DEPTH_GUARD C=a TOOL=M300 S=10.0
    - MANUAL_STEPPER_BASE STEPPER=z_a MOVE=10.0
  - macro: _LH_ZMOVE
    params:
      STEPPER: z_a
      MOVE: 10
      SPEED: 10
      ACCEL: 300
    state: not homed
    set:
      gcode_macro _LH_STATE:
        homed: 0
    expect: refuse
  - macro: _LH_ZMOVE
    params:
      STEPPER: z_b
      MOVE: 10
      SPEED: 10
      ACCEL: 300
    state: lowering an empty carriage
    expect: refuse
  - macro: _LH_ZMOVE
    params:
      STEPPER: z_a
      MOVE: 10
      SPEED: 10
      ACCEL: 300
    state: nozzle not checked since the pick-up
    set:
      gcode_macro _LH_STATE:
        nozzle_ok_a: 0
    expect: refuse
  - macro: _LH_ZMOVE
    params:
      STEPPER: z_a
      MOVE: 10
      SPEED: 10
      ACCEL: 300
    state: 'A4: tip state UNKNOWN (ejected, not observed)'
    set:
      gcode_macro _LH_STATE:
        tips_a: -1
    expect: refuse
    message: TIPS_UNKNOWN
  - macro: _LH_ZMOVE
    params:
      STEPPER: z_a
      MOVE: 10
      SPEED: 10
      ACCEL: 300
    state: over the dock row
    set:
      toolhead:
        position:
          y: ${zs.dock_yf}
    expect: refuse
  - macro: _LH_ZMOVE
    params:
      STEPPER: z_a
      MOVE: 10
      SPEED: 10
      ACCEL: 300
    state: 'hold latched: Z stays'
    set:
      gcode_macro _LH_STATE:
        hold: WRONG_TOOL
    expect: refuse
  - macro: _LH_ZMOVE
    params:
      STEPPER: z_a
      MOVE: 0
      SPEED: 10
      ACCEL: 300
    state: raising is always allowed (no hold)
    set:
      gcode_macro _LH_STATE:
        zpos_z_a: 50.0
        nozzle_ok_a: 0
    expect: accept
    emits:
    - MANUAL_STEPPER_BASE STEPPER=z_a MOVE=0.0
    emits_regex:
    - \A(?![\s\S]*_LH_TC_GUARD)
  - macro: _LH_TRAVEL_GUARD
    params:
      X0: 0
      Y0: 47.5
      X1: 50
      Y1: 47.5
      WHO: G0
    state: A at s 100 over row B (lowest z 201 >= 155 + 10)
    set:
      gcode_macro _LH_STATE:
        zpos_z_a: 100.0
    expect: accept
  - macro: _LH_TRAVEL_GUARD
    params:
      X0: 0
      Y0: 47.5
      X1: 50
      Y1: 47.5
      WHO: G0
    state: A at s 200 over row B (lowest z 101 < the strip module place top + 10)
    set:
      gcode_macro _LH_STATE:
        zpos_z_a: 200.0
    expect: refuse
    message: TRAVEL_HEIGHT
  - macro: _LH_TRAVEL_GUARD
    params:
      X0: 260
      Y0: -60
      X1: 260
      Y1: 160
      WHO: G0
    state: 'A at s 160 across row A: the A3 cold-block height limit (155) is on the path'
    set:
      gcode_macro _LH_STATE:
        zpos_z_a: 160.0
    expect: refuse
    message: A3
  - macro: _LH_TRAVEL_GUARD
    params:
      X0: 0
      Y0: 0
      WHO: G0
    state: gripper at s 250 (fingertips z 91) over the deck
    set:
      toolhead:
        position:
          z: 250.0
    expect: refuse
    message: gripper
  - macro: _LH_TRAVEL_GUARD
    params:
      X0: 0
      Y0: 0
      WHO: G0
    state: gripper at s 100 (fingertips z 241) over the deck
    set:
      toolhead:
        position:
          z: 100.0
    expect: accept
  - macro: _LH_TRAVEL_GUARD
    params:
      ONLY: b
      ALL: 1
      WHO: sideways
    state: B with M50 at s 200 anywhere (lowest z 109 < tallest item + 10)
    set:
      gcode_macro _LH_STATE:
        mounted_b: M50
        zpos_z_b: 200.0
    expect: refuse
  - macro: _LH_TRAVEL_GUARD
    params:
      EXCEPT: a
      WHO: MANUAL_STEPPER
    state: descending carriage A is not checked by its own travel guard
    set:
      gcode_macro _LH_STATE:
        zpos_z_a: 300.0
    expect: accept
  - macro: LH_TRAVEL_QUERY
    state: 'whole deck: A (M300) 301 - (tallest 155 + 10) = 136, B empty, gripper 341 - 165 = 176'
    expect: accept
    emits:
    - LH_TRAVEL S_A=136.00 S_B=EMPTY S_G=176.00
  - macro: _LH_DEPTH_GUARD
    params:
      C: a
      TOOL: M300
      S: ${zs.depth.g4[4]['M300@a']}
      X: ${zs.depth.g4[0] + 90}
      Y: ${zs.depth.g4[1] + 102.5}
      WHO: t
    state: M300 on A into the G4 cold plate wells to the CAD floor stroke
    expect: accept
  - macro: _LH_DEPTH_GUARD
    params:
      C: a
      TOOL: M300
      S: ${zs.depth.g4[4]['M300@a'] + 0.5}
      X: ${zs.depth.g4[0] + 90}
      Y: ${zs.depth.g4[1] + 102.5}
      WHO: t
    state: M300 0.5 mm below the CAD floor stroke at G4
    expect: refuse
    message: DEPTH
  - macro: _LH_DEPTH_GUARD
    params:
      C: a
      TOOL: M300
      S: 345
      X: ${zs.depth.g4[0] + 90}
      Y: ${zs.depth.g4[1] + 102.5}
      WHO: t
    state: 'M300 to the end of the stroke at G4 (was allowed: V6)'
    expect: refuse
    message: DEPTH
  - macro: _LH_DEPTH_GUARD
    params:
      C: a
      TOOL: M300
      S: 250
      X: 222
      Y: -62.5
      WHO: t
    state: 'M300 at A3 (tube block: no CAD reach for M300): only the clearance height'
    expect: accept
    emits:
    - _LH_TRAVEL_GUARD
    - ONLY=a SA=250.0
    - '@A3'
  - macro: _LH_XY_GUARD
    expect: accept
    emits:
    - _LH_TOOLS_LOCKED
  - macro: _LH_XY_GUARD
    params:
      C: a
    state: own carriage lowered (in-nest move)
    set:
      gcode_macro _LH_STATE:
        zpos_z_a: 233.0
    expect: accept
  - macro: _LH_XY_GUARD
    state: chain open
    set:
      gcode_button tools_up:
        state: RELEASED
    expect: refuse
  - macro: _LH_XY_GUARD
    state: carriage down
    set:
      gcode_macro _LH_STATE:
        zpos_z_b: 2.0
    expect: refuse
  - macro: _LH_XY_GUARD
    params:
      C: a
    state: 'the other carriage lowered: checked at its whole-deck travel height (B)'
    set:
      gcode_macro _LH_STATE:
        zpos_z_b: 2.0
    expect: accept
    emits:
    - _LH_TRAVEL_GUARD ONLY=b ALL=1
  - macro: _LH_XY_GUARD
    state: gripper UNKNOWN
    set:
      gcode_macro _LH_STATE:
        grip: 0
    expect: refuse
  - macro: _LH_XY_GUARD
    state: not homed
    set:
      gcode_macro _LH_STATE:
        homed: 0
    expect: refuse
  - macro: _LH_XY_GUARD
    state: homed_axes cleared
    set:
      toolhead:
        homed_axes: ''
    expect: refuse
  - macro: _LH_XY_GUARD
    state: hold latched
    set:
      gcode_macro _LH_STATE:
        hold: BAY_DISAGREE
    expect: refuse
  - macro: _LH_PLACE_GUARD
    params:
      X: 0
      Y: -55
      LINE: a
      WHO: t
    state: B2 strip module safe
    expect: accept
  - macro: _LH_PLACE_GUARD
    params:
      X: 0
      Y: -55
      LINE: a
      WHO: t
    state: B2 line A open (module busy or unplugged)
    set:
      gcode_button safe_b2_a:
        state: RELEASED
    expect: refuse
  - macro: _LH_PLACE_GUARD
    params:
      X: 264
      Y: -165
      LINE: b
      WHO: t
    state: 'A4 is in module zone A3: zone line B open'
    set:
      gcode_button safe_a3_b:
        state: RELEASED
    expect: refuse
  - macro: _LH_PLACE_GUARD
    params:
      X: 132
      Y: -55
      LINE: a
      WHO: t
    state: B3 liquid waste (station connector, no SAFE line) unaffected by B2
    set:
      gcode_button safe_b2_a:
        state: RELEASED
    expect: accept
  - macro: _LH_PLACE_GUARD
    params:
      X: -264
      Y: ${zs.places.g0[1]}
      LINE: a
      WHO: t
    state: 'G0 hazardous liquid: loop-back plug pulled (reserved 37 C module place)'
    set:
      gcode_button safe_g0_a:
        state: RELEASED
    expect: refuse
  - macro: LH_SIZE_STATUS
    expect: accept
    emits:
    - 'LH_SIZE SIZE=${zs.size} '
    - PLACES=a3:a3,a4:a3,b2:b2
  - macro: LH_TOOL_PARK
    params:
      CARRIAGE: A
      BAY: 3
    expect: accept
    emits:
    - _LH_EXCH_GUARD C=a BAY=3 WHO=LH_TOOL_PARK MODE=drop
    - _LH_DOCK_ENTER
    - G0.1 X-50.0
    - VARIABLE=exch VALUE=1
    - _LH_DROP C=a BAY=3
    - VARIABLE=mounted_a VALUE='""'
    - STEPPER=z_a MOVE=0
    - VARIABLE=exch VALUE=0
    - LH_DOCK_LEAVE
    - LH_TOOL RESULT=PARKED CARRIAGE=A BAY=3 TOOL=M300
  - macro: LH_TOOL_PARK
    params:
      CARRIAGE: A
      BAY: 3
    state: 'V2: the guard is rendered after an M400; the drop runs after the X move, an M400 and the settle'
    expect: accept
    emits_regex:
    - \A\s*M400\s*\n\s*_LH_EXCH_GUARD
    - G0.1 X-50.0[^\n]*\n\s*M400\s*\n\s*G4 P1040
  - macro: LH_TOOL_PICK
    params:
      CARRIAGE: B
      BAY: 1
      TOOL: M50
    expect: accept
    emits:
    - _LH_EXCH_GUARD C=b BAY=1 WHO=LH_TOOL_PICK MODE=pick TOOL=M50
    - G0.1 X-296.0
    - VARIABLE=exch VALUE=1
    - _LH_PICKUP C=b BAY=1 TOOL=M50 FROM=0
    - VARIABLE=mounted_b VALUE='"M50"'
    - VARIABLE=tips_b VALUE=0
    - VARIABLE=nozzle_ok_b VALUE=0
    - VARIABLE=exch VALUE=0
    - LH_DOCK_LEAVE
    - _LH_PUSHER_FIND C=b
    - LH_TOOL RESULT=PICKED CARRIAGE=B BAY=1 TOOL=M50
  - macro: LH_TOOL_EXCHANGE
    params:
      CARRIAGE: A
      PARK_BAY: 3
      PICK_BAY: 1
      TOOL: M50
    state: 'CAD exchange in one pass: drop at 3, empty carriage at s 302 along the row, pick at 1'
    expect: accept
    emits:
    - _LH_EXCH_GUARD C=a BAY=3 WHO=LH_TOOL_EXCHANGE MODE=drop
    - _LH_EXCH_GUARD_BAY BAY=1
    - G0.1 X-50.0
    - _LH_DROP C=a BAY=3
    - VARIABLE=mounted_a VALUE='""'
    - STEPPER=z_a MOVE=302.0
    - _LH_INROW_GUARD C=a BAY=1
    - G0.1 X-206.0
    - _LH_PICKUP C=a BAY=1 TOOL=M50 FROM=302.0
    - VARIABLE=mounted_a VALUE='"M50"'
    - _LH_PUSHER_FIND C=a
    - RESULT=EXCHANGED CARRIAGE=A PARK_BAY=3 PICK_BAY=1 PARKED=M300 TOOL=M50
    emits_regex:
    - STEPPER=z_a MOVE=302.0[^\n]*\n[^\n]*\n\s*M400\s*\n\s*_LH_INROW_GUARD
  - macro: LH_TOOL_EXCHANGE
    params:
      CARRIAGE: A
      PARK_BAY: 3
      PICK_BAY: 3
      TOOL: M50
    state: park and pick bay the same
    expect: refuse
  - macro: LH_TOOL_EXCHANGE
    params:
      CARRIAGE: A
      PARK_BAY: 3
      PICK_BAY: 1
      TOOL: P99
    state: unknown tool
    expect: refuse
  - macro: _LH_EXCH_GUARD_BAY
    params:
      BAY: 1
      WHO: t
    state: pick bay occupied
    expect: accept
  - macro: _LH_EXCH_GUARD_BAY
    params:
      BAY: 3
      WHO: t
    state: pick bay empty
    expect: refuse
    message: BAY_EMPTY
  - macro: _LH_EXCH_GUARD_BAY
    params:
      BAY: 9
      WHO: t
