    expect: refuse
  - macro: _LH_EXCH_GUARD
    params:
      C: a
      BAY: 3
      WHO: t
      MODE: drop
    expect: accept
    emits:
    - _LH_TOOLS_LOCKED
  - macro: _LH_EXCH_GUARD
    params:
      C: a
      BAY: 1
      WHO: t
      MODE: drop
    state: drop-off into an occupied bay
    expect: refuse
