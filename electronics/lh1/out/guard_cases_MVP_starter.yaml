    state: protected Z current
    expect: refuse
  - macro: SET_GCODE_VARIABLE
    params:
      MACRO: _LH_SIZE
      VARIABLE: dock_yf
      VALUE: 545.5
    state: host moves the dock row
    expect: refuse
  - macro: SET_GCODE_VARIABLE
    params:
      MACRO: _LH_TOOLDEF
      VARIABLE: commissioned
      VALUE: 1
    state: host commissions SYR
    expect: refuse
  - macro: SET_GCODE_VARIABLE
    params:
      MACRO: MY_MACRO
      VARIABLE: x
      VALUE: 1
    expect: accept
    emits:
    - SET_GCODE_VARIABLE_BASE
  - macro: _LH_Z_FORCE
    params:
      C: a
      TOOL: M50
      'ON': 1
    expect: accept
    emits:
    - SET_TMC_CURRENT_BASE STEPPER=z_a CURRENT=${zcur.force_current}
  - macro: _LH_Z_FORCE
    params:
      C: b
      TOOL: M300
      'ON': 0
    expect: accept
    emits:
    - SET_TMC_CURRENT_BASE STEPPER=z_b CURRENT=${zcur.run_current}
  - macro: _LH_Z_FORCE
    params:
      C: a
      TOOL: S10
      'ON': 1
    state: single-channel tool (no raise)
    expect: accept
    emits_regex:
    - \A(?![\s\S]*SET_TMC_CURRENT_BASE)
  - macro: _LH_REQUIRE_TOOLS_UP
    params:
      WHO: homing
    state: chain open
    set:
      gcode_button tools_up:
        state: RELEASED
    expect: refuse
  - macro: _LH_REQUIRE_TOOLS_UP
    params:
      WHO: homing
    expect: accept
  - macro: _LH_GRIP_RELEASED_CHECK
    state: jaws open, switch reads gripped
    set:
      gcode_button gripped:
        state: PRESSED
    expect: refuse
  - macro: _LH_THERM_EXPECT
    params:
      RELAY: 'off'
      CODE: RELAY_WELDED
    state: contactor off as commanded
    expect: accept
  - macro: _LH_THERM_EXPECT
    params:
      RELAY: 'off'
      CODE: RELAY_WELDED
    state: commanded off, mirror says ON (welded)
    set:
      gcode_button therm_mirror:
        state: RELEASED
    expect: accept
    emits:
    - _LH_THERM_FAULT CODE=RELAY_WELDED
  - macro: _LH_THERM_EXPECT
    params:
      RELAY: 'on'
      CODE: CHAIN_OPEN
    state: enabled but contactor stays off
    expect: accept
    emits:
    - _LH_THERM_FAULT CODE=CHAIN_OPEN
  - macro: _LH_THERM_FAULT
    params:
      CODE: RELAY_WELDED
    expect: accept
    emits:
    - therm_enable VALUE=0
    - wd_heartbeat VALUE=0
    - M112
    - _LH_THERM_RAISE
  - macro: _LH_THERM_FAULT
    params:
      CODE: WATCHDOG_FAIL
    expect: accept
    emits:
    - wd_heartbeat VALUE=0
    - _LH_THERM_RAISE
  - macro: LH_THERM_ON
    state: fault latched
    set:
      gcode_macro _LH_THERM:
        fault: WATCHDOG_FAIL
    expect: refuse
  - macro: LH_THERM_ON
    expect: accept
    emits:
    - RELAY=off CODE=RELAY_WELDED
    - wd_heartbeat VALUE=0
    - CODE=WATCHDOG_FAIL
    - LH_THERM RESULT=ON
  - macro: delayed_gcode _LH_WD_TICK
    state: host silent
    set:
      gcode_macro _LH_THERM:
        'on': 1
        hb_left: 0
    expect: accept
    emits:
    - wd_heartbeat VALUE=0
    - therm_enable VALUE=0
    - HOST_SILENT
  - macro: delayed_gcode _LH_WD_TICK
    state: heartbeat budget counting down
    set:
      gcode_macro _LH_THERM:
        'on': 1
        hb_left: 5
    expect: accept
    emits:
    - VARIABLE=hb_left VALUE=4
  - macro: SET_PIN
    params:
      PIN: therm_enable
      VALUE: 1
    state: host enables THERM directly
    expect: refuse
  - macro: SET_PIN
    params:
      PIN: wd_heartbeat
      VALUE: 1
    state: host holds the heartbeat
    expect: refuse
  - macro: SET_PIN
    params:
      PIN: beam_emitter
      VALUE: 0
    expect: accept
    emits:
    - SET_PIN_BASE PIN=beam_emitter VALUE=0.0
  - foreach:
      c:
      - SET_HEATER_TEMPERATURE
      - UPDATE_DELAYED_GCODE
      - PID_CALIBRATE
    cases:
    - macro: ${c}
      params:
        HEATER: lid_heater
        TARGET: 200
        ID: _LH_WD_TICK
      state: host call
      expect: refuse
  - macro: LH_LID_HEATER
    params:
      TARGET: 120
    state: above 110 C
    set:
      gcode_macro _LH_THERM:
        'on': 1
    expect: refuse
  - macro: LH_LID_HEATER
    params:
      TARGET: 105
    state: THERM off
    expect: refuse
  - macro: LH_LID_HEATER
    params:
      TARGET: 105
    set:
      gcode_macro _LH_THERM:
        'on': 1
    expect: accept
    emits:
    - SET_HEATER_TEMPERATURE_BASE HEATER=lid_heater TARGET=105.0
    - LH_LID_HEATER TARGET=105.0
  - macro: _LH_LID_GUARD
    params:
      WHO: LH_LID_CLOSE
    expect: accept
  - macro: _LH_LID_GUARD
    params:
      WHO: LH_LID_CLOSE
    state: door open
    set:
      gcode_button door:
        state: PRESSED
    expect: refuse
  - macro: _LH_LID_GUARD
    params:
      WHO: LH_LID_CLOSE
    state: chain open
    set:
      gcode_button tools_up:
        state: RELEASED
    expect: refuse
  - macro: _LH_LID_GUARD
    params:
      WHO: LH_LID_CLOSE
    state: carriage A down
    set:
      gcode_macro _LH_STATE:
        zpos_z_a: 3.0
    expect: refuse
  - macro: _LH_LID_GUARD
    params:
      WHO: LH_LID_CLOSE
    state: gripper down
    set:
      toolhead:
        position:
          z: 3.0
    expect: refuse
  - macro: _LH_LID_GUARD
    params:
      WHO: LH_LID_CLOSE
    state: gripper unknown
    set:
      gcode_macro _LH_STATE:
        grip: 0
    expect: refuse
  - macro: _LH_LID_GUARD
    params:
      WHO: LH_LID_CLOSE
    state: lid fault latched
    set:
      gcode_macro _LH_LID:
        fault: OBSTRUCTION
    expect: refuse
  - macro: _LH_LID_GUARD
    params:
      WHO: LH_LID_CLOSE
    state: not homed
    set:
      gcode_macro _LH_STATE:
        homed: 0
    expect: refuse
  - macro: _LH_GATE_EXPECT
    params:
      STATE: 'off'
      CODE: GATE_WELDED
    state: emitter off, gate dropped
    set:
      gcode_button lid_gate:
        state: PRESSED
    expect: accept
  - macro: _LH_GATE_EXPECT
    params:
      STATE: 'off'
      CODE: GATE_WELDED
    state: emitter off, gate still on (welded K_TU / stuck receiver)
    expect: accept
    emits:
    - _LH_LID_FAULT CODE=GATE_WELDED
  - macro: _LH_GATE_EXPECT
    params:
      STATE: 'on'
      CODE: OBSTRUCTION
    state: emitter on, beam blocked
    set:
      gcode_button lid_gate:
        state: PRESSED
    expect: accept
    emits:
    - _LH_LID_FAULT CODE=OBSTRUCTION
  - macro: _LH_LID_AFTER
    params:
      KIND: closed
    state: reached CLOSED, gate on
    set:
      gcode_button lid_closed:
        state: PRESSED
    expect: accept
  - macro: _LH_LID_AFTER
    params:
      KIND: closed
    state: CLOSED sensor not reached
    expect: accept
    emits:
    - _LH_LID_FAULT CODE=LID_STALL
  - macro: _LH_LID_AFTER
    params:
      KIND: sealed
    state: SEALED not reached
    expect: accept
    emits:
    - _LH_LID_FAULT CODE=CLAMP_TIMEOUT
  - macro: _LH_LID_AFTER
    params:
      KIND: closed
    state: gate dropped during the move (beam)
    set:
      gcode_button lid_gate:
        state: PRESSED
      gcode_button lid_closed:
        state: PRESSED
    expect: accept
    emits:
    - _LH_LID_FAULT CODE=OBSTRUCTION
  - macro: _LH_LID_FAULT
    params:
      CODE: OBSTRUCTION
    expect: accept
    emits:
    - SET_PIN PIN=beam_emitter VALUE=0
    - VALUE='"OBSTRUCTION"'
    - _LH_LID_RAISE
  - macro: LH_LID_CLOSE
    state: lid position unknown
    set:
      gcode_macro _LH_LID:
        homed: 0
    expect: refuse
  - macro: LH_LID_OPEN
    state: lid hot, no FORCE
    set:
      gcode_macro _LH_LID:
        homed: 1
      heater_generic lid_heater:
        temperature: 90.0
    expect: refuse
  - macro: LH_LID_STATUS
    set:
      gcode_macro _LH_LID:
        homed: 1
        pos: 0.0
    expect: accept
    emits:
    - LH_LID STATE=OPEN GATE=1 TOOLS_UP=1 FAULT=NONE
  - macro: LH_THERM_STATUS
    expect: accept
    emits:
    - LH_THERM ON=0 RELAY=OFF COLD_RELAY=ON HB_LEFT=0 LID_C=25.0 LID_TARGET=0.0 FAULT=NONE
