    state: pick-up of an unknown tool
    expect: refuse
    message: unknown TOOL
  - macro: _LH_EXCH_GUARD
    params:
      C: a
      BAY: 3
      WHO: t
      MODE: drop
    state: tips on carriage A
    set:
      gcode_macro _LH_STATE:
        tips_a: 1
    expect: refuse
  - macro: _LH_EXCH_GUARD
    params:
      C: a
      BAY: 3
      WHO: t
      MODE: drop
    state: tips on the OTHER carriage
    set:
      gcode_macro _LH_STATE:
        tips_b: 1
    expect: refuse
  - macro: _LH_EXCH_GUARD
    params:
      C: a
      BAY: 3
