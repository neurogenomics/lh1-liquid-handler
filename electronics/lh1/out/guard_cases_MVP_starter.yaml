        grip: 0
    expect: refuse
  - macro: _LH_DOCK_ENTER
    expect: accept
    emits:
    - G0.1 X465.0
    - G0.1 Y${zs.dock_yf}
  - macro: LH_DOCK_LEAVE
    expect: accept
    emits:
    - G0.1 X465.0
    - G0.1 Y${zs.dock_exit_yf}
  - macro: LH_DOCK_LEAVE
    state: tips on a carriage inside the dock row
    set:
      gcode_macro _LH_STATE:
        tips_b: 1
    expect: refuse
  - macro: _LH_DROP
    params:
      C: a
      BAY: 3
    state: 'drop-off: seat, guard, bar up 34.1 (rise 31.1 + gap 3), verify, 13 x (bar +1 then Z -1), bar down onto its switch, verify'
    expect: accept
    emits:
    - STEPPER=z_a MOVE=327.0 SPEED=25.0
    - STEPPER=z_a MOVE=342.0 SPEED=5.0
    - _LH_LIFT_GUARD C=a BAY=3 MODE=drop
    - _LH_LIFT_MOVE TO=34.1
    - _LH_OPEN_VERIFY C=a
    - STEPPER=dock_lift MOVE=47.1
    - STEPPER=z_a MOVE=329.0
    - VARIABLE=bar VALUE=47.1
    - VARIABLE=zpos_z_a VALUE=329.0
    - _LH_LIFT_DOWN
    - _LH_RELEASE_VERIFY C=a BAY=3
    emits_regex:
    - MOVE=342.0[^\n]*\n[^\n]*\n\s*M400\s*\n\s*_LH_LIFT_GUARD
    - _LH_LIFT_MOVE TO=34.1\s*\n\s*M400\s*\n\s*_LH_OPEN_VERIFY
    - STEPPER=dock_lift MOVE=35.1[^\n]*\n\s*MANUAL_STEPPER_BASE STEPPER=z_a MOVE=341.0
    - _LH_LIFT_DOWN\s*\n\s*M400\s*\n\s*_LH_RELEASE_VERIFY
  - macro: _LH_PICKUP
    params:
      C: b
      BAY: 1
      TOOL: M50
      FROM: 0
    state: 'pick-up: approach to s 329 (stud 0.5 mm below the jaw), guard, bar up 47.1, verify, 13 x (Z +1 then bar -1), bar down, verify LOCKED with the code, Z up slowly off the pins, verify the bay empty'
    expect: accept
    emits:
    - STEPPER=z_b MOVE=314.0 SPEED=25.0
    - STEPPER=z_b MOVE=329.0 SPEED=5.0
    - _LH_LIFT_GUARD C=b BAY=1 MODE=pick
    - _LH_LIFT_MOVE TO=47.1
    - _LH_OPEN_VERIFY C=b
    - STEPPER=z_b MOVE=342.0
    - STEPPER=dock_lift MOVE=34.1
    - _LH_LIFT_DOWN
    - _LH_PICK_VERIFY C=b TOOL=M50
    - STEPPER=z_b MOVE=327.0 SPEED=5.0
    - STEPPER=z_b MOVE=0 SPEED=25.0
    - _LH_BAY_EMPTY_VERIFY BAY=1
    emits_regex:
    - STEPPER=z_b MOVE=330.0[^\n]*\n\s*MANUAL_STEPPER_BASE STEPPER=dock_lift MOVE=46.1
    - _LH_LIFT_DOWN\s*\n\s*M400\s*\n\s*_LH_PICK_VERIFY
    - _LH_PICK_VERIFY[^\n]*\n\s*MANUAL_STEPPER_BASE STEPPER=z_b MOVE=327.0
    - M400\s*\n\s*_LH_BAY_EMPTY_VERIFY
  - macro: _LH_PICKUP
    params:
      C: a
      BAY: 1
      TOOL: M50
      FROM: 320
    state: 'pick-up from inside the slow band: no fast approach'
    expect: accept
    emits_regex:
    - \A(?![\s\S]*MOVE=314.0)
  - macro: _LH_LIFT_GUARD
    params:
      C: a
      BAY: 3
      MODE: drop
    expect: accept
    cases:
    - state: 'drop-off: every condition met'
      set:
        toolhead:
          position:
            x: -50.0
            y: ${zs.dock_yf}
        gcode_macro _LH_STATE:
          exch: 1
          zpos_z_a: 342.0
        gcode_button bay3:
          state: PRESSED
      emits_regex:
      - \A(?![\s\S]*_LH_HOLD)
    - state: outside an exchange
      set:
        toolhead:
          position:
            x: -50.0
            y: ${zs.dock_yf}
        gcode_macro _LH_STATE:
          exch: 0
          zpos_z_a: 342.0
        gcode_button bay3:
          state: PRESSED
      emits:
      - _LH_HOLD CODE=LIFT_OUTSIDE_EXCHANGE
    - state: bar not down
      set:
        toolhead:
          position:
            x: -50.0
            y: ${zs.dock_yf}
        gcode_macro _LH_STATE:
          exch: 1
          zpos_z_a: 342.0
        gcode_button bay3:
          state: PRESSED
        gcode_macro _LH_DOCK:
          bar: 10.0
      emits:
      - _LH_HOLD CODE=LIFT_BAR_NOT_DOWN
    - state: head 0.6 mm off the bay centre in X
      set:
        toolhead:
          position:
            x: -49.4
            y: ${zs.dock_yf}
        gcode_macro _LH_STATE:
          exch: 1
          zpos_z_a: 342.0
        gcode_button bay3:
          state: PRESSED
      emits:
      - _LH_HOLD CODE=LIFT_NOT_AT_BAY
    - state: head off the bay row in Y
      set:
        toolhead:
          position:
            x: -50.0
            y: ${zs.dock_yf - 1.0}
        gcode_macro _LH_STATE:
          exch: 1
          zpos_z_a: 342.0
        gcode_button bay3:
          state: PRESSED
      emits:
      - _LH_HOLD CODE=LIFT_NOT_AT_BAY
    - state: carriage not at the seat stroke
      set:
        toolhead:
          position:
            x: -50.0
            y: ${zs.dock_yf}
        gcode_macro _LH_STATE:
          exch: 1
          zpos_z_a: 341.0
        gcode_button bay3:
          state: PRESSED
      emits:
      - _LH_HOLD CODE=LIFT_NOT_AT_STROKE
    - state: other carriage not up
      set:
        toolhead:
          position:
            x: -50.0
            y: ${zs.dock_yf}
        gcode_macro _LH_STATE:
          exch: 1
          zpos_z_a: 342.0
          zpos_z_b: 1.0
        gcode_button bay3:
          state: PRESSED
      emits:
      - _LH_HOLD CODE=LIFT_OTHER_NOT_CLEAR
    - state: gripper not up
      set:
        toolhead:
          position:
            x: -50.0
            y: ${zs.dock_yf}
            z: 1.0
        gcode_macro _LH_STATE:
          exch: 1
          zpos_z_a: 342.0
        gcode_button bay3:
          state: PRESSED
      emits:
      - _LH_HOLD CODE=LIFT_OTHER_NOT_CLEAR
    - state: other carriage's latch not closed (jaw open)
      set:
        toolhead:
          position:
            x: -50.0
            y: ${zs.dock_yf}
        gcode_macro _LH_STATE:
          exch: 1
          zpos_z_a: 342.0
        gcode_button bay3:
          state: PRESSED
        gcode_button latch_b_empty:
          state: RELEASED
        gcode_button latch_b_open:
          state: PRESSED
      emits:
      - _LH_HOLD CODE=LIFT_OTHER_NOT_CLEAR
    - state: flat cable lost
      set:
        toolhead:
          position:
            x: -50.0
            y: ${zs.dock_yf}
        gcode_macro _LH_STATE:
          exch: 1
          zpos_z_a: 342.0
        gcode_button bay3:
          state: PRESSED
        gcode_button cable_a:
          state: RELEASED
      emits:
      - _LH_HOLD CODE=CABLE
    - state: 'bay switch not made: lugs not on the bay pins'
      set:
        toolhead:
          position:
            x: -50.0
            y: ${zs.dock_yf}
        gcode_macro _LH_STATE:
          exch: 1
          zpos_z_a: 342.0
      emits:
      - _LH_HOLD CODE=LIFT_NOT_SEATED
    - state: drop-off with the latch not locked
      set:
        toolhead:
          position:
            x: -50.0
            y: ${zs.dock_yf}
        gcode_macro _LH_STATE:
          exch: 1
          zpos_z_a: 342.0
        gcode_button bay3:
          state: PRESSED
        gcode_button latch_a:
          state: RELEASED
        gcode_button latch_a_open:
          state: PRESSED
      emits:
      - _LH_HOLD CODE=LIFT_LATCH_NOT_LOCKED
    - state: drop-off with the tool code missing (latch locked, 0000)
      set:
        toolhead:
          position:
            x: -50.0
            y: ${zs.dock_yf}
        gcode_macro _LH_STATE:
          exch: 1
          zpos_z_a: 342.0
        gcode_button bay3:
          state: PRESSED
        gcode_button hall_a1:
          state: RELEASED
        gcode_button hall_a2:
          state: RELEASED
      emits:
      - _LH_HOLD CODE=LIFT_CODE
    - state: drop-off with another tool's code
      set:
        toolhead:
          position:
            x: -50.0
            y: ${zs.dock_yf}
        gcode_macro _LH_STATE:
          exch: 1
          zpos_z_a: 342.0
        gcode_button bay3:
          state: PRESSED
        gcode_button hall_a0:
          state: PRESSED
        gcode_button hall_a1:
          state: RELEASED
      emits:
      - _LH_HOLD CODE=LIFT_CODE
  - macro: _LH_LIFT_GUARD
    params:
      C: b
      BAY: 1
      MODE: pick
    expect: accept
    cases:
    - state: 'pick-up: every condition met (B empty at s 329 over bay 1)'
      set:
        toolhead:
          position:
            x: -296.0
            y: ${zs.dock_yf}
        gcode_macro _LH_STATE:
          exch: 1
          zpos_z_b: 329.0
      emits_regex:
      - \A(?![\s\S]*_LH_HOLD)
    - state: pick-up at the seat stroke instead of seat - 13
      set:
        toolhead:
          position:
            x: -296.0
            y: ${zs.dock_yf}
        gcode_macro _LH_STATE:
          exch: 1
          zpos_z_b: 342.0
      emits:
      - _LH_HOLD CODE=LIFT_NOT_AT_STROKE
    - state: pick-up with the latch not closed-empty
      set:
        toolhead:
          position:
            x: -296.0
            y: ${zs.dock_yf}
        gcode_macro _LH_STATE:
          exch: 1
          zpos_z_b: 329.0
        gcode_button latch_b_empty:
          state: RELEASED
        gcode_button latch_b_open:
          state: PRESSED
      emits:
      - _LH_HOLD CODE=LIFT_LATCH_NOT_EMPTY
    - state: pick-up with a code already read (tool plate against the bracket)
      set:
        toolhead:
          position:
            x: -296.0
            y: ${zs.dock_yf}
        gcode_macro _LH_STATE:
          exch: 1
          zpos_z_b: 329.0
        gcode_button hall_b0:
          state: PRESSED
        gcode_button hall_b2:
          state: PRESSED
      emits:
      - _LH_HOLD CODE=LIFT_CODE
    - state: pick-up from a bay that reads empty
      set:
        toolhead:
          position:
            x: -296.0
            y: ${zs.dock_yf}
        gcode_macro _LH_STATE:
          exch: 1
          zpos_z_b: 329.0
        gcode_button bay1:
          state: RELEASED
      emits:
      - _LH_HOLD CODE=LIFT_NOT_SEATED
    - state: pick-up with the other carriage's latch wire faulty
      set:
        toolhead:
          position:
            x: -296.0
            y: ${zs.dock_yf}
        gcode_macro _LH_STATE:
          exch: 1
          zpos_z_b: 329.0
        gcode_button latch_a:
          state: RELEASED
      emits:
      - _LH_HOLD CODE=LIFT_OTHER_NOT_CLEAR
  - macro: _LH_OPEN_VERIFY
    params:
      C: a
    state: bar at the open height and the latch reads NOT CLOSED
    set:
      gcode_button dock_bar_open:
        state: PRESSED
      gcode_button latch_a:
        state: RELEASED
      gcode_button latch_a_open:
        state: PRESSED
    expect: accept
    emits_regex:
    - \A(?![\s\S]*_LH_HOLD)
  - macro: _LH_OPEN_VERIFY
    params:
      C: a
    state: 'lift stall: the bar never reached the open height'
    set:
      gcode_button latch_a:
        state: RELEASED
      gcode_button latch_a_open:
        state: PRESSED
    expect: accept
    emits:
    - _LH_HOLD_LOWERED CODE=LIFT_STALL
  - macro: _LH_OPEN_VERIFY
    params:
      C: a
    state: bar up but the latch still reads LOCKED (toggle or roller fault)
    set:
      gcode_button dock_bar_open:
        state: PRESSED
    expect: accept
    emits:
    - _LH_HOLD_LOWERED CODE=LATCH_NOT_OPEN
  - macro: _LH_OPEN_VERIFY
    params:
      C: a
    state: bar up, latch wire fault
    set:
      gcode_button dock_bar_open:
        state: PRESSED
      gcode_button latch_a:
        state: RELEASED
    expect: accept
    emits:
    - _LH_HOLD_LOWERED CODE=LATCH_NOT_OPEN
  - macro: _LH_HOLD_LOWERED
    params:
      CODE: LIFT_STALL
    state: the hold is latched BEFORE the bar is lowered (a failed lowering still leaves the hold)
    expect: accept
    emits_regex:
    - VARIABLE=hold VALUE='"LIFT_STALL"'[\s\S]*_LH_LIFT_DOWN\s*\n\s*M400\s*\n\s*_LH_HOLD_RAISE
  - macro: _LH_RELEASE_VERIFY
    params:
      C: b
      BAY: 1
    state: 'released: CLOSED-EMPTY, code 0000, bay made'
    expect: accept
    emits_regex:
    - \A(?![\s\S]*_LH_HOLD)
  - macro: _LH_RELEASE_VERIFY
    params:
      C: a
      BAY: 1
    state: tool still locked on the carriage
    expect: accept
    emits:
    - _LH_HOLD CODE=TOOL_NOT_RELEASED
  - macro: _LH_RELEASE_VERIFY
    params:
      C: b
      BAY: 1
    state: jaw did not close (closing springs)
    set:
      gcode_button latch_b_empty:
        state: RELEASED
      gcode_button latch_b_open:
        state: PRESSED
    expect: accept
    emits:
    - _LH_HOLD CODE=LATCH_NOT_CLOSED
  - macro: _LH_RELEASE_VERIFY
    params:
      C: b
      BAY: 3
    state: released but the bay reads empty
    expect: accept
    emits:
    - _LH_HOLD CODE=BAY_DISAGREE
  - macro: _LH_RELEASE_VERIFY
    params:
      C: b
      BAY: 1
    state: latch wire fault
    set:
      gcode_button latch_b_empty:
        state: RELEASED
    expect: accept
    emits:
    - _LH_HOLD CODE=LATCH_WIRE
  - macro: _LH_RELEASE_VERIFY
    params:
      C: b
      BAY: 1
    state: flat cable lost
    set:
      gcode_button cable_b:
        state: RELEASED
    expect: accept
    emits:
    - _LH_HOLD CODE=CABLE
  - macro: _LH_PICK_VERIFY
    params:
      C: a
      TOOL: M300
    state: expected tool locked
    expect: accept
    emits_regex:
    - \A(?![\s\S]*_LH_HOLD)
  - macro: _LH_PICK_VERIFY
    params:
      C: a
      TOOL: M50
    state: wrong tool in the bay
    expect: accept
    emits:
    - _LH_HOLD CODE=WRONG_TOOL
  - macro: _LH_PICK_VERIFY
    params:
      C: a
      TOOL: M300
    state: half-lock (code, latch not in its window)
    set:
      gcode_button latch_a:
        state: RELEASED
      gcode_button latch_a_open:
        state: PRESSED
