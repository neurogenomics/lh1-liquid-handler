# Behavioural cases for the LH-1 guard macros (firmware/lh1/printer.cfg, bench_rig.cfg), run by
#   klipper-guardcheck render electronics/lh1/guard_cases.yaml        (or electronics/lh1/fw_render_check.py)
# Each case renders ONE macro the way Klipper's gcode_macro does, against the named mocked printer after applying
# `set` (deep merge) and `unset`, and asserts: expect refuse/accept, and for accept the `emits` substrings.
# The mocked status follows klipper3d.org Status_Reference (toolhead.homed_axes, gcode_button state, load_cell
# is_calibrated/force_g, gcode_macro variables).  ${...} is a Jinja expression over `printer` (the base status) and the
# printer's `let` values, so numbers that come from the config follow it.
# Size family (20 Nov 2026, ADR-011): the machine printer is the resolved core + size file; family place names (module
# connectors a3 (zone A3+A4), b2, g4, g0; d3/d4 in L), TC-1 at F1, tip station B1, waste B3, MB-1 B4; dock values read from
# _LH_SIZE through ${zs...}, so the same cases run against S, M and L.  Geometry pins per size are generated from the CAD.
# Revision L (15 Nov 2026): the machine cases were rewritten for the exchange head (two tool carriages, gripper Z as printer
# Z, dock, deck-module SAFE lines, environment holds).  Old cases that still apply were carried over with the new axis names;
# retired cases and the reason are listed under `retired` at the end of this file (not run).
configs:
  machine: out/firmware_resolved_S.cfg     # GENERATED by fw_config.py (printer.cfg + its size file); fw_render_check.py overrides it per size
  rig: ../../firmware/lh1/bench_rig.cfg

printers:
  machine:
    config: machine
    status:
      toolhead: {position: {x: 0.0, y: 0.0, z: 0.0}, homed_axes: xyz}
      gcode_move: {absolute_coordinates: true}
      gcode_button tools_up: {state: PRESSED}
      gcode_button lid_parked: {state: PRESSED}
      gcode_button tip_gate: {state: RELEASED}
      gcode_button gripped: {state: RELEASED}
      gcode_button estop: {state: RELEASED}
      gcode_button door: {state: RELEASED}
      gcode_button lid_gate: {state: RELEASED}
      gcode_button therm_mirror: {state: PRESSED}      # contactor off
      gcode_button tb_mirror: {state: RELEASED}
      gcode_button lid_closed: {state: RELEASED}
      gcode_button clamp_sealed: {state: RELEASED}
      # carriage A carries M300 (code 6 = bits 1 and 2), latch made; carriage B empty; both flat cables intact
      gcode_button hall_a0: {state: RELEASED}
      gcode_button hall_a1: {state: PRESSED}
      gcode_button hall_a2: {state: PRESSED}
      gcode_button hall_a3: {state: RELEASED}
      gcode_button latch_a: {state: PRESSED}
      gcode_button latch_a_empty: {state: RELEASED}
      gcode_button latch_a_open: {state: RELEASED}
      gcode_button cable_a: {state: PRESSED}
      gcode_button hall_b0: {state: RELEASED}
      gcode_button hall_b1: {state: RELEASED}
      gcode_button hall_b2: {state: RELEASED}
      gcode_button hall_b3: {state: RELEASED}
      gcode_button latch_b: {state: RELEASED}
      gcode_button latch_b_empty: {state: PRESSED}       # ADR-014: an empty carriage reads CLOSED-EMPTY (three-state latch ladder)
      gcode_button latch_b_open: {state: RELEASED}
      gcode_button cable_b: {state: PRESSED}
      gcode_button dock_bar_open: {state: RELEASED}      # dock lift bar down
      gcode_button force_a: {state: RELEASED}
      gcode_button force_b: {state: RELEASED}
      gcode_button contact_a: {state: RELEASED}
      gcode_button contact_b: {state: RELEASED}
      # bays 1-2 occupied, 3-8 empty
      gcode_button bay1: {state: PRESSED}
      gcode_button bay2: {state: PRESSED}
      gcode_button bay3: {state: RELEASED}
      gcode_button bay4: {state: RELEASED}
      gcode_button bay5: {state: RELEASED}
      gcode_button bay6: {state: RELEASED}
      gcode_button bay7: {state: RELEASED}
      gcode_button bay8: {state: RELEASED}
      gcode_button safe_a3_a: {state: PRESSED}
      gcode_button safe_b2_a: {state: PRESSED}
      gcode_button safe_g4_a: {state: PRESSED}
      gcode_button safe_g0_a: {state: PRESSED}
      gcode_button safe_a3_b: {state: PRESSED}
      gcode_button safe_b2_b: {state: PRESSED}
      gcode_button safe_g4_b: {state: PRESSED}
      gcode_button safe_g0_b: {state: PRESSED}
      gcode_button airflow: {state: PRESSED}
      gcode_button drawer: {state: PRESSED}
      gcode_button bin_clear: {state: PRESSED}
      gcode_button waste1_ok: {state: PRESSED}
      gcode_button waste2_ok: {state: PRESSED}
      gcode_button shutter_h1: {state: PRESSED}
      gcode_button shutter_h2: {state: PRESSED}
      gcode_button cab_fan_ok_1: {state: PRESSED}
      gcode_button cab_fan_ok_2: {state: PRESSED}
      heater_generic lid_heater: {temperature: 25.0, target: 0.0}
    macro_variables:
      _LH_STATE: {homed: 1, grip: 1, mounted_a: M300, nozzle_ok_a: 1, contact_a: 2.0, pos_a: 19.0, pos_b: 0.0}
      _LH_TOOLDEF: {}
      _LH_GEOM: {}
      _LH_SIZE: {}
      _LH_TC_GUARD: {}
      _LH_PROFILE: {}                   # build profile FULL (24 Nov 2026): every device fitted
      _LH_MB1: {}
      LH_TIP_CHECK: {}
      LH_EJECT_TIP: {}
      LH_PICK_TIP: {}
      LH_TIP_PARK: {}
      _LH_DOCK: {bar: 0.0}
      LH_UV: {}
      LH_SHAKER: {}
      _LH_ZCUR: {}
      _LH_THERM: {}
      _LH_LID: {}
    let:
      zcur: "printer['gcode_macro _LH_ZCUR']"
      zs: "printer['gcode_macro _LH_SIZE']"
  rig:
    config: rig
    status:
      gcode_button rig_zup: {state: PRESSED}
      gcode_button rig_force: {state: RELEASED}
      load_cell lc_rack: {is_calibrated: true, force_g: 1000.0}
      load_cell lc_comb: {is_calibrated: true, force_g: 1000.0}
      load_cell lc_yoke: {is_calibrated: true, force_g: 1000.0}
      load_cell lc_eject: {is_calibrated: true, force_g: 1000.0}
      # revision L coupling on the rig: M300 coupled (code 6), latch LOCKED (ADR-014 three-state ladder); bay 1 empty, bay 2 occupied
      gcode_button rig_latch: {state: PRESSED}
      gcode_button rig_latch_empty: {state: RELEASED}
      gcode_button rig_latch_open: {state: RELEASED}
      gcode_button rig_bar_open: {state: RELEASED}
      load_cell lc_lift: {is_calibrated: true, force_g: 1000.0}
      manual_stepper rig_plunger: {position: 0.0}
      gcode_button rig_hall0: {state: RELEASED}
      gcode_button rig_hall1: {state: PRESSED}
      gcode_button rig_hall2: {state: PRESSED}
      gcode_button rig_hall3: {state: RELEASED}
      gcode_button rig_bay1: {state: RELEASED}
      gcode_button rig_bay2: {state: PRESSED}
    macro_variables:
      _BR: {homed: 1, zpos: 0.0, xpos: 0.0}
      _BRL: {lift: 0.0}
    let:
      br: "printer['gcode_macro _BR']"
      br_l: "printer['gcode_macro _BRL']"
      mounted: "br.mounted"
      xc: "br['x_comb_' ~ mounted]"
      zc: "br['z_comb_' ~ mounted]"
      xe: "br.x_eject"
      dm: "br['depth_max_' ~ mounted]"
      sl: "br.comb_slide_mm"

cases:
  # ---------------------------------------------------------------- machine
  - printer: machine
    cases:
      # ---- G0 / G1 (carried over; printer Z is now the gripper Z).  23 Nov 2026 (V2): G0/G1 check only their parameters,
      # wait (M400) and hand over to _LH_GMOVE, which reads the state; the state refusals are asserted on _LH_GMOVE.
      # B: a lowered axis may travel at its travel height: "carriage down" refusals replaced by the equally strict
      # TRAVEL_HEIGHT cases on _LH_TRAVEL_GUARD below (an axis below its travel height over the path is refused).
      - foreach: {g: [G0, G1]}
        cases:
          - {macro: "${g}", params: {X: 10, Y: 20}, expect: accept, emits: ["_LH_GMOVE CMD=${g} X=10.0 Y=20.0"], emits_regex: ["\\A\\s*M400\\s*\\n\\s*_LH_GMOVE"]}
          - {macro: "${g}", params: {X: 10, E: 1}, state: "extra parameter E", expect: refuse}
          - {macro: "${g}", params: {Z: -1}, state: "Z below 0", expect: refuse}
          - {macro: "${g}", params: {X: 1, Z: 5}, state: "XY and Z together", expect: refuse}
          - {macro: _LH_GMOVE, params: {CMD: "${g}", X: 10, Y: 20}, expect: accept, emits: ["_LH_TOOLS_LOCKED WHO=${g}", "${g}.1 X10.0 Y20.0"], emits_regex: ["\\A(?![\\s\\S]*_LH_TRAVEL_GUARD)"]}
          - {macro: _LH_GMOVE, params: {CMD: "${g}", Z: 50}, expect: accept, emits: ["_LH_TC_GUARD TOOL=gripper C=g STROKE=50.0", "LINE=b", "_LH_TRAVEL_GUARD EXCEPT=g", "_LH_DEPTH_GUARD C=g TOOL=gripper S=50.0", "${g}.1 Z50.0"]}
          - {macro: _LH_GMOVE, params: {CMD: "${g}", X: 10}, state: "not homed", set: {gcode_macro _LH_STATE: {homed: 0}}, expect: refuse}
          - {macro: _LH_GMOVE, params: {CMD: "${g}", X: 10}, state: "Klipper homed_axes cleared (motors off)", set: {toolhead: {homed_axes: z}}, expect: refuse}
          - {macro: _LH_GMOVE, params: {CMD: "${g}", X: 10}, state: "all-tools-up chain open with every axis reading up", set: {gcode_button tools_up: {state: RELEASED}}, expect: refuse}
          - {macro: _LH_GMOVE, params: {CMD: "${g}", X: 10}, state: "carriage A lowered: the path is checked at its travel height", set: {gcode_macro _LH_STATE: {zpos_z_a: 5.0}}, expect: accept, emits: ["_LH_TRAVEL_GUARD X0=0.0 Y0=0.0 X1=10.0 Y1=0.0 WHO=${g}"]}
          - {macro: _LH_GMOVE, params: {CMD: "${g}", X: 10}, state: "gripper lowered: the path is checked at its travel height", set: {toolhead: {position: {z: 3.0}}}, expect: accept, emits: ["_LH_TRAVEL_GUARD"]}
          - {macro: _LH_GMOVE, params: {CMD: "${g}", X: 10}, state: "gripper UNKNOWN", set: {gcode_macro _LH_STATE: {grip: 0}}, expect: refuse}
          - {macro: _LH_GMOVE, params: {CMD: "${g}", X: 10}, state: "relative mode", set: {gcode_move: {absolute_coordinates: false}}, expect: refuse}
          - {macro: _LH_GMOVE, params: {CMD: "${g}", Z: -1}, state: "Z below 0", expect: refuse}
          - {macro: _LH_GMOVE, params: {CMD: "${g}", X: 1, Z: 5}, state: "XY and Z together", expect: refuse}
          # rev L new refusals
          - {macro: _LH_GMOVE, params: {CMD: "${g}", X: 10}, state: "motion hold HALF_LOCK latched", set: {gcode_macro _LH_STATE: {hold: HALF_LOCK}}, expect: refuse}
          - {macro: _LH_GMOVE, params: {CMD: "${g}", Y: "${zs.dock_zone_yf}"}, state: "target in the dock row", expect: refuse}
          - {macro: _LH_GMOVE, params: {CMD: "${g}", X: 10}, state: "head inside the dock row (leave only by LH_DOCK_LEAVE)", set: {toolhead: {position: {y: "${zs.dock_yf}"}}}, expect: refuse}
          - {macro: _LH_GMOVE, params: {CMD: "${g}", Z: 50}, state: "gripper over the A4 tube block (zone A3), module NOT safe for the gripper", set: {toolhead: {position: {x: 174.0, y: -61.0}}, gcode_button safe_a3_b: {state: RELEASED}}, expect: accept, emits: ["_LH_PLACE_GUARD X=264.0 Y=-165.0 LINE=b"]}
          # A5 / V3: the shelf window right of the bays (gripper at the spent-wafer slot OK: head x 450, y 356)
          - {macro: _LH_GMOVE, params: {CMD: "${g}", X: 450, Y: "${zs.dock_yf + 1.5}"}, state: "gripper to the shelf slot OK from the front, in the shelf window", set: {toolhead: {position: {x: 450.0, y: "${zs.dock_zone_yf - 100}"}}}, expect: accept, emits: ["${g}.1 X450.0 Y"]}
          - {macro: _LH_GMOVE, params: {CMD: "${g}", X: 450, Y: "${zs.dock_yf + 1.5}"}, state: "diagonal into the dock row: crosses its Y left of the window", set: {toolhead: {position: {x: 0.0, y: "${zs.dock_zone_yf - 100}"}}}, expect: refuse, message: "left of the shelf window"}
          - {macro: _LH_GMOVE, params: {CMD: "${g}", X: 300, Y: "${zs.dock_yf + 1.5}"}, state: "dock row's Y left of the window (over the bays)", set: {toolhead: {position: {x: 300.0, y: "${zs.dock_zone_yf - 100}"}}}, expect: refuse}
          - {macro: _LH_GMOVE, params: {CMD: "${g}", X: 450, Y: "${zs.dock_yf + 1.5}"}, state: "into the shelf window with carriage A lowered", set: {toolhead: {position: {x: 450.0, y: "${zs.dock_zone_yf - 100}"}}, gcode_macro _LH_STATE: {zpos_z_a: 5.0}}, expect: refuse, message: "SHELF_WINDOW"}
          - {macro: _LH_GMOVE, params: {CMD: "${g}", Z: 200}, state: "gripper descends at OK in the window", set: {toolhead: {position: {x: 450.0, y: "${zs.dock_yf + 1.5}"}}}, expect: accept, emits: ["_LH_DEPTH_GUARD C=g TOOL=gripper S=200.0 X=450.0"]}
          - {macro: _LH_GMOVE, params: {CMD: "${g}", Z: 200}, state: "gripper descends over the bays", set: {toolhead: {position: {x: 100.0, y: "${zs.dock_yf + 1.5}"}}}, expect: refuse}
      # ---- carriage lock state (head_l TOOL PRESENT AND LOCKED, HALF-LOCK, WRONG TOOL, cable loop)
      - {macro: _LH_TOOLS_LOCKED, params: {WHO: G0}, state: "A locked M300, B empty", expect: accept}
      - {macro: _LH_TOOLS_LOCKED, params: {WHO: G0}, state: "A half-locked (code present, latch out of window)", set: {gcode_button latch_a: {state: RELEASED}}, expect: refuse}
      - {macro: _LH_TOOLS_LOCKED, params: {WHO: G0}, state: "A one Hall bit lost (code 4: odd weight, invalid)", set: {gcode_button hall_a1: {state: RELEASED}}, expect: refuse}
      - {macro: _LH_TOOLS_LOCKED, params: {WHO: G0}, state: "A reads another valid tool (code 5 M50, M300 recorded)", set: {gcode_button hall_a0: {state: PRESSED}, gcode_button hall_a1: {state: RELEASED}}, expect: refuse}
      - {macro: _LH_TOOLS_LOCKED, params: {WHO: G0}, state: "A dropped (code 0000, latch open) while M300 recorded", set: {gcode_button hall_a1: {state: RELEASED}, gcode_button hall_a2: {state: RELEASED}, gcode_button latch_a: {state: RELEASED}}, expect: refuse}
      - {macro: _LH_TOOLS_LOCKED, params: {WHO: G0}, state: "B empty but latch reads locked (switch fault)", set: {gcode_button latch_b: {state: PRESSED}}, expect: refuse}
      - {macro: _LH_TOOLS_LOCKED, params: {WHO: G0}, state: "B recorded empty but reads a tool", set: {gcode_button hall_b0: {state: PRESSED}, gcode_button hall_b3: {state: PRESSED}, gcode_button latch_b: {state: PRESSED}}, expect: refuse}
      - {macro: _LH_TOOLS_LOCKED, params: {WHO: G0}, state: "A flat cable pulled (reads empty + cable lost)", set: {gcode_button cable_a: {state: RELEASED}, gcode_button hall_a1: {state: RELEASED}, gcode_button hall_a2: {state: RELEASED}, gcode_button latch_a: {state: RELEASED}}, expect: refuse}
      - {macro: _LH_CARRIAGE_EVENT, params: {C: a}, state: "latch change outside an exchange (DROPPED TOOL)", expect: accept, emits: [DROPPED_TOOL, M112]}
      - {macro: _LH_CARRIAGE_EVENT, params: {C: a}, state: "latch change during an exchange (expected)", set: {gcode_macro _LH_STATE: {exch: 1}}, expect: accept, emits_regex: ["\\A(?![\\s\\S]*M112)"]}
      # ---- power-up read before homing
      - {macro: _LH_POWERUP_READ, state: "A tool locked, B empty", expect: accept, emits: ["VARIABLE=mounted_a VALUE='\"M300\"'", "VARIABLE=tips_a VALUE=-1", "VARIABLE=nozzle_ok_a VALUE=0", "VARIABLE=mounted_b VALUE='\"\"'"]}
      - {macro: _LH_POWERUP_READ, state: "power-up with a half-locked tool on A", set: {gcode_button latch_a: {state: RELEASED}}, expect: refuse}
      - {macro: _LH_POWERUP_READ, state: "power-up with an invalid code on A", set: {gcode_button hall_a2: {state: RELEASED}}, expect: refuse}
      - {macro: _LH_POWERUP_READ, state: "power-up with carriage B cable lost", set: {gcode_button cable_b: {state: RELEASED}}, expect: refuse}
      - {macro: _LH_ZBACKOFF, params: {C: a}, state: "tool on A (Z up only)", expect: accept, emits: ["homed up only"], emits_regex: ["\\A(?![\\s\\S]*inverted_probe)"]}
      - {macro: _LH_ZBACKOFF, params: {C: b}, state: "B empty (back-off-and-retrigger)", expect: accept, emits: ["STEPPER=z_b SPEED=2 MOVE=3 STOP_ON_ENDSTOP=inverted_probe"]}
      # ---- MANUAL_STEPPER (carried over with z_a / z_b; rev L lowering conditions added).  23 Nov 2026 (V2): the wrapper
      # checks parameters, M400, then _LH_ZMOVE reads the state; state refusals are asserted on _LH_ZMOVE.  B: the other
      # axes may be at their travel height (TRAVEL_HEIGHT cases below replace "lower one Z axis at a time").
      - {macro: MANUAL_STEPPER, params: {STEPPER: z_a, MOVE: 10}, expect: accept, emits: ["_LH_ZMOVE STEPPER=z_a MOVE=10.0 SPEED=10.0"], emits_regex: ["\\A\\s*M400\\s*\\n\\s*_LH_ZMOVE"]}
      - {macro: MANUAL_STEPPER, params: {STEPPER: z_a, MOVE: 10, SET_POSITION: 0}, state: "SET_POSITION", expect: refuse}
      - {macro: MANUAL_STEPPER, params: {STEPPER: z_a, MOVE: 10, SYNC: 0}, state: "SYNC=0", expect: refuse}
      - {macro: MANUAL_STEPPER, params: {STEPPER: z_a, MOVE: 10, STOP_ON_ENDSTOP: home}, state: "STOP_ON_ENDSTOP", expect: refuse}
      - {macro: MANUAL_STEPPER, params: {STEPPER: z_a, GCODE_AXIS: A}, state: "GCODE_AXIS", expect: refuse}
      - {macro: MANUAL_STEPPER, params: {STEPPER: z_a, ENABLE: 0}, state: "ENABLE", expect: refuse}
      - {macro: MANUAL_STEPPER, params: {STEPPER: z_a, MOVE: -1}, state: "MOVE below 0", expect: refuse}
      - {macro: MANUAL_STEPPER, params: {STEPPER: pusher_a, MOVE: 1}, state: "pusher", expect: refuse}
      - {macro: MANUAL_STEPPER, params: {STEPPER: gripper, MOVE: 1}, state: "gripper", expect: refuse}
      - {macro: MANUAL_STEPPER, params: {STEPPER: z_a, MOVE: 10, SPEED: 30}, state: "faster than the Z corner speed (25 mm/s)", expect: refuse}
      - {macro: _LH_ZMOVE, params: {STEPPER: z_a, MOVE: 10, SPEED: 10, ACCEL: 300}, expect: accept, emits: ["_LH_TRAVEL_GUARD EXCEPT=a", "_LH_TOOLS_LOCKED", "_LH_TC_GUARD TOOL=M300 C=a STROKE=10.0", "LINE=a WHO=MANUAL_STEPPER C=a", "_LH_DEPTH_GUARD C=a TOOL=M300 S=10.0", "MANUAL_STEPPER_BASE STEPPER=z_a MOVE=10.0"]}
      - {macro: _LH_ZMOVE, params: {STEPPER: z_a, MOVE: 10, SPEED: 10, ACCEL: 300}, state: "not homed", set: {gcode_macro _LH_STATE: {homed: 0}}, expect: refuse}
      - {macro: _LH_ZMOVE, params: {STEPPER: z_b, MOVE: 10, SPEED: 10, ACCEL: 300}, state: "lowering an empty carriage", expect: refuse}
      - {macro: _LH_ZMOVE, params: {STEPPER: z_a, MOVE: 10, SPEED: 10, ACCEL: 300}, state: "nozzle not checked since the pick-up", set: {gcode_macro _LH_STATE: {nozzle_ok_a: 0}}, expect: refuse}
      - {macro: _LH_ZMOVE, params: {STEPPER: z_a, MOVE: 10, SPEED: 10, ACCEL: 300}, state: "A4: tip state UNKNOWN (ejected, not observed)", set: {gcode_macro _LH_STATE: {tips_a: -1}}, expect: refuse, message: "TIPS_UNKNOWN"}
      - {macro: _LH_ZMOVE, params: {STEPPER: z_a, MOVE: 10, SPEED: 10, ACCEL: 300}, state: "over the dock row", set: {toolhead: {position: {y: "${zs.dock_yf}"}}}, expect: refuse}
      - {macro: _LH_ZMOVE, params: {STEPPER: z_a, MOVE: 10, SPEED: 10, ACCEL: 300}, state: "hold latched: Z stays", set: {gcode_macro _LH_STATE: {hold: WRONG_TOOL}}, expect: refuse}
      - {macro: _LH_ZMOVE, params: {STEPPER: z_a, MOVE: 0, SPEED: 10, ACCEL: 300}, state: "raising is always allowed (no hold)", set: {gcode_macro _LH_STATE: {zpos_z_a: 50.0, nozzle_ok_a: 0}}, expect: accept, emits: ["MANUAL_STEPPER_BASE STEPPER=z_a MOVE=0.0"], emits_regex: ["\\A(?![\\s\\S]*_LH_TC_GUARD)"]}
      # ---- B: travel height (_LH_TRAVEL_GUARD): CAD zones of the size file, footprint swept along the path, margin 10 mm.
      # Carriage A M300 (p300): lowest point z = 360 - 59 - s.  Path over row B (B0 comb top 102.6, A3 cold block limit 155)
      - {macro: _LH_TRAVEL_GUARD, params: {X0: 0, Y0: 47.5, X1: 50, Y1: 47.5, WHO: G0}, state: "A at s 100 over row B (lowest z 201 >= 155 + 10)", set: {gcode_macro _LH_STATE: {zpos_z_a: 100.0}}, expect: accept}
      - {macro: _LH_TRAVEL_GUARD, params: {X0: 0, Y0: 47.5, X1: 50, Y1: 47.5, WHO: G0}, state: "A at s 200 over row B (lowest z 101 < the strip module place top + 10)", set: {gcode_macro _LH_STATE: {zpos_z_a: 200.0}}, expect: refuse, message: "TRAVEL_HEIGHT"}
      - {macro: _LH_TRAVEL_GUARD, params: {X0: 260, Y0: -60, X1: 260, Y1: 160, WHO: G0}, state: "A at s 160 across row A: the A3 cold-block height limit (155) is on the path", set: {gcode_macro _LH_STATE: {zpos_z_a: 160.0}}, expect: refuse, message: "A3"}
      - {macro: _LH_TRAVEL_GUARD, params: {X0: 0, Y0: 0, WHO: G0}, state: "gripper at s 250 (fingertips z 91) over the deck", set: {toolhead: {position: {z: 250.0}}}, expect: refuse, message: "gripper"}
      - {macro: _LH_TRAVEL_GUARD, params: {X0: 0, Y0: 0, WHO: G0}, state: "gripper at s 100 (fingertips z 241) over the deck", set: {toolhead: {position: {z: 100.0}}}, expect: accept}
      - {macro: _LH_TRAVEL_GUARD, params: {ONLY: b, ALL: 1, WHO: sideways}, state: "B with M50 at s 200 anywhere (lowest z 109 < tallest item + 10)", set: {gcode_macro _LH_STATE: {mounted_b: M50, zpos_z_b: 200.0}}, expect: refuse}
      - {macro: _LH_TRAVEL_GUARD, params: {EXCEPT: a, WHO: MANUAL_STEPPER}, state: "descending carriage A is not checked by its own travel guard", set: {gcode_macro _LH_STATE: {zpos_z_a: 300.0}}, expect: accept}
      - {macro: LH_TRAVEL_QUERY, state: "whole deck: A (M300) 301 - (tallest 155 + 10) = 136, B empty, gripper 341 - 165 = 176", expect: accept, emits: ["LH_TRAVEL S_A=136.00 S_B=EMPTY S_G=176.00"]}
      # ---- A3 / V6: per-place depth caps from the CAD reach report (by_place_and_tool s_target), every tool and place
      - {macro: _LH_DEPTH_GUARD, params: {C: a, TOOL: M300, S: "${zs.depth.g4[4]['M300@a']}", X: "${zs.depth.g4[0] + 90}", Y: "${zs.depth.g4[1] + 102.5}", WHO: t}, state: "M300 on A into the G4 cold plate wells to the CAD floor stroke", expect: accept}
      - {macro: _LH_DEPTH_GUARD, params: {C: a, TOOL: M300, S: "${zs.depth.g4[4]['M300@a'] + 0.5}", X: "${zs.depth.g4[0] + 90}", Y: "${zs.depth.g4[1] + 102.5}", WHO: t}, state: "M300 0.5 mm below the CAD floor stroke at G4", expect: refuse, message: "DEPTH"}
      - {macro: _LH_DEPTH_GUARD, params: {C: a, TOOL: M300, S: 345, X: "${zs.depth.g4[0] + 90}", Y: "${zs.depth.g4[1] + 102.5}", WHO: t}, state: "M300 to the end of the stroke at G4 (was allowed: V6)", expect: refuse, message: "DEPTH"}
      - {macro: _LH_DEPTH_GUARD, params: {C: a, TOOL: M300, S: 250, X: 222, Y: -62.5, WHO: t}, state: "M300 at A3 (tube block: no CAD reach for M300): only the clearance height", expect: accept, emits: ["_LH_TRAVEL_GUARD", "ONLY=a SA=250.0", "@A3"]}
      # ---- _LH_XY_GUARD (carried over)
      - {macro: _LH_XY_GUARD, expect: accept, emits: [_LH_TOOLS_LOCKED]}
      - {macro: _LH_XY_GUARD, params: {C: a}, state: "own carriage lowered (in-nest move)", set: {gcode_macro _LH_STATE: {zpos_z_a: 233.0}}, expect: accept}
      - {macro: _LH_XY_GUARD, state: "chain open", set: {gcode_button tools_up: {state: RELEASED}}, expect: refuse}
      - {macro: _LH_XY_GUARD, state: "carriage down", set: {gcode_macro _LH_STATE: {zpos_z_b: 2.0}}, expect: refuse}
      - {macro: _LH_XY_GUARD, params: {C: a}, state: "the other carriage lowered: checked at its whole-deck travel height (B)", set: {gcode_macro _LH_STATE: {zpos_z_b: 2.0}}, expect: accept, emits: ["_LH_TRAVEL_GUARD ONLY=b ALL=1"]}
      - {macro: _LH_XY_GUARD, state: "gripper UNKNOWN", set: {gcode_macro _LH_STATE: {grip: 0}}, expect: refuse}
      - {macro: _LH_XY_GUARD, state: "not homed", set: {gcode_macro _LH_STATE: {homed: 0}}, expect: refuse}
      - {macro: _LH_XY_GUARD, state: "homed_axes cleared", set: {toolhead: {homed_axes: ""}}, expect: refuse}
      - {macro: _LH_XY_GUARD, state: "hold latched", set: {gcode_macro _LH_STATE: {hold: BAY_DISAGREE}}, expect: refuse}
      # ---- module place guard (ADR-010 fail-safe lines)
      - {macro: _LH_PLACE_GUARD, params: {X: 0, Y: -55, LINE: a, WHO: t}, state: "B2 strip module safe", expect: accept}
      - {macro: _LH_PLACE_GUARD, params: {X: 0, Y: -55, LINE: a, WHO: t}, state: "B2 line A open (module busy or unplugged)", set: {gcode_button safe_b2_a: {state: RELEASED}}, expect: refuse}
      - {macro: _LH_PLACE_GUARD, params: {X: 264, Y: -165, LINE: b, WHO: t}, state: "A4 is in module zone A3: zone line B open", set: {gcode_button safe_a3_b: {state: RELEASED}}, expect: refuse}
      - {macro: _LH_PLACE_GUARD, params: {X: 132, Y: -55, LINE: a, WHO: t}, state: "B3 liquid waste (station connector, no SAFE line) unaffected by B2", set: {gcode_button safe_b2_a: {state: RELEASED}}, expect: accept}
      - {macro: _LH_PLACE_GUARD, params: {X: -264, Y: "${zs.places.g0[1]}", LINE: a, WHO: t}, state: "G0 hazardous liquid: loop-back plug pulled (reserved 37 C module place)", set: {gcode_button safe_g0_a: {state: RELEASED}}, expect: refuse}
      # carriage-B-only p1000 rack (S/M shelf IG): generated per size from the CAD (out/guard_cases_sizes.yaml); MANUAL_STEPPER
      # and LH_PICK_TIP pass C= to the place guard (cases above)
      - {macro: LH_SIZE_STATUS, expect: accept, emits: ["LH_SIZE SIZE=${zs.size} ", "PLACES=a3:a3,a4:a3,b2:b2"]}
      # ---- tool exchange (ADR-014: the dock lift opens the carriage latch; Z only positions; every refusal has a case)
      - {macro: LH_TOOL_PARK, params: {CARRIAGE: A, BAY: 3}, expect: accept, emits: ["_LH_EXCH_GUARD C=a BAY=3 WHO=LH_TOOL_PARK MODE=drop", _LH_DOCK_ENTER, "G0.1 X-50.0", "VARIABLE=exch VALUE=1", "_LH_DROP C=a BAY=3", "VARIABLE=mounted_a VALUE='\"\"'", "STEPPER=z_a MOVE=0", "VARIABLE=exch VALUE=0", LH_DOCK_LEAVE, "LH_TOOL RESULT=PARKED CARRIAGE=A BAY=3 TOOL=M300"]}
      - {macro: LH_TOOL_PARK, params: {CARRIAGE: A, BAY: 3}, state: "V2: the guard is rendered after an M400; the drop runs after the X move, an M400 and the settle", expect: accept, emits_regex: ["\\A\\s*M400\\s*\\n\\s*_LH_EXCH_GUARD", "G0.1 X-50.0[^\\n]*\\n\\s*M400\\s*\\n\\s*G4 P1040"]}
      - {macro: LH_TOOL_PICK, params: {CARRIAGE: B, BAY: 1, TOOL: M50}, expect: accept, emits: ["_LH_EXCH_GUARD C=b BAY=1 WHO=LH_TOOL_PICK MODE=pick TOOL=M50", "G0.1 X-296.0", "VARIABLE=exch VALUE=1", "_LH_PICKUP C=b BAY=1 TOOL=M50 FROM=0", "VARIABLE=mounted_b VALUE='\"M50\"'", "VARIABLE=tips_b VALUE=0", "VARIABLE=nozzle_ok_b VALUE=0", "VARIABLE=exch VALUE=0", LH_DOCK_LEAVE, "_LH_PUSHER_FIND C=b", "LH_TOOL RESULT=PICKED CARRIAGE=B BAY=1 TOOL=M50"]}
      - {macro: LH_TOOL_EXCHANGE, params: {CARRIAGE: A, PARK_BAY: 3, PICK_BAY: 1, TOOL: M50}, state: "CAD exchange in one pass: drop at 3, empty carriage at s 302 along the row, pick at 1", expect: accept,
         emits: ["_LH_EXCH_GUARD C=a BAY=3 WHO=LH_TOOL_EXCHANGE MODE=drop", "_LH_EXCH_GUARD_BAY BAY=1", "G0.1 X-50.0", "_LH_DROP C=a BAY=3", "VARIABLE=mounted_a VALUE='\"\"'", "STEPPER=z_a MOVE=302.0", "_LH_INROW_GUARD C=a BAY=1", "G0.1 X-206.0", "_LH_PICKUP C=a BAY=1 TOOL=M50 FROM=302.0", "VARIABLE=mounted_a VALUE='\"M50\"'", "_LH_PUSHER_FIND C=a", "RESULT=EXCHANGED CARRIAGE=A PARK_BAY=3 PICK_BAY=1 PARKED=M300 TOOL=M50"],
         emits_regex: ["STEPPER=z_a MOVE=302.0[^\\n]*\\n[^\\n]*\\n\\s*M400\\s*\\n\\s*_LH_INROW_GUARD"]}
      - {macro: LH_TOOL_EXCHANGE, params: {CARRIAGE: A, PARK_BAY: 3, PICK_BAY: 3, TOOL: M50}, state: "park and pick bay the same", expect: refuse}
      - {macro: LH_TOOL_EXCHANGE, params: {CARRIAGE: A, PARK_BAY: 3, PICK_BAY: 1, TOOL: P99}, state: "unknown tool", expect: refuse}
      - {macro: _LH_EXCH_GUARD_BAY, params: {BAY: 1, WHO: t}, state: "pick bay occupied", expect: accept}
      - {macro: _LH_EXCH_GUARD_BAY, params: {BAY: 3, WHO: t}, state: "pick bay empty", expect: refuse, message: "BAY_EMPTY"}
      - {macro: _LH_EXCH_GUARD_BAY, params: {BAY: 9, WHO: t}, state: "pick bay out of range", expect: refuse}
      # _LH_EXCH_GUARD: before the head enters the row (base: A carries M300 locked, B empty CLOSED-EMPTY, bays 1-2 occupied, bar down)
      - {macro: _LH_EXCH_GUARD, params: {C: a, BAY: 3, WHO: t, MODE: drop}, expect: accept, emits: [_LH_TOOLS_LOCKED]}
      - {macro: _LH_EXCH_GUARD, params: {C: a, BAY: 1, WHO: t, MODE: drop}, state: "drop-off into an occupied bay", expect: refuse, message: "BAY_OCCUPIED"}
      - {macro: _LH_EXCH_GUARD, params: {C: b, BAY: 3, WHO: t, MODE: drop}, state: "drop-off from an empty carriage", expect: refuse, message: "carries no tool"}
      - {macro: _LH_EXCH_GUARD, params: {C: b, BAY: 1, WHO: t, MODE: pick, TOOL: M50}, expect: accept, emits: [_LH_TOOLS_LOCKED]}
      - {macro: _LH_EXCH_GUARD, params: {C: b, BAY: 3, WHO: t, MODE: pick, TOOL: M50}, state: "pick-up from an empty bay", expect: refuse, message: "BAY_EMPTY"}
      - {macro: _LH_EXCH_GUARD, params: {C: a, BAY: 1, WHO: t, MODE: pick, TOOL: M50}, state: "pick-up onto a carriage that already carries a tool", expect: refuse, message: "already carries"}
      - {macro: _LH_EXCH_GUARD, params: {C: b, BAY: 1, WHO: t, MODE: pick, TOOL: P99}, state: "pick-up of an unknown tool", expect: refuse, message: "unknown TOOL"}
      - {macro: _LH_EXCH_GUARD, params: {C: a, BAY: 3, WHO: t, MODE: drop}, state: "tips on carriage A", set: {gcode_macro _LH_STATE: {tips_a: 1}}, expect: refuse}
      - {macro: _LH_EXCH_GUARD, params: {C: a, BAY: 3, WHO: t, MODE: drop}, state: "tips on the OTHER carriage", set: {gcode_macro _LH_STATE: {tips_b: 1}}, expect: refuse}
      - {macro: _LH_EXCH_GUARD, params: {C: a, BAY: 3, WHO: t, MODE: drop}, state: "a Z axis not at 0", set: {gcode_macro _LH_STATE: {zpos_z_b: 1.0}}, expect: refuse}
      - {macro: _LH_EXCH_GUARD, params: {C: a, BAY: 3, WHO: t, MODE: drop}, state: "chain open", set: {gcode_button tools_up: {state: RELEASED}}, expect: refuse}
      - {macro: _LH_EXCH_GUARD, params: {C: a, BAY: 9, WHO: t, MODE: drop}, state: "bay out of range", expect: refuse}
      - {macro: _LH_EXCH_GUARD, params: {C: a, BAY: 3, WHO: t, MODE: drop}, state: "hold latched", set: {gcode_macro _LH_STATE: {hold: HALF_LOCK}}, expect: refuse}
      - {macro: _LH_EXCH_GUARD, params: {C: a, BAY: 3, WHO: t, MODE: drop}, state: "dock lift bar not homed down (restart or failed lowering)", set: {gcode_macro _LH_DOCK: {bar: -1.0}}, expect: refuse, message: "DOCK_BAR"}
      - {macro: _LH_EXCH_GUARD, params: {C: a, BAY: 3, WHO: t, MODE: drop}, state: "an exchange already latched (exch = 1)", set: {gcode_macro _LH_STATE: {exch: 1}}, expect: refuse, message: "in progress"}
      - {macro: _LH_EXCH_GUARD, params: {C: a, BAY: 3, WHO: t, MODE: drop}, state: "not homed", set: {gcode_macro _LH_STATE: {homed: 0}}, expect: refuse}
      - {macro: _LH_EXCH_GUARD, params: {C: a, BAY: 3, WHO: t, MODE: drop}, state: "gripper state unknown", set: {gcode_macro _LH_STATE: {grip: 0}}, expect: refuse}
      - {macro: _LH_DOCK_ENTER, expect: accept, emits: ["G0.1 X465.0", "G0.1 Y${zs.dock_yf}"]}
      - {macro: LH_DOCK_LEAVE, expect: accept, emits: ["G0.1 X465.0", "G0.1 Y${zs.dock_exit_yf}"]}
      - {macro: LH_DOCK_LEAVE, state: "tips on a carriage inside the dock row", set: {gcode_macro _LH_STATE: {tips_b: 1}}, expect: refuse}
      # drop-off steps 1-4 and pick-up steps 1-5 (CAD head report safety.sequences): moves and their order
      - {macro: _LH_DROP, params: {C: a, BAY: 3}, state: "drop-off: seat, guard, bar up 34.1 (rise 31.1 + gap 3), verify, 13 x (bar +1 then Z -1), bar down onto its switch, verify",
         expect: accept, emits: ["STEPPER=z_a MOVE=327.0 SPEED=25.0", "STEPPER=z_a MOVE=342.0 SPEED=5.0", "_LH_LIFT_GUARD C=a BAY=3 MODE=drop", "_LH_LIFT_MOVE TO=34.1", "_LH_OPEN_VERIFY C=a", "STEPPER=dock_lift MOVE=47.1", "STEPPER=z_a MOVE=329.0", "VARIABLE=bar VALUE=47.1", "VARIABLE=zpos_z_a VALUE=329.0", "_LH_LIFT_DOWN", "_LH_RELEASE_VERIFY C=a BAY=3"],
         emits_regex: ["MOVE=342.0[^\\n]*\\n[^\\n]*\\n\\s*M400\\s*\\n\\s*_LH_LIFT_GUARD", "_LH_LIFT_MOVE TO=34.1\\s*\\n\\s*M400\\s*\\n\\s*_LH_OPEN_VERIFY", "STEPPER=dock_lift MOVE=35.1[^\\n]*\\n\\s*MANUAL_STEPPER_BASE STEPPER=z_a MOVE=341.0", "_LH_LIFT_DOWN\\s*\\n\\s*M400\\s*\\n\\s*_LH_RELEASE_VERIFY"]}
      - {macro: _LH_PICKUP, params: {C: b, BAY: 1, TOOL: M50, FROM: 0}, state: "pick-up: approach to s 329 (stud 0.5 mm below the jaw), guard, bar up 47.1, verify, 13 x (Z +1 then bar -1), bar down, verify LOCKED with the code, Z up slowly off the pins, verify the bay empty",
         expect: accept, emits: ["STEPPER=z_b MOVE=314.0 SPEED=25.0", "STEPPER=z_b MOVE=329.0 SPEED=5.0", "_LH_LIFT_GUARD C=b BAY=1 MODE=pick", "_LH_LIFT_MOVE TO=47.1", "_LH_OPEN_VERIFY C=b", "STEPPER=z_b MOVE=342.0", "STEPPER=dock_lift MOVE=34.1", "_LH_LIFT_DOWN", "_LH_PICK_VERIFY C=b TOOL=M50", "STEPPER=z_b MOVE=327.0 SPEED=5.0", "STEPPER=z_b MOVE=0 SPEED=25.0", "_LH_BAY_EMPTY_VERIFY BAY=1"],
         emits_regex: ["STEPPER=z_b MOVE=330.0[^\\n]*\\n\\s*MANUAL_STEPPER_BASE STEPPER=dock_lift MOVE=46.1", "_LH_LIFT_DOWN\\s*\\n\\s*M400\\s*\\n\\s*_LH_PICK_VERIFY", "_LH_PICK_VERIFY[^\\n]*\\n\\s*MANUAL_STEPPER_BASE STEPPER=z_b MOVE=327.0", "M400\\s*\\n\\s*_LH_BAY_EMPTY_VERIFY"]}
      - {macro: _LH_PICKUP, params: {C: a, BAY: 1, TOOL: M50, FROM: 320}, state: "pick-up from inside the slow band: no fast approach", expect: accept, emits_regex: ["\\A(?![\\s\\S]*MOVE=314.0)"]}
      # _LH_LIFT_GUARD (before the bar may rise): drop-off state = A seated at bay 3 (x -50), exch 1, Z 342, bay 3 made
      - macro: _LH_LIFT_GUARD
        params: {C: a, BAY: 3, MODE: drop}
        expect: accept
        cases:
          - {state: "drop-off: every condition met", set: {toolhead: {position: {x: -50.0, y: "${zs.dock_yf}"}}, gcode_macro _LH_STATE: {exch: 1, zpos_z_a: 342.0}, gcode_button bay3: {state: PRESSED}}, emits_regex: ["\\A(?![\\s\\S]*_LH_HOLD)"]}
          - {state: "outside an exchange", set: {toolhead: {position: {x: -50.0, y: "${zs.dock_yf}"}}, gcode_macro _LH_STATE: {exch: 0, zpos_z_a: 342.0}, gcode_button bay3: {state: PRESSED}}, emits: ["_LH_HOLD CODE=LIFT_OUTSIDE_EXCHANGE"]}
          - {state: "bar not down", set: {toolhead: {position: {x: -50.0, y: "${zs.dock_yf}"}}, gcode_macro _LH_STATE: {exch: 1, zpos_z_a: 342.0}, gcode_button bay3: {state: PRESSED}, gcode_macro _LH_DOCK: {bar: 10.0}}, emits: ["_LH_HOLD CODE=LIFT_BAR_NOT_DOWN"]}
          - {state: "head 0.6 mm off the bay centre in X", set: {toolhead: {position: {x: -49.4, y: "${zs.dock_yf}"}}, gcode_macro _LH_STATE: {exch: 1, zpos_z_a: 342.0}, gcode_button bay3: {state: PRESSED}}, emits: ["_LH_HOLD CODE=LIFT_NOT_AT_BAY"]}
          - {state: "head off the bay row in Y", set: {toolhead: {position: {x: -50.0, y: "${zs.dock_yf - 1.0}"}}, gcode_macro _LH_STATE: {exch: 1, zpos_z_a: 342.0}, gcode_button bay3: {state: PRESSED}}, emits: ["_LH_HOLD CODE=LIFT_NOT_AT_BAY"]}
          - {state: "carriage not at the seat stroke", set: {toolhead: {position: {x: -50.0, y: "${zs.dock_yf}"}}, gcode_macro _LH_STATE: {exch: 1, zpos_z_a: 341.0}, gcode_button bay3: {state: PRESSED}}, emits: ["_LH_HOLD CODE=LIFT_NOT_AT_STROKE"]}
          - {state: "other carriage not up", set: {toolhead: {position: {x: -50.0, y: "${zs.dock_yf}"}}, gcode_macro _LH_STATE: {exch: 1, zpos_z_a: 342.0, zpos_z_b: 1.0}, gcode_button bay3: {state: PRESSED}}, emits: ["_LH_HOLD CODE=LIFT_OTHER_NOT_CLEAR"]}
          - {state: "gripper not up", set: {toolhead: {position: {x: -50.0, y: "${zs.dock_yf}", z: 1.0}}, gcode_macro _LH_STATE: {exch: 1, zpos_z_a: 342.0}, gcode_button bay3: {state: PRESSED}}, emits: ["_LH_HOLD CODE=LIFT_OTHER_NOT_CLEAR"]}
          - {state: "other carriage's latch not closed (jaw open)", set: {toolhead: {position: {x: -50.0, y: "${zs.dock_yf}"}}, gcode_macro _LH_STATE: {exch: 1, zpos_z_a: 342.0}, gcode_button bay3: {state: PRESSED}, gcode_button latch_b_empty: {state: RELEASED}, gcode_button latch_b_open: {state: PRESSED}}, emits: ["_LH_HOLD CODE=LIFT_OTHER_NOT_CLEAR"]}
          - {state: "flat cable lost", set: {toolhead: {position: {x: -50.0, y: "${zs.dock_yf}"}}, gcode_macro _LH_STATE: {exch: 1, zpos_z_a: 342.0}, gcode_button bay3: {state: PRESSED}, gcode_button cable_a: {state: RELEASED}}, emits: ["_LH_HOLD CODE=CABLE"]}
          - {state: "bay switch not made: lugs not on the bay pins", set: {toolhead: {position: {x: -50.0, y: "${zs.dock_yf}"}}, gcode_macro _LH_STATE: {exch: 1, zpos_z_a: 342.0}}, emits: ["_LH_HOLD CODE=LIFT_NOT_SEATED"]}
          - {state: "drop-off with the latch not locked", set: {toolhead: {position: {x: -50.0, y: "${zs.dock_yf}"}}, gcode_macro _LH_STATE: {exch: 1, zpos_z_a: 342.0}, gcode_button bay3: {state: PRESSED}, gcode_button latch_a: {state: RELEASED}, gcode_button latch_a_open: {state: PRESSED}}, emits: ["_LH_HOLD CODE=LIFT_LATCH_NOT_LOCKED"]}
          - {state: "drop-off with the tool code missing (latch locked, 0000)", set: {toolhead: {position: {x: -50.0, y: "${zs.dock_yf}"}}, gcode_macro _LH_STATE: {exch: 1, zpos_z_a: 342.0}, gcode_button bay3: {state: PRESSED}, gcode_button hall_a1: {state: RELEASED}, gcode_button hall_a2: {state: RELEASED}}, emits: ["_LH_HOLD CODE=LIFT_CODE"]}
          - {state: "drop-off with another tool's code", set: {toolhead: {position: {x: -50.0, y: "${zs.dock_yf}"}}, gcode_macro _LH_STATE: {exch: 1, zpos_z_a: 342.0}, gcode_button bay3: {state: PRESSED}, gcode_button hall_a0: {state: PRESSED}, gcode_button hall_a1: {state: RELEASED}}, emits: ["_LH_HOLD CODE=LIFT_CODE"]}
      - macro: _LH_LIFT_GUARD
        params: {C: b, BAY: 1, MODE: pick}
        expect: accept
        cases:
          - {state: "pick-up: every condition met (B empty at s 329 over bay 1)", set: {toolhead: {position: {x: -296.0, y: "${zs.dock_yf}"}}, gcode_macro _LH_STATE: {exch: 1, zpos_z_b: 329.0}}, emits_regex: ["\\A(?![\\s\\S]*_LH_HOLD)"]}
          - {state: "pick-up at the seat stroke instead of seat - 13", set: {toolhead: {position: {x: -296.0, y: "${zs.dock_yf}"}}, gcode_macro _LH_STATE: {exch: 1, zpos_z_b: 342.0}}, emits: ["_LH_HOLD CODE=LIFT_NOT_AT_STROKE"]}
          - {state: "pick-up with the latch not closed-empty", set: {toolhead: {position: {x: -296.0, y: "${zs.dock_yf}"}}, gcode_macro _LH_STATE: {exch: 1, zpos_z_b: 329.0}, gcode_button latch_b_empty: {state: RELEASED}, gcode_button latch_b_open: {state: PRESSED}}, emits: ["_LH_HOLD CODE=LIFT_LATCH_NOT_EMPTY"]}
          - {state: "pick-up with a code already read (tool plate against the bracket)", set: {toolhead: {position: {x: -296.0, y: "${zs.dock_yf}"}}, gcode_macro _LH_STATE: {exch: 1, zpos_z_b: 329.0}, gcode_button hall_b0: {state: PRESSED}, gcode_button hall_b2: {state: PRESSED}}, emits: ["_LH_HOLD CODE=LIFT_CODE"]}
          - {state: "pick-up from a bay that reads empty", set: {toolhead: {position: {x: -296.0, y: "${zs.dock_yf}"}}, gcode_macro _LH_STATE: {exch: 1, zpos_z_b: 329.0}, gcode_button bay1: {state: RELEASED}}, emits: ["_LH_HOLD CODE=LIFT_NOT_SEATED"]}
          - {state: "pick-up with the other carriage's latch wire faulty", set: {toolhead: {position: {x: -296.0, y: "${zs.dock_yf}"}}, gcode_macro _LH_STATE: {exch: 1, zpos_z_b: 329.0}, gcode_button latch_a: {state: RELEASED}}, emits: ["_LH_HOLD CODE=LIFT_OTHER_NOT_CLEAR"]}
      # after the bar went up: positive OPEN check, else hold and lower
      - {macro: _LH_OPEN_VERIFY, params: {C: a}, state: "bar at the open height and the latch reads NOT CLOSED", set: {gcode_button dock_bar_open: {state: PRESSED}, gcode_button latch_a: {state: RELEASED}, gcode_button latch_a_open: {state: PRESSED}}, expect: accept, emits_regex: ["\\A(?![\\s\\S]*_LH_HOLD)"]}
      - {macro: _LH_OPEN_VERIFY, params: {C: a}, state: "lift stall: the bar never reached the open height", set: {gcode_button latch_a: {state: RELEASED}, gcode_button latch_a_open: {state: PRESSED}}, expect: accept, emits: ["_LH_HOLD_LOWERED CODE=LIFT_STALL"]}
      - {macro: _LH_OPEN_VERIFY, params: {C: a}, state: "bar up but the latch still reads LOCKED (toggle or roller fault)", set: {gcode_button dock_bar_open: {state: PRESSED}}, expect: accept, emits: ["_LH_HOLD_LOWERED CODE=LATCH_NOT_OPEN"]}
      - {macro: _LH_OPEN_VERIFY, params: {C: a}, state: "bar up, latch wire fault", set: {gcode_button dock_bar_open: {state: PRESSED}, gcode_button latch_a: {state: RELEASED}}, expect: accept, emits: ["_LH_HOLD_LOWERED CODE=LATCH_NOT_OPEN"]}
      - {macro: _LH_HOLD_LOWERED, params: {CODE: LIFT_STALL}, state: "the hold is latched BEFORE the bar is lowered (a failed lowering still leaves the hold)", expect: accept, emits_regex: ["VARIABLE=hold VALUE='\"LIFT_STALL\"'[\\s\\S]*_LH_LIFT_DOWN\\s*\\n\\s*M400\\s*\\n\\s*_LH_HOLD_RAISE"]}
      # drop-off step 4 (bar down): released
      - {macro: _LH_RELEASE_VERIFY, params: {C: b, BAY: 1}, state: "released: CLOSED-EMPTY, code 0000, bay made", expect: accept, emits_regex: ["\\A(?![\\s\\S]*_LH_HOLD)"]}
      - {macro: _LH_RELEASE_VERIFY, params: {C: a, BAY: 1}, state: "tool still locked on the carriage", expect: accept, emits: ["_LH_HOLD CODE=TOOL_NOT_RELEASED"]}
      - {macro: _LH_RELEASE_VERIFY, params: {C: b, BAY: 1}, state: "jaw did not close (closing springs)", set: {gcode_button latch_b_empty: {state: RELEASED}, gcode_button latch_b_open: {state: PRESSED}}, expect: accept, emits: ["_LH_HOLD CODE=LATCH_NOT_CLOSED"]}
      - {macro: _LH_RELEASE_VERIFY, params: {C: b, BAY: 3}, state: "released but the bay reads empty", expect: accept, emits: ["_LH_HOLD CODE=BAY_DISAGREE"]}
      - {macro: _LH_RELEASE_VERIFY, params: {C: b, BAY: 1}, state: "latch wire fault", set: {gcode_button latch_b_empty: {state: RELEASED}}, expect: accept, emits: ["_LH_HOLD CODE=LATCH_WIRE"]}
      - {macro: _LH_RELEASE_VERIFY, params: {C: b, BAY: 1}, state: "flat cable lost", set: {gcode_button cable_b: {state: RELEASED}}, expect: accept, emits: ["_LH_HOLD CODE=CABLE"]}
      # pick-up step 4 (bar down): locked with the expected code
      - {macro: _LH_PICK_VERIFY, params: {C: a, TOOL: M300}, state: "expected tool locked", expect: accept, emits_regex: ["\\A(?![\\s\\S]*_LH_HOLD)"]}
      - {macro: _LH_PICK_VERIFY, params: {C: a, TOOL: M50}, state: "wrong tool in the bay", expect: accept, emits: ["_LH_HOLD CODE=WRONG_TOOL"]}
      - {macro: _LH_PICK_VERIFY, params: {C: a, TOOL: M300}, state: "half-lock (code, latch not in its window)", set: {gcode_button latch_a: {state: RELEASED}, gcode_button latch_a_open: {state: PRESSED}}, expect: accept, emits: ["_LH_HOLD CODE=HALF_LOCK"]}
      - {macro: _LH_PICK_VERIFY, params: {C: b, TOOL: M50}, state: "nothing picked (code 0000, jaw closed empty)", expect: accept, emits: ["_LH_HOLD CODE=WRONG_TOOL"]}
      - {macro: _LH_PICK_VERIFY, params: {C: b, TOOL: M50}, state: "missing tool code: latch LOCKED, code 0000", set: {gcode_button latch_b_empty: {state: RELEASED}, gcode_button latch_b: {state: PRESSED}}, expect: accept, emits: ["_LH_HOLD CODE=MISSING_CODE"]}
      - {macro: _LH_PICK_VERIFY, params: {C: a, TOOL: M300}, state: "latch wire fault", set: {gcode_button latch_a: {state: RELEASED}}, expect: accept, emits: ["_LH_HOLD CODE=LATCH_WIRE"]}
      - {macro: _LH_PICK_VERIFY, params: {C: a, TOOL: M300}, state: "flat cable lost", set: {gcode_button cable_a: {state: RELEASED}}, expect: accept, emits: ["_LH_HOLD CODE=CABLE"]}
      - {macro: _LH_BAY_EMPTY_VERIFY, params: {BAY: 1}, state: "bay still reads occupied after the pick", expect: accept, emits: ["_LH_HOLD CODE=BAY_DISAGREE"]}
      - {macro: _LH_BAY_EMPTY_VERIFY, params: {BAY: 3}, state: "bay empty after the pick", expect: accept, emits_regex: ["\\A(?![\\s\\S]*_LH_HOLD)"]}
      # LH_TOOL_EXCHANGE: the empty carriage moves along the row at s 302 only when
      - macro: _LH_INROW_GUARD
        params: {C: a, BAY: 1}
        expect: accept
        cases:
          - {state: "in-row move: A empty (CLOSED-EMPTY, 0000) at s 302, B and gripper up, bay 1 occupied", set: {toolhead: {position: {x: -50.0, y: "${zs.dock_yf}"}}, gcode_macro _LH_STATE: {exch: 1, zpos_z_a: 302.0, mounted_a: ""}, gcode_button latch_a: {state: RELEASED}, gcode_button latch_a_empty: {state: PRESSED}, gcode_button hall_a1: {state: RELEASED}, gcode_button hall_a2: {state: RELEASED}}, emits_regex: ["\\A(?![\\s\\S]*_LH_HOLD)"]}
          - {state: "in-row move outside an exchange", set: {toolhead: {position: {x: -50.0, y: "${zs.dock_yf}"}}, gcode_macro _LH_STATE: {exch: 0, zpos_z_a: 302.0, mounted_a: ""}, gcode_button latch_a: {state: RELEASED}, gcode_button latch_a_empty: {state: PRESSED}, gcode_button hall_a1: {state: RELEASED}, gcode_button hall_a2: {state: RELEASED}}, emits: ["_LH_HOLD CODE=INROW_STATE"]}
          - {state: "in-row move with the tool still on the carriage", set: {toolhead: {position: {x: -50.0, y: "${zs.dock_yf}"}}, gcode_macro _LH_STATE: {exch: 1, zpos_z_a: 302.0}}, emits: ["_LH_HOLD CODE=INROW_NOT_EMPTY"]}
          - {state: "in-row move at the wrong height", set: {toolhead: {position: {x: -50.0, y: "${zs.dock_yf}"}}, gcode_macro _LH_STATE: {exch: 1, zpos_z_a: 329.0, mounted_a: ""}, gcode_button latch_a: {state: RELEASED}, gcode_button latch_a_empty: {state: PRESSED}, gcode_button hall_a1: {state: RELEASED}, gcode_button hall_a2: {state: RELEASED}}, emits: ["_LH_HOLD CODE=INROW_HEIGHT"]}
          - {state: "in-row move to an empty bay", params: {C: a, BAY: 3}, set: {toolhead: {position: {x: -50.0, y: "${zs.dock_yf}"}}, gcode_macro _LH_STATE: {exch: 1, zpos_z_a: 302.0, mounted_a: ""}, gcode_button latch_a: {state: RELEASED}, gcode_button latch_a_empty: {state: PRESSED}, gcode_button hall_a1: {state: RELEASED}, gcode_button hall_a2: {state: RELEASED}}, emits: ["_LH_HOLD CODE=BAY_EMPTY"]}
      # the lift bar
      - {macro: _LH_LIFT_MOVE, params: {TO: 34.1}, expect: accept, emits: ["MANUAL_STEPPER_BASE STEPPER=dock_lift MOVE=34.1 SPEED=5.0 SYNC=1", "VARIABLE=bar VALUE=34.1"]}
      - {macro: _LH_LIFT_MOVE, params: {TO: 51}, state: "beyond the 50 mm stroke", expect: refuse}
      - {macro: _LH_LIFT_MOVE, params: {TO: 34.1, SPEED: 6}, state: "faster than the audited 5 mm/s", expect: refuse}
      - {macro: _LH_LIFT_MOVE, params: {TO: 34.1}, state: "bar position unknown", set: {gcode_macro _LH_DOCK: {bar: -1.0}}, expect: refuse}
      - {macro: _LH_LIFT_DOWN, state: "every lowering ends ON the DOWN switch (homing move); bar UNKNOWN until it has", expect: accept, emits_regex: ["VARIABLE=bar VALUE=-1.0\\s*\\n\\s*MANUAL_STEPPER_BASE STEPPER=dock_lift SPEED=5.0 MOVE=-1.0 STOP_ON_ENDSTOP=home[\\s\\S]*VARIABLE=bar VALUE=0.0"]}
      - {macro: _LH_LIFT_HOME, state: "homing the bar: home current, from an unknown height onto the switch, then the run current", expect: accept, emits: ["SET_TMC_CURRENT_BASE STEPPER=dock_lift CURRENT=0.6", "SET_POSITION=53.0", "STOP_ON_ENDSTOP=home", "SET_TMC_CURRENT_BASE STEPPER=dock_lift CURRENT=1.3", "VARIABLE=bar VALUE=0.0"]}
      - {macro: _LH_GMOVE, params: {CMD: G0, X: 10}, state: "X/Y with the dock bar not homed down", set: {gcode_macro _LH_DOCK: {bar: -1.0}}, expect: refuse, message: "DOCK_BAR"}
      - {macro: _LH_GMOVE, params: {CMD: G0, X: 10}, state: "X/Y with the dock bar up", set: {gcode_macro _LH_DOCK: {bar: 34.1}}, expect: refuse, message: "DOCK_BAR"}
      - {macro: _LH_XY_GUARD, state: "firmware sideways move with the bar not down", set: {gcode_macro _LH_DOCK: {bar: -1.0}}, expect: refuse, message: "DOCK_BAR"}
      - {macro: SET_GCODE_VARIABLE, params: {MACRO: _LH_DOCK, VARIABLE: bar, VALUE: 0}, state: "host declares the bar down", expect: refuse}
      - {macro: LH_DOCK_STATUS, expect: accept, emits: ["LH_DOCK BAR=0.0 BAR_OPEN=0 LATCH_A=LOCKED LATCH_B=EMPTY EXCH=0 BAYS=11000000"]}
      - {macro: LH_DOCK_STATUS, state: "after a restart", set: {gcode_macro _LH_DOCK: {bar: -1.0}, gcode_button latch_b_empty: {state: RELEASED}}, expect: accept, emits: ["BAR=UNKNOWN", "LATCH_B=FAULT"]}
      # three-state latch outside the dock and at power-up (head_l TOOL PRESENT AND LOCKED: empty = 0000 AND closed-empty)
      - {macro: _LH_TOOLS_LOCKED, params: {WHO: G0}, state: "B empty with its jaw open outside the dock", set: {gcode_button latch_b_empty: {state: RELEASED}, gcode_button latch_b_open: {state: PRESSED}}, expect: refuse, message: "LATCH_OPEN"}
      - {macro: _LH_TOOLS_LOCKED, params: {WHO: G0}, state: "B latch ladder reads no state (broken wire)", set: {gcode_button latch_b_empty: {state: RELEASED}}, expect: refuse, message: "LATCH_WIRE"}
      - {macro: _LH_POWERUP_READ, state: "power-up (after the bar went down): A code with the jaw still open", set: {gcode_button latch_a: {state: RELEASED}, gcode_button latch_a_open: {state: PRESSED}}, expect: refuse, message: "HALF_LOCK"}
      - {macro: _LH_POWERUP_READ, state: "power-up: B empty with its jaw open (springs)", set: {gcode_button latch_b_empty: {state: RELEASED}, gcode_button latch_b_open: {state: PRESSED}}, expect: refuse, message: "LATCH_OPEN"}
      - {macro: _LH_POWERUP_READ, state: "power-up: B latch wire fault", set: {gcode_button latch_b_empty: {state: RELEASED}}, expect: refuse, message: "LATCH_WIRE"}
      - {macro: _LH_POWERUP_READ, state: "power-up: A latch LOCKED with no code", set: {gcode_button hall_a1: {state: RELEASED}, gcode_button hall_a2: {state: RELEASED}}, expect: refuse, message: "MISSING_CODE"}
      - {macro: _LH_POWERUP_READ, state: "power-up after an interrupted pick-up that re-latched: tool on B, recorded by its code", set: {gcode_button latch_b_empty: {state: RELEASED}, gcode_button latch_b: {state: PRESSED}, gcode_button hall_b0: {state: PRESSED}, gcode_button hall_b2: {state: PRESSED}}, expect: accept, emits: ["VARIABLE=mounted_b VALUE='\"M50\"'", "VARIABLE=tips_b VALUE=-1"]}
      - {macro: _LH_HOLD, params: {CODE: HALF_LOCK}, expect: accept, emits: ["VARIABLE=hold VALUE='\"HALF_LOCK\"'", "LH_HOLD CODE=HALF_LOCK", _LH_HOLD_RAISE]}
      - {macro: LH_HOLD_CLEAR, state: "no confirmation", expect: refuse}
      - {macro: LH_HOLD_CLEAR, params: {CONFIRM: 1}, expect: accept, emits: ["VARIABLE=homed VALUE=0", "LH_HOLD RESULT=CLEARED"]}
      - {macro: LH_HOLD_CLEAR, params: {CONFIRM: 1, KIND: process}, state: "airflow still not proven", set: {gcode_button airflow: {state: RELEASED}}, expect: refuse}
      - {macro: _LH_PUSHER_FIND_END, params: {C: a}, state: "contact inside the window", expect: accept, emits_regex: ["\\A(?![\\s\\S]*_LH_HOLD)"]}
      - {macro: _LH_PUSHER_FIND_END, params: {C: a}, state: "contact never found (jammed or no slider)", set: {gcode_macro _LH_STATE: {contact_a: -1.0}}, expect: accept, emits: ["_LH_HOLD CODE=CONTACT"]}
      # ---- pipetting (carried over per carriage; WRONG_TOOL and tool-armed refusals added)
      # A2 (23 Nov 2026): the public pipetting commands run _LH_PIPETTE_GUARD first and their body only after it (chain
      # cases in fw_render_check.py expand the calls); the body checks are asserted on the _DO macros
      - foreach: {m: [LH_ASPIRATE, LH_DISPENSE]}
        cases:
          - {macro: "${m}", params: {CARRIAGE: A, TOOL: M50, UL: 100}, state: "guard first: the first line is _LH_PIPETTE_GUARD", expect: accept, emits_regex: ["\\A\\s*_LH_PIPETTE_GUARD C=a TOOL=M50 WHO=${m}"]}
      - foreach: {m: [LH_PREPARE, LH_PICK_TIP]}
        cases:
          - {macro: "${m}", params: {CARRIAGE: A, TOOL: M50, Z_START: 280, Z_MAX: 285}, state: "guard first: the first line is _LH_PIPETTE_GUARD", expect: accept, emits_regex: ["\\A\\s*_LH_PIPETTE_GUARD C=a TOOL=M50 WHO=${m}"]}
      - {macro: _LH_ASPIRATE_DO, params: {C: a, TOOL: M300, UL: 100}, expect: accept, emits: ["_LH_PUSHER_MOVE C=a POS=13.33"]}
      - {macro: _LH_ASPIRATE_DO, params: {C: a, TOOL: M300, UL: 0}, state: "UL 0", expect: refuse}
      - {macro: _LH_PIPETTE_GUARD, params: {C: a, TOOL: M300, WHO: LH_ASPIRATE}, expect: accept}
      - {macro: _LH_PIPETTE_GUARD, params: {C: a, TOOL: M300, WHO: LH_ASPIRATE}, state: process hold AIRFLOW, set: {gcode_macro _LH_STATE: {phold: AIRFLOW}}, expect: refuse}
      - {macro: _LH_PIPETTE_GUARD, params: {C: a, TOOL: M300, WHO: LH_ASPIRATE}, state: motion hold, set: {gcode_macro _LH_STATE: {hold: CONTACT}}, expect: refuse}
      - {macro: _LH_PIPETTE_GUARD, params: {C: a, TOOL: M50, WHO: LH_ASPIRATE}, state: "command for another tool (WRONG_TOOL)", expect: refuse}
      - {macro: _LH_PIPETTE_GUARD, params: {C: a, TOOL: M300, WHO: LH_PICK_TIP}, state: not homed, set: {gcode_macro _LH_STATE: {homed: 0}}, expect: refuse}
      - {macro: _LH_PIPETTE_GUARD, params: {C: a, TOOL: M300, WHO: LH_ASPIRATE}, state: pusher contact unknown, set: {gcode_macro _LH_STATE: {contact_a: -1.0}}, expect: refuse}
      - {macro: _LH_PIPETTE_GUARD, params: {C: a, TOOL: M300, WHO: LH_ASPIRATE}, state: "A4: tips UNKNOWN (ejected, not observed): reuse blocked", set: {gcode_macro _LH_STATE: {tips_a: -1}}, expect: refuse, message: "TIPS_UNKNOWN"}
      - {macro: _LH_ASPIRATE_DO, params: {C: a, TOOL: M300, UL: 100}, state: "beyond the first stop (after a blow-out)", set: {gcode_macro _LH_STATE: {pos_a: 24.0}}, expect: refuse}
      - {macro: _LH_DISPENSE_DO, params: {C: a, TOOL: M300, UL: 0}, state: "UL 0", expect: refuse}
      - {macro: _LH_DISPENSE_DO, params: {C: a, TOOL: M300, UL: 50}, state: "past the first stop", expect: refuse}
      - {macro: _LH_DISPENSE_DO, params: {C: a, TOOL: M300, UL: 50}, state: "over B3 waste, bottle 2 full", set: {toolhead: {position: {x: 222.0, y: 47.5}}, gcode_macro _LH_STATE: {pos_a: 10.0}, gcode_button waste2_ok: {state: RELEASED}}, expect: refuse}
      - {macro: _LH_DISPENSE_DO, params: {C: a, TOOL: M300, UL: 50}, state: "over B3 waste, both bottles OK", set: {toolhead: {position: {x: 222.0, y: 47.5}}, gcode_macro _LH_STATE: {pos_a: 10.0}}, expect: accept, emits: ["_LH_PUSHER_MOVE C=a"]}
      # ---- syringe tool SYR (family: direct drive within the 35 mm pusher stroke; OPTIONAL, refused until commissioned)
      - {macro: _LH_PIPETTE_GUARD, params: {C: a, TOOL: SYR, WHO: LH_DISPENSE}, state: "SYR optional, not commissioned", set: {gcode_macro _LH_STATE: {mounted_a: SYR}}, expect: refuse, message: "not commissioned"}
      - {macro: _LH_PIPETTE_GUARD, params: {C: a, TOOL: SYR, WHO: LH_DISPENSE}, state: "SYR commissioned", set: {gcode_macro _LH_STATE: {mounted_a: SYR}, gcode_macro _LH_TOOLDEF: {commissioned: {SYR: 1}}}, expect: accept}
      - {macro: _LH_DISPENSE_DO, params: {C: a, TOOL: SYR, UL: 4000}, state: "SYR jet 4 mL from a full syringe", set: {gcode_macro _LH_STATE: {mounted_a: SYR, pos_a: 2.0}, gcode_macro _LH_TOOLDEF: {commissioned: {SYR: 1}}}, expect: accept, emits: ["_LH_PUSHER_MOVE C=a POS=26.2"]}
      - {macro: _LH_DISPENSE_DO, params: {C: a, TOOL: SYR, UL: 5300}, state: "SYR more than one fill (5.2 mL max: first stop 31.5 mm x 165.1 uL/mm)", set: {gcode_macro _LH_STATE: {mounted_a: SYR, pos_a: 2.0}, gcode_macro _LH_TOOLDEF: {commissioned: {SYR: 1}}}, expect: refuse}
      - {macro: _LH_DISPENSE_DO, params: {C: a, TOOL: SYR, UL: 5200}, state: "SYR jet 5.2 mL from a full syringe (CAD 32 mm travel, first stop 31.5)", set: {gcode_macro _LH_STATE: {mounted_a: SYR, pos_a: 2.0}, gcode_macro _LH_TOOLDEF: {commissioned: {SYR: 1}}}, expect: accept, emits: ["_LH_PUSHER_MOVE C=a POS=33.49"]}
      - {macro: _LH_PUSHER_FIND_END, params: {C: a}, state: "SYR contact at 2.8 mm: inside its 3 mm window (CAD stop screw)", set: {gcode_macro _LH_STATE: {mounted_a: SYR, contact_a: 2.8}}, expect: accept, emits_regex: ["\\A(?![\\s\\S]*_LH_HOLD)"]}
      - {macro: _LH_PUSHER_FIND_END, params: {C: a}, state: "SYR contact at 3.4 mm: beyond its 3 mm window (blow-out would pass the 35 mm stroke)", set: {gcode_macro _LH_STATE: {mounted_a: SYR, contact_a: 3.4}}, expect: accept, emits: ["_LH_HOLD CODE=CONTACT"]}
      - {macro: _LH_PUSHER_FIND_END, params: {C: a}, state: "M300 contact at 3.4 mm: inside the pipettes' 6 mm window", set: {gcode_macro _LH_STATE: {contact_a: 3.4}}, expect: accept, emits_regex: ["\\A(?![\\s\\S]*_LH_HOLD)"]}
      - {macro: SET_GCODE_VARIABLE, params: {MACRO: LH_TIP_PARK, VARIABLE: parked, VALUE: 0}, state: "host sets the tip parking count", expect: refuse}
      - {macro: _LH_ASPIRATE_DO, params: {C: a, TOOL: SYR, UL: 4500}, state: "SYR fill 4.5 mL from the first stop", set: {gcode_macro _LH_STATE: {mounted_a: SYR, pos_a: 29.5}, gcode_macro _LH_TOOLDEF: {commissioned: {SYR: 1}}}, expect: accept, emits: ["_LH_PUSHER_MOVE C=a POS=2.24"]}
      - {macro: _LH_PICK_TIP_DO, params: {C: a, TOOL: SYR, Z_START: 280, Z_MAX: 281, STEP: 0.2}, state: "SYR takes no tips", set: {gcode_macro _LH_STATE: {mounted_a: SYR}, gcode_macro _LH_TOOLDEF: {commissioned: {SYR: 1}}}, expect: refuse}
      - {macro: LH_TIP_CHECK, params: {CARRIAGE: A, TOOL: SYR, EXPECT: 1}, state: "SYR has no tips to check", set: {gcode_macro _LH_STATE: {mounted_a: SYR}}, expect: refuse}
      - {macro: LH_EJECT_TIP, params: {CARRIAGE: A, TOOL: SYR}, state: "SYR: no eject over-travel", set: {gcode_macro _LH_STATE: {mounted_a: SYR}, gcode_macro LH_EJECT_TIP: {armed_ejector: true}}, expect: refuse}
      - {macro: _LH_PUSHER_MOVE, params: {C: a, POS: 35.5, SPEED: 1}, state: "SYR or pipette: never past the 35 mm pusher stroke", expect: refuse}
      - {macro: LH_PREPARE, params: {CARRIAGE: A, TOOL: M300}, expect: accept, emits: ["_LH_CARRIAGE_IS_UP C=a", "_LH_PREPARE_DO C=a TOOL=M300"]}
      - {macro: _LH_PREPARE_DO, params: {C: a, TOOL: M300}, expect: accept, emits: ["_LH_PUSHER_MOVE C=a POS=19.0"]}
      - {macro: _LH_PUSHER_MOVE, params: {C: a, POS: 36, SPEED: 1}, state: "beyond the 35 mm pusher stroke", expect: refuse}
      - {macro: _LH_CARRIAGE_IS_UP, params: {C: a}, state: "carriage lowered: must be at its whole-deck travel height (tip in air)", set: {gcode_macro _LH_STATE: {zpos_z_a: 3.0}}, expect: accept, emits: ["_LH_TRAVEL_GUARD ONLY=a ALL=1"]}
      - {macro: _LH_TRAVEL_GUARD, params: {ONLY: a, ALL: 1, WHO: LH_PREPARE_TIP_IN_AIR}, state: "carriage A at s 250 (tip below the tallest item: maybe in liquid)", set: {gcode_macro _LH_STATE: {zpos_z_a: 250.0}}, expect: refuse}
      # ---- tip pick-up through the push-rod force switch
      - {macro: _LH_PICK_TIP_DO, params: {C: a, TOOL: M300, Z_START: 280, Z_MAX: 285, STEP: 0.2}, set: {toolhead: {position: {x: 222.0, y: 157.5}}}, expect: accept, emits: ["LINE=a WHO=LH_PICK_TIP C=a", "_LH_DEPTH_GUARD C=a TOOL=M300 S=285.0", "_LH_Z_FORCE C=a TOOL=M300 ON=1", "_LH_PICK_STEP C=a", "_LH_Z_FORCE C=a TOOL=M300 ON=0", "_LH_PICK_END C=a"]}
      - {macro: _LH_PICK_TIP_DO, params: {C: a, TOOL: M300, Z_START: 280, Z_MAX: 295, STEP: 0.2}, state: "window longer than the tool's pick window", expect: refuse}
      - {macro: _LH_PICK_TIP_DO, params: {C: a, TOOL: M300, Z_START: 280, Z_MAX: 285, STEP: 0.2}, state: "force switch tripped before contact (broken wire / stuck rod)", set: {gcode_button force_a: {state: PRESSED}}, expect: refuse}
      - {macro: _LH_PICK_TIP_DO, params: {C: a, TOOL: M300, Z_START: 280, Z_MAX: 285, STEP: 0.2}, state: "tips already on", set: {gcode_macro _LH_STATE: {tips_a: 1}}, expect: refuse}
      - {macro: _LH_PICK_TIP_DO, params: {C: a, TOOL: M300, Z_START: 280, Z_MAX: 285, STEP: 0.2}, state: "nozzle not checked", set: {gcode_macro _LH_STATE: {nozzle_ok_a: 0}}, expect: refuse}
      - {macro: _LH_PICK_END, params: {C: a}, state: "no trip before Z_MAX (jammed push-rod)", expect: refuse}
      - {macro: _LH_PICK_END, params: {C: a}, state: "seated", set: {gcode_macro _LH_STATE: {seated: 1}}, expect: accept, emits: ["VARIABLE=tips_a VALUE=1"]}
      - {macro: _LH_PICK_STEP, params: {C: a, Z: 281, SPEED: 2}, state: "switch trips", set: {gcode_button force_a: {state: PRESSED}}, expect: accept, emits: ["VARIABLE=seated VALUE=1"]}
      - {macro: _LH_PICK_STEP, params: {C: a, Z: 281, SPEED: 2}, state: "V2: a step that moves ends with M400 so the next step reads after the move", expect: accept, emits_regex: ["_LH_CARRIAGE_Z C=a Z=281[\\s\\S]*M400\\s*\\Z"]}
      - {macro: _LH_PICK_TIP_DO, params: {C: a, TOOL: M300, Z_START: 280, Z_MAX: 285, STEP: 0.2}, state: "A4: tip state UNKNOWN", set: {gcode_macro _LH_STATE: {tips_a: -1}}, expect: refuse, message: "UNKNOWN"}
      - {macro: _LH_PICK_TIP_DO, params: {C: a, TOOL: M300, Z_START: 280, Z_MAX: 285, STEP: 0.2}, state: "V2: the first force read follows the approach and an M400; one read after the last move", expect: accept, emits_regex: ["_LH_Z_FORCE C=a TOOL=M300 ON=1\\s*\\n\\s*M400", "_LH_PICK_STEP C=a Z=285.0 SPEED=2.0\\s*\\n\\s*_LH_PICK_STEP C=a Z=285.0"]}
      - {macro: _LH_PUSHER_FIND, params: {C: a}, state: "V2: the contact is read only after the homing and an M400", expect: accept, emits_regex: ["_LH_PUSHER_HOME C=a\\s*\\n\\s*M400\\s*\\n\\s*_LH_PUSHER_PRECHECK C=a"]}
      # ---- plunger pusher LGA351S12-A-UIAP-038 (ADR-014 #5): homing <= 0.50 A and <= 2 mm/s, every move <= 5 mm/s
      - {macro: _LH_PUSHER_HOME, params: {C: a}, state: "homing current 0.5 A (maker's internal-stop limit 0.57 A), 2 mm/s, run current restored after", expect: accept,
         emits: ["SET_TMC_CURRENT_BASE STEPPER=pusher_a CURRENT=0.5", "SET_POSITION=38.0", "SPEED=2.0 MOVE=-0.6 STOP_ON_ENDSTOP=home", "SET_TMC_CURRENT_BASE STEPPER=pusher_a CURRENT=0.7", "VARIABLE=pos_a VALUE=0"],
         emits_regex: ["CURRENT=0.5\\s*\\n(?:(?!CURRENT=)[\\s\\S])*STOP_ON_ENDSTOP=home(?:(?!CURRENT=0.7)[\\s\\S])*STOP_ON_ENDSTOP=home[\\s\\S]*CURRENT=0.7"]}
      - {macro: _LH_PUSHER_MOVE, params: {C: a, POS: 10, SPEED: 5}, state: "5 mm/s: the audited plunger speed", expect: accept, emits: ["STEPPER=pusher_a MOVE=10.0 SPEED=5.0"]}
      - {macro: _LH_PUSHER_MOVE, params: {C: a, POS: 10, SPEED: 6}, state: "faster than 5 mm/s (128 N at 5, 115 N at 8: audit margin < 1.5)", expect: refuse, message: "PUSHER_SPEED"}
      - {macro: _LH_PUSHER_MOVE, params: {C: a, POS: 10, SPEED: 0}, state: "zero speed", expect: refuse}
      # ---- SYR return spring (audit margin 1.3): the firmware detects a plunger that did not follow; it cannot close the margin
      - {macro: LH_ASPIRATE, params: {CARRIAGE: A, TOOL: SYR, UL: 1000}, state: "SYR fill ends with an M400 and the follow check", expect: accept, emits_regex: ["_LH_ASPIRATE_DO C=a TOOL=SYR[^\\n]*\\n\\s*M400\\s*\\n\\s*_LH_FOLLOW_CHECK C=a"]}
      - {macro: LH_ASPIRATE, params: {CARRIAGE: A, TOOL: M300, UL: 100}, state: "pipettes: no follow check (the pipette's own spring)", expect: accept, emits_regex: ["\\A(?![\\s\\S]*_LH_FOLLOW_CHECK)"]}
      - {macro: _LH_FOLLOW_CHECK, params: {C: a}, state: "SYR plunger stuck: pad lost contact after the fill", expect: accept, emits: ["_LH_HOLD CODE=SYR_NOT_FOLLOWING"]}
      - {macro: _LH_FOLLOW_CHECK, params: {C: a}, state: "SYR plunger followed the pusher", set: {gcode_button contact_a: {state: PRESSED}}, expect: accept, emits_regex: ["\\A(?![\\s\\S]*_LH_HOLD)"]}
      - {macro: _LH_PUSHER_PRECHECK, params: {C: a}, state: "contact reads made with the pusher retracted", set: {gcode_button contact_a: {state: PRESSED}}, expect: accept, emits: ["_LH_HOLD CODE=CONTACT"]}
      # ---- tip ejection (method B per carriage)
      - {macro: LH_EJECT_TIP, params: {CARRIAGE: A, TOOL: M300}, state: "not commissioned", expect: refuse}
      - {macro: LH_EJECT_TIP, params: {CARRIAGE: A, TOOL: M300}, state: "tip bin full", set: {gcode_macro LH_EJECT_TIP: {armed_ejector: true}, gcode_button bin_clear: {state: RELEASED}}, expect: refuse}
      - {macro: LH_EJECT_TIP, params: {CARRIAGE: A, TOOL: M300}, state: "drawer open", set: {gcode_macro LH_EJECT_TIP: {armed_ejector: true}, gcode_button drawer: {state: RELEASED}}, expect: refuse}
      - {macro: LH_EJECT_TIP, params: {CARRIAGE: B, TOOL: M300}, state: "no tool coded on B", set: {gcode_macro LH_EJECT_TIP: {armed_ejector: true}}, expect: refuse}
      - {macro: LH_EJECT_TIP, params: {CARRIAGE: A, TOOL: M300}, state: "armed, gate not armed: tips UNKNOWN after the eject (A4: not observed)", set: {gcode_macro LH_EJECT_TIP: {armed_ejector: true}}, expect: accept, emits: ["_LH_CARRIAGE_Z C=a Z=0", "_LH_PUSHER_MOVE C=a POS=0", "_LH_EJECT_OVERTRAVEL C=a", "VARIABLE=tips_a VALUE=-1", "tips state UNKNOWN"], emits_regex: ["\\A(?![\\s\\S]*tips_a VALUE=0)"]}
      - {macro: LH_EJECT_TIP, params: {CARRIAGE: A, TOOL: M300}, state: "armed with the gate armed: the eject is followed by the EXPECT=0 observation at B1", set: {gcode_macro LH_EJECT_TIP: {armed_ejector: true}, gcode_macro LH_TIP_CHECK: {armed: true}}, expect: accept, emits: ["VARIABLE=tips_a VALUE=-1", "LH_TIP_CHECK CARRIAGE=A TOOL=M300 EXPECT=0"]}
      - {macro: LH_TIPS_CONFIRM, params: {CARRIAGE: A, TIPS: 0}, state: "no person confirmation", expect: refuse}
      - {macro: LH_TIPS_CONFIRM, params: {CARRIAGE: A, TIPS: 0, CONFIRM: 1}, state: "a person saw bare nozzles", expect: accept, emits: ["VARIABLE=tips_a VALUE=0"]}
      - {macro: SET_GCODE_VARIABLE, params: {MACRO: _LH_STATE, VARIABLE: tips_a, VALUE: 0}, state: "host clears the tip state directly", expect: refuse}
      - {macro: _LH_EJECT_OVERTRAVEL, params: {C: a, X: 0, Y: 0}, state: "over the funnel", expect: accept, emits: ["SET_TMC_CURRENT_BASE STEPPER=z_a CURRENT=0.9", "STEPPER=z_a MOVE=-12.0"]}
      - {macro: _LH_EJECT_OVERTRAVEL, params: {C: a, X: 50, Y: 0}, state: "not over the funnel", expect: refuse}
      - {macro: _LH_EJECT_OVERTRAVEL, params: {C: b, X: 0, Y: 0}, state: "no tip tool coded on B", expect: refuse}
      # ---- tip gate (W3) and nozzle check
      - {macro: _LH_TIPGATE_SAMPLE, params: {KIND: "off", I: 0}, state: "emitter off but reads clear (stuck clear)", set: {gcode_button tip_gate: {state: RELEASED}}, expect: refuse}
      - {macro: _LH_TIPGATE_SAMPLE, params: {KIND: "off", I: 0}, state: "emitter off reads blocked", set: {gcode_button tip_gate: {state: PRESSED}}, expect: accept}
      - {macro: _LH_TIPGATE_SAMPLE, params: {KIND: ref, I: 0}, state: "clear reference reads blocked", set: {gcode_button tip_gate: {state: PRESSED}}, expect: refuse}
      - {macro: _LH_TIPGATE_EVAL, params: {C: a, TOOL: M50, N: 8, EXPECT: 1}, state: "8 tips", set: {gcode_macro _LH_STATE: {tip_mask: 255, gap_mask: 0}}, expect: accept,
         emits: ["VARIABLE=tips_a VALUE=1", "LH_TIP_CHECK RESULT TOOL=M50 EXPECT=1 TIPS=11111111 GAPS=0000000 RESOLVABLE=1 SUPPLY_TEST=PASS REF_CLEAR=PASS RESULT=PASS"]}
      - {macro: _LH_TIPGATE_EVAL, params: {C: a, TOOL: M50, N: 8, EXPECT: 1}, state: "tips seen only in a gap", set: {gcode_macro _LH_STATE: {tip_mask: 0, gap_mask: 1}}, expect: accept, emits: ["VARIABLE=tips_a VALUE=-1", "_LH_TIPGATE_RAISE"]}
      - {macro: _LH_TIPGATE_EVAL, params: {C: a, TOOL: M50, N: 8, EXPECT: 1}, state: "8 tips + gap blocked (crooked)", set: {gcode_macro _LH_STATE: {tip_mask: 255, gap_mask: 8}}, expect: accept, emits: ["VARIABLE=tips_a VALUE=-1", "_LH_TIPGATE_RAISE"]}
      - {macro: _LH_TIPGATE_EVAL, params: {C: a, TOOL: M50, N: 8, EXPECT: 1}, state: "7 of 8", set: {gcode_macro _LH_STATE: {tip_mask: 127, gap_mask: 0}}, expect: accept, emits: ["VARIABLE=tips_a VALUE=-1", "_LH_TIPGATE_RAISE"]}
      - {macro: _LH_TIPGATE_EVAL, params: {C: a, TOOL: M50, N: 8, EXPECT: 0}, state: "no tips: the only way (besides a person) the tip state becomes 0", set: {gcode_macro _LH_STATE: {tip_mask: 0, gap_mask: 0, tips_a: -1}}, expect: accept, emits: ["RESULT=PASS", "TIPS=00000000", "VARIABLE=tips_a VALUE=0"]}
      - {macro: _LH_TIPGATE_EVAL, params: {C: a, TOOL: M50, N: 8, EXPECT: 0}, state: "EXPECT=0, gap blocked", set: {gcode_macro _LH_STATE: {tip_mask: 0, gap_mask: 4}}, expect: accept, emits: ["VARIABLE=tips_a VALUE=-1", "_LH_TIPGATE_RAISE"]}
      - {macro: _LH_TIPGATE_RAISE, params: {MSG: expected_no_tips, TIPS: "00000000", GAPS: "0010000", RESOLVABLE: 0}, state: "a failed check stops the command", expect: refuse, message: "tip state UNKNOWN"}
      - {macro: _LH_TIPGATE_EVAL, params: {C: b, TOOL: S10, N: 1, EXPECT: 1}, state: "single, tip on", set: {gcode_macro _LH_STATE: {tip_mask: 1, gap_mask: 0}}, expect: accept, emits: ["TIPS=1 GAPS=- RESOLVABLE=1", "RESULT=PASS"]}
      - {macro: LH_TIP_CHECK, params: {CARRIAGE: A, TOOL: M300, EXPECT: 1}, state: "gate not armed", expect: accept, emits: ["NOT OBSERVED", "LH_PREPARE CARRIAGE=a TOOL=M300"]}
      - {macro: LH_TIP_CHECK, params: {CARRIAGE: A, TOOL: M50, EXPECT: 1}, state: "wrong tool for the carriage", expect: refuse}
      - {macro: LH_NOZZLE_CHECK, params: {CARRIAGE: A, TOOL: M300}, state: "gate not armed (NOT OBSERVED, carriage stays blocked)", expect: refuse}
      - {macro: LH_NOZZLE_CHECK, params: {CARRIAGE: A, TOOL: M300}, state: "tips on", set: {gcode_macro _LH_STATE: {tips_a: 1}, gcode_macro LH_TIP_CHECK: {armed: true}}, expect: refuse}
      - {macro: LH_NOZZLE_CHECK, params: {CARRIAGE: A, TOOL: M300}, state: "armed, nozzle not yet checked", set: {gcode_macro LH_TIP_CHECK: {armed: true}, gcode_macro _LH_STATE: {nozzle_ok_a: 0}}, expect: accept, emits: ["_LH_CARRIAGE_Z C=a Z=247.5", "_LH_TIPGATE_SAMPLE KIND=ref", "_LH_NOZZLE_EVAL C=a N=8"]}
      - {macro: LH_NOZZLE_CHECK, params: {CARRIAGE: A, TOOL: M300}, state: "B: re-pick of a tool already checked since power-up: no new information, no motion", set: {gcode_macro LH_TIP_CHECK: {armed: true}}, expect: accept, emits: ["RESULT=PASS (tool M300 checked since power-up"], emits_regex: ["\\A(?![\\s\\S]*_LH_CARRIAGE_Z)"]}
      - {macro: LH_NOZZLE_CHECK, params: {CARRIAGE: A, TOOL: M300, FORCE: 1}, state: "FORCE=1 repeats the check", set: {gcode_macro LH_TIP_CHECK: {armed: true}}, expect: accept, emits: ["_LH_NOZZLE_EVAL C=a N=8"]}
      - {macro: _LH_NOZZLE_EVAL, params: {C: a, N: 8}, state: "all nozzles seen", set: {gcode_macro _LH_STATE: {tip_mask: 255}}, expect: accept, emits: ["RESULT=PASS", "VARIABLE=nozzle_ok_a VALUE=1"]}
      - {macro: _LH_NOZZLE_EVAL, params: {C: a, N: 8}, state: "nozzle row offset (6 of 8 seen)", set: {gcode_macro _LH_STATE: {tip_mask: 63}}, expect: refuse}
      - {macro: _LH_CARRIAGE_Z, params: {C: a, Z: 285, SPEED: 10, CHECK: 1}, state: "gate check with the other carriage lowered: checked at its whole-deck travel height", set: {gcode_macro _LH_STATE: {zpos_z_b: 3.0}}, expect: accept, emits_regex: ["\\A\\s*M400\\s*\\n\\s*_LH_TRAVEL_GUARD EXCEPT=a ALL=1"]}
      # ---- B: nozzle check only at the first pick-up of a tool since power-up (nozzle_seen)
      - {macro: LH_TOOL_PICK, params: {CARRIAGE: B, BAY: 1, TOOL: M50}, state: "M50 already passed its nozzle check since power-up", set: {gcode_macro _LH_STATE: {nozzle_seen: ",M50,"}}, expect: accept, emits: ["VARIABLE=nozzle_ok_b VALUE=1"]}
      - {macro: _LH_NOZZLE_EVAL, params: {C: a, N: 8, TOOL: M300}, state: "pass remembers the tool", set: {gcode_macro _LH_STATE: {tip_mask: 255}}, expect: accept, emits: ["VARIABLE=nozzle_seen VALUE='\",M300,\"'"]}
      - {macro: _LH_MOTORS_OFF, state: "motors off forgets the checked tools", expect: accept, emits: ["VARIABLE=nozzle_seen VALUE='\",\"'"]}
      - {macro: _LH_POWERUP_READ, state: "power-up with a tool: tips UNKNOWN (-1), nozzle not checked, checked tools forgotten", expect: accept, emits: ["VARIABLE=tips_a VALUE=-1", "VARIABLE=nozzle_seen VALUE='\",\"'"]}
      - {macro: _LH_EXCH_GUARD, params: {C: a, BAY: 3, WHO: t, MODE: drop}, state: "A4: tips UNKNOWN on carriage A: no dock entry", set: {gcode_macro _LH_STATE: {tips_a: -1}}, expect: refuse}
      # ---- V2: reads after the moves they check (M400 between)
      - {macro: LH_GRIPPER, params: {STATE: OPEN}, state: "V2: M400 before the gripped-switch check", expect: accept, emits_regex: ["G4 P200\\s*\\n\\s*M400\\s*\\n\\s*_LH_GRIP_RELEASED_CHECK"]}
      - {macro: LH_DOCK_LEAVE, state: "V2: M400 before each sideways guard (chain read after the Z rise)", expect: accept, emits_regex: ["\\A\\s*G90\\s*\\n\\s*M400\\s*\\n\\s*_LH_XY_GUARD"]}
      # ---- A6: heater-shaker (host-declared state; descents at the shaker place only when IDLE)
      - {macro: _LH_PLACE_GUARD, params: {X: 264, Y: -275, LINE: b, WHO: G0}, state: "gripper descends at the shaker, state UNKNOWN after restart", expect: refuse, message: "SHAKER"}
      - {macro: _LH_PLACE_GUARD, params: {X: 264, Y: -275, LINE: b, WHO: G0}, state: "gripper descends at the shaker while RUNNING", set: {gcode_macro LH_SHAKER: {state: RUNNING}}, expect: refuse, message: "SHAKER"}
      - {macro: _LH_PLACE_GUARD, params: {X: 264, Y: -275, LINE: a, WHO: MANUAL_STEPPER, C: a}, state: "pipette descends at the shaker while IDLE", set: {gcode_macro LH_SHAKER: {state: IDLE}}, expect: accept}
      - {macro: _LH_PLACE_GUARD, params: {X: 264, Y: -275, LINE: b, WHO: G0, DOWN: 0}, state: "gripper rises at the shaker while RUNNING", set: {gcode_macro LH_SHAKER: {state: RUNNING}}, expect: accept}
      - {macro: LH_SHAKER, params: {STATE: IDLE}, expect: accept, emits: ["VARIABLE=state VALUE='\"IDLE\"'"]}
      - {macro: LH_SHAKER, params: {STATE: SHAKE}, state: "unknown state", expect: refuse}
      - {macro: SET_GCODE_VARIABLE, params: {MACRO: LH_SHAKER, VARIABLE: state, VALUE: IDLE}, state: "host sets the shaker state past the macro", expect: refuse}
      # ---- A7: compartment fan-fail
      - {macro: LH_THERM_ON, state: "a compartment fan stopped", set: {gcode_button cab_fan_ok_2: {state: RELEASED}}, expect: refuse, message: "COMPARTMENT_FAN"}
      # ---- TC-1 guard (family: TC-1 at F1, lid park A1; per tool lowest point incl. its tip type)
      - {macro: _LH_TC_GUARD, params: {TOOL: M300, C: a, STROKE: 200, X: -42, Y: 60}, state: "over A2 (outside the TC-1 zone), lid not parked", set: {gcode_button lid_parked: {state: RELEASED}}, expect: accept}
      - {macro: _LH_TC_GUARD, params: {TOOL: M300, C: a, STROKE: 200, X: -42, Y: -172.5}, state: "over TC-1, lid not parked, tip end z 101 < 129", set: {gcode_button lid_parked: {state: RELEASED}}, expect: refuse}
      - {macro: _LH_TC_GUARD, params: {TOOL: M300, C: a, STROKE: 200, X: -42, Y: -172.5}, state: "over TC-1, lid parked", expect: accept}
      - {macro: _LH_TC_GUARD, params: {TOOL: M300, C: a, STROKE: 150, X: -42, Y: -172.5}, state: "tip end z 151 above 129", set: {gcode_button lid_parked: {state: RELEASED}}, expect: accept}
      - {macro: _LH_TC_GUARD, params: {TOOL: gripper, STROKE: 250, X: -222, Y: -172.5}, state: "gripper over the zone low, lid not parked", set: {gcode_button lid_parked: {state: RELEASED}}, expect: refuse}
      # ---- ethanol, airflow (Y7), UV option, lights
      - {macro: LH_ETHANOL, params: {STATE: BEGIN}, expect: accept, emits: ["SET_PIN_BASE PIN=uv_enable VALUE=0", "VARIABLE=ethanol VALUE=1", "LH_ETHANOL RESULT=ACTIVE"]}
      - {macro: LH_ETHANOL, params: {STATE: BEGIN}, state: "airflow not proven", set: {gcode_button airflow: {state: RELEASED}}, expect: refuse}
      - {macro: LH_ETHANOL, params: {STATE: BEGIN}, state: "process hold latched", set: {gcode_macro _LH_STATE: {phold: AIRFLOW}}, expect: refuse}
      - {macro: _LH_AIRFLOW_LOST, state: "airflow lost during an ethanol step", set: {gcode_macro _LH_STATE: {ethanol: 1}}, expect: accept, emits: ["VARIABLE=phold VALUE='\"AIRFLOW\"'", "uv_enable VALUE=0", "LH_HOLD CODE=AIRFLOW"]}
      - {macro: _LH_AIRFLOW_LOST, state: "airflow lost with no ethanol step", expect: accept, emits: ["no ethanol step may start"], emits_regex: ["\\A(?![\\s\\S]*VARIABLE=phold)"]}
      - {macro: LH_UV, params: {STATE: "ON"}, state: "option not fitted", expect: refuse}
      - {macro: LH_UV, params: {STATE: "ON"}, state: "fitted but no guard locking", set: {gcode_macro LH_UV: {fitted: true}}, expect: refuse}
      - {macro: LH_UV, params: {STATE: "ON"}, state: "door open", set: {gcode_macro LH_UV: {fitted: true, lock_fitted: true}, gcode_button door: {state: PRESSED}}, expect: refuse}
      - {macro: LH_UV, params: {STATE: "ON"}, state: "ethanol step active", set: {gcode_macro LH_UV: {fitted: true, lock_fitted: true}, gcode_macro _LH_STATE: {ethanol: 1}}, expect: refuse}
      - {macro: LH_UV, params: {STATE: "ON"}, state: "all conditions met", set: {gcode_macro LH_UV: {fitted: true, lock_fitted: true}}, expect: accept, emits: ["SET_PIN_BASE PIN=uv_enable VALUE=1"]}
      - {macro: LH_UV, params: {STATE: "OFF"}, expect: accept, emits: ["SET_PIN_BASE PIN=uv_enable VALUE=0"]}
      - {macro: SET_PIN, params: {PIN: uv_enable, VALUE: 1}, state: "host switches the UV lamps directly", expect: refuse}
      - {macro: SET_PIN, params: {PIN: deck_light, VALUE: 1}, expect: accept, emits: ["SET_PIN_BASE PIN=deck_light VALUE=1.0"]}
      - {macro: LH_HEAD_STATUS, expect: accept, emits: ["LH_HEAD A=M300 B=EMPTY TIPS=00 NOZZLE_OK=10 HOLD=NONE PHOLD=NONE AIRFLOW=1 BIN=OK DRAWER=IN WASTE=OK BAYS=11000000"]}
      - {macro: LH_GRIPPER_LIFT, params: {Z: 0}, state: "lifting a plate off MB-1 at B4 (K15 speed)", set: {toolhead: {position: {x: 174.0, y: 47.5, z: 100.0}}, gcode_macro _LH_STATE: {grip: 2}}, expect: accept, emits: ["G0.1 Z0.0 F600.0"]}
      - {macro: LH_GRIPPER_LIFT, params: {Z: 50}, state: "downward with the lift macro", set: {toolhead: {position: {z: 10.0}}}, expect: refuse}
      # ---- W5 audit: refusing overrides and wrappers (carried over)
      - {macro: RESTORE_GCODE_STATE, params: {NAME: a, MOVE: 1}, state: "MOVE=1", expect: refuse}
      - {macro: RESTORE_GCODE_STATE, params: {NAME: a}, state: "plain", expect: refuse}
      - foreach: {c: [MANUAL_PROBE, Z_ENDSTOP_CALIBRATE, STEPPER_BUZZ, SET_TMC_CURRENT, SET_TMC_FIELD, SET_STEPPER_ENABLE,
                      SET_VELOCITY_LIMIT, M204, M220, G92, SET_GCODE_OFFSET, SET_KINEMATIC_POSITION, FORCE_MOVE, TUNING_TOWER]}
        cases:
          - {macro: "${c}", params: {STEPPER: z_a, CURRENT: 1.6}, state: "host call", expect: refuse}
      - {macro: M84, expect: accept, emits: [_LH_MOTORS_OFF, M84.1]}
      - {macro: _LH_MOTORS_OFF, expect: accept, emits: ["VARIABLE=homed VALUE=0", "VARIABLE=grip VALUE=0", "VARIABLE=nozzle_ok_a VALUE=0"]}
      - {macro: SET_GCODE_VARIABLE, params: {MACRO: _LH_STATE, VARIABLE: homed, VALUE: 1}, state: "protected state", expect: refuse}
      - {macro: SET_GCODE_VARIABLE, params: {MACRO: _LH_STATE, VARIABLE: hold, VALUE: "''"}, state: "host clears a hold directly", expect: refuse}
      - {macro: SET_GCODE_VARIABLE, params: {MACRO: _LH_TOOLDEF, VARIABLE: codes, VALUE: 1}, state: "protected tool table", expect: refuse}
      - {macro: SET_GCODE_VARIABLE, params: {MACRO: _LH_ZCUR, VARIABLE: force_current, VALUE: 2.0}, state: "protected Z current", expect: refuse}
      - {macro: SET_GCODE_VARIABLE, params: {MACRO: _LH_SIZE, VARIABLE: dock_yf, VALUE: 545.5}, state: "host moves the dock row", expect: refuse}
      - {macro: SET_GCODE_VARIABLE, params: {MACRO: _LH_TOOLDEF, VARIABLE: commissioned, VALUE: 1}, state: "host commissions SYR", expect: refuse}
      - {macro: SET_GCODE_VARIABLE, params: {MACRO: MY_MACRO, VARIABLE: x, VALUE: 1}, expect: accept, emits: [SET_GCODE_VARIABLE_BASE]}
      - {macro: _LH_Z_FORCE, params: {C: a, TOOL: M50, "ON": 1}, expect: accept, emits: ["SET_TMC_CURRENT_BASE STEPPER=z_a CURRENT=${zcur.force_current}"]}
      - {macro: _LH_Z_FORCE, params: {C: b, TOOL: M300, "ON": 0}, expect: accept, emits: ["SET_TMC_CURRENT_BASE STEPPER=z_b CURRENT=${zcur.run_current}"]}
      - {macro: _LH_Z_FORCE, params: {C: a, TOOL: S10, "ON": 1}, state: "single-channel tool (no raise)", expect: accept, emits_regex: ["\\A(?![\\s\\S]*SET_TMC_CURRENT_BASE)"]}
      - {macro: _LH_REQUIRE_TOOLS_UP, params: {WHO: homing}, state: "chain open", set: {gcode_button tools_up: {state: RELEASED}}, expect: refuse}
      - {macro: _LH_REQUIRE_TOOLS_UP, params: {WHO: homing}, expect: accept}
      - {macro: _LH_GRIP_RELEASED_CHECK, state: "jaws open, switch reads gripped", set: {gcode_button gripped: {state: PRESSED}}, expect: refuse}
      # ---- ADR-003: thermal enable, weld check, watchdog supervision, lid state machine (carried over)
      - {macro: _LH_THERM_EXPECT, params: {RELAY: "off", CODE: RELAY_WELDED}, state: "contactor off as commanded", expect: accept}
      - {macro: _LH_THERM_EXPECT, params: {RELAY: "off", CODE: RELAY_WELDED}, state: "commanded off, mirror says ON (welded)", set: {gcode_button therm_mirror: {state: RELEASED}}, expect: accept,
         emits: ["_LH_THERM_FAULT CODE=RELAY_WELDED"]}
      - {macro: _LH_THERM_EXPECT, params: {RELAY: "on", CODE: CHAIN_OPEN}, state: "enabled but contactor stays off", expect: accept, emits: ["_LH_THERM_FAULT CODE=CHAIN_OPEN"]}
      - {macro: _LH_THERM_FAULT, params: {CODE: RELAY_WELDED}, expect: accept, emits: ["therm_enable VALUE=0", "wd_heartbeat VALUE=0", M112, _LH_THERM_RAISE]}
      - {macro: _LH_THERM_FAULT, params: {CODE: WATCHDOG_FAIL}, expect: accept, emits: ["wd_heartbeat VALUE=0", _LH_THERM_RAISE]}
      - {macro: LH_THERM_ON, state: "fault latched", set: {gcode_macro _LH_THERM: {fault: WATCHDOG_FAIL}}, expect: refuse}
      - {macro: LH_THERM_ON, expect: accept, emits: ["RELAY=off CODE=RELAY_WELDED", "wd_heartbeat VALUE=0", "CODE=WATCHDOG_FAIL", "LH_THERM RESULT=ON"]}
      - {macro: delayed_gcode _LH_WD_TICK, state: "host silent", set: {gcode_macro _LH_THERM: {"on": 1, hb_left: 0}}, expect: accept, emits: ["wd_heartbeat VALUE=0", "therm_enable VALUE=0", HOST_SILENT]}
      - {macro: delayed_gcode _LH_WD_TICK, state: "heartbeat budget counting down", set: {gcode_macro _LH_THERM: {"on": 1, hb_left: 5}}, expect: accept, emits: ["VARIABLE=hb_left VALUE=4"]}
      - {macro: SET_PIN, params: {PIN: therm_enable, VALUE: 1}, state: "host enables THERM directly", expect: refuse}
      - {macro: SET_PIN, params: {PIN: wd_heartbeat, VALUE: 1}, state: "host holds the heartbeat", expect: refuse}
      - {macro: SET_PIN, params: {PIN: beam_emitter, VALUE: 0}, expect: accept, emits: ["SET_PIN_BASE PIN=beam_emitter VALUE=0.0"]}
