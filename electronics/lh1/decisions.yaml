# LH-1 electrical decisions: which small custom boards are worth making.  12 Nov 2026.  Maturity: CALCULATED.
# Conductor counts are from wiring.csv (check.py chain report) and from the alternatives counted below.
a_head_interconnect:
  question: "Cut the conductors through the X drag chain (CAD: 10 x 10 mm inner, R18; Y chain the same)"
  conductors_through_x_chain:
    rev_B_as_drawn: {count: 48, detail: "4 Z motors x 4 + gripper 4 + 3 plungers x 4 = 32 motor; 4 Z homes + jaws-open + gripped x 2 = 12 switch; reserved pipette bus 4 (24 V, 0 V, CAN H/L)", fits: "no: 32 motor cores alone are 32 x 1.54 = 49 mm2 of 0.25 mm2 singles plus 0.5 mm2 motor current; as 8 screened 4-core cables (OD 5.6, R >= 42 mm) neither area nor R18 works"}
    passive_head_interconnect_board_only: {count: 43, detail: "same motor cores; the 6 switches share one return (7 instead of 12)", fits: "no"}
    aux_board_SKR_Pico_on_the_head: {count: 33, detail: "Z motors 16 + Z homes 5 (shared return) on the Octopus; Pico: 24 V pair + USB 4 + bus 4 = 10; Pico 85 x 56 mm does not fit the 45 x 45 tray", fits: "no (and USB in a drag chain is the least robust link)"}
    bought_single_driver_CAN_toolheads: {count: 8, detail: "EBB36/42-class boards have ONE driver each: eight boards on the head", fits: "chain yes, head no (8 boards, 8 CAN nodes, mass and space)"}
    two_bought_4_driver_CAN_boards_CHOSEN: {count: 8, detail: "24 V MOTION_H pair (0.75 mm2) + 24 V PIPETTE pair (0.75) + Klipper CAN pair + pipette CAN pair (0.25); Y chain adds the X motor (2 + 4), X end stop 2 and the gantry bond 1 = 17", fits: "yes: X chain fill 0.24, Y chain 0.47 (limit 0.60); R18 = 7.5 x 2.4 mm exactly (chain-rated 0.75 mm2 singles)"}
  decision: "Drivers move onto the carriage on two BOUGHT BigTreeTech MMB CAN V2.0 boards (4 EZ2209 each, STM32G0B1, Klipper over CAN): head_a = four Z axes, head_b = gripper + three plungers. The SKR Pico is retired; the magnet lift moves to Octopus socket 2. A small CUSTOM passive board, HIB-1, IS made: it sits in the existing 45 x 45 EB-1 tray and terminates the 8-conductor chain bundle in one keyed Mini-Fit Jr, fuses each MMB separately (4 A / 2 A) and the pipette port (2 A), clamps both 24 V feeds (SMBJ28A), carries the Klipper CAN termination and splits short stubs to the two XT30 leads, and passes the reserved pipette bus to a port."
  why_HIB1_is_worth_it: "Without it the head has 6 splices, 3 in-line fuse holders and a CAN tee hanging on a moving carriage; the board is 45 x 45 mm, 2 layers, passive, about 20 parts, fits space the CAD already reserves, and makes the head unpluggable at one connector. It does NOT itself reduce chain conductors: the bought MMB boards do."
  why_not_custom_8_driver_head_controller: "a custom MCU + 8 TMC2209 CAN board would be about the size of two MMBs, adds firmware/bring-up risk and has no bought fallback; the MMB is a stock Klipper target"
  costs_of_the_choice: "two more MCUs (Klipper restart after every motion-power removal, as already happens through TMC under-voltage); MMB logic is on MOTION (single input), so the head MCUs go down with the e-stop and the door; a new bracket for two 108 x 59 mm boards (CR-06)"
  files: [hib1/circuit.yaml, hib1/check_circuit.py, hib1/bom.csv, hib1/layout_brief.yaml]
b_power_distribution:
  decision: "NOT a custom board. Bought DIN-rail fuse terminals and push-in distribution blocks."
  why: "Rail currents are 16-25 A at the trunk; DIN fuse terminals with blown-fuse LEDs are certified, replaceable by a technician, recognised by an assessor and cost about the same as a 4-layer heavy-copper PCB with holders; a PCB would save about 60 mm of rail but put the THERM 25 A path and every branch on one unreviewed board in the most safety-relevant part of the machine. The only real constraint, bay height, is the same for both."
  bought_alternative:
    - "7 x DIN fuse terminal 5 x 20 with 24 V LED (Phoenix UT 4-HESILED 24 class): F1 LOGIC 5 A, F3 PIPETTE 2 A, F4 THERM_AUX 6.3 A, F6 SAFE 2 A, F7 small LOGIC loads 2 A, F22 head 6.3 A, F23 TC-1 lid 2 A"
    - "1 x DIN fuse terminal 6.3 x 32 (UT 6-HESILED 24 class): F21 gantry 10 A"
    - "2 x DIN fuse holder 10 x 38, DC-rated: F2 MOTION trunk 16 A gG, F5 THERM 25 A gG"
    - "6 x push-in distribution block 12 x 2.5 mm2 on DIN adapters (Phoenix PTFIX class): 0V x 2, LOGIC, LOG7, MOT_G, SAFE/SAFE_E"
    - "21 x push-in feed-through terminal 2.5 mm2 (XE, XD, XR, PIPETTE, THERM_AUX), end plates, jumper bars, marker strips"
    - "2 x 35 mm DIN rail 290 mm, end stops; 25 x 25 wiring duct"
c_safety_relay:
  decision: "NOT a custom circuit. Two bought, certified safety relays driving two pairs of force-guided-contact (mirror-contact) contactors."
  e_stop:
    relay: "SR1: dual-channel e-stop safety relay, 24 V DC, cross-fault detection, monitored manual reset, feedback loop, >= 2 NO safety outputs + semiconductor status; PL e / Cat 4 capable (e.g. Pilz PNOZ s4 750104 or Phoenix PSR-SCP-24DC/ESAM4/3X1/1X2)"
    wiring: "e-stop 2 NC positive-opening contacts as two separate channels: S11-S12 (ch1) and S21-S22 (ch2) through the 7-core screened cable W-S-03 (terminals XE), the relay's own test pulses detect cross-faults; reset button (W-S-10) in series with the feedback loop KM1 NC 21-22 -> KM2 NC 21-22 between S12 and S34 (monitored reset on release); outputs 13-14 -> KM1 coil, 23-24 -> KM2 coil (W-S-13/14) with coil suppressors; Y32 status lights the reset lamp"
    what_it_switches: "KM1 and KM2 in series, one main pole each for MOTION (16 A trunk), PIPETTE and THERM_AUX; their front auxiliary NO contacts in series make SAFE_E, which feeds the TC-1 relay coil through the three TC-1 thermostats (THERM) and the TCB1 hardware-disable input"
  door:
    relay: "SR2: same family as SR1, automatic reset (justify in the assessment), matched to the door sensor's contact type"
    sensor: "coded non-contact magnetic safety sensor, ISO 14119 type 4 low coding, 2 safety contacts + 1 signalling contact"
    wiring: "sensor ch1 -> S11-S12, ch2 -> S21-S22 (W-S-16/17, terminals XD); outputs 13-14 -> KM3, 23-24 -> KM4; feedback KM3 NC -> KM4 NC -> S34; KM3 and KM4 main poles in series with KM1/KM2 on MOTION only (gantry, head and the TC-1 lid drivers)"
  why_contactors: "MOTION is 10.7 A and feeds driver input capacitors: safety-relay contacts (about 6 A, inrush-sensitive) are not rated for it; contactors with mirror contacts in the feedback loop keep the Cat 3/4 structure and are cheap"
  not_weakened: "the e-stop removes MOTION, PIPETTE, THERM and THERM_AUX in hardware and leaves LOGIC (host, Octopus logic, TCB1 logic, fans) up; the door removes MOTION including the TC-1 lid; neither depends on software. Software monitoring (PG11, PB7) is for logging only."
  known_limits: "THERM is removed through ONE non-monitored automotive relay (TC-1's own) plus the requested TCB1 SAFE input as a diverse second channel; the assessor must decide whether that is adequate or a third contactor pair is needed for THERM"
cad_change_requests:
  - {id: CR-01, to: frame, what: "X chain: the bought 10x10 R18 chain needs about 50 mm bend height; 46 mm available. Raise the head chain-anchor underside by >= 4 mm (frame report already proposes local z >= 63) or otherwise give 50 mm. Do not go to R15: 0.75 mm2 cores need R >= 18."}
  - {id: CR-02, to: frame, what: "Y chain: tray z 388 to reserved top z 436 = 48 mm; raise the reserved top to >= z 440 (or confirm a chain of outer height <= 12 mm)."}
  - {id: CR-03, to: head, what: "four Z-travel mini chains (inner >= 5 x 6 mm, R >= 15, about 0.25 m), one per tool carriage, carriage plate -> tool plate: plunger motor + released switch (6 cores), gripper motor + 2 switches (8 cores)."}
  - {id: CR-04, to: head, what: "gripper jaws-open limit switch (D2F class) on GR-1/GR-2: firmware homes the jaws to it; only the 'gripped' D2F exists in CAD."}
  - {id: CR-05, to: head, what: "three plunger 'released' (rod retracted) switches (D2F class) on the HP-4 brackets."}
  - {id: CR-06, to: head, what: "bracket for two BTT MMB CAN V2.0 boards (108.3 x 59 mm, about 25 mm tall with EZ drivers; driver airflow), within about 0.3 m cable reach of all eight head motors, plus their 0.10 kg in the head mass. The EB-1 tray now holds HIB-1 (45 x 45 x 15, as already modelled). Suggested: stacked over the plate top behind the Z motors / over the beam, left of the chain anchor."}
  - {id: CR-07, to: frame, what: "control bay plate CBP (3 mm Al, x 245..480, y -148..148 on the base mid members) and a vertical board panel at x 476..479; bay height to z -6 (127 mm) with a removable cover at deck-underside level and right-panel access; 60 mm fan cut-out + grille in the right panel; IEC inlet cut-out (right panel, y -65..-15, z -110..-70)."}
  - {id: CR-08, to: frame, what: "static cable paths: right rear upright from the bay to the Y chain fixed end (bundle about 12 mm), clips or a 10 x 15 mm duct on the X beam back face from the Y-chain moving end (x +500) to the X-chain fixed end (x -316) and on to the X motor (x -485); clips along the base for the Y1 motor and Y end stop."}
  - {id: CR-09, to: frame, what: "mounts: e-stop box and reset button on the front right (x 400-450, z about 50, reachable with the door shut); door sensor + actuator on the right door edge; camera on the upper front cross-member; M6 PE stud on the base mid member at x 300; bonding points (M4 studs) on every panel and the deck halves."}
  - {id: CR-10, to: deck, what: "space and fixing under the deck near C3 for the thermal-block TEC controller (about 70 x 50 x 20 mm, needs airflow) and harness clips from the bay to B2 (magnet) and C3."}
  - {id: CR-11, to: thermocycler, what: "TC-1 lid chain inner 5 x 6 mm cannot carry the 14 lid conductors incl. the new clamp SEALED switch (fill 0.83 > 0.60): inner >= 6 x 8 mm (fill 0.52). Also confirm whether the IR break-beam rides on the hood (adds 5 cores to the chain)."}
  - {id: CR-13, to: frame, what: "second Y end-stop bracket (mirror of ESY) at the front right so each Y motor homes to its own switch and the gantry is re-squared at every homing."}
  - {id: CR-12, to: head, what: "X end-stop flag on the carriage for the ESX switch (frame report already notes it)."}
interface_requests_tcb1:
  status: "superseded by the real TCB-1 design (electronics/tcb1/circuit.yaml, 12 Nov): J11 MOTION input and the J9 chain exist; no separate SAFE input is needed because SAFE_E (= SAFE_24V) feeds the J9 chain. check.py now matches every TCB-1 connector to wiring.csv."
thermal_block_controller:
  decision: "second TCB-1 in its TM population, NOT the bought TEC controller"
  why: "cheaper (TCB-1 TM parts about 45 USD for the G2 24v13 plus Pico, ADS1115 and connectors, against several hundred for a Meerstetter-class controller), the firmware already supports TM, one board design to stock and debug, and the same hardware safety pattern as TC-1: own DC contactor whose coil runs SAFE_E -> 72 C cut-off -> KSD9700 -> J9 -> Q4. Wiring is simpler too: one XT60 power pair, one XT60 Peltier pair, 2 NTC, 1 fan, the 3-wire J9 chain and USB."
  costs: "a second NTC (sink) and a 4-wire PWM fan instead of the deck BOM's 2-wire one; one more DC contactor"
therm_switch: "the 40 A automotive relay is replaced by a DC contactor rated to make/break >= 40 A at 32 V DC (24 V-system automotive ratings are about 20-30 A at 28 V, below the ~34 A an LRS-600 delivers into a short); coil <= 0.15 A fits TCB-1 J9/Q4 (0.25 A budget). Same part for TC-1 and the thermal block."
rev_d_review:   # re-check against CAD integration rev D (cad/lh1/assembly/out/changes_rev_d.yaml), 12 Nov 2026
  closed:
    CR-01: "CCA-1 attach face at local z 90: X-chain bend height 50 mm available = 2 x R18 + 14 needed (check.py: fits, fill 0.24)"
    CR-02: "RES_y_cable_chain top z 442: 54 mm over the tray floor z 388 vs 50 needed (fits, fill 0.47)"
    CR-04: "GR-4 jaws-open D2F bracket under the GR-1 arm"
    CR-05: "HP-6 plunger switch brackets x 3 (D2F)"
    CR-06: "MBB-1 at local x -105..3, y -9.5..49.5; boards at local z 84..109 (head_a) and 110..135 (head_b)"
    CR-07: "CBP x 245..480, y -148..148 (plate top z -133); VBP x 476..479 up to z -10; CBC cover z -9..-6: 124 mm usable (SR1/SR2 121 mm fit)"
    CR-10: "reserved box under D3 x 72..192, y 100..188, z -136..-102 (keepouts K8): TCB_TM 120 x 88 board + 30 mm stack fits exactly (34 mm)"
    CR-11: "TC-1 lid chain inner 6 x 8 mm, outer 9.5 x 12, R18: 14 conductors, fill 0.52"
    CR-13: "second ESY bracket (front right), qty 2"
  partly_closed:
    CR-08: "10 x 15 duct on the beam back face x -485..500, z 415..430 present; the path up the right rear upright from the bay to the Y-chain fixed end is still not drawn"
    CR-09: "e-stop (x 425, z 50) and reset (x 425, z 110) 22.5 mm holes in ENC-FR, interlock bracket ENC-ILK on the mullion, 12 M4 bonding studs: present. Missing: camera mount, M6 main PE stud"
    CR-12: "XFL-1 flag present, but its tip at local x 160 trips ESX at carriage x 299.5: beyond the commanded 295 and 0.14 mm past the collision-free 299.36, and Klipper cannot take position_endstop > position_max. CR-12b: shorten the flag tip to local x 155.5 (trip at 295.0)"
  not_done:
    CR-03: "no room for Z chains: replaced by CR-03b below"
  new_requests:
    CR-03b_status: "CLOSED by rev E2: 10-way 1.0 mm FFC rolling loop per tool (FFC-F / FFC-M clamps, loop radius 6.5 mm, keepouts z_axis_cables); the 1.27 mm 28 AWG cable below is superseded (mechanical review M5)"
    CR-03b: >-
      SUPERSEDED. Z-axis cables without chains: one ROLLING LOOP of high-flex flat cable per tool (10 ways, 1.27 mm pitch, 28 AWG 7-strand,
      12.7 x 1.0 mm; conductors used: pipettes 6 = plunger motor 4 + released switch 2; gripper 8 = motor 4 + jaws-open 2 + gripped 2;
      max 0.6 A per conductor against 1.0 A). Bend: loop radius R 15 mm = 15 x thickness (minimum for continuous flexing of this
      class); the loop apex moves half the stroke, so for the 200 mm stroke the free length is 200/2 + pi x 15 + 20 = 167 mm and the
      cable flexes once per Z move, never tighter than R 15. Geometry asked of the head CAD, per tool, in carriage-local coordinates:
      (1) a fixed clamp on the carriage plate front face beside the tool's Z rail, at x = tool axis + 24 (outside the 12 mm rail and
      the ZC-1 block), z = local 0 (top of the Z carriage at home), M3 tapped pair 10 mm apart along z;
      (2) a moving clamp on the Z carriage ZC-1 top rear corner at the same x, M3 tapped pair;
      (3) a clear channel 16 mm wide (x, centred on that x) and 32 mm deep (y, from the carriage plate face forward) from local z +10
      down to local z -(100 + 15 + 10) = -125, i.e. the rolling-loop envelope with the lower run on the plate face and the upper run
      on the Z carriage, both flat; nothing else (screws heads, home switch lever, tool plate edge) may enter it over the full stroke;
      (4) on the tool side a 3-way strain-relief tie point on the tool plate within 30 mm of the moving clamp, where the flat cable is
      spliced to the motor and switch leads; on the carriage side a tie point within 30 mm of the fixed clamp where it is spliced to
      the SC_HF_025 / JST-XH tails from MMB_B. If x = axis + 24 collides, any x inside the tool's 74 mm band works: give the CAD
      coordinates back and wiring.csv lengths are recomputed.
    CR-14: >-
      PSU exhaust: the PSU fans end at x 460 and the service-panel grilles are at x 560: 100 mm of open gap, so hot exhaust can
      recirculate into the bay and the under-deck inlet. Add a 3-sided sheet duct per PSU (115 x 30 mm section, x 460..557,
      mounted on the PSU plate) or move the grilles' panel inboard; the frame report text 'grilles at x = 485' is out of date.
    CR-15: >-
      The IEC inlet sits on the removable service panel ENC-SRL (thumb screws): opening the panel moves live mains wiring and its PE
      bond. Move the inlet to the fixed back panel ENC-BK (cut-out 50 x 40 at x 400, z -100, beside the two M20 glands, above the
      rear PSU) or fix the inlet on a small fixed bracket behind the service panel. The two M20 glands have no cable assigned in this
      harness: use one for an optional host Ethernet cable, blank the other.
  host_supply: "host moved to its own DIN mains 5 V 10 A supply (MDR-60-5 class), looped from PSU_TC's AC terminals (W-M-03), PE W-E-16; PSU_MAIN 19.85 -> 19.05 A (76 %) with the host budget raised to a Pi 5 at 5 A (PSU_5V 6.0 / 10 A = 60 %)"
  enclosure_check: "check.py enclosure_checks parses frame_gantry/build.py: e-stop, reset, door sensor, bay fan and inlet positions match system.yaml within 0.5 mm; PSU grilles |y| 165..260 lie in front of the PSUs |y| 152..267; CBP/VBP/height match control_bay.yaml"
review_2026_11_13:   # docs/lh1/review/2026-11-13_review_software_electrical.md, finding A12 and section B
  homing: "[homing_override]: every G28 raises the four Z axes, then plungers (tips in air), magnet, then X/Y; the gripper is never moved; 'homed' resets on every restart (each e-stop/door opening forces one); G0/G1/MANUAL_STEPPER and every LH_ motion macro refuse until homed; gripper state UNKNOWN after restart until a person runs LH_GRIPPER_RELEASE CONFIRM=1"
  lid_permissive: "hardware: four Z_UP top-of-travel switches in series into TCB-1 J25 (OR gate U8 on the lid drivers' EN). Reverse direction (tools over C1 only with the lid parked) is FIRMWARE only: lid PARKED switch on Octopus PG13 read by the G0/G1/MANUAL_STEPPER guards (zone and z limit from keepouts K1/K2); it depends on Klipper's position and is not a safety function"
  welded_contactors: "KM5 added (SR1 output 3) in series with TC_RELAY on THERM; TC_RELAY, TB_RELAY and KM5 are mirror-contact contactors in SR1's feedback loop with KM1/KM2: a welded contact prevents reset. Claim made consistent: designed toward Cat 3 / PL d for every energy removal, unverified"
  alarms_and_heater: "servo ALM outputs to PG14/PG15/PC0 -> M112; LH_BLOCK_TEMP removed (the host code no longer emits it; check.py fails if either side reintroduces it); lid-heater lead behind an in-line 5 A fuse F31 (short 0.75 mm2 tap from TCB-1 J5)"
  section_b: "TVS: HIB-1 SMBJ28A (clamp onset 31-34 V) replaced by P6SMB27A (25.7-28.4 V) + 470 uF per feed; TCB-1 now has SMCJ24A on THERM (OK for the G2's 40 V) and SMBJ24A on LOGIC/VMOT (onset up to 29.5 V vs TMC2209 29 V: request P6SMB27A). Octopus: all eight DIAG jumpers removed (driver N DIAG -> STOP_N). Safety relay: Pilz PNOZ s4 750104 x 2, terminals drawn in system.yaml safety_relays; S12 carries channel 1 and the start/feedback loop because that is how Pilz draws it (manual 21396-EN-23 p.15), not an error"
  tip_check: "fork through-beam gate on Octopus PF9 (passive breakout in socket 4); LH_TIP_CHECK steps the nozzle row across the beam, one sample per channel and per gap, per-channel result when the gaps read clear, else ANY/NONE; disarmed (NOT OBSERVED) until the station is in the CAD"
  rev_e_items_not_yet_in_this_harness: "the CAD (rev E) and TCB-1 now show a down-looking USB camera on the carriage (CAM-1: USB does not fit the X/Y chains at R18; needs a chain-rated USB cable with R >= 34 mm or a CAN/Ethernet camera) and stage-3/4 modules (shaker SM-1, waste WM-1, TCB-1 builds SM and WM): not wired here; bay cover now at z -11 leaves 122 mm, 1 mm over the 121 mm safety relays (ask for >= 127)"
