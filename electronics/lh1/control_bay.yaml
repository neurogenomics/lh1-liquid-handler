# LH-1 control compartment layout, size family (ADR-011, 20 Nov 2026).  Checked by check.py: on-plate, no overlap, height,
# heat sum, plates against the CAD (cad/lh1/machine_family/scene.py COMPARTMENT and the CBP-F / CBP2-F plate boxes),
# every relay, contactor and supply inside the compartment, and the compartment airflow.
# CAD (cr_answers CR-L4): control compartment CBX-F UNDER the base, behind the drawer, between the feet: x -495..495,
# y 35..345, z -345..-162, 1.5 mm sheet, SAME IN EVERY SIZE (it never moves on an extension); sealed from the deck air by
# the enclosure floor sheets (glands); CAD services_interface (21 Nov 2026, answers CR-F2): two 92 mm intake fans with guard
# and washable filter on the RIGHT wall (centres y 120 / 250, z -253.5), a louvred exhaust grille on the LEFT wall.  Plates on the box floor: CBP-F x -480..160, y 36.5..343.5
# and CBP2-F x 245..480, y 42.5..337.5, top z -340.5; device volume 127 mm high (to z -213.5).
# Coordinates: global x, y of each item's lower-left corner on its plate; footprint = [along x, along y, height above plate].
# Footprints and dissipations are catalogue-class estimates for the parts in electrical_bom.csv.
# EVERY relay, contactor, SSR, supply and safety relay of the machine is in this compartment (ethanol ignition sources,
# system.yaml family.y7_ignition_sources): the former TEP relays (K_TU, K_CH, WDOG, LID_SSR, TG_SW, F31) are on rail E.
compartment:
  cad: "cad/lh1/machine_family/scene.py COMPARTMENT (x0 -495, x1 495, y0 35, y1 345, z0 = base z0 - foot + 11, z1 = base z0 - 6, t 1.5)"
  x: [-495, 495]
  y: [35, 345]
  z: [-345, -162]
  intake_fan: {size_mm: 92, count: 2, wall: "right (CAD services_interface airflow: intake right wall x 495, exhaust grille left wall x -495)", free_air_cfm_each: 40.0, derate: 0.6, through_grilles_cfm: 48.0, one_failed_cfm: 24.0, note: "CAD: about 40 CFM free air each (ASSUMED class, UNVERIFIED) x 0.6 for filter, grille and compartment (ASSUMED) = 48 CFM; check.py pins it to the CAD airflow block"}
plates:
  CBP:
    status: "CAD machine_family CBP-F_control_bay_plate (rev L CB-L, 640 x 310) on the compartment floor, PE-bonded (W-E-05)"
    x: [-480, 160]
    y: [36.5, 343.5]
    plate_top_z: -340.5
    height_available_mm: 127
  CBP2:
    status: "CAD machine_family CBP2-F_rear_electronics_plate (CR-L4, 235 x 295), PE-bonded (W-E-20)"
    x: [245, 480]
    y: [42.5, 337.5]
    plate_top_z: -340.5
    height_available_mm: 127
  GAP:
    status: "compartment floor between the two plates (x 160..245): reserved volume only (UPS batteries), no plate"
    x: [161, 244]
    y: [37, 343]
    plate_top_z: -343.5
    height_available_mm: 130
