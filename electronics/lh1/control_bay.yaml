totals:
  heat_w_psus: 74.0
  heat_w_bay_excluding_psus: 65.1
  airflow: "Compartment is sealed from the deck air and from the PSU grilles of rev L: ALL of its heat leaves through its own intake fans.  Average 139.1 W (PSUs 74.0 W, others 65.1 W incl. the two 92 mm fans 4.8 W; the CAD airflow block used the earlier 136 W).  Air needed for a 10 K rise: Q = P / (rho cp dT) = 139.1 / (1.2 x 1005 x 10) = 11.5 L/s (24.5 CFM).  Two 92 mm fans (CAD, answers CR-F2) about 40 CFM free air each x 0.6 (filter, grille, compartment: ASSUMED) = 48 CFM: rise about 5.1 K, 2.0 x the need; one fan failed 24 CFM: rise about 10.2 K (just over the 10 K target: a fan-fail alarm is NOT fitted, see check.py COMPARTMENT_ONE_FAN).  All fan figures are class figures (UNVERIFIED) until the fans are bought and the rise measured."
  airflow_needed_cfm_at_10K: 24.5
