# Cable and connector data used by build_harness.py (lengths, BOM) and check.py (fill, bend, drop, ratings).
# Values are generic catalogue figures for the class named; confirm on the parts actually bought (gate G0).
# od_mm: outer diameter of ONE core (singles) or of the whole cable (multicore).
# bend_factor: minimum bend radius / OD for continuous flexing in a chain (chain-rated cables 7.5 x d);
#              static cables are not checked for bending.
# ampacity_a: continuous current per conductor in a bundle/enclosure at 40 C (conservative, derated).
# r_ohm_per_m: conductor resistance (copper, 20 C) = 0.0172 / mm2.
cable_types:
  SC_HF_025: {desc: "single core 0.25 mm2 (24 AWG) high-flex chain-rated, PVC/TPE, 30 x 0.1 mm strands", gauge_mm2: 0.25, od_mm: 1.4, bend_factor: 7.5, ampacity_a: 3.0, chain_rated: true, single_core: true}
  SC_HF_050: {desc: "single core 0.5 mm2 (20 AWG) high-flex chain-rated", gauge_mm2: 0.5, od_mm: 2.0, bend_factor: 7.5, ampacity_a: 6.0, chain_rated: true, single_core: true}
