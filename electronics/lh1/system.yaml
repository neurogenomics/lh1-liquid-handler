    - {function: "half-lock, wrong tool, bay-switch disagreement, tool not released, contact window", where: "FIRMWARE latched holds (_LH_HOLD; Z stays, person clears with LH_HOLD_CLEAR CONFIRM=1)", why: "the dock is outside every guard opening; a held machine is safe"}
    - {function: "dropped tool (latch / code / cable change outside an exchange)", where: "FIRMWARE gcode_button events -> M112", why: "M112 removes stepping on every MCU; the latch is spring-closed so a tool cannot drop on power loss (mechanical)"}
