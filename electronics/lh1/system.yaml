    net_thrust_N_at: {"1.3": 225.8}       # minus the bar load
    release_force_N: 130.6                # CAD latch.release max_force_at_roller_N (phi -4 deg)
    margin_net: 1.73                      # >= 1.5 (the audit with the gross figure: 1.79)
    stall_static_N_at_1p3: 579            # best friction mu 0.10, static: 0.52 x 1.3/1.7 x 2 pi x 0.463 / 0.002 (what the pad can push into a jammed roller)
