    - {function: "airflow proving for ethanol steps; airflow lost mid-step", where: "FIRMWARE + HOST: LH_ETHANOL BEGIN refused without proven flow; release of the airflow input latches the AIRFLOW process hold (no pipetting; XY, gripper, eject, park allowed), UV forced off; host lids the ethanol reservoir and open wash plates and calls a person", why: "only the host knows which liquid is open; time to the LFL with no exchange is 25-77 min (deck_k Y7), so a firmware hold + lidding within minutes is proportionate; competent person to confirm"}
    - {function: "liquid waste full, tip bin full, drawer open", where: "FIRMWARE refusals (LH_DISPENSE over A4, LH_EJECT_TIP) + host hold", why: "process conditions"}
    - {function: "UV only with the door closed and nobody able to open it lit", where: "HARDWARE (UV supply on F24 after KM1/KM2 and KM3/KM4: door opening cuts it) + GUARD LOCKING (required: a coded guard-locking door interlock replacing DOOR_SW before the option is fitted) + FIRMWARE (LH_UV refuses without option, lock, closed door, during ethanol)", why: "a non-locking door would expose a person for the instant before the contactors drop: guard locking is the only way 'nobody can open it lit'"}
