    exchange_time: "check.py exchange_time (firmware moves, XY 150 mm/s, 0.25 s per verify): LH_TOOL_EXCHANGE 103.9 s (CAD head model 92.5 at 300 mm/s XY); LH_TOOL_PARK alone 70.3 s, LH_TOOL_PICK alone 73.0 s; + about 7 s pusher contact search after every pick-up and 10 s nozzle check at the first pick-up of a tool since power-up.  XY at 300 mm/s for the dock moves would save about 8 s"
    planner_and_link_must_absorb: ["LH_TOOL_EXCHANGE CARRIAGE= PARK_BAY= PICK_BAY= TOOL= (reply LH_TOOL RESULT=EXCHANGED CARRIAGE= PARK_BAY= PICK_BAY= PARKED= TOOL=); LH_TOOL_PARK / LH_TOOL_PICK keep their parameters and replies", "exchange time 103.9 s (park 70.3, pick 73.0) instead of 53.5", "G28 homes the dock lift bar first; homing_time_s 230 (was 200)", "new holds: LIFT_OUTSIDE_EXCHANGE, LIFT_BAR_NOT_DOWN, LIFT_NOT_AT_BAY, LIFT_NOT_AT_STROKE, LIFT_OTHER_NOT_CLEAR, LIFT_NOT_SEATED, LIFT_LATCH_NOT_LOCKED, LIFT_LATCH_NOT_EMPTY, LIFT_CODE, LIFT_STALL, LATCH_NOT_OPEN, LATCH_NOT_CLOSED, LATCH_WIRE, MISSING_CODE, INROW_*, SYR_NOT_FOLLOWING; refusals DOCK_BAR, LATCH_OPEN, LATCH_WIRE, PUSHER_SPEED", "pusher speed <= 5 mm/s (LH_ASPIRATE / LH_DISPENSE SPEED in uL/s <= 5 x ul_per_mm; M300 88 uL/s, SYR 826 uL/s)", "tip parking: LH_TIP_PARK / LH_TIP_UNPARK ... WELLS= [SPOT=] in ANY order (reply LH_TIP_PARK RESULT=PARKED|REPICKED SPOT=k); M300 only (the M50 admission goes); LH_TIP_PARK_SET CONFIRM=1 SETS=0 frees every spot; LH_TIP_PARK_STATUS; refused until commissioned and the strip force entered", "LH_DOCK_STATUS reply (BAR, BAR_OPEN, LATCH_A/B three states, EXCH, BAYS)", "FakeLinkS must model the dock lift (bar position, bar-open switch), the three latch buttons per carriage, the five-step sequences and their verifies, and LGA35 pusher speeds"]
