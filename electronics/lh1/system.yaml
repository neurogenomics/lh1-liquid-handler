  round_23nov_b:   # ADR-014 round (latch LTG-1 on the carriage, dock lift DLB-1, LGA35 pusher, random-access TPK-S); DESIGNED and SIMULATED only
    firmware:
      - "exchange: LH_TOOL_PARK / LH_TOOL_PICK rebuilt on the CAD sequences (head report safety.sequences) as _LH_DROP / _LH_PICKUP; LH_TOOL_EXCHANGE (park + in-row move of the EMPTY carriage at s 307 + pick, the CAD exchange); Z only positions"
      - "bar-up guard _LH_LIFT_GUARD (inside an exchange; bar down; head at the bay centre within 0.5 mm in X and Y; Z at the step-1 stroke; bay switch made; latch LOCKED with the tool's code for a drop-off, CLOSED-EMPTY with 0000 for a pick-up; the other carriage and the gripper at s 0 with closed latches): every refusal LATCHES a hold, Z stays"
      - "positive OPEN check after the bar rises (_LH_OPEN_VERIFY): bar-open-height switch made AND latch NOT CLOSED; otherwise the hold is latched FIRST and the bar lowered (the springs re-close the jaw on the stud or on nothing): LIFT_STALL / LATCH_NOT_OPEN"
      - "release check (CLOSED-EMPTY, 0000, bay still made) and lock check (LOCKED, code = TOOL; MISSING_CODE for LOCKED with 0000) after the bar is down; bay-empty check after the pick-up; every lowering is a homing move onto the DOWN switch (bar UNKNOWN until then)"
      - "power cut, e-stop, hold inside the dock: G28 lowers the bar FIRST (the bar can only let the springs close a latch), then reads both carriages (three-state), then Z up (a tool rides up latched; a released tool stays on its bay pins): no tool can drop because a tool stands on the bay pins whenever the jaw is open; a jaw closed on the stud's cone reads NOT CLOSED and homing is refused (a person)"
      - "X/Y (G0/G1 and every firmware sideways move) refused unless the bar is homed down (DOCK_BAR); _LH_DOCK protected from SET_GCODE_VARIABLE"
      - "latch: three analog buttons per carriage on the MMB ADC input PC2 (LOCKED 3.9-6.2 k, CLOSED-EMPTY 1.8-3.1 k, NOT CLOSED 15-35 k; none = LATCH_WIRE); _LH_TOOLS_LOCKED / power-up read need CLOSED-EMPTY for an empty carriage (LATCH_OPEN, LATCH_WIRE refusals)"
      - "pushers: rotation_distance 0.6096, 0 = the RETRACTED switch, Klipper limits -0.6 .. 37.0 (CAD soft limits 0.5 .. 37.5 of actuator stroke), work moves 0 .. 35; _LH_PUSHER_HOME at 0.50 A and 2 mm/s (never into the internal stop above 0.57 A), run 0.7 A restored; every pusher move <= 5 mm/s (PUSHER_SPEED)"
      - "tip parking: random access over the CAD groups (size file geometry: spots, row y, s_above 193.4, s_slide 271.7, s_seat 273.0, <= 10 mm/s, <= 0.25 m/s2, strip 9.6 mm at 1.3 A and <= 5 mm/s); M300 only; per-spot owner '<tool>|<wells>'; SPOT_OCCUPIED, SPOT_EMPTY, SET_OWNER, TIPS_UNKNOWN, PARKING_UNKNOWN, PARKING_FULL, NOT COMMISSIONED, STRIP_FORCE_UNMEASURED / _HIGH (limit 174 N = latch preload 535 N / 1.5 through the head report's strip cases)"
      - "SYR: after every fill an M400 and _LH_FOLLOW_CHECK (contact switch must still be made: HOLD SYR_NOT_FOLLOWING)"
    syringe_return_spring: "mechanism audit 1.3 < 1.5 (5.2 N against about 4 N of seal friction and check valve, ASSUMED): NOT closable by firmware or the drive: the pusher only pushes the plunger and cannot pull it back, so the refill force is the spring's alone; a slower refill reduces only the flow-dependent part, not the 3.5 N Coulomb friction nor the 0.5 N cracking pressure.  A CAD matter (stiffer return spring, 7 N class: margin 1.75) plus the rig measurement (CT-SYR); SYR stays uncommissioned.  The firmware DETECTS a plunger that did not follow (above)"
    wiring:
      - "dock lift: TMC5160 SPI stepstick in main Octopus socket 6 (PE2/PE3/PD4, CS PE1, MOTOR_POWER = MOTION_G via F21), 1.3 A run / 0.6 A hold and home; 4 x 0.5 mm2 screened lead W-I-40 through the connector plane; DOWN slot sensor W-I-41/42 (XK terminals, LOG7/F7) to io PE14 as a multi-MCU endstop; OPEN-height switch W-I-43 to io PE15; MOTION budget +0.4 A; E1 21.9 mJ"
      - "latch ladder: second sealed switch (EMPTY) per carriage and four resistors in the switch lead; no new FFC way"
      - "pushers: LGA351S12-A-UIAP-038 x 2 (+2 rig); FFC verdict and the new continuous-rating purchase condition (ffc_check, plunger_motor)"
      - "lead lengths: roof frame 760 -> 810 (PANEL_TOP 834, deck light 790), machine 10 mm wider on the left (Y1 motor, Y left end stop, X motor, left panel -10 mm): harness regenerated; door sensor at its CAD envelope"
    cad_published_not_taken_as_published:
      - "'latch switch unchanged in place; it now reads three states': a single window switch cannot tell CLOSED-EMPTY from OPEN; the design adds an EMPTY switch (made with the jaw >= 0.3 mm past the LOCK window) and a ladder.  CAD request: place the second switch"
