  exchange_time_model: "check.py exchange_time (out/check_report.json info.exchange_time): the firmware's own moves and speeds"
z_home_failsafe:
  statement: >-
    Revision L: an NC Z-home switch reads 'triggered' on a broken wire.  Homing: (0) both carriages are read before any
    move (half-lock refuses); (1) the three Z axes home up; (2) the hardware tools-up chain (three Z_UP switches, PG10)
    must read closed before any downward move; (3) an EMPTY carriage backs off until its switch opens (max 3 mm, error if
    it never opens) and homes again; the gripper Z (printer Z) does the same through Klipper's retract check; (4) a
    carriage CARRYING a tool is homed up only (head_l POWER-UP guard), so its broken home wire is covered by the chain alone.
  undetected_single_faults:
    - "a Z-up switch or chain wire SHORTED (chain reads closed with a Z axis down): XY guard and the K_TU lid gate defeated; only position tracking remains"
    - "a home-switch wire shorted to GND: homing drives up to the hard top and errors after a collision of up to the 12 mm eject band"
    - "K_CH contact welded closed: PG10 reads 'all up' with a Z axis down (K_TU gate unaffected)"
    - "carriage with a tool AND a broken home wire AND the tool down at power-up: Z reads homed where it stands; the chain check after homing then refuses (chain open), unless the chain is also shorted"
z_drive:      # Z axis current decision (13 Nov 2026, updated for CAD rev G5); check.py recomputes the window from the head report
  decision_short: "NEMA17 48 mm (CAD rev G5): force-stroke current 1.3 A inside the window floor (thrust) .. ceiling (bearing SF 2, driver 1.4 A)"
  decision: >-
    Run current 0.9 A rms for every ordinary Z move (driver ~1.2 W, motor copper ~2.4 W while moving, hold 0.6 A).  The
    eight-channel force strokes (force-ended pick-up, comb-strip lift) run at force_current 1.3 A, set per stroke by the
    firmware only (_LH_ZCUR / _LH_Z_FORCE; SET_TMC_CURRENT from the host is refused), one axis at a time, restored after the
    stroke and at every homing.  The window has two ends: FLOOR = the current at which the worst-case thrust (screw
    friction mu 0.20, usable-torque basis, at speed) reaches 1.1 x params Z_MIN_THRUST_N = 220 N (head report: 1.22 A);
    CEILING = the lower of (a) the current at which the stall onto the ZHS-1 stop (static stall at the least friction mu
    0.10 + rotor dynamic + carriage weight) keeps the F6-14M thrust bearing's static safety factor at 2 (head report: 1.35
    A; at 1.4 A the factor is 1.95) and (b) the TMC2209's 1.4 A rms short-time figure (datasheet rev 1.03 section 20.3:
    2.8 W at 1.4 A, 'short time operation'; section 3: thermal design 'critical ... at or above 1.4A RMS').  Continuous
    1.6 A (the earlier CAD recommendation for the 40 mm motor) stays rejected: ~3.7 W per driver and ~7.7 W per motor.
    All motor constants are catalogue-typical (ASSUMED) until the motor bought is measured; the rig measures the real
    pick-up and strip forces at the same 1.3 A (a stall shows as a force plateau on LC-1 / LC-2).
  motor: {class: "NEMA17 48 mm (CAD rev G5, head report z_thrust / z_screw_axial_support_rev_g4)", holding_torque_nm: 0.52, usable_torque_nm: 0.325, rated_current_a: 1.7, rotor_inertia_g_cm2: 68, phase_resistance_ohm: 1.5, source: "head report motor string (check.py parses it and fails if these copies differ); catalogue-typical, ASSUMED; phase resistance ASSUMED for the heat estimate only"}
  screw: {lead_mm: 2.0, d2_mm: 7.0, flank_half_angle_deg: 15.0, mu: [0.10, 0.15, 0.20], source: "head report z_thrust (Tr8x2, d2 7.0, 30 deg thread, mu keys)"}
  thrust_margin: 1.1
  bearing_min_sf: 2.0
  speed:   # B (23 Nov 2026): highest Z speed with the thrust basis kept; check.py z_speed recomputes it every run
    rule: "the Z drive must stay at or below its CORNER speed at the run current: up to there the driver still forces the full run current through the winding, so the torque (and the thrust every load case uses: usable torque x I / I_rated) is the same as at low speed; above it the back-EMF and the inductance cut the current and the thrust falls.  So no load case loses margin."
    supply_v: 24.0
    phase_resistance_ohm: 1.5        # z_drive.motor (ASSUMED catalogue figure)
    inductance_mh: 2.8               # ASSUMED: catalogue-typical for a NEMA17 48 mm 1.7 A winding; MEASURE on the motor bought
    pole_pairs: 50                   # 1.8 deg hybrid stepper
    ke_basis: "back-EMF constant = torque constant = holding torque / (sqrt 2 x rated current) = 0.216 V s/rad (peak, per phase): ASSUMED"
    screw_root_mm: 6.0               # Tr8x2 minor diameter (ASSUMED class)
    screw_free_length_mm: 380.0      # stroke 345 + nut + ends, fixed-free (one F6-14M bearing pair at the motor): conservative
    critical_speed_factor: 0.8
    result: "corner speed at 0.9 A on 24 V = 25.6 mm/s (12.8 rev/s); at 1.3 A 21.0 mm/s (force strokes run at 2 mm/s); screw critical speed (fixed-free) 60 mm/s x 0.8 = 48 mm/s; step rate at 25 mm/s 40 kHz per axis.  Set: velocity 25 mm/s (was 20).  Hardware option: a 48 V head supply gives a corner of 52.8 mm/s, capped by the screw at 48 mm/s (not taken: the MOTION overvoltage budget is 47.5 V)."
  driver: "BTT EZ5160 Pro (ADR-003): TMC5160 gate driver with external MOSFETs, VM 8-48 V, '2.5A, Peak Value: 3A' (BTT wiki, read 13 Nov 2026); sense resistor not stated on the wiki: Klipper default 0.075 ohm used, READ the resistor marking before first power"
  driver_continuous_limit_a: 2.5     # A rms, BTT wiki rating; 0.9 A used; heat at 1.3 A: power stage is external MOSFETs ('heat generation much lower than 2100/2130' per BTT; MOSFET part not identified): MEASURE on the bench rig
  driver_burst_limit_a: 2.5          # no separate short-time figure published; the bearing ceiling (1.35 A) binds
  driver_rms_max_a: 2.5              # module rating (BTT wiki); Klipper's tmc5160 limit with 0.075 ohm is higher
  recomputed:   # electrical owner's own arithmetic from the head report inputs (check.py repeats it each run)
    efficiency: {mu_0.10: 0.463, mu_0.15: 0.364, mu_0.20: 0.299}
    worst_thrust_N_at: {"0.9": 161.8, "1.2": 215.8, "1.3": 233.8, "1.4": 251.8, "1.7": 305.7}
    floor_a: 1.22
    stall_static_N_at_rated: 757          # 2 pi 0.52 0.463 / 0.002
    stall_dynamic_plus_weight_N: 192      # head report 'stall onto ZHS-1 at rated current' 949 N - static 757 N
    stall_total_N_at: {"0.9": 593, "1.3": 771, "1.4": 815}
    ceiling_bearing_a: 1.35               # (1588 / 2 - 192) / 757 x 1.7
    driver_W_at: {"0.6": 0.5, "0.9": 1.2, "1.3": 2.4, "1.4": 2.8}
    motor_copper_W_at: {"0.6": 1.1, "0.9": 2.4, "1.3": 5.1}
  supply_note_tmc2209_history: "the earlier 1.4 A burst cap came from the TMC2209 datasheet (sections 3 and 20.3); it no longer applies with the EZ5160 Pro"
  supply: "one Z axis at the force current at a time (every Z move is its own sequential command; only _LH_Z_FORCE raises, for the tool whose stroke it is): MOTION supply per Z motor at 1.3 A about 0.3 A (copper + driver loss / 24 V), others at hold about 0.06 A each; F22 6.3 A and the 0.75 mm2 head pair unaffected (z_motors load stays 2.7 A, conservative)"
  rig: "bench_rig.cfg _BR force_current 1.3 A for BR_PICK and the comb-strip lift, run 0.9 A otherwise: the rig measures the real pick-up / strip force at the machine's force current"
klipper_target:
  branch: "Klipper3d/klipper master"
  release: "NONE: the newest tagged release is v0.13.0 (commit 61c0c8d2ef40, 2025-04-11) and it does NOT take the STOP_ON_ENDSTOP names (home / inverted_probe) these configs use; the names arrived with commit 5a877d72203262fc87e5e111d3317c0dc7e0ad4a 'manual_stepper: Rework STOP_ON_ENDSTOP parameter' (committed 2026-02-14)"
  minimum: "a master commit at or after 5a877d72203262fc87e5e111d3317c0dc7e0ad4a (and containing [load_cell], in since v0.13.0)"
  commit: "29d4ec2d6d840ee839333306003a400da186d41d"
  commit_note: "master HEAD on 13 Nov 2026 when the command audit read the docs and klippy sources (committer date 2026-11-10, 'trdispatch: Fix signed comparison when extending trsync timeout'); read from api.github.com, not built or run here"
  build_document_instruction: "Install Klipper from git, not a release: git clone https://github.com/Klipper3d/klipper && cd klipper && git checkout 29d4ec2d6d840ee839333306003a400da186d41d; flash the Octopus and both MMB boards from that same checkout; record 'git rev-parse HEAD' in the build record. A different commit needs the command audit (firmware_command_audit) repeated against its docs before commissioning."
  audited_against: "klipper3d.org G-Codes.html, Config_Reference.html, Status_Reference.html, Config_Changes.html and klippy/{gcode,toolhead,klippy,pins,stepper}.py, klippy/extras/{gcode_macro,gcode_move,manual_probe,manual_stepper,force_move,stepper_enable,tmc}.py, src/stm32/spi.c on master, read 13 Nov 2026"
firmware_command_audit:
  # one row per built-in command family a loaded module registers.  loaded: how we know it is registered with these configs.
  # machine / rig: refused (a refusing gcode_macro of that name), wrapped (a gcode_macro with rename_existing that checks
  # and calls the base), left (with the reason), n/a (not registered).  check.py verifies every refused/wrapped entry.
  - {cmd: [G0, G1], module: gcode_move, loaded: "always (toolhead add_printer_objects)", risk: "moves X/Y/Z", machine: wrapped, rig: left, why: "machine: allow-list X Y Z F, homed, chain, tools up, C1 guard; rig: kinematics none, no stepper on the toolhead (GCODE_AXIS refused by the MANUAL_STEPPER wrapper)"}
  - {cmd: [G92], module: gcode_move, loaded: always, risk: "sets the position", machine: refused, rig: left, why: "rig: no toolhead axes"}
  - {cmd: [SET_GCODE_OFFSET], module: gcode_move, loaded: always, risk: "offsets shift every limit, MOVE=1 moves", machine: refused, rig: left, why: "rig: no toolhead axes"}
  - {cmd: [RESTORE_GCODE_STATE], module: gcode_move, loaded: always, risk: "MOVE=1 moves X/Y/Z unguarded (gcode_move.cmd_RESTORE_GCODE_STATE -> move_with_transform); also restores relative mode / offsets", machine: refused, rig: refused, why: "no firmware macro needs it"}
  - {cmd: [SAVE_GCODE_STATE, GET_POSITION, M114, G90, G21, M82, M83], module: gcode_move, loaded: always, risk: none, machine: left, rig: left, why: "no motion, no position change (G91 is left too: the wrappers refuse moves in relative mode and the macros send G90)"}
  - {cmd: [G91], module: gcode_move, loaded: always, risk: "relative coordinates", machine: left, rig: left, why: "G0/G1 wrappers refuse when not absolute"}
  - {cmd: [G20], module: gcode_move, loaded: always, risk: none, machine: left, rig: left, why: "raises its own error (no inch units)"}
  - {cmd: [M220], module: gcode_move, loaded: always, risk: "speed factor scales slow eject / tip-check / pick moves", machine: refused, rig: left, why: "rig: manual steppers ignore the speed factor"}
  - {cmd: [M221], module: gcode_move, loaded: always, risk: none, machine: refused, rig: left, why: "no extruder; refused for completeness on the machine"}
  - {cmd: [G4, M400], module: toolhead, loaded: always, risk: none, machine: left, rig: left, why: "dwell / wait"}
  - {cmd: [SET_VELOCITY_LIMIT], module: toolhead, loaded: always, risk: "raises speed/accel above the config (no upper bound in cmd_SET_VELOCITY_LIMIT)", machine: refused, rig: left, why: "rig: no toolhead moves"}
  - {cmd: [M204], module: toolhead, loaded: always, risk: "raises acceleration", machine: refused, rig: left, why: "rig: no toolhead moves"}
  - {cmd: [G28], module: homing, loaded: always, risk: "homing", machine: wrapped, rig: left, why: "machine: [homing_override] runs the guarded sequence; rig: kinematics none, homing is BR_HOME"}
  - {cmd: [MANUAL_PROBE], session_commands: [TESTZ, ACCEPT, ABORT], module: manual_probe, loaded: "always (toolhead add_printer_objects); TESTZ/ACCEPT/ABORT exist only inside a session", risk: "TESTZ moves toolhead Z with no guard (manual_probe.py manual_move)", machine: refused, rig: refused, why: "MANUAL_PROBE refused, so no session (TESTZ, ACCEPT, ABORT) can start; ACCEPT/ABORT are not overridden because the load-cell calibration session on the rig needs them"}
  - {cmd: [Z_ENDSTOP_CALIBRATE, Z_OFFSET_APPLY_ENDSTOP], module: manual_probe, loaded: "only when [stepper_z] has position_endstop (machine: yes; rig: no stepper_z)", risk: "TESTZ session; changes the Z endstop", machine: refused, rig: n/a, why: "rig: not registered"}
  - {cmd: [STEPPER_BUZZ], module: force_move, loaded: "always (force_move.register_stepper, no enable needed)", risk: "moves any stepper +-1 mm ten times", machine: refused, rig: refused, why: ""}
  - {cmd: [FORCE_MOVE, SET_KINEMATIC_POSITION], module: force_move, loaded: "only with enable_force_move: True (default False; not set)", risk: "unguarded moves / position set", machine: refused, rig: refused, why: "not registered; a refusing macro of the same name makes Klipper fail at start-up if enable_force_move were ever set"}
  - {cmd: [MANUAL_STEPPER], module: manual_stepper, loaded: "with any [manual_stepper]", risk: "moves, SET_POSITION, ENABLE, STOP_ON_ENDSTOP, GCODE_AXIS", machine: wrapped, rig: refused, why: "machine: allow-list STEPPER MOVE SPEED ACCEL SYNC=1, Z axes only; rig: all moves through _BR_Z / _BR_X / _BR_XSLIDE"}
  - {cmd: [SET_TMC_CURRENT], module: tmc2209, loaded: "with any [tmc2209]", risk: "grip force, eject force, Z thrust/stall", machine: refused, rig: refused, why: "firmware macros use SET_TMC_CURRENT_BASE (eject over-travel, Z force strokes)"}
  - {cmd: [SET_TMC_FIELD], module: tmc2209, loaded: "with any [tmc2209]", risk: "any driver register (current scale, chopper off)", machine: refused, rig: refused, why: ""}
  - {cmd: [INIT_TMC, DUMP_TMC], module: tmc2209, loaded: "with any [tmc2209]", risk: "INIT_TMC rewrites the config values (restores, never raises); DUMP_TMC reads", machine: left, rig: left, why: "can only return a driver to printer.cfg values"}
  - {cmd: [M18, M84], module: stepper_enable, loaded: always, risk: "drivers off: positions lost", machine: wrapped, rig: wrapped, why: "wrapper clears homed (and on the machine plunger positions and gripper state) before calling M18.1/M84.1; the idle timeout's M84 goes through it"}
  - {cmd: [SET_STEPPER_ENABLE], module: stepper_enable, loaded: always, risk: "one driver off: position lost without clearing homed", machine: refused, rig: refused, why: ""}
  - {cmd: [SET_IDLE_TIMEOUT], module: idle_timeout, loaded: always, risk: "shortens the timeout -> M84", machine: left, rig: left, why: "fail-safe: the timeout runs the M84 wrapper (homed cleared)"}
  - {cmd: [TUNING_TOWER], module: tuning_tower, loaded: always, risk: "issues a command on every Z change during moves", machine: refused, rig: left, why: "rig: no toolhead moves"}
  - {cmd: [SET_PRINT_STATS_INFO], module: print_stats, loaded: always, risk: none, machine: left, rig: left, why: ""}
  - {cmd: [QUERY_ENDSTOPS, M119, QUERY_ADC, QUERY_BUTTON, STATUS, HELP, ECHO, M115, M110, RESPOND, M118], module: "query_endstops / query_adc / gcode_button / gcode / respond", loaded: always or with the section, risk: none, machine: left, rig: left, why: "read-only or messages"}
  - {cmd: [M112, RESTART, FIRMWARE_RESTART], module: gcode, loaded: always, risk: "stop / restart (clears all state)", machine: left, rig: left, why: "must stay: e-stop path and recovery; restart resets homed"}
  - {cmd: [SAVE_CONFIG], module: configfile, loaded: always, risk: "writes pending calibration results and restarts", machine: left, rig: left, why: "only results of calibration commands are pending; the motion-related ones (Z_ENDSTOP_CALIBRATE, MANUAL_PROBE) are refused; the rig needs it for LOAD_CELL_CALIBRATE; a restart clears homed"}
  - {cmd: [SET_GCODE_VARIABLE], module: gcode_macro, loaded: "with any [gcode_macro]", risk: "rewrites guard state (homed, positions, calibration constants)", machine: wrapped, rig: refused, why: "machine: refuses the firmware state macros (_LH_STATE, LH_EJECT_TIP, LH_TIP_CHECK, LH_PICK_TIP, _LH_TOOLS, _LH_C1_GUARD, _LH_MB1, _LH_ZCUR); rig: refused for every macro"}
  - {cmd: [SET_PIN], module: output_pin, loaded: "machine: tip_gate_power, beam_emitter, therm_enable, wd_heartbeat, deck_light, vc2_light, uv_enable; rig: none", risk: "therm_enable would bypass the LH_THERM_ON proof test; wd_heartbeat could be held on by hand", machine: wrapped, rig: n/a, why: "wrapper refuses therm_enable and wd_heartbeat, allows tip_gate_power and beam_emitter (off = fail-safe; on only powers the gate if every tool is up and the beam is clear)"}
  - {cmd: [SET_HEATER_TEMPERATURE], module: heaters, loaded: "with [heater_generic lid_heater] (machine)", risk: "lid heater target outside 30..110 C or with THERM unarmed", machine: refused, rig: n/a, why: "LH_LID_HEATER is the route; max_temp 115 and the 130 C KSD301 remain"}
  - {cmd: [PID_CALIBRATE], module: pid_calibrate, loaded: "with a heater (machine)", risk: "drives the lid heater to a target", machine: refused, rig: n/a, why: "commissioning only, by name PID_CALIBRATE_BASE with a competent person"}
  - {cmd: [TURN_OFF_HEATERS, TEMPERATURE_WAIT], module: heaters, loaded: "with a heater (machine)", risk: none, machine: left, rig: n/a, why: "off / wait only"}
  - {cmd: [UPDATE_DELAYED_GCODE], module: delayed_gcode, loaded: "with [delayed_gcode _LH_WD_TICK] (machine)", risk: "stopping _LH_WD_TICK would stop the host-silence supervision (the MCU's own heartbeat square wave would go on)", machine: refused, rig: n/a, why: "the tick re-arms itself through UPDATE_DELAYED_GCODE_BASE"}
  - {cmd: [LOAD_CELL_DIAGNOSTIC, LOAD_CELL_CALIBRATE, LOAD_CELL_TARE, LOAD_CELL_READ, LOAD_CELL_TEST_TAP], module: load_cell, loaded: "rig only ([load_cell] x 4)", risk: "calibration/tare change force readings", machine: n/a, rig: left, why: "no motion; operator calibration needs them; every force-limited BR_ macro checks is_calibrated and tares at an unloaded position itself"}
  - {cmd: [G2, G3, G10, G11, EXCLUDE_OBJECT, SDCARD_PRINT_FILE, M24, PAUSE, RESUME, SET_SERVO, SET_FAN_SPEED, BED_MESH_CALIBRATE, PROBE, SET_DUAL_CARRIAGE, SAVE_VARIABLE], module: "gcode_arcs, firmware_retraction, exclude_object, virtual_sdcard, pause_resume, servo, fan, bed_mesh, probe, dual_carriage, save_variables", loaded: "NOT loaded: none of these sections is in either config (check.py fails if one is added without re-auditing)", risk: "various", machine: n/a, rig: n/a, why: "a file printed through virtual_sdcard would still pass every command through the same macros"}
firmware_residual_risks:
  - "Klipper keeps renamed built-ins callable (gcode_macro rename_existing: 'provide the previous definition of the command via the name provided here'; klippy/extras/gcode_macro.py handle_connect re-registers the old handler under the new name).  Every *_BASE / *.1 name in firmware_command_audit (G0.1, G1.1, MANUAL_STEPPER_BASE, G92.1, SET_GCODE_OFFSET_BASE, SET_GCODE_VARIABLE_BASE, RESTORE_GCODE_STATE_BASE, MANUAL_PROBE_BASE, Z_ENDSTOP_CALIBRATE_BASE, Z_OFFSET_APPLY_ENDSTOP_BASE, STEPPER_BUZZ_BASE, SET_TMC_CURRENT_BASE, SET_TMC_FIELD_BASE, SET_STEPPER_ENABLE_BASE, M18.1, M84.1, SET_VELOCITY_LIMIT_BASE, M204.1, M220.1, M221.1, TUNING_TOWER_BASE) bypasses its guard if sent by name.  No Klipper option hides them.  The wrappers are the documented only route; the host code must never send these names (a host-side lint is the src owner's job)."
  - "M84/M18 (also run by the idle timeout) clear the homed state through the wrapper; SET_STEPPER_ENABLE is refused; the machine guards also require Klipper's toolhead homed_axes == xyz, which Klipper clears on every motors-off (stepper_enable motor_off -> clear_homing_state), so even M84.1 sent by name leaves the machine refusing moves until G28.  The rig (kinematics none) has no homed_axes and relies on the wrapper only."
  - "A raised Z current left by an error inside a force stroke stays until the next force macro or G28 (_LH_Z_NOMINAL); at standstill the driver falls to hold_current 0.6 A."
  - "SET_KINEMATIC_POSITION and FORCE_MOVE exist only with [force_move] enable_force_move: True (default False); printer.cfg must not enable it (check.py) and defines a refusing SET_KINEMATIC_POSITION macro."
  - "Guards are Klipper macros, not a safety function: a firmware fault or a wrong printer.cfg defeats them.  The hardware layer (SR1/SR2, KM1-KM5, TC_RELAY/TB_RELAY, the K_TU gate and the WDOG watchdog) is unaffected."
octopus_diag_jumpers:
  fitted: []                       # all eight removed: verify on the received board before first power
  diag_to_stop: {0: PG6, 1: PG9, 2: PG10, 3: PG11, 4: PG12, 5: PG13, 6: PG14, 7: PG15}
  io_board: "the io Octopus uses STOP_0..7 for the bay switches: ALL EIGHT DIAG jumpers removed on that board too (check.py treats both boards the same)"
  source: "0-3 from Klipper's sample generic-bigtreetech-octopus-pro-v1.1.cfg (diag_pin comments); 4-7 per the board pin diagram (STOP_4..7): VERIFY on the received board"
  mmb_note: "MMB CAN V2.0 DIAG pins (PB9, PB8, PB7, PB6) are separate MCU pins, not the end-stop inputs PA15/PA10/PD9/PD8: no jumper conflict"
overvoltage_motion:   # ADR-003: no suppressors on the head.  check.py recomputes every event (no-TVS model) and asserts the peak stays below the lowest-rated part on the MOTION bus minus the margin
  basis: "calculated, not measured; scope the head supply during an e-stop with Z at 60 mm/s on the bench rig (ADR-003 consequence)"
  supply_max_v: 24.5               # LRS-600-24 set to 24.0 V +/- 2 %; NEVER trimmed up.  Mean Well LRS-600-SPEC 2025-09-12: 24 V model VOLTAGE ADJ. RANGE 22.8 ~ 26.4 V, OVER VOLTAGE protection 27.6 ~ 32.4 V (shut down, re-power to recover)
  supply_trim_max_v: 26.4          # if the trimmer were turned to its end
  supply_ovp_max_v: 32.4           # the supply's own OVP trip, upper tolerance
  margin_v: 0.5
  parts_on_bus:    # every part powered from MOTION (after KM1-KM4), with its rating and where the figure comes from
    TMC5160_STEPSTICK: {limit_v: 48.0, kind: "PURCHASE CONDITION (ADR-014 dock lift driver, not bought): VM rating >= 48 V", where: "main Octopus socket 6 (dock lift DLB-1), on MOTION_G", source: "system.yaml dock_lift.driver purchase condition"}
    EZ5160_PRO: {limit_v: 48.0, kind: "operating maximum (VM 8-48 V); no absolute maximum published", where: "6 head drivers (family: Z x 3, pushers x 2, gripper jaws)", source: "BTT EZ5160 Pro wiki 'Input Voltage (VM) 8V-48V' (global.bttwiki.com, read 13 Nov 2026)"}
    MMB_CAN_V2: {limit_v: 60.0, kind: "input range 12-60 V", where: "MMB_A, MMB_B", source: "BTT MMB CAN V2.0 wiki 'DC12V-DC60V' (read 13 Nov 2026); SMAJ60A on DC_IN, SIC461 6-60 V buck, 100 uF/80 V per socket per the BTT schematic (read for HIB-1, 13 Nov 2026)"}
    DM542_CLASS: {limit_v: 50.0, kind: "supply range maximum (20-50 V DC table; 18-50 V feature list)", where: "TC-1 lid drivers (via K_TU)", source: "Leadshine DM542E product page (leadshine.com, read 13 Nov 2026)"}
    XY_CLOSED_LOOP: {limit_v: 48.0, kind: "PURCHASE CONDITION (motors not bought): supply rating >= 48 V", where: "X, Y, Y1 integrated closed-loop motors (MOTION_G)", source: "electrical_bom.csv purchase condition"}
    OCTOPUS_MOTOR_POWER: {limit_v: 60.0, kind: "ASSUMED: Octopus Pro MOTOR_POWER input rated for its 60 V-class drivers; no on-board driver fitted (breakouts only)", where: "MAIN_CTRL MOTOR_POWER", source: "not verified this round"}
  bulk:            # capacitance credited (20 % tolerance taken off)
    - {ref: MMB_A, uf: 400, tol: 0.2, what: "4 x 100 uF/80 V at the driver sockets (BTT schematic)"}
    - {ref: MMB_B, uf: 400, tol: 0.2, what: "4 x 100 uF/80 V"}
    - {ref: MMB_bucks, uf: 94, tol: 0.2, what: "2 x 47 uF/80 V buck inputs behind SS510B"}
  feed_cable: {what: "KM1-KM4 making onto the head: W-P-28, 2 x 1.5 mm2 chain cores (SC_HF_15) through the Y and X chains, family length cut for L in every size (wiring.csv; check.py reads the length and fails if this copy differs)", cable_id: W-P-28, length_m: 4.45, l_uh_per_m: 1.2, r_ohm_per_m: 0.0115}
  recomputed: "20 Nov 2026 (family): rev L figures were stale (eight drivers, 3.55 m of 0.75 mm2).  Now: three Z axes, two NEMA14 pushers, gripper jaws on six EZ5160 Pro; feed 4.45 m of 1.5 mm2; events E1, E2, E5 recomputed; E3/E4 unchanged (same gantry mass class 22.6 kg, same X motor)"
  events:
    - {id: E1_winding_dump, kind: inductive, energy_j: 0.0219, what: "e-stop/door with every MOTION motor energised (ADR-014): 2 x Z at 0.9 A (3.8 mH, 3.08 mJ each) = 6.16 mJ + 1 x Z at the 1.3 A force current 6.4 mJ + the dock lift at 1.3 A (same motor class, 6.4 mJ) + 2 LGA35 pushers at 0.7 A (2.46 mH VERIFIED, 2 phases: 1.21 mJ each) + gripper 0.51 mJ = 21.9 mJ"}
    - {id: E2_estop_fast_z, kind: source, source_max_v: 39.2, energy_j: 0.416, what: "e-stop with Z at 60 mm/s: 48 mm NEMA17 Kt = 0.52 N m / (sqrt2 x 1.7 A) = 0.216 V s/rad -> EMF 40.8 V peak at 188.5 rad/s, 39.2 V after two body diodes; rotor 68 + screw 7 + coupler 3 g cm2 x THREE axes (family head) = 0.416 J"}
    - {id: E3_gantry_regen, kind: regen, ke_j: 1.53, t_s: 0.2, p_loss_w: 0.0, standing_load_a: 0.71, what: "gantry braking from 400 mm/s at 2000 mm/s2 with KM closed; KM/SR coils sink 0.71 A (Y moving mass 22.6 kg, family dynamics)"}
    - {id: E4_gantry_by_hand, kind: source, source_max_v: 34.5, energy_j: 7.1, what: "MOTION off, gantry pushed by hand at 1.0 m/s (X motor EMF 34.5 V rectified)"}
    - {id: E5_cable_opening, kind: inductive, energy_j: 7.9e-05, what: "KM or F22 opening with 3.85 A in W-P-28 (2 x 4.45 m x 1.2 uH/m = 10.7 uH): 0.5 x 10.7e-6 x 3.85^2"}
    - {id: E6_supply_overshoot, kind: source, source_max_v: 26.95, energy_j: 0.135, what: "PSU_MAIN load-step overshoot, ASSUMED 10 %"}
    - {id: E7_z_braking, kind: regen, ke_j: 0.139, t_s: 0.2, p_loss_w: 2.19, standing_load_a: 0.0, what: "one 48 mm Z braking from 60 mm/s (78 g cm2 at 188.5 rad/s) in normal use; copper loss 2.19 W at 0.9 A"}
    - {id: E8_supply_ovp, kind: source, source_max_v: 32.4, energy_j: 1.0, what: "PSU_MAIN regulation fault up to its own OVP trip (upper tolerance 32.4 V) before it shuts down"}
heater_shaker_interface:   # A6 (23 Nov 2026): host-side interface the planner calls for the bought USB heater-shaker at F4, specified the way the TEC controllers are (peltier_controller_choice.host_protocol).  DESIGNED; the vendor mapping is OPEN (no model chosen; no protocol invented)
  device: "SHAKER: bought heater-shaker at F4 (USB on HUB2 port 8, W-N-42; mains on the KM6-switched strip outlet 1, W-N-45; e-stop removes its power).  Purchase conditions: USB (virtual COM or HID) command interface documented by the maker, an electric labware lock with a lock-state read-back, a 'shaking' / 'speed' read-back, heater set point + actual temperature read-back, its own over-temperature cut-out, a defined state after power-up (motor off, heater off, lock open or closed: stated), and V9 (y7_ignition_sources) ignition-source conditions"
  driver: "host module retain.backends.heater_shaker (planner/software owner, not written): one class, transport chosen per vendor; every command waits for the device's acknowledgement and reads the state back; a command not acknowledged within ack_timeout_s is a LINK fault"
  commands:   # name -> parameters -> what the host does and checks
    HS_CONNECT: {params: "", does: "open the port, read model / firmware / serial, reset errors, read the full state; refuse any other command until done", reply: "STATE"}
    HS_STATUS: {params: "", does: "read state: lock (OPEN|LOCKED|UNKNOWN), motion (STOPPED|SHAKING|HOMING|UNKNOWN), speed_rpm, target_c, actual_c, heater (ON|OFF), error code", reply: "HS STATE LOCK=<..> MOTION=<..> RPM=<n> TARGET_C=<t> ACTUAL_C=<t> HEATER=<..> ERROR=<code|NONE>"}
    HS_LOCK: {params: "STATE=LOCKED|OPEN", does: "close or open the labware lock; OPEN refused unless MOTION=STOPPED (read back) ", reply: "STATE"}
    HS_SHAKE: {params: "RPM=<n> DURATION_S=<s> [MODE=orbital]", does: "refused unless LOCK=LOCKED (read back) and the firmware's F4 interlock is set (LH_SHAKER STATE=RUNNING accepted, see firmware); starts shaking; the host times the duration and calls HS_STOP; RPM within the model's range (OPEN until a model is chosen)", reply: "STATE"}
    HS_STOP: {params: "", does: "stop shaking, wait for MOTION=STOPPED (home position if the model has one) within stop_timeout_s, then LH_SHAKER STATE=IDLE to the firmware", reply: "STATE"}
    HS_TEMP: {params: "TARGET_C=<t>|OFF", does: "heater set point within 4..max of the model (protocol uses <= 95 C; OPEN); OFF = heater off", reply: "STATE"}
    HS_WAIT_TEMP: {params: "TOL_C=<t> TIMEOUT_S=<s>", does: "poll HS_STATUS until |actual - target| <= TOL_C, error on timeout", reply: "STATE"}
  states: "OFFLINE (no link) -> CONNECTED_IDLE (stopped, lock open or closed, heater any) <-> RUNNING (locked + shaking); FAULT (device error or link loss): only HS_STOP / HS_TEMP OFF / HS_CONNECT accepted until a person clears it"
  interlocks:
    gripper: "the gripper may descend at F4 (place or take a plate or a lid) only when the shaker is STOPPED and its lock OPEN: the host sends LH_SHAKER STATE=IDLE only after reading MOTION=STOPPED and LOCK=OPEN; the firmware refuses every gripper descent at F4 (and every pipette descent at F4) unless its F4 state is IDLE (_LH_PLACE_GUARD, guard cases)"
    pipette: "pipetting into a plate on the shaker only while STOPPED (same firmware state, line a)"
    shaking: "HS_SHAKE only with the lock LOCKED, the gripper not at F4 below its travel height (host checks the firmware position) and the firmware F4 state set to RUNNING first (LH_SHAKER STATE=RUNNING), so a gripper or pipette descent is refused for the whole shake"
    lid: "a sealing lid or plate lid on the plate during shaking or heating is a protocol choice (the planner's closure model); the gripper puts it on or takes it off only in IDLE; the TC-1 lid is unrelated"
    ethanol: "heating or shaking during an open ethanol step is allowed only if the chosen model passes the V9 ignition-source review (competent person); until then the planner must not overlap them (planner rule, OPEN)"
  on_estop: "KM6 removes the shaker's mains (it stops; heater off); its lock state after power loss is the maker's (OPEN item); Klipper shuts down and loses the F4 state (UNKNOWN after restart): the host must reconnect, read MOTION=STOPPED, then declare IDLE"
  on_link_loss: "host: no acknowledgement within ack_timeout_s or the port closes -> FAULT; the host stops issuing gripper/pipette work at F4 and leaves the firmware F4 state RUNNING (or UNKNOWN) so descents there stay refused; the device keeps its last command (most heater-shakers have no communication watchdog: OPEN per model) - the shake ends at the host-timed stop only if the link returns, so a run with a running shaker and a lost link needs a person (e-stop removes its power)"
  on_host_loss: "as link loss; Klipper keeps the F4 state; the TC-1 watchdog does not cover the shaker"
  firmware_side: "no electrical interlock input (the bought device has no contact output; F4 has no place connector).  Firmware: [gcode_macro LH_SHAKER] STATE=IDLE|RUNNING (host-declared, UNKNOWN after every restart) and _LH_PLACE_GUARD refusing descents at F4 unless IDLE.  This is a SOFTWARE interlock declared by the host, not a safety function; a model with a lock/running contact could feed a reserved io input later"
  timeouts: {ack_timeout_s: 2.0, stop_timeout_s: 15.0}
  vendor_mapping: "OPEN: no heater-shaker model is chosen; each command above maps to the chosen maker's documented protocol when it is bought.  Nothing here is a vendor command."
host_commands_not_in_klipper:
  LH_THERMAL_TCB_PROTOCOL: "retired with TCB-1 (ADR-003): the host now talks MeCom to TEC_TC and TEC_COLD and sends LH_THERM_* / LH_LID_* / LH_HEARTBEAT to Klipper"
  LH_MAGNET: "removed (revision F, keepouts K15): magnet steps are gripper moves onto the passive block MB-1; klipper_link.py no longer emits it (it raises for a lift-mode magnet step); check.py warns if it is emitted again"
  LH_BLOCK_TEMP: "removed from printer.cfg (review A12): thermal set points go only to the TEC controllers over USB (MeCom); klipper_link.py no longer emits it (check.py fails if it is emitted again or redefined)"
