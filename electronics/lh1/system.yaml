      - "the in-row move of the empty carriage at s 307 (CAD exchange steps) with the CAD headroom 'Z clearance over the dock (no tips) 7.4 mm < 8 (LOWER)': taken as the CAD's sequence; the CAD to confirm that move's clearance over the parked tools' studs"
