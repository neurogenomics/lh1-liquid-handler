  cad_figure: "CAD mechanism audit: 128 N at 0.7 A and 5 mm/s (sourcing curve) vs 80 N x 1.5: margin 1.6; homing 0.50 A <= 0.57 A: PASS"
dock_lift:      # ADR-014 #2 (electrical owner 23 Nov 2026): the drive the force audit's latch-release row stands on
  cad: "head report dock_bay.dock_lift: one bar under all eight bays, NEMA17 48 mm + integrated Tr8x2 screw with anti-backlash nut (the Z axes' motor and screw class, UNVERIFIED part) at the row's LEFT end, two D8 shafts in LM8UU bushings hung under the bar, stroke 50 mm (47.1 needed: roller rise 31.1 + 13 follow + 3 gap), 5 mm/s, run 1.3 A, home = optical slot sensor at bar DOWN (broken wire = not home), OPEN-height roller-lever switch from 33.1 mm (family dock_lift)"
  driver: "TMC5160 SPI stepstick (BTT TMC5160 class with external MOSFETs, >= 2.5 A rms, VM >= 48 V: PURCHASE CONDITION, UNVERIFIED part) in the main Octopus Pro socket 6 (STEP PE2, DIR PE3, EN PD4, CS PE1, spi1); MOTOR_POWER = MOTION_G (F21, after KM1-KM4: the e-stop and the door remove it); DIAG jumper 6 removed (it would short onto STOP_6 = PG14, servo alarm X)"
