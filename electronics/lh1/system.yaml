      "34": ["THERM coil chain feed: TS_BLOCK -> TS_SINK -> TS_LID -> WDOG contact -> KM5 coil and TC_RELAY coil (W-S-29)"]
      Y32: ["reset lamp (W-S-11)"]
    shared_by_design:
      S12: "manufacturer's wiring (manual 21396-EN-23 p.15): the start/feedback loop runs from S12 through the feedback contacts and the reset button S3 to S34; S12 is also the end of input channel 1. Two conductors under one terminal (or a bridge from a feed-through terminal) as the manual draws it; not a fault."
    feedback_loop: [KM1, KM2, KM5, TC_RELAY, TB_RELAY, KM6, RESET_PB]
    allowed_terminals: [A1, A2, S11, S12, S21, S22, S34, "13", "14", "23", "24", "33", "34", "41", "42", Y32]
  SR2:
    part: "Pilz PNOZ s4, 24 V DC, 3 n/o 1 n/c, 750104"
    settings: "dual-channel safety gate WITH detection of shorts across contacts; automatic start WITH feedback loop (assessor to confirm automatic start is acceptable for the door)"
    manual: "21396-EN-23 pp.13-15"
    terminals:
      A1: ["24V SAFE (W-S-02)"]
      A2: ["0V (W-S-02)"]
      S11: ["door sensor channel 1, end 1 (W-S-17)"]
      S12: ["door sensor channel 1, end 2 (W-S-17)", "feedback loop out: KM3 21 (W-S-23)"]
      S21: ["door sensor channel 2, end 1 (W-S-17)"]
      S22: ["door sensor channel 2, end 2 (W-S-17)"]
      S34: ["feedback loop in from KM4 22 (W-S-25)"]
