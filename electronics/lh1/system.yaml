safety_assessment:
  status: "NOT ASSESSED. No electrical safety assessment has been done. The machine must not be used (beyond supervised, low-voltage bench bring-up of individual boards from a current-limited bench supply) until a competent person has assessed it."
  standards_to_consider: "IEC/EN 61010-1 (laboratory equipment) with 61010-2-081 (automatic lab equipment) and 61010-2-010 (heating); EN ISO 13849-1/-2 for the e-stop and door functions (target PL d, Cat 3); EN ISO 13850 (e-stop); EN ISO 14119 (interlock, defeat resistance); EN 60204-1 where machinery rules apply; EN 61326-1 (EMC); UK PSSR / Supply of Machinery and Electrical Equipment (Safety) Regulations for placing in service."
  must_cover:
    - "mains: inlet, fuse rating and breaking capacity, switch rating, terminal wiring to both supplies, PE conductor sizes, strain relief, creepage of the inlet installation, earth continuity (< 0.1 ohm inlet PE pin to every exposed conductive part incl. door, panels, deck, gantry), insulation resistance and earth-leakage tests (two supplies' Y-capacitors summed), PAT/in-service test regime"
    - "SELV: both supplies' certification and their separation; decide SELV (0 V floating, as drawn) or PELV (0 V bonded to PE at one point: cable W-PE-0V reserved); touch current"
    - "e-stop and door: PL verification (SISTEMA or equivalent) for SR1+KM1/KM2 and SR2+KM3/KM4, contactor DC-1/capacitive making ratings, feedback loops, reset behaviour (manual for e-stop; automatic for the door must be justified), stop category (0), defeat resistance of the door sensor, response time vs the 590 mm/s-class gantry speed and finger access, whether the single TC-1 relay plus TCB1 SAFE input is adequate for the thermal energy removal"
    - "overcurrent: every fuse protects its cable (check.py), selectivity, short-circuit current of the supplies vs DC breaking capacity of fuses and contactors"
    - "thermal: touch temperatures (TC-1 block 98 C, lid 105 C with 130 C cut-out, sinks), thermostat placement and ratings, fire enclosure for the heater and TEC circuits (61010-1 clause 9), cabinet temperature rise with the PSUs at load"
    - "mechanical hazards on loss of power (self-locking Z and gripper verified by drop test), pinch points of the TC-1 lid (force-limited, break-beam), guards and labels"
    - "EMC and functional: CAN/USB immunity with the steppers running, the Klipper shutdown on every door opening"
family:     # size family (ADR-011; electrical owner 20 Nov 2026).  CALCULATED / DESIGNED; nothing built or measured.
  # Authority: cad/lh1/machine_family/out (cr_answers.json, <size>/family_<size>.json, <size>/report.json, kits.json).
  # Same in every size: control compartment and everything in it (supplies, boards, contactors, relays, fuses, hubs),
  # head, gantry, dock, drawer, extraction, firmware core.  Differs: Y travel and dock row (size file), row-G and row-D
  # devices (back section, through the connector plane CPL-F), the module places of row D (L), the H2 shutter (M, L).
  build_size: S                    # the size being built: printer.cfg includes lh1_size_S.cfg; wiring.csv / electrical_bom.csv are for S
  firmware_structure: "printer.cfg = shared core + [include lh1_size_<S|M|L>.cfg] (last line); the size file holds [stepper_y] position_max, [gcode_macro _LH_SIZE] (size, y_max, dock_yf, dock_zone_yf, dock_exit_yf, places, carriage_only, stations) and the row-D SAFE inputs (L) and the H2 shutter (M, L); an upgrade changes the include line.  electronics/lh1/fw_config.py resolves it as Klipper does (out/firmware_resolved_<size>.cfg)."
  corrected_values: {noz_dy: "-73.5 -> -102.5 (CAD tool_carriages nozzle_dy_from_beam_front_face)", dock_yf: "545.5 -> S 354.5 / M 464.5 / L 574.5 (CAD dock 'printer_y_over_the_bays')", dock_zone_yf: "480 -> 260 / 370 / 480", dock_exit_yf: "450 -> 230 / 340 / 450", y_travel: "-230..592 -> -219..372 / 482 / 592", x_travel: "-311..465 -> -328.5..465"}
  cable_length_tolerance: "+/-20 %: device positions from the family CAD where it models them (compartment, plates, chains, duct, rail, connector plane, deck places, dock, head axes), the rest the electrical owner's placement; route = Manhattan legs through the waypoints x 1.10 + 200 mm terminations, rounded up to 50 mm; cut long and trim on the machine.  Cables through the Y chain are cut for L in every size."
  syringe_tool:
    decision: "RE-ARMED as an OPTIONAL tool.  The CAD redesign (cr_answers open_question_syringe_stroke) drives a 10 mL luer-lock syringe DIRECTLY from the pusher, plunger travel = pusher travel, inside the 35 mm stroke: the 60 mm disagreement is gone.  Armed in _LH_TOOLDEF, but every pipetting macro refuses SYR until _LH_TOOLDEF commissioned SYR = 1 is set after the rig tests (guard cases).  21 Nov 2026: stroke 28 -> 32 mm and a 3 mm SYR contact window, from the CAD syringe_tool block."
    stroke_mm: 32.0
    contact_window_mm: 3.0
    why_32: "CAD syringe_tool: contact window 3 mm (lock-nutted M4 stop screw in the pusher pad, set with a 3 mm gauge at the bench) + plunger travel 32 mm = the 35 mm pusher stroke, no margin: the firmware holds (HOLD CONTACT) a SYR whose contact is found beyond 3 mm (_LH_TOOLDEF contact_hi_tool), so the blow-out never asks the pusher past 35 mm.  32 mm x 165 mm2 (14.5 mm bore ASSUMED) = 5.28 mL per fill (CAD); first stop 31.5 mm = 5.2 mL largest dispense"
    table: {first_stop_mm: 31.5, blowout_mm: 32.0, ul_per_mm: 165.1, vmax_ul: 5200, takes_tips: false, contact_hi_mm: 3.0}
    open: "return spring (CAD 23 Nov 2026, modelled in 3D): 1.5 x 20 x 75 stainless compression spring, 7.4 N plunger-out (6.7 N at -10 % rate) against about 4 N seal friction + check valve: margin 1.85 (1.66 low tolerance), 23.2 N at full stroke; ASSUMED class, UNVERIFIED: the rig must prove that the plunger follows the pusher up and measure the friction (CT-SYR); the 3 mm window leaves no stroke margin: the stop-screw setting is a commissioning check"
    force: "pusher (LGA351S12-A-UIAP-038) at 0.7 A about 128 N at 5 mm/s (maker's curve scaled, INFERENCE) >= 80 N x 1.5 (margin 1.6); never faster than 5 mm/s.  The return spring's own margin (1.3, mechanism audit) is NOT a drive matter: the pusher only pushes; the firmware detects a plunger that did not follow (HOLD SYR_NOT_FOLLOWING after every fill); the CAD's stiffer spring (7.4 N) now passes the audit at 1.85"
  carriage_b_only: "S and M: the 1,000 uL tips are in the person-loaded shelf rack IG, which only carriage B may serve (CAD planner rule).  Firmware: _LH_SIZE carriage_only {ig: [x, y, half, half, [b]]}; _LH_PLACE_GUARD refuses carriage A over it for MANUAL_STEPPER descents and LH_PICK_TIP (CARRIAGE_ONLY).  L: the rack is at D0 on the deck, reached by both carriages: no rule."
  ffc_check:
    verdict_B: "ADR-014 (23 Nov 2026), pusher = Nanotec LGA351S12-A-UIAP-038 (1.2 A winding) run at 0.7 A rms ONLY: carriage B's 20-way 0.5 mm FFC carries each phase on two ways, 0.35 A rms = 0.495 A peak per conductor (stepper phase current is a sine; the driver setting is rms).  The 0.35 A per conductor is an RMS figure, compared with the conductor's and the ZIF contact's CONTINUOUS (thermal) class rating of 0.5 A: 70 %, ACCEPTABLE.  If the cable or ZIF bought publishes only a PEAK rating, the peak counts: 0.495 A = 99 % of 0.5 A, NOT acceptable (80 % rule); then buy parts with a continuous rating >= 0.44 A or a peak rating >= 0.62 A per conductor (the purchase condition that REPLACES 'winding rated <= 1.0 A', which no longer holds: plunger_motor.purchase_condition).  At the 1.2 A rating (never set: printer.cfg run_current pinned, SET_TMC_CURRENT refused) it would be 0.6 A rms per conductor = 120 %.  Drop about 0.5 V per phase loop (2.2 % of 24 V).  All 20 ways are used (none spare); the latch ladder needs no new way.  Every FFC and ZIF figure is UNVERIFIED until the parts are chosen."
    verdict_gripper: "gripper 12-way 0.5 mm FFC: 0.35 A rms per conductor (motor not doubled) = 70 % of a continuous rating (0.495 A peak = 99 % if only a peak rating were published: same purchase condition); 4 ways spare"
    verdict_A: "carriage A 20-way 1.0 mm FFC: the LGA35 at 0.7 A rms on one way per phase = 70 % of a 1.0 A continuous class rating (0.99 A peak = 99 % if only a peak rating is published: buy a continuous rating >= 0.875 A or a peak rating >= 1.24 A); one way spare"
