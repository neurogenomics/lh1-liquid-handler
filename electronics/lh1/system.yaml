    - "head drives: keep the two bought MMB CAN V2.0 boards on the carriage plate (6 motors in 8 sockets: 2 spare); every switch, Hall sensor and the pusher of a carriage is on the carriage; NO electrical contact through the coupling and no board on a tool (ADR-010: Klipper cannot hot-plug an MCU)"
