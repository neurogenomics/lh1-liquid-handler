  F36: {fuse_a: 1.0, note: "V8 (23 Nov 2026): T1A 5 x 20 fuse terminal on rail E between SR1 34 and the TC-1 coil chain (W-S-29 -> W-S-30..33): the 0.25 mm2 chain leads W-S-31/32 through the TC-1 lid chain (Iz 1.6 A) sit below F6 2 A; chain load 0.4 A (KM5 + TC_RELAY coils); open fuse = THERM off (fail-safe)"}
  F32: {fuse_a: 16.0, note: "DIN fuse terminal 6.3 x 32 mm 16 A on the THERM side of TEC_TC (13.2 A input): protects the 2.5 mm2 feed into the controller's terminal-block plug"}
  F31: {fuse_a: 5.0, note: "DIN fuse terminal 5 x 20 mm on the THERM side of LID_SSR (lid heater 3.7 A max): re-instated now that TCB-1 no longer fuses its lid output"}
therm_switch:
  part: "contactor with a mirror NC auxiliary (IEC 60947-4-1 Annex F), DC-rated: >= 40 A make/break at 32 V DC with the maker's series-pole DC connection (e.g. Siemens 3RT2026 3-pole with poles in series; verify DC-1 table), 24 V DC coil <= 0.2 A (electronic/economised coil); same part for TC_RELAY, TB_RELAY and KM5; TC_RELAY and TB_RELAY need TWO mirror NC auxiliaries (one for SR1's loop, one read by the Octopus)"
  coil_hold_a: 0.2
  coil_switch: "TC_RELAY coil return through the Octopus heater output HE1 (MOSFET rated 10 A class; 0.2 A coil with the contactor's plug-in suppressor); TB_RELAY coil to 0 V directly"
  break_a_at_32vdc: 40.0
  why: "the TC report's automotive relay is typically rated 30-40 A at 14 V and about 20-30 A at 28 V DC (24 V-system ratings); an LRS-600 into a short delivers up to about 34 A (overload 105-135 %) before F5/F4 clear, and THERM normally breaks 16.3 A of partly inductive load (LC filter): a DC-rated contactor makes the break rating explicit. One part for both THERM switches."
psu_short_circuit_a: 34.0
conductor_protection:   # V8 (verification 21 Nov 2026): fuse vs conductor, recomputed by check.py conductor_protection every run
  basis: "IEC 60204-1:2016 Table 6 class figures (PVC-insulated copper, 70 C conductor, 40 C ambient, installation method B2: cable / single cores in a duct or trunking on a wall), the electrical owner's reading of the table: competent person to confirm.  The compartment runs about 5-10 K above room air (control_bay air), i.e. <= 40 C in a 30 C lab: no further temperature factor."
  iz_table_a: {0.75: 6.8, 1.0: 9.6, 1.5: 12.2, 2.5: 16.5, 4.0: 23.0, 6.0: 29.0}
  factor_fixed: 1.0               # cabinet wiring in ducts, static runs (B2 already assumes the duct)
  factor_chain: 0.8               # cables in drag chains / bundled moving looms: 0.8 (chain-maker derating practice for a filled chain, ASSUMED)
  small_gauge_factor: 1.0         # below 0.75 mm2 Table 6 gives no figure: the cable_types ampacity class, which is already a bundled 40 C figure (cable_types.yaml header)
  supply_limit_a: {PSU_MAIN: 30.0, PSU_TC: 30.0, PSU_AUX: 30.0}   # LRS-600-24 overload trip about 105-130 % of 25 A (UNVERIFIED): feeders to the first fuse are short runs
  rule: "fuse rating In <= Iz of every conductor it protects (IEC 60204-1 7.2 / IEC 60364-4-43 433); no short-run exemption is claimed for fused branches"
  changes_23nov: "F21 (10 A) no longer feeds the motor leads directly: per-motor fuse terminals F25 (X, 4 A, 0.75 mm2 chain lead, Iz 5.4 A), F26 (Y right, 4 A, 1.0 mm2, Iz 9.6 A), F27 (Y left, 4 A); F21 10 A now protects only the 1.5 mm2 MOT_G feed and the Octopus MOTOR_POWER lead (Iz 12.2 A).  MOTION path W-P-06..10 1.5 -> 2.5 mm2 (F2 16 A, Iz 16.5 A).  THERM_AUX path W-P-14..16, W-P-27, W-K-16 2.5 -> 4 mm2 (F4 20 A, Iz 23 A).  THERM path W-P-34/35/41/42 4 -> 6 mm2 (F5 25 A, Iz 29 A); KM5 and TC_RELAY main terminals must take 6 mm2 (purchase condition).  Lid-heater leads W-T-02/W-T-20 in the TC-1 chain 0.5 -> 0.75 mm2 (F31 5 A, 3.7 A load; 0.5 mm2 in a chain: Iz 4.8 A < 5 A).  TC-1 coil-chain leads W-S-31/W-S-32 in the TC-1 chain 0.25 -> 0.5 mm2 (F6 2 A; 0.25 mm2 in a chain: Iz 1.6 A)."
options:
  magnet_lift:
    status: "documented OPTION, not built (revision F: passive magnet block MB-1 in B2)"
    hardware: "NEMA17 34 mm with integrated T8 2 mm lead screw (MM-2/MM-3 module); slotted optical home (3-wire); Octopus Driver2 socket (TMC2209 UART PC6); its old home input STOP_2 (PG10) is taken by the all-tools-up chain: the option would need another free input"
    wiring: "Octopus M2 -> motor: MC4_025 4 x 0.25 mm2, about 0.9 m under the deck; STOP_2 (S, G, V) -> optical home: MC3_025, about 0.85 m (choose an output that reads 'home' on a dead sensor only if homing goes AWAY from the hard stop)"
    firmware: "[manual_stepper magnet_lift] step PF11, dir !PG3, enable !PG5, rotation_distance 2, endstop: a free input (NOT PG10: STOP_2 now reads the all-tools-up chain), position 0..25; [tmc2209] uart PC6 run 0.5 hold 0.3; LH_MAGNET STATE=ENGAGED|RELEASED PLATE=FULL|SEMI (25 / 20 mm); home it in homing_override after the plungers"
    load: "MOTION 0.5 A on F21"
interlocks:
  tools_up_chain: [Z_UP_A, Z_UP_B, Z_UP_GRIP]     # series order, LOG7 -> ... -> ZC (check.py, check_adr003.py)
  lid_needs_all_tools_up:
    type: HARDWARE (bought relays), plus firmware refusals
    how: "LOG7 (+24 V, F7) -> THREE Z_UP roller-lever NO contacts in series (carriage A, carriage B, gripper axis; rev L) through the Y and X chains -> chain end ZC: (a) K_CH coil -> 0 V (its NO contact reads the chain on the Octopus PG10); (b) beam receiver TC_BEAM_RX supply; the receiver's PNP light-ON output -> K_TU coil -> 0 V.  K_TU (Finder 7S.12, forcibly guided, EN 61810-3 type A) NO 13-14 switches the lid drivers' supply from F23; its NC 21-22 (mechanically linked to the NO) is read back on the Octopus PB6.  So the lid drivers have power only while every tool is up AND the beam is clear AND the receiver is alive; a broken wire anywhere drops K_TU."
    single_faults:
      broken_chain_or_coil_wire: "K_TU (and K_CH) drop: lid unpowered, PG10 reads 'not all up': safe, visible"
      Z_UP_switch_stuck_open: "same as a broken wire: safe, visible"
      Z_UP_switch_or_chain_shorted: "chain reads closed with a tool down: NOT detected by the gate (same as before); the firmware also tracks every Z position (G0/MANUAL_STEPPER) and refuses lid commands unless each tracked Z is 0; residual"
      K_TU_contact_welded_NO: "detected before every lid move: the beam self-test switches the emitter OFF, which must drop K_TU; with a welded NO the forcibly guided NC cannot close, PB6 keeps reading 'gate on' -> LH_LID refuses (GATE_WELDED) and the lid stays stopped"
      K_TU_coil_open_or_relay_dead: "lid unpowered: safe, visible (LH_LID refuses GATE_OPEN)"
      beam_receiver_output_stuck_on: "detected by the same emitter-off self-test (gate stays on with the emitter off): BEAM_SENSOR"
      beam_receiver_dead_or_emitter_dead: "gate never closes: safe, visible"
      K_CH_contact_welded: "PG10 reads 'all up' with a tool down: the XY guard falls back on position tracking (as for a shorted chain); the lid gate itself is unaffected (K_TU is in the chain); residual, also listed in z_home_failsafe"
      PB6_input_or_wire_fault: "PB6 broken wire reads 'relay off' (pull-up, NC closed reads low): the self-test then fails (gate never reads on): safe"
    replaces: "TCB-1 J25 + OR gate U8 (retired) and the diode tap to PG10"
    why_not_the_home_switches: "the KW10 home switches are single-pole inputs to MMB_A; one contact cannot serve a firmware input and an isolated series chain (CAD request CR-16, closed)"
    chain_current: "K_CH 10.4 mA + receiver about 30 mA + K_TU coil 38.2 mA = about 79 mA through three roller levers (rev L): within the D2F-01 0.1 A at 30 V DC rating (micro-load gold version needed for the low current; check the variant bought)"
  tools_down_over_c1_needs_lid_parked:
    type: FIRMWARE (Klipper on the Octopus), not hardware
    how: "lid PARKED micro switch on Octopus PG13; G0/G1/MANUAL_STEPPER overrides refuse any Z move that would put a tool below z 129 (keepouts K1) in the TC-1 zone x -270..-60 (K2 extended 15 mm for the rev L lid strip), y -10..230; lowest point = nozzle top (L_NOZZLE_TOP_Z) - tip length - stroke, per mounted tool unless PG13 is made"
    why_not_hardware: "a hardware gate would need a head-position sensor over C1 (cam/flag on the gantry) feeding the Z driver enables on two CAN boards; the MMB enable pins are MCU-controlled and the head is on CAN, so the gate would have to cut each Z driver's VM or EN through a relay on the carriage. Not practical in this revision."
    remains_software_only: "the position of the head (where 'over C1' is decided) comes from Klipper's kinematic position; a lost step or a wrong homing defeats it. The lid side IS hardware (K_TU), so the remaining software-only case is a tool being lowered into the lid's path while the lid is already parked open: no lid motion is possible then without the chain closed."
