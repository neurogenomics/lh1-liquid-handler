  not_verified:    # distributor listings or not opened: each is a purchase condition / commissioning check
    - "Leadshine DM542 class minimum current, enable polarity, 3.3 V logic (we use 5 V level-shift breakouts), over-voltage behaviour"
    - "Omron E3T-ST13: PNP light-ON 12-24 V, 50 mA output, 1 ms (distributor listings only; Octopart even lists it as NPN dark-ON): CHECK the label of the part bought; a receiver with output current < 40 mA cannot drive K_TU"
    - "Finder 38.51.7.024.0050 coil current (10.4 mA distributor; 9.4 mA in an older Finder table)"
    - "Omron EE-SX67x slot sensors and EE-1006 leads; D2F-01 variants with factory leads (no leaded D2F found: switch tabs keep two solder joints each, or use the D2F with a pre-crimped 2.8 mm receptacle lead where the tab allows)"
    - "Red Lion 6HBWDOG1 relay POLARITY: the data sheet says the relay ENERGISES when the heartbeat stops, a manual excerpt says it is de-energised without a heartbeat. The wiring uses whichever contact OPENS on loss; LH_THERM_ON proof-tests it every time (a wrong contact or an unpowered watchdog fails the test). Also unverified: whether it re-arms by itself when the heartbeat resumes (if it latches, THERM stays off: safe, visible). Price not seen."
    - "Meerstetter communication watchdog scope (whole device, not per channel: assumed from the error model) and its default after a firmware update"
    - "screw-terminal HX711 boards for the rig (generic listings only)"
    - "XT30(2+2) pre-made 0.15 m leads (BTT supplies one with each MMB/EBB kit; length to confirm)"
  peltier_controller_choice:
    need: "TC-1 block: two Peltiers in series, string R 1.588 ohm, alpha 0.103 V/K, 13 A limit (TCB-1 config tec_i_limit_a), ramp limit 3 C/s, 4-99 C, NTC 10k B57861S; cold blocks C3, F3: two TEC1-12706 in series each (deck CAD), 3.5 A / 18 V limit, 4-50 C, NTC 10k"
    chosen: "Meerstetter TEC-1163-TB for TC-1 (comm watchdog ON) + TEC-1166-TB for C3/F3 (comm watchdog OFF): true bipolar current sources (no PWM on the Peltiers), NTC with Steinhart-Hart, object + sink error limits that switch the output off, ramp control, USB, openly documented MeCom protocol with an MIT Python package; CHF 485 + 619 = CHF 1104 ex VAT (about GBP 970 at 0.88) incl. TB plugs CHF 7 each"
    compared:
      - {line: "Meerstetter TEC-1123 (2 x 16 A / 30 V)", price: "CHF 897 (1 pc)", verdict: "review's pick; maker marks it 'not recommended for new designs'; one device could not give TC-1 'off on comm loss' and the cold blocks 'hold' at the same time (watchdog is device-wide)"}
      - {line: "TE Technology TC-36-25-RS485 (1 x 25 A, 12-36 V)", price: "US$796 (1-9 pcs), RS485 adapter US$105", verdict: "meets current and supply; NO comm timeout (the host watchdog relay would be the only host-loss layer for TC-1); PWM H-bridge at full rail voltage (TEC1-12706 Vmax 15.2 V needs the output multiplier); three units for three zones = US$2388: not chosen"}
      - {line: "TE Technology TC-24-10 (10 A, <= 26 V)", price: "US$197 (out of stock)", verdict: "cheaper class; 10 A < 13 A for TC-1; communication interface not listed: could serve a cold block only; not chosen"}
      - {line: "generic 'TEC-8A-24V PID' RS232 boards", price: "not seen (page redirected)", verdict: "protocol and fault behaviour undocumented: not acceptable for the thermocycler"}
    cold_blocks_shared_channel: "NO.  Series string on one channel: one control sensor, the other block runs uncontrolled; unequal loads (different labware, lid open/closed, one fan failed) give different temperatures; each block is already a 2-module string (about 16 V + alpha dT at 4 A); two blocks in series would need about 40 V, far above the 24 V rail; a failed fan on one block is not seen by the channel until that block's KSD9700 opens.  Parallel: 8 A on one channel (> TEC-1166's 5 A).  So one channel per block on TEC-1166 (CHF 619 vs 379 for a single TEC-1162: CHF 240 for independent control, sink monitoring and error shutdown per block).  Both blocks keep their own 72 C fuse and 70 C KSD9700 in the shared TB_RELAY coil chain (either over-temperature switches both off: accepted, low energy)."
    host_protocol: "MeCom over USB (FTDI virtual COM).  Host needs: set Target Object Temperature, read Object Temperature and Sink Temperature, Output Stage Enable (Live ON/OFF), Device Status and Error Number, Reset Device; parameters configured once with the maker's service software and saved to flash: current limit (13 A / 4 A), voltage limit (24 V / 18 V); cold current limit 3.5 A, NTC Steinhart-Hart coefficients, object/sink error thresholds (TC-1: 102 C block, 60 C sink, max change 6 C/s; cold: 55 C, 60 C), Coarse Temp Ramp 3 C/s (TC-1) / 1 C/s (cold), Communication Watchdog Timeout 10 s on TEC_TC and 0 (off) on TEC_COLD, output enable mode 'Live' on TEC_TC (off after power-up) and 'Static ON' on TEC_COLD (resumes after power-up).  Parameter IDs from the protocol document 5136 / pyMeCom commands.py (software owner to confirm)."
  safety_functions:    # function -> bought part(s) -> each single fault
    - function: "e-stop removes motion, heater and Peltier power (logic stays)"
      parts: "SR1 PNOZ s4 + KM1/KM2 (MOTION, THERM_AUX) + KM5/TC_RELAY (THERM, via SR1 34 coil chain)"
      faults: "unchanged: welded contactor -> mirror open -> SR1 refuses reset; channel short -> PNOZ cross-fault detection"
    - function: "door stops motion including the TC-1 lid"
      parts: "SR2 + KM3/KM4; lid drivers on MOTION (F23 -> K_TU)"
      faults: "unchanged"
    - function: "independent over-temperature cut, TC-1"
      parts: "KSD301 110/75/130 C in the TC_RELAY + KM5 coil chain"
      faults: "thermostat welded: second layer TEC_TC object/sink error shutdown + Klipper verify_heater (lid); open: heat off, visible"
    - function: "independent over-temperature cut, cold blocks C3, F3"
      parts: "72 C TCO + KSD9700 70 C per block in the TB_RELAY coil chain"
      faults: "one device welded: the other device and TEC_COLD error limits remain"
    - function: "welded THERM contactor detected"
      parts: "TC_RELAY + KM5 mirror NCs in SR1's loop; TC_RELAY mirror 2 read on PF4 after every off (LH_THERM_OFF, weld check 0.3 s)"
      faults: "weld while on: found at the next off (latched RELAY_WELDED, M112); PF4 wire broken: reads 'on' -> weld check fails -> heat refused (safe)"
    - function: "host loss stops TC-1 heat (A12d)"
      parts: "WDOG (Red Lion 6HBWDOG1) contact in the TC-1 coil chain; heartbeat toggled by Klipper on FAN1 only while LH_HEARTBEAT arrives; plus TEC_TC MeCom watchdog"
      faults: "host dead / Klippy dead / Octopus dead or reset / FAN1 output stuck high or low: no edges -> trip; WDOG unpowered, wrong contact or welded: caught by the proof test at every LH_THERM_ON (heartbeat paused for timeout + 1 s, TC_RELAY must drop); WDOG fails between proof tests: TEC_TC's own comm watchdog still stops the block (not the lid heater: Klipper's max_temp/verify_heater remain while Klippy runs)"
    - function: "all-tools-up hardware gate on the lid motors (A12b)"
      parts: "Z_UP chain + beam receiver + K_TU forcibly guided relay in the lid drivers' supply; K_CH for status"
      faults: "see interlocks.lid_needs_all_tools_up.single_faults (welded K_TU detected by the emitter-off self-test before every move)"
    - function: "lid beam stops the lid"
      parts: "E3T through-beam pair; receiver output IS the K_TU coil drive"
      faults: "receiver output stuck on: self-test BEAM_SENSOR; dead: lid cannot move (safe)"
  lid_rules_carried_over:   # firmware/tcb1/lid.py and core.py -> printer.cfg LH_LID_* (all refusals checked by fw_render_check.py)
    - "no lid motion unless the all-tools-up chain is closed: HARDWARE (K_TU) + firmware (tools_up PG10, every tracked Z at 0) -> TOOLS_DOWN"
    - "gripper clear: the gripper Z must be up and the gripper state known -> TOOLS_DOWN / GRIPPER_UNKNOWN"
    - "door closed (door input) -> DOOR_OPEN"
    - "beam self-tested before every slide or clamp move: emitter off -> gate must drop (else BEAM_SENSOR or GATE_WELDED), emitter on -> gate must be on and stay on for 0.2 s (else OBSTRUCTION)"
    - "slide/clamp-down are counted moves to a known position; the end sensor must then be active -> LID_STALL / CLAMP_TIMEOUT; lid left where it stopped"
    - "obstruction during a move: the beam drops K_TU (motor supply cut in hardware); the end sensor is missed and the gate reads off -> OBSTRUCTION"
    - "implausible sensor pairs (open AND closed, up AND sealed) -> LID_SENSOR"
    - "position unknown -> refused until LH_LID_HOME (slow, toward OPEN on the open sensor)"
    - "any lid fault latches until LH_LID_CLEAR"
  lid_rules_not_carried_over:
    - "hardware stop within one microstep of the beam breaking: now the beam removes the drivers' supply through K_TU (relay drop-out about 10 ms + coast; at 40 mm/s about 0.4 mm on the slide; the clamp's lead screw is self-locking)"
    - "after an OBSTRUCTION during clamp-down the TCB raised the clamp to release a trapped object: impossible while the beam is blocked (K_TU unpowers both drivers); the beam stops the clamp before the plate plane, so nothing is trapped by the clamp; the person clears the beam, LH_LID_CLEAR, then LH_LID_OPEN raises the clamp"
    - "warm the block to 15 C before opening after a cold hold (condensation): moved to the HOST (it reads the block temperature from TEC_TC) - Klipper cannot see the block temperature"
    - "block above 45 C only with the lid sealed (unsealed_max_c), lid-opened-during-run fault: moved to the HOST (it owns TEC_TC); Klipper refuses LH_LID_OPEN while the lid heater is above 45 C target unless FORCE=1"
    - "fan tachometer fault: not monitored (fans always on; the 75 C sink KSD301 and TEC_TC's sink error are the backstops)"
    - "ambient NTC: dropped (it served TCB-1's model checks only)"
