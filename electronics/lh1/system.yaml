  maker_curve_n_at_1p2a_24v: {"1.4": 240.8, "3": 232, "5": 220, "7": 210, "10": 165, "12.5": 140}   # sourcing file: 240.8 readout, the rest read off the curve image (INFERENCE)
  scaled_n_at_0p7a: {"2": 140, "5": 128, "8": 115}                                                   # x 0.7 / 1.2 (INFERENCE; rig CT-0d measures it)
  # the force audit (cad/lh1/machine_family/mechanisms.py pusher_model) reads the four fields below as a thrust model:
  # F = 2 pi x efficiency x holding_torque x I/I_rated x torque_at_speed_fraction / lead.  holding_torque_nm is an EQUIVALENT
  # back-solved so the model gives the maker's 220 N at 1.2 A and 5 mm/s (0.6 x 0.35 kept from the earlier model): NOT the
  # motor's catalogue holding torque (not published for this part).  At 0.7 A the model gives 128.3 N (sourcing curve: 128 N).
  holding_torque_nm: 0.1016
  torque_at_speed_fraction: 0.6
  efficiency: 0.35
