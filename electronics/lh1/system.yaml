      S21: ["E-STOP NC2 contact, end 1 (W-S-04)"]
      S22: ["E-STOP NC2 contact, end 2 (W-S-04)"]
      S34: ["start/feedback loop in: reset button S3 (W-S-09)"]
      "13": ["24V SAFE contact feed (W-S-12)"]
      "14": ["KM1 coil A1 (W-S-13)"]
      "23": ["24V SAFE contact feed (W-S-12)"]
