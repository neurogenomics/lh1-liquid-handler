  force_needed_n: 80.0             # largest tool SYR 80 N (incl. return spring), S1000 60 N (head_l TOOLS)
  margin: 1.5
  lead_mm: 0.6096                  # printer.cfg rotation_distance (check.py pins it): 328.08 full steps/mm, 5249.34 microsteps/mm at 1/16
  stroke_mm: 38.1
  soft_limits_mm: [0.5, 37.5]      # CAD, actuator stroke: the RETRACTED switch trips 0.5 mm before the internal stop; firmware 0 = the switch, so 0 .. 37.0
  rated_current_a: 1.2
  run_current_a: 0.7               # 0.7 A rms ONLY (driver setting pinned by check.py; SET_TMC_CURRENT refused for the host)
  hold_current_a: 0.35
  home_current_max_a: 0.5          # CAD: homing <= 0.50 A ...
  end_stop_current_max_a: 0.57     # ... and never into the internal end stop above 0.57 A (Nanotec LGA35 commissioning note, this thread)
  home_speed_max_mm_s: 2.0
  force_speed_max_mm_s: 5.0        # mechanism audit: 128 N at 5 mm/s (margin 1.6); 115 N at 8 mm/s (1.44): every pusher move <= 5 mm/s
