      - "'the H1 hand-off is closed on S' (published planner list) vs the S headroom table 'S opens H1 only (H2 cut and blanked)': the H1 shutter switch stays fitted and wired in S until the CAD settles it"
      - "TPK-S reach s_target 272.5 is 0.5 mm ABOVE the CAD's own s_seat 273.0: the depth cap at B0 is 273.5, so the re-pick window ends 0.5 mm past the seat (not 1 mm); the CAD should run the reach to s_seat + the pick over-travel"
