  hold_current_a: 0.6
  home_current_a: 0.6               # lowering onto the switch from an unknown height (homing); a jam at 0.6 A pushes about 100 N
  speed_mm_s: 5.0                   # CAD bar speed; below the corner speed at 1.3 A (21.0 mm/s, z_drive.speed): full thrust
  stroke_mm: 50.0
