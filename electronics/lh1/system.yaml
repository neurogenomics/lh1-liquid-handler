stop_category_claim: >-
  Designed toward EN ISO 13849-1 Category 3 / PL d (NOT verified) for every energy removal: MOTION through KM1+KM2 (e-stop)
  and KM3+KM4 (door); THERM_AUX through KM1+KM2 (TB_RELAY is a further, monitored functional contactor);
  THERM through KM5 and TC_RELAY in series, both with mirror contacts in SR1's feedback loop (a welded contactor prevents
  reset). Both coils hang on the end of the TC-1 coil chain, which is fed from SR1 output 33-34: the e-stop, any of the
  three TC-1 thermostats AND the host-loss watchdog WDOG open BOTH THERM contactors (two output channels; the sensing is one thermostat per
  location, i.e. single-channel input, so the over-temperature function is claimed only as Category 1-like, not PL d).
  Cold blocks (THERM_AUX): over-temperature opens only TB_RELAY (one channel; KM1/KM2 cannot be opened by it without
  stopping motion). Accepted because the energy is low (TEC_COLD limits each channel to 3.5 A x 18 V = 63 W) and each
  block's 72 C one-shot fuse and 70 C sink thermostat are separate devices in that coil chain; claimed as Category B /
  1-like only. The host-loss watchdog is a functional (not safety-rated) device. The assessor must confirm the claims.
input_failsafe:      # every safety-relevant input: what a broken wire or dead sensor reads, and that it is the safe reading
  basis: "pull-up (^) to 3.3 V on every input; a broken wire therefore reads HIGH"
  inputs:
    estop_monitor:   {section: "gcode_button estop", device: ESTOP, contact: "NC", modifier: "^", high_means: "pressed -> M112", safe: true}
    door_monitor:    {section: "gcode_button door", device: DOOR_SW, contact: "closed while door closed", modifier: "^", high_means: "door open -> pause", safe: true}
    servo_alarm_x:   {section: "gcode_button servo_alarm_x", device: X_MOTOR, contact: "ALM conducting while healthy", modifier: "^", high_means: "alarm -> M112", safe: true}
    servo_alarm_y:   {section: "gcode_button servo_alarm_y", device: Y_MOTOR, contact: "ALM conducting while healthy", modifier: "^", high_means: "alarm -> M112", safe: true}
    servo_alarm_y1:  {section: "gcode_button servo_alarm_y1", device: Y1_MOTOR, contact: "ALM conducting while healthy", modifier: "^", high_means: "alarm -> M112", safe: true}
    force_switches:  {sections: ["gcode_button force_a", "gcode_button force_b"], device: FORCE_SW_A, contact: "NC", modifier: "^", high_means: "force reached (or broken wire) -> pick-up stops; tripped at the start -> refused", safe: true}
    contact_switches: {sections: ["gcode_button contact_a", "gcode_button contact_b"], device: PUSH_CONTACT_A, contact: "NC", modifier: "^", high_means: "pad on the slider (or broken wire): contact window check holds", safe: true}
    latch_switches:  {sections: ["gcode_button latch_a", "gcode_button latch_a_empty", "gcode_button latch_a_open", "gcode_button latch_b", "gcode_button latch_b_empty", "gcode_button latch_b_open"], device: LATCH_SW_A, contact: "resistor ladder on an ADC input", word: "ladder", modifier: "", high_means: "ADR-014 three-state ladder: a broken wire (infinite) or a short (0 ohm) is in none of the three bands = LATCH_WIRE fault: refused everywhere (half-lock / dropped-tool / exchange holds)", safe: true}
    dock_lift_home:  {sections: ["manual_stepper dock_lift"], device: DOCK_LIFT_HOME, contact: "NPN slot sensor conducting with the flag in the slot (bar DOWN)", word: "slot sensor", modifier: "^!", high_means: "bar not home (or broken wire / dead sensor): the lowering ends in 'No trigger' with the bar UNKNOWN; X/Y and the dock refused until G28", safe: true}
    dock_bar_open:   {section: "gcode_button dock_bar_open", device: DOCK_BAR_OPEN, contact: "NO", modifier: "^!", high_means: "bar not at the open height (or broken wire): the open check fails, the bar is lowered and the exchange holds (LIFT_STALL)", safe: true}
    hall_code:       {sections: ["gcode_button hall_a0", "gcode_button hall_a1", "gcode_button hall_a2", "gcode_button hall_a3", "gcode_button hall_b0", "gcode_button hall_b1", "gcode_button hall_b2", "gcode_button hall_b3"], device: HALL_A, contact: "open collector", word: "open collector", modifier: "^!", high_means: "bit 0 (or broken wire): codes have even weight, so one lost bit is an invalid code, never another tool", safe: true}
    cable_loop:      {sections: ["gcode_button cable_a", "gcode_button cable_b"], device: HALL_A, contact: "looped to GND", word: "looped to GND", modifier: "^!", high_means: "flat cable lost: refused, never read as an empty carriage", safe: true}
    bay_switches:    {sections: ["gcode_button bay1", "gcode_button bay2", "gcode_button bay3", "gcode_button bay4", "gcode_button bay5", "gcode_button bay6", "gcode_button bay7", "gcode_button bay8"], device: BAY_SW_1, contact: "NC", modifier: "^", high_means: "occupied (or broken wire): no drop-off into that bay", safe: true}
    module_safe_lines: {sections: ["gcode_button safe_a3_a", "gcode_button safe_b2_a", "gcode_button safe_g4_a", "gcode_button safe_g0_a", "gcode_button safe_a3_b", "gcode_button safe_b2_b", "gcode_button safe_g4_b", "gcode_button safe_g0_b"], device: MODCONN_A3, contact: "closed to 0 V by the module while safe", word: "closed to 0 V", modifier: "^!", high_means: "NOT safe (unplugged, busy or broken wire): Z refused over that place", safe: true}
    airflow:         {section: "gcode_button airflow", device: AIRFLOW_SW, contact: "NO", modifier: "^!", high_means: "flow not proven (or broken wire): no ethanol step; AIRFLOW hold during one", safe: true}
    drawer:          {section: "gcode_button drawer", device: DRAWER_SW, contact: "NO", modifier: "^!", high_means: "drawer open (or broken wire): no tip ejection", safe: true}
    bin_clear:       {section: "gcode_button bin_clear", device: BIN_RX, contact: "NPN light-on", modifier: "^!", high_means: "bin full (or dead receiver / broken wire): no tip ejection", safe: true}
    waste_levels:    {sections: ["gcode_button waste1_ok", "gcode_button waste2_ok"], device: LVL_1, contact: "conducting while below 80 %", word: "CONDUCT", modifier: "^!", high_means: "bottle full (or dead sensor / broken wire): no dispense over the waste at B3", safe: true}
    shutters:        {sections: ["gcode_button shutter_h1", "gcode_button shutter_h2"], sizes: [M, L], device: SHUT_H1, contact: "NO", modifier: "^!", high_means: "shutter open (status for the hand-off macros)", safe: true}
    tip_gate:        {section: "gcode_button tip_gate", device: TIP_GATE_RX, contact: "NPN light-on", modifier: "^", high_means: "blocked (and the clear reference check fails)", safe: true, stuck_clear: "W3: before every pass the gate supply is switched off through TG_SW (FAN5 PD15) and the input must read 'blocked'; an output or PF9 shorted to 0 V, a failed output stage or a TG_SW stuck on reads 'clear' and stops the check"}
    tools_up_chain_octopus: {section: "gcode_button tools_up", device: K_CH, contact: "K_CH NO contact (closed while the chain is energised)", word: "NO", modifier: "^!", high_means: "chain open, a tool down, broken wire or K_CH dead -> no XY move, no G28 X/Y, no lid move", safe: true}
    lid_gate_readback: {section: "gcode_button lid_gate", device: K_TU, contact: "K_TU NC (forcibly guided)", word: "NC", modifier: "^!", high_means: "NC open = gate ON (relay energised); a broken wire reads 'gate ON' and is caught by the emitter-off self-test before every lid move", safe: true}
    therm_mirror:    {section: "gcode_button therm_mirror", device: TC_RELAY, contact: "TC_RELAY mirror NC 2 (closed while the contactor is OFF)", word: "NC", modifier: "!", high_means: "mirror open = contactor ON (or broken wire): LH_THERM_OFF's weld check then fails and latches RELAY_WELDED (safe direction: heat refused)", safe: true, note: "thermistor input PF4 with the board's own pull-up (no ^)"}
    tb_mirror:       {section: "gcode_button tb_mirror", device: TB_RELAY, contact: "TB_RELAY mirror NC 2", word: "NC", modifier: "!", high_means: "status only (cold-block contactor on); reported", safe: true}
    lid_open_sensor: {sections: ["manual_stepper tc_lid_slide"], device: TC_S_OPEN, contact: "NPN slot sensor, set so 'open' reads high", word: "slot sensor", modifier: "^", high_means: "lid at OPEN (or dead sensor/broken wire): homing toward OPEN stops at once", safe: true}
    clamp_up_switch: {sections: ["manual_stepper tc_lid_clamp"], device: TC_SW_CLAMP, contact: "NC", modifier: "^", high_means: "clamp UP reached (or broken wire): homing up stops at once", safe: true}
    lid_closed_sensor: {section: "gcode_button lid_closed", device: TC_S_CLOSED, contact: "NPN slot sensor", word: "slot sensor", modifier: "!", high_means: "status: lid CLOSED only if it reads closed AND open reads not-open (implausible pair -> LID_SENSOR)", safe: true}
    clamp_sealed_switch: {section: "gcode_button clamp_sealed", device: TC_SW_SEALED, contact: "NO to 0 V", word: "NO", modifier: "!", high_means: "not sealed (or broken wire): heat above 45 C refused by the host rule and the lid-heater macro", safe: true}
    gripped:         {section: "gcode_button gripped", device: GRIPPED_SW, contact: "NC", modifier: "^", high_means: "gripped (or broken wire: caught when the jaws open, LH_GRIPPER refuses)", safe: true}
    lid_parked:      {section: "gcode_button lid_parked", device: TC_SW_PARKED, contact: "NO", modifier: "^!", high_means: "not parked -> tools kept out of the TC-1 zone (F1)", safe: true}
    endstops_note: "Z home switches are roller levers on cam bars (rev G1): actuated (contact open) over the whole band from the normal top to the eject top, so the eject over-travel keeps them 'triggered' and a broken wire also reads 'triggered'"
    endstops:        {sections: [stepper_x, stepper_y, stepper_y1, stepper_z, "manual_stepper z_a", "manual_stepper z_b", "manual_stepper pusher_a", "manual_stepper pusher_b", "manual_stepper gripper", "manual_stepper tc_lid_clamp"], device: X_ENDSTOP, contact: "NC", modifier: "^", high_means: "triggered (or broken wire): homing stops", safe: true}
    z_up_chain:      {hardware: "K_CH + beam receiver + K_TU (interlocks.lid_needs_all_tools_up)", contact: "NO roller levers in series, closed only from the normal top to the eject top", high_means: "chain open (tool down or broken wire) -> lid drivers unpowered", safe: true}
  not_failsafe:
homing_time: "about 230 s worst case (ADR-014): dock lift bar 53/5 s + gripper Z 347/8 s + carriages 2 x 347/8 s + back-offs + pushers 2 x (38.6/2 + back-off) s at <= 2 mm/s + X 803.5/40 s + Y 591/40 s (S); printer.cfg _LH_STATE variable_homing_time_s, recomputed by check.py"
plunger_motor:   # carriage pusher (ADR-014 #5, 23 Nov 2026): the catalogue part replaces the NEMA14 "1 mm lead, <= 1.0 A winding" paper specification
