# LH-1 electrical architecture, revision L (15 Nov 2026): harness level, brought to CAD revision K (deck) and revision L
# (exchange head, eight-bay dock, enlarged K2 frame: cad/lh1/head_l, cad/lh1/machine_l, assembly report rev_l / rev_k).
# Maturity: CALCULATED / DESIGNED.  Nothing built or measured.  Currents are datasheet-style estimates to be measured.
# All low voltage is 24 V SELV (0 V not earthed; see safety_assessment) behind THREE bought enclosed 24 V supplies and
# one 5 V supply fed from a bought fused, switched IEC inlet.  Mains work (inlet -> supplies -> KM6 -> switched strip,
# PE) is for a competent person.  Every unverified part fact is marked UNVERIFIED (here or in rev_l.unverified).
#
# NOT ASSESSED: this design has had no electrical safety assessment.  See safety_assessment and rev_l.competent_person.
#
# ADR-003 (bought electronics): no custom circuit boards.  Revision L adds a second bought Octopus Pro (io board), a
# third 24 V supply (PSU_AUX), two more Meerstetter TEC-1166, two USB hubs, a bought USB load-cell interface and a mains
# strip contactor KM6.  ADR-010: the exchanged tools are passive (no electrical contact, no board on any tool).
# Revision L design: section `rev_l` (I/O and power budgets, decisions, safety functions, Y7 ignition sources, owners).
supplies:
  PSU_MAIN:  {spec: "enclosed 24 V 25 A (600 W) supply, Mean Well LRS-600-24 class: LOGIC and MOTION; on the FRONT PSU plate", v: 24, a_max: 25.0}
  PSU_TC:    {spec: "second LRS-600-24 class: TC-1 THERM only (Peltiers 13.2 A + lid heater 3.3 A); on the REAR PSU plate; 0 V common with PSU_MAIN at the 0 V bus", v: 24, a_max: 25.0}
  PSU_AUX:   {spec: "THIRD LRS-600-24 class (rev L): THERM_AUX (five thermal modules on three TEC-1166) and the MODULE rail (deck-place 24 V); on the rear electronics plate CBP2 (CAD request CR-L4); 0 V linked to the 0 V bus", v: 24, a_max: 25.0}
  PSU_5V:    {spec: "DIN-rail enclosed 5 V 10 A (50 W) mains supply, Mean Well MDR-60-5 class, set to 5.2 V: host and both USB hubs", v: 5, a_max: 10.0}
rails:
  HOST_5V:   {supply: PSU_5V, fuse_a: 10.0, fuse: PSU5_LIMIT, switched_by: [], note: "host and the two powered USB hubs; the MDR-60-5's own current limit protects the 5 V wiring"}
  LOGIC:     {supply: PSU_MAIN, fuse_a: 8.0,  fuse: F1, switched_by: [], note: "both Octopus boards' logic and their HE/FAN outputs (deck light, VC-2 light, K_UV coil), host-side sensors, fans, safety relays (F6), extraction fan (F8): stays up after e-stop and door; F1 raised 5 -> 8 A (6.3 x 32) for the io board and the extraction fan"}
  MOTION:    {supply: PSU_MAIN, fuse_a: 16.0, fuse: F2, switched_by: [ESTOP, DOOR], note: "every motor driver supply, through KM1+KM2 (e-stop) and KM3+KM4 (door) in series; branches F21 gantry, F22 head, F23 TC-1 lid drivers (through K_TU), F24 UV option (through K_UV)"}
  THERM:     {supply: PSU_TC,   fuse_a: 25.0, fuse: F5, switched_by: [ESTOP, OVERTEMP_BLOCK, OVERTEMP_SINK, OVERTEMP_LID, HOST_WATCHDOG], note: "TC-1 block controller TEC_TC and the lid-heater SSR, through KM5 and TC_RELAY in series (coil chain SR1 34 -> three KSD301 -> WDOG); unchanged"}
  THERM_AUX: {supply: PSU_AUX,  fuse_a: 20.0, fuse: F4, switched_by: [ESTOP, OVERTEMP_BLOCK_AUX, OVERTEMP_SINK_AUX], note: "family: four thermal modules (B2, G4, A3, A4) on TEC_COLD and TEC_TUBE, TEC_WARM reserved (G0 37 C) through KM1/KM2 pole 5 and TB_RELAY (coil from SAFE_E through every module's 72 C cut-off and 70 C sink thermostat); one fuse per controller F33-F35; NOT through the host watchdog (modules hold their setpoint on host loss)"}
  MODULE:    {supply: PSU_AUX,  fuse_a: 4.0,  fuse: F9, switched_by: [ESTOP], note: "deck-place standard connectors (ADR-010: 24 V 3 A fused per place, F41-F48 in XM; family places A3, B2, G4, G0, + D3, D4 in L) through KM1/KM2 pole 3: the e-stop removes module power; anything that must keep running after an e-stop is not a module"}
branches:     # fuse terminals downstream of the rail fuses; load ids from `loads`
  F6:  {rail: LOGIC,  fuse_a: 2.0,  loads: [safety_circuit], note: "SR1, SR2 supply; KM1-KM4 coils; TC-1 coil chain from SR1 33-34; cold-module chain and KM6 coil via SAFE_E"}
  F7:  {rail: LOGIC,  fuse_a: 2.0,  loads: [tc_fans, cab_fan, tip_gate, thermal_ctrl_logic, env_sensors], note: "small LOGIC loads on thin leads"}
  F8:  {rail: LOGIC,  fuse_a: 2.0,  loads: [extraction_fan], note: "extraction fan, always on (rev L, Y7)"}
  F21: {rail: MOTION, fuse_a: 10.0, loads: [x_motor, y_motors, dock_lift], note: "gantry: X and Y closed-loop motors through the per-motor fuses F25-F27 (V8, 23 Nov 2026: F21 now protects only the 1.5 mm2 MOT_G feed W-P-18/W-P-29 and the Octopus MOTOR_POWER lead W-P-20); ADR-014: the dock lift driver in main socket 6 is fed from that MOTOR_POWER (its motor lead is protected by the driver's current limit)"}
  F25: {rail: MOTION, fuse_a: 4.0, loads: [], parent: F21, note: "X motor lead W-P-30 (0.75 mm2 through the Y chain, Iz 5.4 A): T4A 5 x 20 fuse terminal in FT, fed from MOT_G"}
  F26: {rail: MOTION, fuse_a: 4.0, loads: [], parent: F21, note: "Y right motor lead W-P-31 (1.0 mm2, Iz 9.6 A): T4A; closed-loop driver 1.75 A at acceleration (inrush of its bulk capacitor: time-lag fuse, competent person to confirm)"}
  F27: {rail: MOTION, fuse_a: 4.0, loads: [], parent: F21, note: "Y left motor lead W-P-32 (1.0 mm2): T4A"}
  F22: {rail: MOTION, fuse_a: 6.3,  loads: [z_motors, pushers, gripper_motor, head_boards], note: "head: one 0.75 mm2 pair through the Y and X chains to the lever-splice block, two pre-made XT30(2+2) leads to MMB_A and MMB_B"}
  F23: {rail: MOTION, fuse_a: 2.0,  loads: [tc_lid_motors], note: "TC-1 lid drivers through the NO contact of K_TU"}
  F24: {rail: MOTION, fuse_a: 2.0,  loads: [uv_option], note: "UV-C OPTION (reserved): after KM1/KM2 and KM3/KM4 (an open door removes UV power in hardware), through K_UV"}
  F33: {rail: THERM_AUX, fuse_a: 8.0, loads: [tm_cold], note: "TEC_COLD (B2 strips, G4 cold plate CPB-1)"}
  F34: {rail: THERM_AUX, fuse_a: 8.0, loads: [tm_tube], note: "TEC_TUBE (A3 CTB-1, A4 CTB-2)"}
  F35: {rail: THERM_AUX, fuse_a: 8.0, loads: [tm_warm], note: "RESERVED: TEC_WARM for a 37 C module at G0 (not fitted in any size; fuse terminal fitted, fuse not)"}
  F41: {rail: MODULE, fuse_a: 3.15, loads: [place_a3], note: "module zone A3+A4 (two thermal-module fans)"}
  F42: {rail: MODULE, fuse_a: 3.15, loads: [place_b2], note: "place B2 strip module fan"}
  F43: {rail: MODULE, fuse_a: 3.15, loads: [place_g4], note: "place G4 CPB-1 module fan (row G, through the connector plane)"}
  F44: {rail: MODULE, fuse_a: 3.15, loads: [place_g0], note: "place G0 RESERVED module place (loop-back plug, no load)"}
  F45: {rail: MODULE, fuse_a: 3.15, loads: [place_d3], note: "place D3 balance (L only; loop-back plug, no 24 V load); fuse terminal fitted in every size (XM sized for L), fuse only in L"}
  F46: {rail: MODULE, fuse_a: 3.15, loads: [place_d4], note: "place D4 weighing nest (L only; USB-powered interface, no 24 V load)"}
  F47: {rail: MODULE, fuse_a: 3.15, loads: [], note: "SPARE place fuse position (ADR-009)"}
  F48: {rail: MODULE, fuse_a: 3.15, loads: [], note: "SPARE place fuse position (ADR-009)"}
loads:
  - {id: controller, desc: "Octopus Pro v1.1 main board logic + endstop/sensor supply", rail: LOGIC, a: 0.3}
  - {id: io_controller, desc: "second Octopus Pro (io board) logic 0.3 A + its outputs: deck LED strip 0.5 A (HE2), VC-2 backlight 0.05 A (FAN0), K_UV coil 0.04 A (option)", rail: LOGIC, a: 0.9}
  - {id: host, desc: "Raspberry Pi 5 (worst case 5 A) at 5 V on PSU_5V", rail: HOST_5V, a: 5.0}
  - {id: usb_hubs, desc: "two powered USB 2.0 hubs: bus-powered VC-1, VC-2, VC-3 (3 x 0.25 A), load-cell interface 0.1 A (L), TEC USB interfaces (3 fitted + 1 reserved x 0.05 A), 2 x 0.5 A reserve for spare ports, hub electronics 0.2 A: counted for L in every size", rail: HOST_5V, a: 2.25}
  - {id: sensors, desc: "end stops, carriage switches on the main board side, door/e-stop monitor contacts", rail: LOGIC, a: 0.1}
  - {id: safety_circuit, desc: "SR1 + SR2 + KM1-KM5 coils + TC_RELAY, TB_RELAY coils + KM6 coil (<= 0.15 A) through SAFE_E", rail: LOGIC, a: 1.45}
  - {id: tc_fans, desc: "TC-1 2 x 80 mm 24 V fans, always on", rail: LOGIC, a: 0.5}
  - {id: thermal_ctrl_logic, desc: "relays K_TU + K_CH + WDOG supply + beam pair + lid slot sensors + SSR input", rail: LOGIC, a: 0.21}
  - {id: tip_gate, desc: "tip-gate through-beam pair (emitter switched by TG_SW, receiver), 24 V", rail: LOGIC, a: 0.06}
  - {id: env_sensors, desc: "bin-full beam pair 0.06 A + two capacitive level switches 0.04 A + the dock lift DOWN slot sensor 0.02 A (ADR-014; airflow, drawer, shutter, bay and bar-open switches are dry contacts)", rail: LOGIC, a: 0.12}
  - {id: cab_fan, desc: "control compartment: two 92 mm 24 V intake fans, about 40 CFM free air class, 0.1 A each (ASSUMED class, UNVERIFIED), always on (CAD services_interface)", rail: LOGIC, a: 0.2}
  - {id: extraction_fan, desc: "24 V EC inline duct fan, 30 m3/h class, always on (UNVERIFIED part: about 15-25 W)", rail: LOGIC, a: 1.0}
  - {id: x_motor, desc: "NEMA17 closed-loop >= 0.65 N m, X (stiffer belt, 1167 mm beam)", rail: MOTION, a: 2.0}
  - {id: y_motors, desc: "2 x NEMA17 closed-loop, Y moving mass 22.1 kg (rev L dynamics, was about 17): 1.75 A each at acceleration", rail: MOTION, a: 3.5}
  - {id: z_motors, desc: "3 x NEMA17 48 mm Z (carriage A, carriage B, gripper axis) on EZ5160 Pro: one moves under load at a time (0.9 A, 1.3 A force strokes, 0.6 A hold)", rail: MOTION, a: 2.2}
  - {id: pushers, desc: "2 x NEMA14 34 mm captive linear pushers (family CR-L5; one moves at a time, 0.7 A run, 0.35 A hold): supply current about 0.6 A, 1.0 A counted", rail: MOTION, a: 1.0}
  - {id: gripper_motor, desc: "NEMA11 gripper jaws, current-limited grip", rail: MOTION, a: 0.4}
  - {id: dock_lift, desc: "dock lift DLB-1 (ADR-014): NEMA17 48 mm + Tr8x2 on a TMC5160 stepstick in main socket 6, 1.3 A run while the bar moves (about 25 s per exchange, Z axes then at hold), 0.6 A hold: copper 5.1 W + driver about 1.5 W -> about 0.3 A from 24 V, 0.4 A counted", rail: MOTION, a: 0.4}
  - {id: head_boards, desc: "2 x BTT MMB CAN V2.0 logic + Hall supply (from MOTION: go down with motion power)", rail: MOTION, a: 0.25}
  - {id: tc_lid_motors, desc: "TC-1 lid slide and clamp on two DM542-class drivers, through K_TU", rail: MOTION, a: 0.9}
  - {id: uv_option, desc: "UV-C OPTION, 2 x 8 W T5 lamps on a 24 V DC ballast (UNVERIFIED part), through K_UV: reserved, counted in the budget", rail: MOTION, a: 0.8}
  - {id: tc_peltiers, desc: "TC-1 block controller TEC_TC input, 13 A limit at <= 24 V out / 0.95 / 24 V = 13.2 A peak", rail: THERM, a: 13.2}
  - {id: tc_lid_heater, desc: "TC-1 lid heater 80 W, 7.2 ohm, through LID_SSR", rail: THERM, a: 3.33}
  - {id: tm_cold, desc: "TEC_COLD: B2 strip carrier + G4 cold plate CPB-1, 2 x 3.5 A x 18 V = 126 W / 0.9 / 24 V", rail: THERM_AUX, a: 5.84}
  - {id: tm_tube, desc: "TEC_TUBE: A3 CTB-1 + A4 CTB-2 tube blocks, 2 x 63 W / 0.9 / 24 V", rail: THERM_AUX, a: 5.84}
  - {id: tm_warm, desc: "RESERVED (not fitted in any size): TEC_WARM ch1 for a 37 C module at G0, 63 W / 0.9 / 24 V, counted in the budget so the reserve is real", rail: THERM_AUX, a: 2.92, reserve: true}
  - {id: place_a3, desc: "module zone A3+A4: two thermal-module 60 mm fans (CTB-1, CTB-2)", rail: MODULE, a: 0.4}
  - {id: place_b2, desc: "B2 thermal module 60 mm fan", rail: MODULE, a: 0.2}
  - {id: place_g4, desc: "G4 thermal module 60 mm fan", rail: MODULE, a: 0.2}
  - {id: place_g0, desc: "G0 reserved module place: loop-back plug, no load", rail: MODULE, a: 0.0}
  - {id: place_d3, desc: "D3 balance (L only): own adapter on the switched strip, no 24 V load", rail: MODULE, a: 0.0, sizes: [L]}
  - {id: place_d4, desc: "D4 weighing nest (L only): USB-powered interface, no 24 V load", rail: MODULE, a: 0.0, sizes: [L]}
buses:
  - {name: usb_controller, between: [HOST, MAIN_CTRL], note: "Klipper over USB; the Octopus Pro also runs Klipper's USB-to-CAN bridge for the head boards"}
  - {name: usb_io, between: [HOST, IO_CTRL], note: "second Octopus Pro as Klipper MCU 'io', USB direct to a host port (not through a hub)"}
  - {name: can_klipper, between: [MAIN_CTRL, CAN_SPLICE, MMB_A, MMB_B], note: "Klipper CAN, 1 Mbit/s, Octopus Pro CAN port (on-board transceiver, 120 ohm ON) through the chain twisted pair to the lever-splice block CAN_SPLICE on the head, two pre-made 0.15 m XT30(2+2) leads; MMB_B's own 120 ohm jumper ON (bus end), MMB_A's OFF"}
  - {name: usb_hub1, between: [HOST, HUB1, TEC_TC, TEC_COLD, TEC_TUBE, TEC_WARM, VC2, VC3, VC1, HEAD_SPARE], note: "10-port powered hub in the bay: four TEC controllers (MeCom), the three cameras and the installed head spare; 2 ports spare"}
  - {name: usb_hub2, between: [HOST, HUB2, MODCONN_A3, MODCONN_B2, MODCONN_G4, MODCONN_G0, SHAKER], note: "10-port powered hub in the compartment: one port per module place (A3, B2, G4, G0; D3 balance and D4 weighing interface in L) and the heater-shaker at F4"}
safety_chain:
  - {id: ESTOP, type: "22 mm latching mushroom, 2 NC positive-opening into SR1 dual-channel with cross-fault detection; 1 NC aux to the Octopus for logging only", breaks: [MOTION, THERM, THERM_AUX, MODULE],
     hardware: "SR1 (monitored manual reset) drives KM1 and KM2 (force-guided mirror NC in SR1's feedback loop); MOTION, MODULE and THERM_AUX pass through one main pole of each; the auxiliary NO of each makes SAFE_E (cold-module coil chain, KM6 mains strip); SR1 34 feeds the TC-1 coil chain"}
  - {id: DOOR, type: "coded non-contact magnetic safety sensor (ISO 14119 type 4) on the front door, 2 safety contacts into SR2, 1 signalling contact to the Octopus", breaks: [MOTION],
     hardware: "SR2 drives KM3 and KM4 in series with KM1/KM2 on MOTION only (includes the TC-1 lid drivers F23 and the UV option F24)"}
  - {id: OVERTEMP_BLOCK, type: "KSD301 110 C NC bimetal on the TC-1 block, in the relay coil chain", breaks: [THERM]}
  - {id: OVERTEMP_SINK, type: "KSD301 75 C NC bimetal on the TC-1 heat sink, in the relay coil chain", breaks: [THERM]}
  - {id: OVERTEMP_LID, type: "KSD301 130 C NC bimetal on the heated lid, in the relay coil chain", breaks: [THERM]}
  - {id: OVERTEMP_BLOCK_AUX, type: "axial thermal cut-off fuse 72 C (one-shot) in EVERY thermal module (family: B2, G4, A3, A4), in the TB_RELAY coil chain", breaks: [THERM_AUX]}
  - {id: OVERTEMP_SINK_AUX, type: "KSD9700 70 C NC bimetal on EVERY thermal module's heat sink, in the TB_RELAY coil chain", breaks: [THERM_AUX]}
  - {id: HOST_WATCHDOG, type: "bought heartbeat watchdog relay WDOG in the TC-1 coil chain; heartbeat from the Octopus FAN1", breaks: [THERM]}
safe_state:
  on_host_loss: "no LH_HEARTBEAT -> Klipper stops the WDOG heartbeat -> WDOG opens the TC-1 coil chain -> KM5 and TC_RELAY drop: TC-1 block and lid heater unpowered.  TEC_TC also stops on its MeCom communication watchdog.  TEC_COLD, TEC_TUBE and TEC_WARM have the communication watchdog OFF and hold their setpoints (cold modules 4 C, A3 37 C) stand-alone under their own object/sink error limits and the module thermostats.  The heater-shaker and balance follow their own host-loss behaviour (shaker: maker's sheet, UNVERIFIED).  Klipper on the main and io boards keeps running; the latched holds stay."
  on_estop: "motors, gripper, pushers, the dock lift, THERM, THERM_AUX, MODULE and the mains strip (shaker, balance) unpowered by KM1/KM2 (+ SAFE_E -> KM6, TB_RELAY); Z screws, pushers, the dock lift screw and the over-centre latch (ADR-014: held by geometry, closed by constant-force springs) need no power: tools stay on their carriages or on the bay pins; after the restart G28 lowers the dock lift bar FIRST (a seated latch re-closes on its springs) and then reads both carriages; host, both Octopus boards, TEC controller logic, TC-1 fans and the extraction fan keep running and log. Klipper shuts down (head MCUs are on MOTION): FIRMWARE_RESTART and re-homing; the power-up read refuses homing with a half-locked tool."
  on_door: "motion stops (TC-1 lid and UV option included); thermal programmes continue.  Klipper shuts down as for the e-stop."
  on_mains_loss: "everything stops; the spring latch keeps every tool on its carriage; journal on the host's storage survives; on restart every unresolved action is resolved by sensing (power-up read of both carriages, bay switches)"
controller:
  board: "BigTreeTech Octopus Pro v1.1 (STM32H723, 8 driver sockets; all eight driver-voltage jumpers on MOTOR_POWER)"
  driver_sockets: {0: x (external closed-loop via step/dir breakout), 1: y (external closed-loop via breakout), 2: tc_lid_slide (external DM542-class driver via breakout XDA2), 3: y1 (external closed-loop via breakout), 4: spare (passive breakout XDA4 used as inputs PF9/PF10/PG2), 5: tc_lid_clamp (external driver via breakout XDA5), 6: "dock_lift (TMC5160 SPI stepstick: ADR-014 dock lift DLB-1)", 7: spare}
io_controller:
  board: "second BigTreeTech Octopus Pro v1.1 as Klipper MCU 'io' on USB (bought; the same part as MAIN_CTRL, one spare covers both)"
  why: "revision L needs 32 new digital inputs (8 bay switches, 16 module SAFE lines, 8 environment inputs) and 4 switched outputs; the main board has 20 spare GPIO, so a second bought board keeps the main board's spares and adds 6 spare driver sockets (ADR-009) instead of a custom expander"
  driver_sockets: {0: spare, 1: spare, 2: spare, 3: spare, 4: spare (passive breakout XDB4 used as inputs PF9/PF10/PG2), 5: spare (passive breakout XDB5 used as inputs PC13; PF0/PF1 compartment fan-fail inputs), 6: spare, 7: spare}
head_controllers:
  head_a: {board: "BigTreeTech MMB CAN V2.0 (STM32G0B1, 12-60 V), EZ5160 Pro on spi1, Klipper over CAN: carriage A Z + pusher, gripper Z (= printer Z)", driver_sockets: {1: z_a, 2: pusher_a, 3: stepper_z (gripper Z), 4: spare}}
  head_b: {board: "BigTreeTech MMB CAN V2.0 (12-60 V), EZ5160 Pro on spi1, Klipper over CAN: carriage B Z + pusher, gripper jaws", driver_sockets: {1: z_b, 2: pusher_b, 3: gripper, 4: spare}}
retired:
  - {item: "HIB-1 head interconnect board (electronics/lh1/hib1)", why: "ADR-003: passive, no safety function; its only hard job (holding e-stop back-EMF under the TMC2209's 32 V) disappears with the 48 V-class EZ5160 Pro drivers; replaced by a lever-splice block and two pre-made XT30(2+2) leads"}
  - {item: "TCB-1 thermal controller board in all builds (electronics/tcb1, firmware/tcb1)", why: "ADR-003: four-layer double-sided SMT board that never routed; replaced by bought Meerstetter TEC controllers, Klipper (lid heater, lid motion, weld check, watchdog heartbeat) and bought relays (gate K_TU/K_CH, watchdog WDOG, lid SSR)"}
  - {item: "reserved pipette-module bus (PIPETTE rail F3, HIB-1 J4/C2/D2, USB-CAN adapter U2C, PIP_MOD)", why: "ADR-003 #1(d): nothing uses it in the first build"}
  - {item: "BigTreeTech SKR Pico v1.0 auxiliary board", why: "its four drivers moved to the head (plungers) and to Octopus socket 2 (magnet lift); keeping it would put 12 plunger-motor conductors through the X chain"}
  - {item: "fixed four-tool head (Z small/50/gripper/300, three plungers, three cradle seat switches, four Z-up switches, four FFC loops)", why: "ADR-010: two identical tool carriages with passive exchangeable tools + gripper axis (revision L); the old head devices and cables are removed from system.yaml and wiring.csv"}
  - {item: "fork tip-check sensor TIP_GATE", why: "rev K tip station needs a separated through-beam pair (beam span about 107 mm): TIP_GATE_TX / TIP_GATE_RX"}
  - {item: "cold blocks C3/F3 as loose devices (TB_TEC, TB_NTC, TB_TCO, TB_KSD, TB_FAN, TB2_*)", why: "rev K/L thermal modules are plug-in modules (TM_*) with their sensors, thermostats and fan inside; the old F3 block is now B3 (cold plate) and F3/F4 are tube blocks"}
  - {item: "4-port USB hub USB_HUB and the CAM-2 camera CAMERA", why: "rev L: two 10-port hubs HUB1/HUB2 (17 USB devices); VC-3 replaces CAMERA (ADR-004)"}
  - {item: "comb strip-off method (LH_EJECT_TIP METHOD=comb, keepouts K7)", why: "head_l ejects by method B only (fixed finger per carriage); the comb is retired with the fixed head"}
