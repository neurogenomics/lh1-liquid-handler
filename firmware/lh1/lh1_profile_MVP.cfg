# LH-1 build profile MVP: GENERATED by electronics/lh1/gen_size_files.py --profile MVP from electronics/lh1/profile_MVP.yaml.
# Do not edit.  Included LAST by printer_MVP.cfg (itself generated from the shared core printer.cfg without the hardware
# sections of the absent devices), after lh1_size_S.cfg.  The core macros run unchanged; they read _LH_PROFILE:
# absent groups refuse DEVICE_ABSENT, carriage B refuses CARRIAGE_ABSENT, and carriage A's tool is DECLARED here ({'a': 'M300'}),
# never treated as sensed (no latch, no Hall code).  Guard: door.  DESIGNED and SIMULATED only: Klipper has not loaded it.

[gcode_macro _LH_PROFILE]
variable_name: "MVP"
variable_absent: ["carriage_b", "gripper", "dock", "thermocycler", "modules", "shaker", "liquid_waste", "tip_parking", "extraction", "uv", "deck_light", "cameras", "weighing", "mains_strip"]
variable_carriages: ["a"]
variable_fixed_tools: {"a": "M300"}

# Printer Z = the gripper Z on head_a EZ3 (core [stepper_z], pins unchanged): MMB_A is fitted for carriage A but socket EZ3 has no
# driver and no motor (its [tmc5160 stepper_z] is cut).  Klipper's cartesian kinematics needs the Z rail, so homing_override marks
# Z homed at 0 (set_position_z) and every G0/G1 Z refuses DEVICE_ABSENT: this axis never moves.  head_a EZ3 left empty (no driver, no motor); end stop head_a:PD9 not wired (Z_HOME_GRIP absent): never homed, never moved
[homing_override]
set_position_z: 0

# no THERM path and no watchdog relay: the tick only re-arms itself (THERM can never be on: LH_THERM_ON refuses)
[delayed_gcode _LH_WD_TICK]
gcode:
    UPDATE_DELAYED_GCODE_BASE ID=_LH_WD_TICK DURATION=1

[gcode_macro LH_HEAD_STATUS]
gcode:
    {% set s = printer["gcode_macro _LH_STATE"] %}
    RESPOND TYPE=command MSG="LH_HEAD BUILD=MVP A={s.mounted_a or 'EMPTY'} (fixed) B=ABSENT TIPS_A={s.tips_a} NOZZLE_OK_A={s.nozzle_ok_a} HOLD={s.hold or 'NONE'} PHOLD={s.phold or 'NONE'} AIRFLOW=ABSENT BIN={'OK' if printer['gcode_button bin_clear'].state == 'PRESSED' else 'FULL'} DRAWER={'IN' if printer['gcode_button drawer'].state == 'PRESSED' else 'OUT'} WASTE=ABSENT BAYS=ABSENT"

