    _LH_MOTORS_OFF
    M84.1

[gcode_macro _LH_MOTORS_OFF]
description: internal: before the drivers go off: positions are lost, so homed, pusher positions and gripper state are cleared (G28 and a person's gripper confirmation needed again)
gcode:
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=homed VALUE=0
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=grip VALUE=0
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=nozzle_seen VALUE='","'
    {% for c in ["a", "b"] %}
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=pos_{c} VALUE=-1.0
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=nozzle_ok_{c} VALUE=0
    {% endfor %}
    RESPOND MSG="motors off: homed state cleared, G28 needed"

