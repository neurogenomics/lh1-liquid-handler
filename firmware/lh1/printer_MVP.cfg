# LH-1 motion controller configuration for Klipper: SHARED CORE of the size family (ADR-011, 20 Nov 2026; CAD
# cad/lh1/machine_family, sizes S / M / L).  Everything that differs between the sizes (Y travel, dock row, deck-module
# place list, per-row stations, carriage-only places, the SAFE-line inputs of row-D places) is in ONE small file per size,
# included at the END of this file: lh1_size_S.cfg (starter, built first), lh1_size_M.cfg, lh1_size_L.cfg.  An upgrade
# changes only the include line.  Klipper reads the include in place and merges a section named twice (the size file's
# [stepper_y] adds position_max to the core's [stepper_y]); electronics/lh1/fw_render_check.py builds the merged file the
# same way (electronics/lh1/out/firmware_resolved_<size>.cfg) and checks it.  Do not put a size-dependent number here.
# Family changes (20 Nov 2026): nozzle row y = beam front face - 102.5 (noz_dy, CAD tool_carriages; was -73.5: 29 mm off);
# dock row per size; X travel -328.5..465 (-338.5 from 23 Nov); NEMA14 34 mm captive pushers; places renamed to the family deck (tip station
# B1, liquid waste B3, magnet B4, TC-1 at F1 with its lid park A1); syringe tool SYR re-armed as an OPTIONAL tool.
# 21 Nov 2026 (CAD tip parking, keepouts, syringe tool): tip parking place per size (_LH_SIZE tip_parking; LH_TIP_PARK /
# LH_TIP_UNPARK, not commissioned), TC-1 zone from the CAD family keepouts, SYR 32 mm stroke with a 3 mm contact window.
# 23 Nov 2026 (independent check V2/V3/V6/V7/V20 and the S replay; electronics/lh1/system.yaml family.round_23nov): no stale
# switch reads (M400 before every read that follows a move; fw_render_check.py lint), guard before body in the pipetting
# commands, per-place depth caps from the CAD reach report, tip state changed only by an observation, parked sets owned by
# tool and wells, gripper offset -104 and the shelf window (slot OK), heater-shaker state, compartment fan-fail, travel at a
# per-path safe height, Z 25 mm/s, faster tip check / pick-up / eject, nozzle check once per tool since power-up.
# 23 Nov 2026, ADR-014 (latch LTG-1 on the carriage opened by the powered dock lift DLB-1; LGA35 pusher; random-access TPK-S):
# tool drop-off and pick-up follow the CAD's dock-lift sequences (_LH_DROP / _LH_PICKUP, LH_TOOL_EXCHANGE) with a guard before
# the bar may rise and a positive OPEN check; the latch reads LOCKED / CLOSED-EMPTY / NOT CLOSED through a resistor ladder; G28
# lowers the bar first (recovery from a power cut, an e-stop or a hold inside the dock); X/Y refuse unless the bar is down;
# pushers 0.6096 mm lead, homing <= 0.50 A and <= 2 mm/s, every move <= 5 mm/s; tip parking random access (M300 only) with
# per-spot owners and a strip-force limit; SYR fills checked for a plunger that did not follow.  DESIGNED and SIMULATED only.
# History: firmware revision L (15 Nov 2026; CAD revision K deck + revision L
# exchange head, cad/lh1/head_l and cad/lh1/machine_l): two identical tool carriages A and B with passive exchangeable
# pipette tools (no electrical contact on any tool, ADR-010), a gripper axis, an eight-bay pipette dock, the larger frame,
# a second Octopus Pro as the deck/dock/environment I/O board, guarded motion wrappers, holds for half-lock, dropped tool,
# wrong tool, bay-switch disagreement, waste full, tip bin full, drawer open and lost extraction airflow.
# KLIPPER VERSION: written for Klipper mainline (master) at or after the 20260214 Config_Changes entry (MANUAL_STEPPER
# STOP_ON_ENDSTOP takes the names home / inverted_probe ...).  No tagged release has these names yet: record the exact
# commit hash installed in electronics/lh1/system.yaml klipper_target before commissioning.
# Boards (all bought; nothing that is exchanged carries electronics: the four Hall switches, latch, force and contact
# switches and the pusher motor of each carriage are ON THE CARRIAGE, permanently wired through its flat cable):
#   [mcu]        BigTreeTech Octopus Pro v1.1 (STM32H723), Klipper "USB to CAN bus bridge" (can0): gantry X/Y, TC-1 lid,
#                THERM enable, watchdog heartbeat, safety monitors, tip gate.  Pin names from Klipper's sample
#                config/generic-bigtreetech-octopus-pro-v1.1.cfg.
#   [mcu head_a] BigTreeTech MMB CAN V2.0 (STM32G0B1) on the carriage plate: carriage A (Z, pusher, inputs) + gripper Z.
#   [mcu head_b] BigTreeTech MMB CAN V2.0 on the carriage plate: carriage B (Z, pusher, inputs) + gripper jaws.
#                MMB pins from bigtreetech/MMB Firmware/sample-bigtreetech-mmb-canbus-v2.0.cfg (EZ1-EZ4, endstop1-4
#                PA15/PA10/PD9/PD8, sensor PC2, 2x7 header in_h_0..5 PC7/PA9/PB12/PB10/PB1/PC5 and in_l_0..5
#                PC6/PA8/PB11/PB2/PB0/PC4).  The header input circuit (pull-up level, 24 V tolerance) is UNVERIFIED:
#                every switch and Hall output here is a contact or open collector to GND with the MCU pull-up.
#   [mcu io]     second BigTreeTech Octopus Pro v1.1 on USB in the control bay: dock bay switches, deck-module SAFE lines,
#                extraction airflow, waste levels, tip bin and drawer, hand-off shutters, lights, UV option.  Permanently
#                wired, never hot-plugged (Klipper shuts down if a configured MCU disappears).
# Wiring: electronics/lh1/wiring.csv (every pin below is checked against it by electronics/lh1/check.py).
# STATUS: written from the design, parsed and checked by electronics/lh1/check.py and fw_render_check.py (rendered
# guard cases).  NOT loaded by Klipper, has driven no motor.  Directions, polarities, currents, speeds and the
# geometry numbers marked PROVISIONAL are starting values to be set at commissioning.
#
# Axes.  X = carriage centre x (carriage B axis), family travel_xc -338.5..465 (every size; was -328.5 before the CAD of 23 Nov 2026).  Y = beam front face y_f,
# family travel_yf -219..372 (S) / 482 (M) / 592 (L): the back end is in the size file.  Three Z axes, 0 = fully up,
# positive = down, stroke 345 (params L_Z_TRAVEL):
#   printer Z (stepper_z) = GRIPPER Z (it never carries a pipette tool, so Klipper's G28 retract is never a tool move);
#   manual_stepper z_a / z_b = tool carriages A and B (eject over-travel to -12 = params Z_EJECT_TRAVEL, only by
#   _LH_EJECT_OVERTRAVEL).  X/Y moves are refused unless all three Z are at 0, the hardware tools-up chain (three
#   Z_UP switches) is closed, and each carriage is either empty or carries a locked tool with a valid code.
# Motor power for every driver (MOTION) is removed in hardware by the e-stop and the door; Klipper then shuts down and
# needs FIRMWARE_RESTART and re-homing.  Self-locking Z screws, pushers, the dock lift screw and the over-centre latch (no
# power needed) keep every tool on its carriage or on its bay pins.

[mcu]
canbus_uuid: REPLACE_octopus_bridge_uuid      # bridge mode: the Octopus appears on can0 (canbus_query.py)

[mcu head_a]
canbus_uuid: REPLACE_head_a_uuid

[mcu io]
serial: /dev/serial/by-id/REPLACE_usb-Klipper_stm32h723xx_io      # second Octopus Pro, USB direct to the host (not through a hub)

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 2000
max_z_velocity: 25              # B (23 Nov 2026): gripper Z = the carriage Z drive; 25 mm/s = corner speed at 0.9 A, 24 V (check.py z_speed)
max_z_accel: 300
square_corner_velocity: 5

# ---- X: Octopus Driver0 socket -> step/dir breakout XDA0 -> closed-loop NEMA17 >= 0.65 N m (stiffer X belt EA >= 6e4 N) ----
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 16                 # must match the closed-loop driver's DIP setting
rotation_distance: 40          # GT2, 20 teeth
endstop_pin: ^PG6              # X end stop on the right beam end (frame report: "X end-stop (right)"), via the Y chain
position_endstop: 465          # homes toward +X, where the switch is: family travel_xc upper end (PROVISIONAL flag position)
position_min: -338.5           # family travel_xc lower end (CAD 23 Nov 2026: machine 10 mm wider on the left for the TPK-S groups), every size
position_max: 465
homing_speed: 40
homing_positive_dir: True

# ---- Y: two closed-loop motors, Driver1 (right) and Driver3 (left) sockets via breakouts XDA1 / XDA3 ----
# Each Y motor homes to its own front end stop (right PG12, left PG9): G28 Y re-squares the gantry at every homing.
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 16
rotation_distance: 40
endstop_pin: ^PG12             # Y end stop, front RIGHT
position_endstop: -219         # family travel_yf front end (beam front face y_f), the same in every size (rows F-B never move)
position_min: -219
# position_max: in the size file (lh1_size_<size>.cfg [stepper_y]): the dock row and the shelf slot OK behind row G
homing_speed: 40
homing_positive_dir: False

[stepper_y1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PG9              # Y end stop, front left: homes the left motor independently

# ---- dock lift DLB-1 (ADR-014 #2): one lift bar under all eight bays, raised by a NEMA17 48 mm + Tr8x2 lead-screw motor at the
# dock row's end (CAD); it opens the LTG-1 latch of the ONE carriage seated at a bay.  Driver: TMC5160 SPI stepstick in the main
# Octopus socket 6 (MOTOR_POWER = MOTION_G: the e-stop and the door remove it).  Home = bar DOWN: optical slot sensor, NC
# (broken wire = not home), on the io board (io:PE14, EXP1 breakout): a multi-MCU endstop (Klipper trsync; at 5 mm/s the timing
# error is < 0.2 mm, irrelevant for a 3 mm pad gap).  Every lowering of the bar ends on this switch (_LH_LIFT_DOWN).
# Run 1.3 A (thrust 225.8 N net of the bar, system.yaml dock_lift: = the force audit's figure), home 0.6 A, 5 mm/s.
[stepper_z]
step_pin: head_a:PC15
dir_pin: head_a:PC11
enable_pin: !head_a:PC10
microsteps: 16
rotation_distance: 2           # Tr8x2 lead screw (study 7.1: Z axis as revision G5)
endstop_pin: ^head_a:PD9       # KW10 roller-lever home on the gripper axis cam bar, NC (broken wire reads triggered)
position_endstop: 0
position_min: 0                # the gripper has no eject over-travel
position_max: 345              # params L_Z_TRAVEL
homing_speed: 8
second_homing_speed: 2
homing_retract_dist: 3          # Klipper errors "still triggered after retract" if the NC switch never opens (broken wire); gripper only
homing_positive_dir: False

[manual_stepper z_a]
step_pin: head_a:PD4
dir_pin: head_a:PD3
enable_pin: !head_a:PD5
microsteps: 16
rotation_distance: 2
endstop_pin: ^head_a:PA15      # KW10 roller-lever Z home, NC
position_min: -12             # METHOD B eject over-travel above the normal top: ONLY _LH_EJECT_OVERTRAVEL may go below 0
position_max: 345             # params L_Z_TRAVEL (dock seat at 342 = params L_DOCK_S)
velocity: 25                  # B (23 Nov 2026): corner speed of the NEMA17 48 mm + Tr8x2 at 0.9 A on 24 V (check.py z_speed: full torque kept)
accel: 300

[tmc5160 manual_stepper z_a]
cs_pin: head_a:PB5
spi_bus: spi1
sense_resistor: 0.075
run_current: 0.9
hold_current: 0.6

# ---- carriage A plunger pusher: Nanotec LGA351S12-A-UIAP-038 (ADR-014 #5; captive NEMA 14 with integrated guide, 0.6096 mm
# lead, 38.1 mm stroke, 1.2 A winding RUN AT 0.7 A ONLY): head_a EZ2.  Coordinates: 0 = the RETRACTED switch, which trips
# 0.5 mm before the actuator's internal retract stop (CAD: soft limits 0.5 .. 37.5 mm of actuator stroke = 0 .. 37.0 here).
# Homing (_LH_PUSHER_HOME): <= 0.50 A and <= 2 mm/s, so it can never be driven into the internal end stop above the maker's
# 0.57 A; every pusher move <= 5 mm/s (force audit: 128 N at 5 mm/s against 80 N x 1.5; at 8 mm/s only 115 N).
[manual_stepper pusher_a]
step_pin: head_a:PC9
dir_pin: !head_a:PC8
enable_pin: !head_a:PD2
microsteps: 16
rotation_distance: 0.6096     # LGA351S12-A-UIAP lead 0.6096 mm (datasheet; the 2021 catalogue's 0.635 is superseded): 328.08 full steps/mm, 5249 microsteps/mm
full_steps_per_rotation: 200
endstop_pin: ^head_a:PA10      # pusher RETRACTED switch (sealed subminiature beside the D12 rod collar under the U standoff, 24.6 mm above the bracket: CAD), NC
position_min: -0.6            # only the homing move goes below 0 (to the internal stop at -0.5, at <= 0.50 A); work moves 0 .. 35 (_LH_PUSHER_MOVE)
position_max: 37.0            # CAD soft limit 37.5 mm of actuator stroke (internal stop at 38.1)
velocity: 5                   # force strokes <= 5 mm/s (mechanism audit); the actuator's own ceiling is 13 mm/s at 24 V
accel: 50

[tmc5160 manual_stepper pusher_a]
cs_pin: head_a:PB4
spi_bus: spi1
sense_resistor: 0.075
run_current: 0.7              # 1.2 A winding run at 0.7 A rms: about 128 N at 5 mm/s (maker's curve x 0.7/1.2, INFERENCE; rig CT-0d measures it)
                              # and carriage B's 0.5 mm FFC at 0.35 A rms per conductor (phases on two ways): system.yaml plunger_motor / family.ffc_check
hold_current: 0.35

# ================= head_b: carriage B (Z + pusher) and the gripper jaws =================
[gcode_button estop]
pin: ^PG11                     # FAIL-SAFE: e-stop auxiliary NC (closed to GND while released); pressed OR broken wire -> high -> M112
press_gcode:
    M112

[gcode_button door]
pin: ^PB7                      # FAIL-SAFE: door sensor signalling contact closed to GND while the door is CLOSED; open door OR broken wire -> high
press_gcode:
    PAUSE_FOR_DOOR
release_gcode:
    RESPOND MSG="door closed"

[gcode_button tools_up]
pin: ^!PG10
press_gcode:
    _LH_NOP
release_gcode:
    _LH_NOP

[gcode_button servo_alarm_x]
pin: ^PG14                     # FAIL-SAFE: driver ALM output set to CONDUCT while healthy; alarm OR broken wire -> high -> M112
press_gcode:
    M112

[gcode_button servo_alarm_y]
pin: ^PG15                     # FAIL-SAFE: ALM conducting while healthy
press_gcode:
    M112

[gcode_button servo_alarm_y1]
pin: ^PC0                      # FAIL-SAFE: ALM conducting while healthy (PWR-DET header used as an input)
press_gcode:
    M112

# Tip-check gate (rev K tip station): SEPARATED through-beam pair across A1 (beam along X, about 107 mm span), receiver
# NPN LIGHT-ON to GND while the beam is received, on PF9 via the passive breakout XDA4.  FAIL-SAFE: beam broken, dead
# receiver or broken wire read 'blocked'.  W3 positive reference: the EMITTER's 24 V is switched by TG_SW (FAN5, PD15);
# with the emitter off the receiver must read 'blocked', with it on the clear reference must read 'clear'.
[output_pin tip_gate_power]
pin: PD15
value: 1
shutdown_value: 0              # emitter off after any shutdown: the gate reads 'blocked'

[gcode_button tip_gate]
pin: ^PF9
press_gcode:
    _LH_NOP
release_gcode:
    _LH_NOP

# ================= carriage inputs (head boards), passed through each carriage's flat cable =================
# Z home: KW10 roller levers, NC (endstop_pin above).  Latch (ADR-014): three states on one way through a resistor ladder
# (below: LOCKED / CLOSED-EMPTY / NOT CLOSED; none = wire fault).  Hall code: four unipolar Hall
# switches (open collector, magnet present = output low; '^!': PRESSED = magnet = bit 1; a broken wire reads 0).
# Tool codes have EVEN weight (two or four magnets), so one lost bit always gives an invalid code, never another tool.
# Force switch: D2F on the push-rod, wired NC ('^': PRESSED = force reached OR broken wire).  Contact switch: D2F on the
# pusher pad, NC ('^': PRESSED = pad touching the slider OR broken wire).  Cable loop: two FFC ways looped to GND at the
# carriage end ('^!': PRESSED = cable intact): a pulled flat cable reads 'cable lost' instead of 'empty carriage'.
# Any change of latch or code outside an exchange is a DROPPED TOOL: M112 (XY and everything stop; Z self-locks).
# Family head (CR-L7): the four Hall switches are bought 6.5 mm cylindrical LEADED parts in reamed holes of the coupling
# bracket (no Hall board); latch, force, contact and pusher-retracted switches are sealed subminiature types with factory
# leads.  Carriage A: 20-way 1.0 mm FFC; carriage B: 20-way 0.5 mm FFC, pusher phases on two ways each and one shared
# (doubled) switch return; gripper: 12-way 0.5 mm FFC (jaws-open and gripped switches).  Same MCU pins on both carriages.
# LTG-1 latch state (ADR-014, 23 Nov 2026; CAD latch.SENSE, integration 23 Nov 2026): THREE states read on ONE flat-cable way.
# Each carriage carries two single-edge sealed pin-plunger switches on bracket LSB-L, pressed by flag LSF-L on the jaw: LOCK
# operates when the closing jaw reaches +0.12 mm and stays made closed; EMPTY operates at -0.12 mm (jaw closed empty at -0.54).
# Ladder (lever splices on the bracket, no soldering): Rs 1.0 k in series; R0 22 k node to return; LOCK adds 4.7 k, EMPTY adds 2.0 k,
# read by the MMB's thermistor input PC2 (4.7 k pull-up, UNVERIFIED) as three analog buttons:
#   LOCKED 4.87 k (LOCK only; band 3.9-6.2 k), CLOSED-EMPTY 2.32 k (both made; 1.8-3.1 k), NOT CLOSED (neither) 23.0 k (15-35 k).
# None of the three = LATCH_WIRE fault (broken wire reads infinite, a short 0 ohm): refused like a half-lock.  Klipper's
# buttons.py shares one ADC pin among several analog buttons (as for resistor-ladder display keys): to be confirmed when Klipper
# first loads the file.  Bands are PROVISIONAL: LH_DOCK_STATUS reports the states; the rig (CT-4) sets them.
[gcode_button force_a]
pin: ^head_a:PC7
press_gcode:
    _LH_NOP

[gcode_button contact_a]
pin: ^head_a:PA9
press_gcode:
    _LH_NOP

[gcode_button drawer]
pin: ^!io:PB7
press_gcode:
    _LH_NOP
release_gcode:
    _LH_NOP

# Tip-bin full: IR through-beam pair 30 mm below the crate rim, receiver NPN LIGHT-ON ('^!': PRESSED = beam received =
# NOT full; dead receiver, blocked beam or broken wire = full = hold).
[gcode_button bin_clear]
pin: ^!io:PB6
press_gcode:
    _LH_NOP
release_gcode:
    _LH_NOP

# Liquid-waste bottles (two streams, station LW-1 at B3): capacitive level switches set to output ON (NPN, conducting) while the level is
# BELOW 80 % ('^!': PRESSED = not full; full, dead sensor or broken wire = full = hold).  Via the passive breakout XDB4.
[output_pin vc2_light]
pin: io:PA8
value: 0
shutdown_value: 0

# UV-C OPTION (not fitted in the first build): io HE1 drives the coil of the interface relay K_UV whose contact feeds the
# UV ballast from the MOTION branch F24 (after KM1/KM2 e-stop AND KM3/KM4 door contactors: an open door removes UV power
# in hardware).  Only LH_UV may set it, and only with the option fitted, the door closed AND guard-locked, and no ethanol
# step active.  shutdown_value 0.
[gcode_macro _LH_THERM]
variable_on: 0                         # 1 after a successful LH_THERM_ON (proof test passed)
variable_fault: ""                     # latched: RELAY_WELDED, CHAIN_OPEN, WATCHDOG_FAIL, WATCHDOG_NO_REARM, HOST_SILENT
variable_hb_left: 0                    # seconds of host silence still tolerated
variable_hb_budget_s: 15               # host must send LH_HEARTBEAT at least this often while THERM is on
variable_wd_timeout_s: 3               # WDOG timeout setting (DIP/config on the relay): MUST match
variable_wd_rearm_s: 2
variable_pulse_duty: 0.5
variable_weld_ms: 300                  # relay commanded off -> mirror closed within this
variable_lid_max_c: 110                # retired TCB-1 lid_limits 30..110
variable_lid_min_c: 30
gcode:

[delayed_gcode _LH_WD_TICK]
initial_duration: 1.0
gcode:
    {% set t = printer["gcode_macro _LH_THERM"] %}
    {% if t.on %}
    {% if t.hb_left <= 0 %}
    SET_PIN_BASE PIN=wd_heartbeat VALUE=0
    SET_GCODE_VARIABLE_BASE MACRO=_LH_THERM VARIABLE=on VALUE=0
    SET_GCODE_VARIABLE_BASE MACRO=_LH_THERM VARIABLE=fault VALUE='"HOST_SILENT"'
    SET_PIN_BASE PIN=therm_enable VALUE=0
    SET_HEATER_TEMPERATURE_BASE HEATER=lid_heater TARGET=0
    RESPOND TYPE=error MSG="LH_THERM FAULT=HOST_SILENT: no LH_HEARTBEAT for {t.hb_budget_s} s, THERM off"
    {% else %}
    SET_GCODE_VARIABLE_BASE MACRO=_LH_THERM VARIABLE=hb_left VALUE={t.hb_left - 1}
    {% endif %}
    {% endif %}
    UPDATE_DELAYED_GCODE_BASE ID=_LH_WD_TICK DURATION=1

[gcode_macro LH_HEARTBEAT]
description: Host keep-alive.  Must arrive at least every hb_budget_s (15 s) while THERM is on, or Klipper stops the watchdog heartbeat and THERM drops.  Reply: none
gcode:
    SET_GCODE_VARIABLE_BASE MACRO=_LH_THERM VARIABLE=hb_left VALUE={printer["gcode_macro _LH_THERM"].hb_budget_s}

[gcode_macro LH_THERM_ON]
description: Arm THERM (TC-1 block controller and lid heater power) after proving the contactor and the watchdog.  Refused while a THERM fault is latched or the door/e-stop path is open.  Reply: LH_THERM RESULT=ON
gcode:
    {% set t = printer["gcode_macro _LH_THERM"] %}
    {% if t.fault %}{action_raise_error("LH_THERM_ON refused: fault %s latched (LH_THERM_CLEAR CONFIRM=1 after inspection)" % t.fault)}{% endif %}
    {% if printer["gcode_button cab_fan_ok_1"].state != "PRESSED" or printer["gcode_button cab_fan_ok_2"].state != "PRESSED" %}{action_raise_error("LH_THERM_ON refused: COMPARTMENT_FAN: a control-compartment fan reports stopped (rotation detect) or its wire is broken: about 10 K more rise with one fan (check)")}{% endif %}
    SET_PIN_BASE PIN=therm_enable VALUE=0
    G4 P{t.weld_ms}
    M400
    _LH_THERM_EXPECT RELAY=off CODE=RELAY_WELDED
    SET_GCODE_VARIABLE_BASE MACRO=_LH_THERM VARIABLE=hb_left VALUE={t.hb_budget_s}
    SET_PIN_BASE PIN=wd_heartbeat VALUE={t.pulse_duty}
    G4 P{t.wd_rearm_s * 1000}
    SET_PIN_BASE PIN=therm_enable VALUE=1
    G4 P{t.weld_ms}
    M400
    _LH_THERM_EXPECT RELAY=on CODE=CHAIN_OPEN
    SET_PIN_BASE PIN=wd_heartbeat VALUE=0
    G4 P{(t.wd_timeout_s + 1) * 1000}
    M400
    _LH_THERM_EXPECT RELAY=off CODE=WATCHDOG_FAIL
    SET_PIN_BASE PIN=wd_heartbeat VALUE={t.pulse_duty}
    G4 P{t.wd_rearm_s * 1000}
    M400
    _LH_THERM_EXPECT RELAY=on CODE=WATCHDOG_NO_REARM
    SET_GCODE_VARIABLE_BASE MACRO=_LH_THERM VARIABLE=on VALUE=1
    RESPOND TYPE=command MSG="LH_THERM RESULT=ON"

[gcode_macro LH_THERM_OFF]
description: Remove THERM (lid heater target 0, contactor off) and check the contactor really opened (weld check).  Reply: LH_THERM RESULT=OFF
gcode:
    {% set t = printer["gcode_macro _LH_THERM"] %}
    SET_HEATER_TEMPERATURE_BASE HEATER=lid_heater TARGET=0
    SET_PIN_BASE PIN=therm_enable VALUE=0
    SET_GCODE_VARIABLE_BASE MACRO=_LH_THERM VARIABLE=on VALUE=0
    G4 P{t.weld_ms}
    M400
    _LH_THERM_EXPECT RELAY=off CODE=RELAY_WELDED
    RESPOND TYPE=command MSG="LH_THERM RESULT=OFF"

[gcode_macro _LH_THERM_EXPECT]
description: internal: RELAY=on|off CODE=<fault>.  Reads the TC_RELAY mirror NOW; on a mismatch latches the fault, removes the enable and the heartbeat, and stops (M112 for a weld: the stopped heartbeat makes WDOG drop KM5 too)
gcode:
    {% set off = printer["gcode_button therm_mirror"].state == "PRESSED" %}
    {% set want_off = params.RELAY == "off" %}
    {% if off != want_off %}
    _LH_THERM_FAULT CODE={params.CODE}
    {% endif %}

[gcode_macro _LH_THERM_FAULT]
gcode:
    SET_PIN_BASE PIN=therm_enable VALUE=0
    SET_PIN_BASE PIN=wd_heartbeat VALUE=0
    SET_HEATER_TEMPERATURE_BASE HEATER=lid_heater TARGET=0
    SET_GCODE_VARIABLE_BASE MACRO=_LH_THERM VARIABLE=on VALUE=0
    SET_GCODE_VARIABLE_BASE MACRO=_LH_THERM VARIABLE=fault VALUE='"{params.CODE}"'
    RESPOND TYPE=error MSG="LH_THERM FAULT={params.CODE}"
    {% if params.CODE == "RELAY_WELDED" %}
    M112
    {% endif %}
    _LH_THERM_RAISE CODE={params.CODE}

[gcode_macro _LH_THERM_RAISE]
gcode:
    {action_raise_error("LH_THERM FAULT=%s: THERM off" % params.CODE)}

[gcode_macro LH_THERM_CLEAR]
description: CONFIRM=1.  PERSON ONLY, after inspecting the contactor, coil chain and watchdog: clears a latched THERM fault
gcode:
    {% if params.CONFIRM|default(0)|int != 1 %}{action_raise_error("LH_THERM_CLEAR: a person must confirm with CONFIRM=1 after inspection")}{% endif %}
    SET_GCODE_VARIABLE_BASE MACRO=_LH_THERM VARIABLE=fault VALUE='""'
    RESPOND TYPE=command MSG="LH_THERM RESULT=CLEARED"

[gcode_macro LH_THERM_STATUS]
description: Reply: LH_THERM ON=<0|1> RELAY=<ON|OFF> COLD_RELAY=<ON|OFF> HB_LEFT=<s> LID_C=<t> LID_TARGET=<t> FAULT=<code|NONE>
gcode:
    {% set t = printer["gcode_macro _LH_THERM"] %}
    {% set h = printer["heater_generic lid_heater"] %}
    RESPOND TYPE=command MSG="LH_THERM ON={t.on} RELAY={'OFF' if printer['gcode_button therm_mirror'].state == 'PRESSED' else 'ON'} COLD_RELAY={'OFF' if printer['gcode_button tb_mirror'].state == 'PRESSED' else 'ON'} HB_LEFT={t.hb_left} LID_C={'%.1f' % h.temperature} LID_TARGET={'%.1f' % h.target} FAULT={t.fault if t.fault else 'NONE'}"

[gcode_macro LH_LID_HEATER]
description: TARGET=<C>.  0 = off, otherwise lid_min_c..lid_max_c (30..110).  Refused unless THERM is on.  Reply: LH_LID_HEATER TARGET=<t>
gcode:
    {% set t = printer["gcode_macro _LH_THERM"] %}
    {% set c = params.TARGET|float %}
    {% if c != 0 and (c < t.lid_min_c or c > t.lid_max_c) %}{action_raise_error("LH_LID_HEATER refused: TARGET %.1f outside %d..%d C (0 = off)" % (c, t.lid_min_c, t.lid_max_c))}{% endif %}
    {% if c != 0 and not t.on %}{action_raise_error("LH_LID_HEATER refused: THERM is off (LH_THERM_ON first)")}{% endif %}
    SET_HEATER_TEMPERATURE_BASE HEATER=lid_heater TARGET={c}
    RESPOND TYPE=command MSG="LH_LID_HEATER TARGET={'%.1f' % c}"

# ---- lid state machine (rules from the retired firmware/tcb1/lid.py; system.yaml ease_of_build.lid_rules_carried_over) ----
[gcode_macro _LH_LID]
variable_fault: ""                     # latched: OBSTRUCTION, LID_STALL, TOOLS_DOWN, CLAMP_TIMEOUT, BEAM_SENSOR, GATE_WELDED, GATE_OPEN, LID_SENSOR, DOOR_OPEN, GRIPPER_UNKNOWN
variable_homed: 0                      # slide referenced at OPEN since restart
variable_pos: 0.0                      # tracked slide position (0 = OPEN)
variable_closed_mm: 110.5              # TCB-1 config: travel 110 + end 0.5 onto the CLOSED sensor
variable_margin_mm: 8.0
variable_clamp_down_mm: 11.0
variable_slide_speed: 40.0
variable_home_speed: 10.0
variable_clamp_speed: 4.0
variable_beam_off_ms: 200              # emitter off -> gate must drop within this (TCB beam_test_s 0.05 + relay drop-out)
variable_beam_clear_ms: 300            # emitter on -> gate must be on (TCB beam_clear_s 0.2 + relay pick-up)
variable_open_max_lid_c: 45            # LH_LID_OPEN refused above this lid temperature unless FORCE=1 (TCB unsealed_max_c)
gcode:

[gcode_macro _LH_LID_GUARD]
description: internal: WHO=<macro>.  Every refusal of the retired lid firmware that Klipper can see
gcode:
    {% set s = printer["gcode_macro _LH_STATE"] %}
    {% set l = printer["gcode_macro _LH_LID"] %}
    {% if l.fault %}{action_raise_error("%s refused: lid fault %s latched (LH_LID_CLEAR)" % (params.WHO, l.fault))}{% endif %}
    {% if not s.homed or printer.toolhead.homed_axes != "xyz" %}{action_raise_error("%s refused: not homed since restart/e-stop (G28)" % params.WHO)}{% endif %}
    {% if printer["gcode_button door"].state == "PRESSED" %}{action_raise_error("%s refused: DOOR_OPEN" % params.WHO)}{% endif %}
    {% if printer["gcode_button tools_up"].state != "PRESSED" or printer.toolhead.position.z > 0.01 or s.zpos_z_a > 0.01 or s.zpos_z_b > 0.01 %}{action_raise_error("%s refused: TOOLS_DOWN (every tool must be up and the all-tools-up chain closed)" % params.WHO)}{% endif %}
    {% if s.grip == 0 %}{action_raise_error("%s refused: GRIPPER_UNKNOWN (gripper state unknown since restart)" % params.WHO)}{% endif %}
    {% if printer["gcode_button lid_closed"].state == "PRESSED" and printer["gcode_macro _LH_LID"].homed and l.pos < 1.0 %}{action_raise_error("%s refused: LID_SENSOR (closed sensor active at the open position)" % params.WHO)}{% endif %}

[gcode_macro _LH_LID_FAULT]
description: internal: CODE=<fault>.  Cuts the gate (emitter off), latches the fault and stops
gcode:
    SET_PIN PIN=beam_emitter VALUE=0
    SET_GCODE_VARIABLE_BASE MACRO=_LH_LID VARIABLE=fault VALUE='"{params.CODE}"'
    RESPOND TYPE=error MSG="LH_LID FAULT={params.CODE}"
    _LH_LID_RAISE CODE={params.CODE}

[gcode_macro _LH_LID_RAISE]
gcode:
    {action_raise_error("LH_LID FAULT=%s: lid stopped where it is" % params.CODE)}

[gcode_macro _LH_GATE_EXPECT]
description: internal: STATE=on|off CODE=<fault>.  Reads the K_TU readback NOW
gcode:
    {% set on = printer["gcode_button lid_gate"].state == "RELEASED" %}
    {% if on != (params.STATE == "on") %}
    _LH_LID_FAULT CODE={params.CODE}
    {% endif %}

[gcode_macro _LH_BEAM_TEST]
description: internal: emitter OFF -> the gate must drop (a stuck receiver output or a welded K_TU fails here); emitter ON -> the gate must pull in and stay in (beam clear)
gcode:
    {% set l = printer["gcode_macro _LH_LID"] %}
    SET_PIN PIN=beam_emitter VALUE=0
    G4 P{l.beam_off_ms}
    M400
    _LH_GATE_EXPECT STATE=off CODE=GATE_WELDED
    SET_PIN PIN=beam_emitter VALUE=1
    G4 P{l.beam_clear_ms}
    M400
    _LH_GATE_EXPECT STATE=on CODE=OBSTRUCTION

[gcode_macro _LH_LID_AFTER]
description: internal: KIND=closed|open|sealed|up.  After a counted move: gate still on (else OBSTRUCTION), end sensor active (else LID_STALL / CLAMP_TIMEOUT)
gcode:
    {% set gate_on = printer["gcode_button lid_gate"].state == "RELEASED" %}
    {% set k = params.KIND %}
    {% set ok = {"closed": printer["gcode_button lid_closed"].state == "PRESSED", "sealed": printer["gcode_button clamp_sealed"].state == "PRESSED", "open": printer["gcode_button lid_closed"].state != "PRESSED", "up": printer["gcode_button clamp_sealed"].state != "PRESSED"}[k] %}
    {% if not gate_on %}
    _LH_LID_FAULT CODE=OBSTRUCTION
    {% elif not ok %}
    _LH_LID_FAULT CODE={"LID_STALL" if k in ("closed", "open") else "CLAMP_TIMEOUT"}
    {% endif %}

[gcode_macro LH_LID_HOME]
description: Reference the lid slide at OPEN (slow) after raising the clamp.  Reply: LH_LID RESULT=OPEN
gcode:
    {% set l = printer["gcode_macro _LH_LID"] %}
    {% if not printer["gcode_macro _LH_STATE"].homed %}{action_raise_error("LH_LID_HOME refused: not homed since restart/e-stop (G28)")}{% endif %}
    M400
    _LH_LID_GUARD WHO=LH_LID_HOME
    _LH_BEAM_TEST
    MANUAL_STEPPER_BASE STEPPER=tc_lid_clamp SET_POSITION=12.5
    MANUAL_STEPPER_BASE STEPPER=tc_lid_clamp SPEED={l.clamp_speed} MOVE=0 STOP_ON_ENDSTOP=home
    M400
    _LH_LID_AFTER KIND=up
    MANUAL_STEPPER_BASE STEPPER=tc_lid_slide SET_POSITION=118
    MANUAL_STEPPER_BASE STEPPER=tc_lid_slide SPEED={l.home_speed} MOVE=0 STOP_ON_ENDSTOP=home
    M400
    _LH_LID_AFTER KIND=open
    SET_GCODE_VARIABLE_BASE MACRO=_LH_LID VARIABLE=homed VALUE=1
    SET_GCODE_VARIABLE_BASE MACRO=_LH_LID VARIABLE=pos VALUE=0.0
    SET_PIN PIN=beam_emitter VALUE=0
    RESPOND TYPE=command MSG="LH_LID RESULT=OPEN"

[gcode_macro LH_LID_CLOSE]
description: Close and seal the lid: beam test, clamp up, slide to CLOSED, clamp down to SEALED.  Reply: LH_LID RESULT=SEALED
gcode:
    {% set l = printer["gcode_macro _LH_LID"] %}
    M400
    _LH_LID_GUARD WHO=LH_LID_CLOSE
    {% if not l.homed %}{action_raise_error("LH_LID_CLOSE refused: lid position unknown (LH_LID_HOME)")}{% endif %}
    _LH_BEAM_TEST
    MANUAL_STEPPER_BASE STEPPER=tc_lid_clamp SET_POSITION=12.5
    MANUAL_STEPPER_BASE STEPPER=tc_lid_clamp SPEED={l.clamp_speed} MOVE=0 STOP_ON_ENDSTOP=home
    M400
    _LH_LID_AFTER KIND=up
    MANUAL_STEPPER_BASE STEPPER=tc_lid_slide MOVE={l.closed_mm} SPEED={l.slide_speed} SYNC=1
    SET_GCODE_VARIABLE_BASE MACRO=_LH_LID VARIABLE=pos VALUE={l.closed_mm}
    M400
    _LH_LID_AFTER KIND=closed
    MANUAL_STEPPER_BASE STEPPER=tc_lid_clamp MOVE={l.clamp_down_mm} SPEED={l.clamp_speed} SYNC=1
    M400
    _LH_LID_AFTER KIND=sealed
    SET_PIN PIN=beam_emitter VALUE=0
    RESPOND TYPE=command MSG="LH_LID RESULT=SEALED"

[gcode_macro LH_LID_OPEN]
description: [FORCE=1].  Raise the clamp and slide the lid to OPEN.  Refused above 45 C lid temperature unless FORCE=1 (block warm-before-open is a host rule).  Reply: LH_LID RESULT=OPEN
gcode:
    {% set l = printer["gcode_macro _LH_LID"] %}
    M400
    _LH_LID_GUARD WHO=LH_LID_OPEN
    {% if not l.homed %}{action_raise_error("LH_LID_OPEN refused: lid position unknown (LH_LID_HOME)")}{% endif %}
    {% if printer["heater_generic lid_heater"].temperature > l.open_max_lid_c and params.FORCE|default(0)|int != 1 %}{action_raise_error("LH_LID_OPEN refused: lid at %.1f C > %d C (FORCE=1 to override)" % (printer["heater_generic lid_heater"].temperature, l.open_max_lid_c))}{% endif %}
    _LH_BEAM_TEST
    MANUAL_STEPPER_BASE STEPPER=tc_lid_clamp SET_POSITION=12.5
    MANUAL_STEPPER_BASE STEPPER=tc_lid_clamp SPEED={l.clamp_speed} MOVE=0 STOP_ON_ENDSTOP=home
    M400
    _LH_LID_AFTER KIND=up
    MANUAL_STEPPER_BASE STEPPER=tc_lid_slide SET_POSITION={l.pos + l.margin_mm}
    MANUAL_STEPPER_BASE STEPPER=tc_lid_slide SPEED={l.slide_speed} MOVE=0 STOP_ON_ENDSTOP=home
    SET_GCODE_VARIABLE_BASE MACRO=_LH_LID VARIABLE=pos VALUE=0.0
    M400
    _LH_LID_AFTER KIND=open
    SET_PIN PIN=beam_emitter VALUE=0
    RESPOND TYPE=command MSG="LH_LID RESULT=OPEN"

[gcode_macro LH_LID_CLEAR]
description: Clear a latched lid fault (the lid position becomes unknown: LH_LID_HOME next).  Reply: LH_LID RESULT=CLEARED
gcode:
    SET_GCODE_VARIABLE_BASE MACRO=_LH_LID VARIABLE=fault VALUE='""'
    SET_GCODE_VARIABLE_BASE MACRO=_LH_LID VARIABLE=homed VALUE=0
    SET_PIN PIN=beam_emitter VALUE=0
    RESPOND TYPE=command MSG="LH_LID RESULT=CLEARED"

[gcode_macro LH_LID_STATUS]
description: Reply: LH_LID STATE=<OPEN|CLOSED|SEALED|UNKNOWN> GATE=<0|1> TOOLS_UP=<0|1> FAULT=<code|NONE>
gcode:
    {% set l = printer["gcode_macro _LH_LID"] %}
    {% set closed = printer["gcode_button lid_closed"].state == "PRESSED" %}
    {% set sealed = printer["gcode_button clamp_sealed"].state == "PRESSED" %}
    {% set st = "UNKNOWN" if not l.homed else ("SEALED" if closed and sealed else ("CLOSED" if closed else ("OPEN" if l.pos < 1.0 else "UNKNOWN"))) %}
    RESPOND TYPE=command MSG="LH_LID STATE={st} GATE={1 if printer['gcode_button lid_gate'].state == 'RELEASED' else 0} TOOLS_UP={1 if printer['gcode_button tools_up'].state == 'PRESSED' else 0} FAULT={l.fault if l.fault else 'NONE'}"


# Control-compartment fans (21 Nov CAD: two 92 mm intake fans, always on): rotation-detect output of each fan, open collector,
# LOW while the fan turns ('^!': PRESSED = turning; stopped fan, dead output or broken wire = RELEASED = failed).  A failure is
# reported and LH_THERM_ON is refused (the compartment's 139 W with one fan gives about a 10 K rise: check.py air).
[gcode_button cab_fan_ok_1]
pin: ^!io:PF0
press_gcode:
    _LH_NOP
release_gcode:
    RESPOND TYPE=error MSG="COMPARTMENT_FAN 1 stopped or its rotation-detect wire is broken: no new THERM; a person checks the fan"

[gcode_macro LH_SHAKER]
description: STATE=IDLE|RUNNING.  Host-declared heater-shaker state (after reading the device back): descents at the shaker place are refused unless IDLE.  Reply: LH_SHAKER STATE=<state>
variable_state: "UNKNOWN"
gcode:
    {% set st = params.STATE|default("")|upper %}
    {% if st not in ("IDLE", "RUNNING") %}{action_raise_error("LH_SHAKER: STATE must be IDLE or RUNNING")}{% endif %}
    SET_GCODE_VARIABLE_BASE MACRO=LH_SHAKER VARIABLE=state VALUE='"{st}"'
    RESPOND TYPE=command MSG="LH_SHAKER STATE={st}"

[respond]

[idle_timeout]
timeout: 86400                 # keep axes energised through long incubations
gcode:
    M84
# (M84 is the wrapper below: it clears the homed state before the motors go off.)

# ================= homing and the 'homed since restart' state =================
# Every G28 runs this whole sequence.  00 (ADR-014): the dock lift bar is homed DOWN first, before any Z move: lowering the bar
# only lets the closing springs shut a latch, it never forces one, so after a power cut, an e-stop or a hold inside the dock
# every seated carriage either re-latches its tool (stud still in the jaw: tool on the carriage, still on the bay pins) or
# closes empty (stud below the jaw: tool stays in its bay); a jaw that closes on the stud's cone reads NOT CLOSED and homing is
# refused (a person).  No tool can drop: whenever the jaw is open the tool stands on the bay pins.  0: POWER-UP READ: both carriages' code, latch and cable loop are read BEFORE any
# move; each must be either empty (code 0000, latch not made) or a locked valid tool, otherwise homing is refused
# (HALF_LOCK: a person must seat or remove the tool).  1: gripper Z up (G28 Z, with Klipper's 3 mm retract: the gripper
# never carries a pipette tool).  2: carriages A and B up onto their NC home switches.  3: the hardware tools-up chain
# (three Z_UP switches, PG10) must read closed before ANY downward move.  4: back-off-and-retrigger (3 mm down, error if
# the switch never opens) ONLY on an EMPTY carriage: a carriage with a tool is homed with Z UP ONLY (head_l guard
# POWER-UP); its home-switch wire is then covered by the tools-up chain alone.  5: pushers retracted (tips in air).
# 6: chain and carriages checked again, then X FIRST (toward +X, which is the dock row's entry end), then Y: if the head
# stopped inside the dock row it leaves it at the right end, never across the bays.  The gripper jaws are NOT moved.
# A carriage found carrying a tool is marked 'tips possibly on' and 'nozzle not checked': it must eject and pass
# LH_NOZZLE_CHECK at the tip gate before any work.
[homing_override]
axes: xyz
gcode:
    {% set grip0 = printer['gcode_macro _LH_STATE'].grip %}
    {% set pf = printer['gcode_macro _LH_PROFILE'] %}
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=homed VALUE=0
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=exch VALUE=0
    M400
    {% if "dock" not in pf.absent %}
    _LH_LIFT_HOME
    M400
    {% endif %}
    _LH_POWERUP_READ
    _LH_Z_NOMINAL
    {% if "gripper" not in pf.absent %}
    G28 Z
    {% else %}
    RESPOND MSG="homing: no gripper axis in build {pf.name}: the Z axis is held at 0 (homing_override set_position_z), never moved"
    {% endif %}
    {% for c in pf.carriages %}
    MANUAL_STEPPER_BASE STEPPER=z_{c} SET_POSITION=347
    MANUAL_STEPPER_BASE STEPPER=z_{c} SPEED=8 MOVE=0 STOP_ON_ENDSTOP=home
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=zpos_z_{c} VALUE=0
    {% endfor %}
    M400
    _LH_REQUIRE_TOOLS_UP WHO=homing
    {% for c in pf.carriages %}
    _LH_ZBACKOFF C={c}
    {% endfor %}
    {% for c in pf.carriages %}
    {% if c in pf.fixed_tools %}
    _LH_PUSHER_FIND C={c}
    {% else %}
    _LH_PUSHER_HOME C={c}
    {% endif %}
    {% endfor %}
    M400
    _LH_REQUIRE_TOOLS_UP WHO=homing
    _LH_TOOLS_LOCKED WHO=homing
    G28 X
    G28 Y
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=homed VALUE=1
    RESPOND MSG="homed: Z x3 up, pushers retracted, X then Y homed; gripper state {['UNKNOWN', 'OPEN', 'CLOSED'][grip0]}"

[gcode_macro _LH_POWERUP_READ]
description: internal: after the bar is homed down and before any Z move, read each carriage (cable loop, latch state, Hall code); refuse unless empty (code 0000, latch CLOSED-EMPTY) or a valid tool LOCKED; record the mounted tool
gcode:
    {% set d = printer["gcode_macro _LH_TOOLDEF"] %}
    {% set pf = printer["gcode_macro _LH_PROFILE"] %}
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=nozzle_seen VALUE='","'
    {% for c in pf.carriages %}
    {% if c in pf.fixed_tools %}
    {% if pf.fixed_tools[c] not in d.codes %}{action_raise_error("homing refused: carriage %s fixed tool %s is not in _LH_TOOLDEF (build %s)" % (c, pf.fixed_tools[c], pf.name))}{% endif %}
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=mounted_{c} VALUE='"{pf.fixed_tools[c]}"'
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=tips_{c} VALUE=-1
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=nozzle_ok_{c} VALUE=0
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=contact_{c} VALUE=-1.0
    {% else %}
    {% set ns = namespace(code=0) %}
    {% for i in range(4) %}{% if printer["gcode_button hall_" ~ c ~ i].state == "PRESSED" %}{% set ns.code = ns.code + 2 ** i %}{% endif %}{% endfor %}
    {% set lk = "locked" if printer["gcode_button latch_" ~ c].state == "PRESSED" else ("empty" if printer["gcode_button latch_" ~ c ~ "_empty"].state == "PRESSED" else ("open" if printer["gcode_button latch_" ~ c ~ "_open"].state == "PRESSED" else "fault")) %}
    {% if printer["gcode_button cable_" ~ c].state != "PRESSED" %}{action_raise_error("homing refused: carriage %s flat cable lost (CABLE): its code and latch cannot be read" % c)}{% endif %}
    {% if lk == "fault" %}{action_raise_error("homing refused: carriage %s LATCH_WIRE: the latch ladder reads no state (broken or shorted wire)" % c)}{% endif %}
    {% if ns.code != 0 and lk != "locked" %}{action_raise_error("homing refused: carriage %s HALF_LOCK (code %d, latch %s after the bar went down): a person must seat or remove the tool" % (c, ns.code, lk))}{% endif %}
    {% if ns.code == 0 and lk == "locked" %}{action_raise_error("homing refused: carriage %s latch reads locked with no tool code (MISSING_CODE: latch switch or Hall supply fault)" % c)}{% endif %}
    {% if ns.code == 0 and lk == "open" %}{action_raise_error("homing refused: carriage %s LATCH_OPEN with no tool after the bar went down (closing springs or toggle): a person" % c)}{% endif %}
    {% set names = [] %}{% for t, v in d.codes.items() %}{% if v == ns.code %}{% set _ = names.append(t) %}{% endif %}{% endfor %}
    {% if ns.code != 0 and not names %}{action_raise_error("homing refused: carriage %s invalid tool code %d (a Hall bit lost)" % (c, ns.code))}{% endif %}
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=mounted_{c} VALUE='"{names[0] if names else ""}"'
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=tips_{c} VALUE={(0 - 1) if names else 0}
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=nozzle_ok_{c} VALUE=0
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=contact_{c} VALUE=-1.0
    {% endif %}
    {% endfor %}

[gcode_macro _LH_ZBACKOFF]
description: internal: C=a|b.  Back-off-and-retrigger of an EMPTY carriage's Z home (detects a broken home-switch wire); a carriage with a tool is homed up only
gcode:
    {% set c = params.C %}
    {% set m = printer["gcode_macro _LH_STATE"]["mounted_" ~ c] %}
    {% if printer["gcode_macro _LH_STATE"]["mounted_" ~ c] == "" %}
    MANUAL_STEPPER_BASE STEPPER=z_{c} SPEED=2 MOVE=3 STOP_ON_ENDSTOP=inverted_probe
    MANUAL_STEPPER_BASE STEPPER=z_{c} SPEED=1 MOVE=0 STOP_ON_ENDSTOP=home
    {% else %}
    RESPOND MSG="carriage {c} carries {m}: Z homed up only; eject and LH_NOZZLE_CHECK before work"
    {% endif %}

[gcode_macro _LH_REQUIRE_TOOLS_UP]
description: internal: refuses unless the all-tools-up chain (PG10) reads closed
gcode:
    {% if printer["gcode_button tools_up"].state != "PRESSED" %}{action_raise_error("%s refused: the all-tools-up chain is open (a Z axis is not at its top, a Z-up switch or its wire is faulty)" % params.WHO|default("move"))}{% endif %}

[gcode_macro _LH_STATE]
variable_homed: 0                     # 1 only after the full homing_override since the last restart
variable_homing_time_s: 230           # worst-case G28 duration (ADR-014: + dock lift bar, pushers at 2 mm/s) (check.py recomputes it): the host's G28 timeout must exceed it
variable_grip: 0                      # 0 UNKNOWN (after restart), 1 OPEN, 2 CLOSED
variable_zpos_z_a: 0.0
variable_zpos_z_b: 0.0
variable_pos_a: -1.0                  # pusher positions, -1 = unknown
variable_pos_b: -1.0
variable_mounted_a: ""                # tool on carriage A by its code ('' = empty)
variable_mounted_b: ""
variable_tips_a: 0                    # 0 = none (observed), 1 = on (observed: force switch / tip gate), -1 = UNKNOWN (power-up with a tool,
variable_tips_b: 0                    #   ejected or parked and not yet observed): UNKNOWN blocks the dock, pick-up and reuse (A4 / V7)
variable_nozzle_seen: ","             # tools whose nozzle row passed LH_NOZZLE_CHECK since restart (",M300,M50,"): cleared by M84 / hold clear / homing
variable_nozzle_ok_a: 0               # 1 after LH_NOZZLE_CHECK passed for the mounted tool
variable_nozzle_ok_b: 0
variable_contact_a: -1.0              # pusher position where the slider was found after the pick-up (-1 = not found)
variable_contact_b: -1.0
variable_exch: 0                      # 1 while LH_TOOL_PICK / LH_TOOL_PARK is inside the dock (latch/code changes expected)
variable_hold: ""                     # latched MOTION hold: HALF_LOCK WRONG_TOOL BAY_DISAGREE TOOL_NOT_RELEASED CONTACT
variable_phold: ""                    # latched PROCESS hold: AIRFLOW (pipetting and UV refused; XY, gripper, eject, park allowed)
variable_ethanol: 0                   # 1 between LH_ETHANOL STATE=BEGIN and END
variable_tip_mask: 0
variable_seated: 0
variable_gap_mask: 0
gcode:
    RESPOND MSG="homed={printer['gcode_macro _LH_STATE'].homed} grip={printer['gcode_macro _LH_STATE'].grip}"

[gcode_macro _LH_NOP]
gcode:

# ---- build profile (24 Nov 2026): FULL = every device of the size.  A reduced build (lh1_profile_<name>.cfg, e.g. the MVP:
# one carriage with a fixed tool) replaces these variables; the shared macros below read them so the SAME guards run in
# every build: an absent device group's commands refuse DEVICE_ABSENT, an absent carriage CARRIAGE_ABSENT, and a carriage
# whose tool is fixed by screws is DECLARED (fixed_tools), never read as if its latch and Hall code were sensed.
[gcode_macro _LH_PROFILE]
variable_name: "FULL"
variable_absent: []                   # device groups not fitted (carriage_a, gripper, dock, thermocycler, modules, shaker, tip_parking, extraction, uv, lights, ...)
variable_carriages: ["a", "b"]        # tool carriages fitted
variable_fixed_tools: {}              # carriage -> tool fixed by screws / a manual clamp (no latch, no Hall code): declared
gcode:

# ---- tool definitions: Hall codes (EVEN weight, so one lost bit can never read as another tool), pusher stroke tables,
# tip types, nozzle heights (params L_NOZZLE_TOP_Z), pick-up windows and gate strokes.  Strokes from the head_l report
# tools.*.stroke (blow-out); first stops and ul_per_mm are NOMINAL until the gravimetric table (T-P2-01..03) replaces them.
# SYR (family, cr_answers open_question_syringe_stroke): a 10 mL luer-lock syringe DRIVEN DIRECTLY by the pusher (no lever),
# plunger travel = pusher travel.  CAD syringe_tool (21 Nov 2026): contact window 3 mm (lock-nutted M4 stop screw in the
# pusher pad, set with a 3 mm gauge) + plunger travel 32 mm = the 35 mm pusher stroke (no margin left: a contact found
# beyond 3 mm is a HOLD CONTACT for SYR, contact_hi_tool); 32 mm x 165 mm2 = 5.28 mL per fill (14.5 mm bore ASSUMED); first
# stop 31.5 mm, so at most 5.2 mL per dispense (vmax).  A bought return spring (CAD: 5.2 N out, 16.4 N at full stroke,
# UNVERIFIED, measure on the rig) makes the plunger follow the pusher up to refill.  SYR is an
# OPTIONAL tool: armed in the table (its stroke now fits), but every pipetting command refuses it until the rig has
# proved it and commissioned is set to 1 here (_LH_PIPETTE_GUARD).  It takes no tips (no pick-up, tip check or eject).
[gcode_macro _LH_TOOLDEF]
variable_codes: {"M10": 3, "M50": 5, "M300": 6, "S10": 9, "S100": 10, "S1000": 12, "SYR": 15}
variable_tip: {"M10": "p10", "M50": "p200", "M300": "p300", "S10": "p10", "S100": "p200", "S1000": "p1000", "SYR": ""}
variable_eight: {"M10": 1, "M50": 1, "M300": 1, "S10": 0, "S100": 0, "S1000": 0, "SYR": 0}
variable_armed: {"M10": 1, "M50": 1, "M300": 1, "S10": 1, "S100": 1, "S1000": 1, "SYR": 1}
variable_optional: {"SYR": 1}             # optional tools: refused until commissioned below
variable_commissioned: {"SYR": 0}         # set 1 only after the rig syringe tests (CT-SYR) pass
variable_first_stop: {"M10": 12.0, "M50": 14.0, "M300": 17.0, "S10": 12.0, "S100": 14.0, "S1000": 22.0, "SYR": 31.5}
variable_blowout: {"M10": 15.0, "M50": 18.0, "M300": 22.0, "S10": 15.0, "S100": 18.0, "S1000": 28.0, "SYR": 32.0}
variable_vmax: {"M10": 10.0, "M50": 50.0, "M300": 300.0, "S10": 10.0, "S100": 100.0, "S1000": 1000.0, "SYR": 5200.0}
variable_ul_per_mm: {"M10": 0.8333, "M50": 3.5714, "M300": 17.647, "S10": 0.8333, "S100": 7.1429, "S1000": 45.455, "SYR": 165.1}
variable_noz_top: {"M10": 360.0, "M50": 360.0, "M300": 360.0, "S10": 360.0, "S100": 360.0, "S1000": 390.0, "SYR": 360.0}
variable_tip_len: {"p10": 32.0, "p200": 51.0, "p300": 59.0, "p1000": 88.0, "": 0.0}
variable_pick_window: {"M10": 6.0, "M50": 6.0, "M300": 6.0, "S10": 6.0, "S100": 6.0, "S1000": 8.0, "SYR": 0.0}
variable_gate_s: {"M10": 223.0, "M50": 204.0, "M300": 196.0, "S10": 223.0, "S100": 204.0, "S1000": 197.0, "SYR": 0.0}
variable_nozzle_gate_s: {"M10": 247.5, "M50": 247.5, "M300": 247.5, "S10": 247.5, "S100": 247.5, "S1000": 277.5, "SYR": 247.5}
variable_contact_lo: 0.5              # pusher must meet the slider between these (mm from retracted): PROVISIONAL
variable_contact_hi: 6.0
variable_contact_hi_tool: {"SYR": 3.0}     # per-tool window where it is narrower (CAD syringe_tool: 3 mm, set by the M4 stop screw with a gauge)
variable_pusher_max: 35.0             # tool interface stroke (head_l: 0-35 mm from the RETRACTED switch); the actuator's soft limit is 37.0 ([manual_stepper pusher_*] position_max)
variable_pusher_vmax: 5.0             # mm/s, EVERY pusher move: the force audit passes the plunger only at <= 5 mm/s (128 N; 115 N at 8 mm/s = margin 1.44)
variable_pusher_run_current: 0.7      # = [tmc5160 manual_stepper pusher_*] run_current (1.2 A winding run at 0.7 A only)
variable_pusher_home_current: 0.5     # homing: <= 0.50 A (CAD) and below the maker's 0.57 A limit for driving into the internal end stop
variable_pusher_home_speed: 2.0       # homing <= 2 mm/s (CAD)
variable_pusher_home_from: 38.0       # SET_POSITION before homing: fully extended (37.0) + 1 mm, so the move always reaches the switch
variable_pusher_home_to: -0.6         # 0.1 mm past the internal retract stop (-0.5): reached only if the switch fails, at home current
variable_default_speed_mm_s: 2.0
variable_settle_ms: 1040              # keepouts K14 / rev_l exchange dwell 1.04 s
gcode:

# ---- geometry shared by every size (rows F, A, B and the head never move, ADR-011).  noz_dy = nozzle row y relative to
# the printer Y (beam front face): CAD machine_family tool_carriages nozzle_dy_from_beam_front_face -102.5 (was -73.5).
# Dock row, place list and per-row stations are in _LH_SIZE (size file).  waste_xy = liquid waste LW-1 at B3, tip_xy =
# tip station (funnel, gate, VC-2) at B1.  PROVISIONAL until the commissioning dry run (check.py pins them to the CAD).
[gcode_macro _LH_GEOM]
variable_axis_dx: {"a": -90.0, "b": 0.0, "g": 90.0}
variable_noz_dy: -102.5
variable_bay_x0: -296.0
variable_bay_pitch: 78.0
variable_dock_entry_x: 465.0          # dock entry_rule: enter and leave at the right end (xc >= 465), every size
variable_dock_s: 342.0                # params L_DOCK_S
variable_dock_slow_mm: 15.0
variable_park_lift_mm: 40.0           # CAD head report dock_bay.in_row_lift_mm (inrow_clearance: 9.3 mm over the parked studs; 35 gave 4.3 < 8)
variable_pick_lift_mm: 8.0            # 'Z up 8 mm slow: latch closes, balls seat, tool lifts off the pins'
variable_z_fast: 25.0                 # = [manual_stepper z_*] velocity and [printer] max_z_velocity (check.py z_speed: corner speed at run current)
variable_grip_dy: -104.0              # A5: gripper finger centre y relative to the printer Y (CAD tool_carriages gripper_dy; was taken as noz_dy -102.5)
variable_travel_margin_mm: 10.0       # B: a lowered axis travels sideways only with its lowest point >= the tallest CAD item under its swept footprint + this
variable_foot_eight: [5.0, 35.0]      # half footprint (x, y) of an eight-channel nozzle row with tips (31.5 + tip collar)
variable_foot_single: [5.0, 5.0]      # single channel with tip
variable_foot_grip: [70.0, 48.0]      # gripper with an SBS plate (127.76 x 85.48 / 2 + about 6)
variable_z_slow: 5.0
variable_xy_speed: 150.0
variable_place_half: [66.0, 55.0]     # half of the 132 x 110 place pitch
variable_waste_xy: [132.0, -55.0]     # B3 LW-1 (family)
variable_tip_xy: [-132.0, -55.0]      # B1 tip station (family)
gcode:

[gcode_macro _LH_HOLD]
description: internal: CODE=<hold> KIND=motion|process.  Latches a hold, reports it and stops the command
gcode:
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE={"hold" if params.KIND|default("motion") == "motion" else "phold"} VALUE='"{params.CODE}"'
    RESPOND TYPE=error MSG="LH_HOLD CODE={params.CODE}: a person is needed (LH_HOLD_CLEAR CONFIRM=1 after inspection)"
    _LH_HOLD_RAISE CODE={params.CODE}

[gcode_macro _LH_HOLD_RAISE]
gcode:
    {action_raise_error("LH_HOLD %s: stopped where it is" % params.CODE)}

[gcode_macro LH_HOLD_CLEAR]
description: CONFIRM=1.  PERSON ONLY: clears a latched hold after inspection; carriages are re-read first and must be consistent.  Reply: LH_HOLD RESULT=CLEARED
gcode:
    {% if params.CONFIRM|default(0)|int != 1 %}{action_raise_error("LH_HOLD_CLEAR: a person must confirm with CONFIRM=1 after inspecting the head and dock")}{% endif %}
    {% if params.KIND|default("motion") == "process" and "extraction" in printer["gcode_macro _LH_PROFILE"].absent %}{action_raise_error("LH_HOLD_CLEAR refused: DEVICE_ABSENT: no extraction in build %s, so no process hold exists" % printer["gcode_macro _LH_PROFILE"].name)}{% endif %}
    {% if params.KIND|default("motion") == "process" and printer["gcode_button airflow"].state != "PRESSED" %}{action_raise_error("LH_HOLD_CLEAR refused: extraction airflow still not proven")}{% endif %}
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE={"hold" if params.KIND|default("motion") == "motion" else "phold"} VALUE='""'
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=exch VALUE=0
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=homed VALUE=0
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=nozzle_seen VALUE='","'
    RESPOND TYPE=command MSG="LH_HOLD RESULT=CLEARED (G28 needed)"

[gcode_macro _LH_NO_HOLD]
description: internal: WHO=<cmd> [PROCESS=1].  Refuses while a motion hold (or, with PROCESS=1, a process hold) is latched
gcode:
    {% set s = printer["gcode_macro _LH_STATE"] %}
    {% if s.hold %}{action_raise_error("%s refused: hold %s latched (LH_HOLD_CLEAR CONFIRM=1)" % (params.WHO, s.hold))}{% endif %}
    {% if params.PROCESS|default(0)|int == 1 and s.phold %}{action_raise_error("%s refused: process hold %s latched" % (params.WHO, s.phold))}{% endif %}

[gcode_macro _LH_CARRIAGE_EVENT]
description: internal: C=a|b.  A latch, Hall or cable-loop change outside an exchange after homing is a DROPPED TOOL: emergency stop
gcode:
    {% set s = printer["gcode_macro _LH_STATE"] %}
    {% if s.homed and s.exch == 0 %}
    RESPOND TYPE=error MSG="DROPPED_TOOL: carriage {params.C} latch / code / cable changed outside an exchange: emergency stop (XY and Z stop; Z self-locks)"
    M112
    {% endif %}

[gcode_macro _LH_TOOLS_LOCKED]
description: internal: WHO=<cmd>.  Each carriage must read EITHER empty (cable intact, code 0000, latch CLOSED-EMPTY) and be recorded empty, OR its recorded tool's valid code with the latch LOCKED (head_l guard TOOL PRESENT AND LOCKED).  Anything else refuses: CABLE, LATCH_WIRE, HALF_LOCK, LATCH_SWITCH, LATCH_OPEN, INVALID_CODE, WRONG_TOOL, DROPPED_TOOL
gcode:
    {% set s = printer["gcode_macro _LH_STATE"] %}
    {% set d = printer["gcode_macro _LH_TOOLDEF"] %}
    {% set pf = printer["gcode_macro _LH_PROFILE"] %}
    {% for c in pf.carriages %}
    {% set m = s["mounted_" ~ c] %}
    {% if c in pf.fixed_tools %}
    {% if m != pf.fixed_tools[c] %}{action_raise_error("%s refused: carriage %s WRONG_TOOL: the fixed tool declared for build %s is %s, recorded '%s' (G28 re-reads the declaration)" % (params.WHO, c, pf.name, pf.fixed_tools[c], m))}{% endif %}
    {% else %}
    {% set ns = namespace(code=0) %}
    {% for i in range(4) %}{% if printer["gcode_button hall_" ~ c ~ i].state == "PRESSED" %}{% set ns.code = ns.code + 2 ** i %}{% endif %}{% endfor %}
    {% set lk = "locked" if printer["gcode_button latch_" ~ c].state == "PRESSED" else ("empty" if printer["gcode_button latch_" ~ c ~ "_empty"].state == "PRESSED" else ("open" if printer["gcode_button latch_" ~ c ~ "_open"].state == "PRESSED" else "fault")) %}
    {% set latch = lk == "locked" %}
    {% if printer["gcode_button cable_" ~ c].state != "PRESSED" %}{action_raise_error("%s refused: carriage %s CABLE lost" % (params.WHO, c))}{% endif %}
    {% if ns.code != 0 and not latch %}{action_raise_error("%s refused: carriage %s HALF_LOCK (code %d, latch %s)" % (params.WHO, c, ns.code, lk))}{% endif %}
    {% if lk == "fault" %}{action_raise_error("%s refused: carriage %s LATCH_WIRE: the latch reads no state (broken or shorted wire)" % (params.WHO, c))}{% endif %}
    {% if ns.code == 0 and latch %}{action_raise_error("%s refused: carriage %s LATCH_SWITCH reads locked with no tool" % (params.WHO, c))}{% endif %}
    {% if ns.code == 0 and lk == "open" %}{action_raise_error("%s refused: carriage %s LATCH_OPEN: empty carriage with its jaw not closed outside the dock" % (params.WHO, c))}{% endif %}
    {% if ns.code != 0 and ns.code not in d.codes.values() %}{action_raise_error("%s refused: carriage %s INVALID_CODE %d" % (params.WHO, c, ns.code))}{% endif %}
    {% if m == "" and ns.code != 0 %}{action_raise_error("%s refused: carriage %s WRONG_TOOL: recorded empty, reads code %d" % (params.WHO, c, ns.code))}{% endif %}
    {% if m != "" and ns.code == 0 %}{action_raise_error("%s refused: carriage %s DROPPED_TOOL: %s recorded, reads empty" % (params.WHO, c, m))}{% endif %}
    {% if m != "" and ns.code != d.codes[m] %}{action_raise_error("%s refused: carriage %s WRONG_TOOL: %s recorded, reads code %d" % (params.WHO, c, m, ns.code))}{% endif %}
    {% endif %}
    {% endfor %}

[gcode_macro _LH_PLACE_GUARD]
description: internal: X=<nozzle x> Y=<nozzle y> LINE=a|b WHO=<cmd> [C=a|b].  Over a fitted deck-module place (size file _LH_SIZE places), the module's fail-safe line must read SAFE (a = pipettes, b = gripper); with C, a place listed in _LH_SIZE carriage_only refuses the other carriage; over the size's tip parking (_LH_SIZE tip_parking) only the listed carriages and tools descend (tips on or bare nozzles) and never the gripper (TIP_PARKING)
gcode:
    {% set g = printer["gcode_macro _LH_GEOM"] %}
    {% set z = printer["gcode_macro _LH_SIZE"] %}
    {% set pf = printer["gcode_macro _LH_PROFILE"] %}
    {% for p, v in z.places.items() %}
    {% if (params.X|float - v[0])|abs <= g.place_half[0] and (params.Y|float - v[1])|abs <= g.place_half[1] %}
    {% if "modules" in pf.absent and params.DOWN|default(1)|int == 1 %}{action_raise_error("%s refused: DEVICE_ABSENT: deck module place %s has no module in build %s (closed to descents)" % (params.WHO, p|upper, pf.name))}{% endif %}
    {% if "modules" not in pf.absent and printer["gcode_button safe_" ~ v[2] ~ "_" ~ params.LINE].state != "PRESSED" %}{action_raise_error("%s refused: module at %s reports NOT safe for %s (line %s of connector %s open: module busy, unplugged or faulty)" % (params.WHO, p|upper, "pipettes" if params.LINE == "a" else "the gripper", params.LINE, v[2]|upper))}{% endif %}
    {% endif %}
    {% endfor %}
    {% if params.C is defined %}
    {% for p, v in z.carriage_only.items() %}
    {% if (params.X|float - v[0])|abs <= v[2] and (params.Y|float - v[1])|abs <= v[3] and params.C|lower not in v[4] %}{action_raise_error("%s refused: CARRIAGE_ONLY: place %s is served by carriage %s only in size %s (carriage %s)" % (params.WHO, p|upper, v[4]|join("/")|upper, z.size, params.C|upper))}{% endif %}
    {% endfor %}
    {% endif %}
    {% set sh = z.shaker %}
    {% if sh and (params.X|float - sh[0])|abs <= sh[2] and (params.Y|float - sh[1])|abs <= sh[3] and params.DOWN|default(1)|int == 1 and "shaker" in pf.absent %}{action_raise_error("%s refused: DEVICE_ABSENT: heater-shaker not fitted in build %s (its place is closed to descents)" % (params.WHO, pf.name))}{% endif %}
    {% if sh and (params.X|float - sh[0])|abs <= sh[2] and (params.Y|float - sh[1])|abs <= sh[3] and params.DOWN|default(1)|int == 1 and printer["gcode_macro LH_SHAKER"].state != "IDLE" %}{action_raise_error("%s refused: SHAKER: the heater-shaker place is %s (host: read the device back, then LH_SHAKER STATE=IDLE)" % (params.WHO, printer["gcode_macro LH_SHAKER"].state))}{% endif %}
    {% for p, v in z.tip_parking.items() %}
    {% if (params.X|float - v[0])|abs <= v[2] and (params.Y|float - v[1])|abs <= v[3] %}
    {% if "tip_parking" in pf.absent and params.DOWN|default(1)|int == 1 %}{action_raise_error("%s refused: DEVICE_ABSENT: tip parking %s (%s) not fitted in build %s (closed to descents)" % (params.WHO, p|upper, v[6], pf.name))}{% endif %}
    {% if (params.C is not defined or params.LINE == "b") and params.DOWN|default(1)|int == 1 %}{action_raise_error("%s refused: TIP_PARKING: place %s (%s) is pipette-only: the gripper never descends there" % (params.WHO, p|upper, v[6]))}{% endif %}
    {% if params.C is defined and params.LINE != "b" %}
    {% set m = printer["gcode_macro _LH_STATE"]["mounted_" ~ params.C|lower] %}
    {% if params.C|lower not in v[4] or m not in v[5] %}{action_raise_error("%s refused: TIP_PARKING: place %s (%s) takes only %s on carriage %s (carriage %s carries '%s')" % (params.WHO, p|upper, v[6], v[5]|join("/"), v[4]|join("/")|upper, params.C|upper, m))}{% endif %}
    {% endif %}
    {% endif %}
    {% endfor %}

# ---- guarded motion commands ----
# Host moves go through these wrappers, which rebuild the command from checked parameters only (no {rawparams}).  Every
# other built-in command that can move an axis, set a position, change a current or a speed limit, or switch a driver off
# is overridden below (W5 command audit: electronics/lh1/system.yaml firmware_command_audit, command_audit.yaml).
# RESIDUAL RISK (Klipper behaviour): every renamed original (G0.1, G1.1, MANUAL_STEPPER_BASE, G92.1, SET_GCODE_OFFSET_BASE,
# SET_GCODE_VARIABLE_BASE, RESTORE_GCODE_STATE_BASE, MANUAL_PROBE_BASE, Z_ENDSTOP_CALIBRATE_BASE, Z_OFFSET_APPLY_ENDSTOP_BASE,
# STEPPER_BUZZ_BASE, SET_TMC_CURRENT_BASE, SET_TMC_FIELD_BASE, SET_STEPPER_ENABLE_BASE, M18.1, M84.1, SET_VELOCITY_LIMIT_BASE,
# M204.1, M220.1, M221.1, TUNING_TOWER_BASE, SET_PIN_BASE, SET_HEATER_TEMPERATURE_BASE, PID_CALIBRATE_BASE,
# UPDATE_DELAYED_GCODE_BASE) stays callable by name.  The host must never send a base name (firmware_residual_risks).
# printer Z is the GRIPPER axis: G0/G1 Z moves the gripper only.
[gcode_macro G0]
rename_existing: G0.1
gcode:
    {% for k in params %}{% if k not in ("X", "Y", "Z", "F") %}{action_raise_error("G0 refused: parameter %s is not allowed (X Y Z F only)" % k)}{% endif %}{% endfor %}
    {% if (params.X is defined or params.Y is defined) and params.Z is defined %}{action_raise_error("G0 refused: XY and Z in one move (send them separately)")}{% endif %}
    {% if params.Z is defined and params.Z|float < 0 %}{action_raise_error("G0 refused: Z below 0")}{% endif %}
    {% set a = [] %}{% for k in ("X", "Y", "Z", "F") %}{% if params[k] is defined %}{% set _ = a.append(k ~ "=" ~ (params[k]|float)) %}{% endif %}{% endfor %}
    M400
    _LH_GMOVE CMD=G0 {a|join(" ")}

[gcode_macro G1]
rename_existing: G1.1
gcode:
    {% for k in params %}{% if k not in ("X", "Y", "Z", "F") %}{action_raise_error("G1 refused: parameter %s is not allowed (X Y Z F only)" % k)}{% endif %}{% endfor %}
    {% if (params.X is defined or params.Y is defined) and params.Z is defined %}{action_raise_error("G1 refused: XY and Z in one move (send them separately)")}{% endif %}
    {% if params.Z is defined and params.Z|float < 0 %}{action_raise_error("G1 refused: Z below 0")}{% endif %}
    {% set a = [] %}{% for k in ("X", "Y", "Z", "F") %}{% if params[k] is defined %}{% set _ = a.append(k ~ "=" ~ (params[k]|float)) %}{% endif %}{% endfor %}
    M400
    _LH_GMOVE CMD=G1 {a|join(" ")}

# _LH_GMOVE: the checks of G0 / G1, rendered AFTER the wrapper's M400 (V2: a macro's template is rendered when it starts,
# so the switch and position reads must come after the queued moves have run).  XY (B, 23 Nov 2026): an axis may be lowered
# to its TRAVEL height (lowest point >= the tallest CAD item under its swept footprint + travel_margin_mm, _LH_TRAVEL_GUARD)
# instead of fully up; with every axis fully up the all-tools-up chain must read closed as before.  The dock row's Y is
# entered only by LH_TOOL_* / LH_DOCK_LEAVE, except right of the bays (head X >= _LH_SIZE shelf_window_x, A5 / V3) with every
# Z up, where the gripper serves the shelf slots (OK).  Z = the gripper: descents need the carriages at their travel height,
# the TC-1 guard, the module place guard (line b), the heater-shaker state and the per-place depth cap (A3).
[gcode_macro _LH_GMOVE]
gcode:
    {% set s = printer["gcode_macro _LH_STATE"] %}
    {% set g = printer["gcode_macro _LH_GEOM"] %}
    {% set zs = printer["gcode_macro _LH_SIZE"] %}
    {% set p = printer.toolhead.position %}
    {% set cmd = params.CMD|default("G0") %}
    {% set pf = printer["gcode_macro _LH_PROFILE"] %}
    {% if cmd not in ("G0", "G1") %}{action_raise_error("_LH_GMOVE: CMD must be G0 or G1")}{% endif %}
    {% if params.Z is defined and "gripper" in pf.absent %}{action_raise_error("%s refused: DEVICE_ABSENT: gripper axis (printer Z) is not fitted in build %s: Z stays at 0" % (cmd, pf.name))}{% endif %}
    {% if not s.homed or printer.toolhead.homed_axes != "xyz" %}{action_raise_error("%s refused: not homed since restart/e-stop (G28)" % cmd)}{% endif %}
    {% if not printer.gcode_move.absolute_coordinates %}{action_raise_error("%s refused: relative mode (G91) is not allowed" % cmd)}{% endif %}
    {% if s.hold %}{action_raise_error("%s refused: hold %s latched" % (cmd, s.hold))}{% endif %}
    {% set xy = params.X is defined or params.Y is defined %}
    {% if xy and params.Z is defined %}{action_raise_error("%s refused: XY and Z in one move (send them separately)" % cmd)}{% endif %}
    {% if params.Z is defined and params.Z|float < 0 %}{action_raise_error("%s refused: Z below 0" % cmd)}{% endif %}
    {% set x1 = params.X|default(p.x)|float %}
    {% set y1 = params.Y|default(p.y)|float %}
    {% set zone = zs.dock_zone_yf %}
    {% set wx = zs.shelf_window_x %}
    {% set up = s.zpos_z_a <= 0.01 and s.zpos_z_b <= 0.01 and p.z <= 0.01 %}
    {% if xy %}
    {% if xy and s.grip == 0 and "gripper" not in pf.absent %}{action_raise_error("%s refused: gripper state UNKNOWN since restart (LH_GRIPPER_RELEASE CONFIRM=1 or LH_GRIPPER_ASSERT_HOLDING CONFIRM=1)" % cmd)}{% endif %}
    {% set a_in = p.y >= zone %}
    {% set b_in = y1 >= zone %}
    {% if (a_in and p.x < wx) or (b_in and x1 < wx) %}{action_raise_error("%s refused: the dock row is entered and left only by LH_TOOL_PICK / LH_TOOL_PARK / LH_DOCK_LEAVE (right of the bays from head X %.1f: shelf window)" % (cmd, wx))}{% endif %}
    {% if a_in != b_in and (p.x + (x1 - p.x) * (zone - p.y) / (y1 - p.y)) < wx %}{action_raise_error("%s refused: the path crosses into the dock row left of the shelf window (head X %.1f)" % (cmd, wx))}{% endif %}
    {% if (a_in or b_in) and not up %}{action_raise_error("%s refused: SHELF_WINDOW: every Z must be fully up at the dock row's Y" % cmd)}{% endif %}
    {% if up and printer["gcode_button tools_up"].state != "PRESSED" %}{action_raise_error("%s refused: XY move with the all-tools-up chain open (every axis reads up: chain or switch fault)" % cmd)}{% endif %}
    {% if "dock" not in pf.absent and printer["gcode_macro _LH_DOCK"].bar != 0 %}{action_raise_error("%s refused: DOCK_BAR: the dock lift bar is not homed down (%s): X/Y never move unless the bar is down on its switch" % (cmd, printer["gcode_macro _LH_DOCK"].bar))}{% endif %}
    _LH_TOOLS_LOCKED WHO={cmd}
    {% if not up %}
    _LH_TRAVEL_GUARD X0={p.x} Y0={p.y} X1={x1} Y1={y1} WHO={cmd}
    {% endif %}
    {% endif %}
    {% if params.Z is defined %}
    {% set zt = params.Z|float %}
    {% if zt > p.z + 0.01 %}
    {% if p.y >= zone and p.x < wx %}{action_raise_error("%s refused: no gripper descent over the dock row" % cmd)}{% endif %}
    _LH_TRAVEL_GUARD EXCEPT=g WHO={cmd}
    _LH_DEPTH_GUARD C=g TOOL=gripper S={zt} X={p.x} Y={p.y} WHO={cmd}
    {% endif %}
    _LH_TC_GUARD TOOL=gripper C=g STROKE={zt}
    _LH_PLACE_GUARD X={p.x + g.axis_dx.g} Y={p.y + g.grip_dy} LINE=b WHO={cmd} DOWN={1 if zt > p.z + 0.01 else 0}
    {% endif %}
    {% set a = [] %}{% for k in ("X", "Y", "Z", "F") %}{% if params[k] is defined %}{% set _ = a.append(k ~ (params[k]|float)) %}{% endif %}{% endfor %}
    {cmd}.1 {a|join(" ")}

# _LH_TRAVEL_GUARD (B): X0 Y0 X1 Y1 = the head path (default: here), [EXCEPT=a|b|g] [ONLY=a|b|g] [SA= SB= SG= stroke
# overrides] [ALL=1: every zone of the size, any path].  For each lowered axis: lowest point (carriage: nozzle top - its tip
# type's length - stroke, tips always counted; gripper: top_gripper - stroke, a held plate counted) must be >= the highest
# _LH_SIZE zone its footprint sweeps + travel_margin_mm.  An axis at 0 always passes (CAD z_clearance: the head at s 0 clears
# every deck item by 50 mm and the shelf by 36 mm with tips).  Refusal: TRAVEL_HEIGHT.
[gcode_macro _LH_TRAVEL_GUARD]
gcode:
    {% set s = printer["gcode_macro _LH_STATE"] %}
    {% set g = printer["gcode_macro _LH_GEOM"] %}
    {% set d = printer["gcode_macro _LH_TOOLDEF"] %}
    {% set zs = printer["gcode_macro _LH_SIZE"] %}
    {% set tc = printer["gcode_macro _LH_TC_GUARD"] %}
    {% set p = printer.toolhead.position %}
    {% set x0 = params.X0|default(p.x)|float %}
    {% set y0 = params.Y0|default(p.y)|float %}
    {% set x1 = params.X1|default(x0)|float %}
    {% set y1 = params.Y1|default(y0)|float %}
    {% set st = {"a": params.SA|default(s.zpos_z_a)|float, "b": params.SB|default(s.zpos_z_b)|float, "g": params.SG|default(p.z)|float} %}
    {% for k in ("a", "b", "g") %}
    {% set sk = st[k] %}
    {% if k != params.EXCEPT|default("") and params.ONLY|default(k) == k and sk > 0.01 %}
    {% if k == "g" %}
    {% set low = tc.top_gripper - sk %}{% set f = g.foot_grip %}{% set dy = g.grip_dy %}{% set what = "gripper" %}
    {% else %}
    {% set t = s["mounted_" ~ k] %}
    {% if t == "" %}{action_raise_error("%s refused: carriage %s is lowered with no tool recorded" % (params.WHO|default("move"), k))}{% endif %}
    {% set low = d.noz_top[t] - d.tip_len[d.tip[t]] - sk %}{% set f = g.foot_eight if d.eight[t] else g.foot_single %}{% set dy = g.noz_dy %}{% set what = "carriage " ~ k ~ " (" ~ t ~ ")" %}
    {% endif %}
    {% set bx0 = [x0, x1]|min + g.axis_dx[k] - f[0] %}{% set bx1 = [x0, x1]|max + g.axis_dx[k] + f[0] %}
    {% set by0 = [y0, y1]|min + dy - f[1] %}{% set by1 = [y0, y1]|max + dy + f[1] %}
    {% set ns = namespace(top=0.0, name="deck") %}
    {% for z in zs.zones %}{% if params.ALL|default(0)|int == 1 or (z[0] < bx1 and bx0 < z[1] and z[2] < by1 and by0 < z[3]) %}{% if z[4] > ns.top %}{% set ns.top = z[4] %}{% set ns.name = z[5] %}{% endif %}{% endif %}{% endfor %}
    {% if low < ns.top + g.travel_margin_mm %}{action_raise_error("%s refused: TRAVEL_HEIGHT: %s lowest point z %.1f < %.1f (%s top %.1f + %.1f mm): raise it to s <= %.1f (LH_TRAVEL_QUERY)" % (params.WHO|default("move"), what, low, ns.top + g.travel_margin_mm, ns.name, ns.top, g.travel_margin_mm, sk - (ns.top + g.travel_margin_mm - low)))}{% endif %}
    {% endif %}
    {% endfor %}

# LH_TRAVEL_QUERY [X= Y=]: the deepest stroke each axis may hold for a sideways move from here to X Y (no X/Y: anywhere on
# the size's deck and shelf).  Reply: LH_TRAVEL S_A=<mm|EMPTY> S_B=<mm|EMPTY> S_G=<mm>.  The host lifts to these, not to 0.
[gcode_macro LH_TRAVEL_QUERY]
description: [X=<head x> Y=<head y>].  Deepest carriage / gripper stroke allowed for the sideways move from here to X Y (no X/Y: whole deck).  Reply: LH_TRAVEL S_A=<mm|EMPTY> S_B=<mm|EMPTY> S_G=<mm>
gcode:
    {% set s = printer["gcode_macro _LH_STATE"] %}
    {% set g = printer["gcode_macro _LH_GEOM"] %}
    {% set d = printer["gcode_macro _LH_TOOLDEF"] %}
    {% set zs = printer["gcode_macro _LH_SIZE"] %}
    {% set tc = printer["gcode_macro _LH_TC_GUARD"] %}
    {% set p = printer.toolhead.position %}
    {% set all = params.X is not defined and params.Y is not defined %}
    {% set x1 = params.X|default(p.x)|float %}
    {% set y1 = params.Y|default(p.y)|float %}
    {% set out = {} %}
    {% for k in ("a", "b", "g") %}
    {% if k == "g" %}
    {% set top0 = tc.top_gripper %}{% set f = g.foot_grip %}{% set dy = g.grip_dy %}
    {% else %}
    {% set t = s["mounted_" ~ k] %}
    {% set top0 = d.noz_top[t] - d.tip_len[d.tip[t]] if t != "" else -1 %}{% set f = (g.foot_eight if d.eight[t] else g.foot_single) if t != "" else g.foot_single %}{% set dy = g.noz_dy %}
    {% endif %}
    {% set bx0 = [p.x, x1]|min + g.axis_dx[k] - f[0] %}{% set bx1 = [p.x, x1]|max + g.axis_dx[k] + f[0] %}
    {% set by0 = [p.y, y1]|min + dy - f[1] %}{% set by1 = [p.y, y1]|max + dy + f[1] %}
    {% set ns = namespace(top=0.0) %}
    {% for z in zs.zones %}{% if all or (z[0] < bx1 and bx0 < z[1] and z[2] < by1 and by0 < z[3]) %}{% if z[4] > ns.top %}{% set ns.top = z[4] %}{% endif %}{% endif %}{% endfor %}
    {% set _ = out.update({k: ("EMPTY" if top0 < 0 else "%.2f" % ([top0 - ns.top - g.travel_margin_mm, 0.0]|max))}) %}
    {% endfor %}
    RESPOND TYPE=command MSG="LH_TRAVEL S_A={out.a} S_B={out.b} S_G={out.g}"

# _LH_DEPTH_GUARD (A3 / V6): C=a|b|g TOOL=<tool|gripper> S=<target stroke> X Y=<head position> WHO=.  The nozzle row (or the
# gripper fingers) over a place of _LH_SIZE depth: refused below that place's cap for this tool and carriage (CAD s_target).
# Over a place where the CAD gives this tool no reach, or over no place at all: the axis may go no lower than its clearance
# height there (_LH_TRAVEL_GUARD, zero path).
[gcode_macro _LH_DEPTH_GUARD]
gcode:
    {% set g = printer["gcode_macro _LH_GEOM"] %}
    {% set zs = printer["gcode_macro _LH_SIZE"] %}
    {% set c = params.C %}
    {% set key = "gripper" if c == "g" else params.TOOL ~ "@" ~ c %}
    {% set hx = params.X|float %}{% set hy = params.Y|float %}
    {% set nx = hx + g.axis_dx[c] %}
    {% set ny = hy + (g.grip_dy if c == "g" else g.noz_dy) %}
    {% set sv = params.S|float %}
    {% set ns = namespace(found=0, cap=1000.0, place="", nocap="") %}
    {% for pl, v in zs.depth.items() %}
    {% if (nx - v[0])|abs <= v[2] and (ny - v[1])|abs <= v[3] %}
    {% set ns.found = 1 %}
    {% if key in v[4] %}{% if v[4][key] < ns.cap %}{% set ns.cap = v[4][key] %}{% set ns.place = pl %}{% endif %}{% else %}{% set ns.nocap = pl %}{% endif %}
    {% endif %}
    {% endfor %}
    {% if ns.found and ns.nocap == "" %}
    {% if sv > ns.cap + 0.001 %}{action_raise_error("%s refused: DEPTH: %s to s %.2f below the CAD limit %.2f at %s (by_place_and_tool s_target)" % (params.WHO|default("move"), key, sv, ns.cap, ns.place|upper))}{% endif %}
    {% else %}
    _LH_TRAVEL_GUARD X0={hx} Y0={hy} ONLY={c} S{c|upper}={sv} WHO={params.WHO|default("move")}_DEPTH:{key}@{ns.nocap|upper if ns.nocap else "NO_PLACE"}
    {% endif %}

# MANUAL_STEPPER: host Z moves of the tool carriages only (z_a, z_b).  The wrapper checks the parameters, waits for the queue
# (M400, V2) and hands over to _LH_ZMOVE, which reads the state.  Downward moves need: the carriage carrying a locked tool whose
# nozzle passed LH_NOZZLE_CHECK and whose tip state is KNOWN (A4), the other carriage and the gripper at or above their travel
# height here (B; was: fully up), not over the dock row, the TC-1 guard, the module place guard (line a) and the per-place
# depth cap (A3).  Upward moves are always allowed (except under a motion hold: Z stays).  SPEED <= z_fast (25 mm/s).
[gcode_macro MANUAL_STEPPER]
rename_existing: MANUAL_STEPPER_BASE
gcode:
    {% set g = printer["gcode_macro _LH_GEOM"] %}
    {% set st = params.STEPPER|default("") %}
    {% for k in params %}{% if k not in ("STEPPER", "MOVE", "SPEED", "ACCEL", "SYNC") %}{action_raise_error("MANUAL_STEPPER refused: parameter %s is not allowed (SET_POSITION, STOP_ON_ENDSTOP, ENABLE ... are firmware-only)" % k)}{% endif %}{% endfor %}
    {% if params.SYNC is defined and params.SYNC|int != 1 %}{action_raise_error("MANUAL_STEPPER refused: SYNC=0 is not allowed")}{% endif %}
    {% if params.MOVE is not defined %}{action_raise_error("MANUAL_STEPPER refused: MOVE is required")}{% endif %}
    {% if st.startswith("pusher_") or st == "gripper" %}{action_raise_error("raw MANUAL_STEPPER on %s refused: use the LH_ macros" % st)}{% endif %}
    {% if st not in ("z_a", "z_b") %}{action_raise_error("MANUAL_STEPPER refused: unknown stepper %s" % st)}{% endif %}
    {% if st[2] not in printer["gcode_macro _LH_PROFILE"].carriages %}{action_raise_error("MANUAL_STEPPER refused: CARRIAGE_ABSENT: carriage %s is not fitted in build %s" % (st[2]|upper, printer["gcode_macro _LH_PROFILE"].name))}{% endif %}
    {% if params.MOVE|float < 0 %}{action_raise_error("MANUAL_STEPPER refused: MOVE below 0 (the eject over-travel) is reachable only by LH_EJECT_TIP")}{% endif %}
    {% if params.SPEED|default(10)|float > g.z_fast or params.SPEED|default(10)|float <= 0 %}{action_raise_error("MANUAL_STEPPER refused: SPEED %s outside 0..%.0f mm/s (the Z drive's corner speed)" % (params.SPEED, g.z_fast))}{% endif %}
    M400
    _LH_ZMOVE STEPPER={st} MOVE={params.MOVE|float} SPEED={params.SPEED|default(10)|float} ACCEL={params.ACCEL|default(300)|float}

[gcode_macro _LH_ZMOVE]
gcode:
    {% set s = printer["gcode_macro _LH_STATE"] %}
    {% set g = printer["gcode_macro _LH_GEOM"] %}
    {% set zs = printer["gcode_macro _LH_SIZE"] %}
    {% set p = printer.toolhead.position %}
    {% set st = params.STEPPER %}
    {% set c = st[2] %}
    {% set mv = params.MOVE|float %}
    {% if not s.homed or printer.toolhead.homed_axes != "xyz" %}{action_raise_error("MANUAL_STEPPER refused: not homed since restart/e-stop (G28)")}{% endif %}
    {% if s.hold %}{action_raise_error("MANUAL_STEPPER refused: hold %s latched: Z stays where it is" % s.hold)}{% endif %}
    {% if mv > s["zpos_" ~ st] %}
    {% set t = s["mounted_" ~ c] %}
    {% if t == "" %}{action_raise_error("MANUAL_STEPPER refused: carriage %s carries no tool" % c)}{% endif %}
    {% if not s["nozzle_ok_" ~ c] %}{action_raise_error("MANUAL_STEPPER refused: carriage %s nozzle not checked since the pick-up / power-up (LH_NOZZLE_CHECK)" % c)}{% endif %}
    {% if s["tips_" ~ c] < 0 %}{action_raise_error("MANUAL_STEPPER refused: TIPS_UNKNOWN on carriage %s (ejected or parked, not observed): LH_TIP_CHECK EXPECT=0 or LH_TIPS_CONFIRM" % c)}{% endif %}
    {% if p.y >= zs.dock_zone_yf %}{action_raise_error("MANUAL_STEPPER refused: over the dock row only LH_TOOL_PICK / LH_TOOL_PARK move Z")}{% endif %}
    _LH_TRAVEL_GUARD EXCEPT={c} WHO=MANUAL_STEPPER
    _LH_TOOLS_LOCKED WHO=MANUAL_STEPPER
    _LH_TC_GUARD TOOL={t} C={c} STROKE={mv}
    _LH_PLACE_GUARD X={p.x + g.axis_dx[c]} Y={p.y + g.noz_dy} LINE=a WHO=MANUAL_STEPPER C={c}
    _LH_DEPTH_GUARD C={c} TOOL={t} S={mv} X={p.x} Y={p.y} WHO=MANUAL_STEPPER
    {% endif %}
    MANUAL_STEPPER_BASE STEPPER={st} MOVE={mv} SPEED={params.SPEED|float} ACCEL={params.ACCEL|float} SYNC=1
    SET_GCODE_VARIABLE_BASE MACRO=_LH_STATE VARIABLE=zpos_{st} VALUE={mv}

[gcode_macro G92]
rename_existing: G92.1
gcode:
    {action_raise_error("G92 refused: positions are set only by homing")}

[gcode_macro SET_GCODE_OFFSET]
rename_existing: SET_GCODE_OFFSET_BASE
gcode:
    {action_raise_error("SET_GCODE_OFFSET refused: offsets would move the guarded limits")}

[gcode_macro SET_KINEMATIC_POSITION]
gcode:
    {action_raise_error("SET_KINEMATIC_POSITION refused: positions are set only by homing")}

[gcode_macro SET_GCODE_VARIABLE]
rename_existing: SET_GCODE_VARIABLE_BASE
gcode:
    {% if params.MACRO|default("")|upper in ("_LH_STATE", "_LH_TOOLDEF", "_LH_GEOM", "_LH_SIZE", "LH_EJECT_TIP", "LH_TIP_CHECK", "LH_PICK_TIP", "_LH_TC_GUARD", "_LH_MB1", "_LH_ZCUR", "_LH_THERM", "_LH_LID", "LH_UV", "LH_TIP_PARK", "LH_SHAKER", "_LH_FANS", "_LH_DOCK", "_LH_PROFILE") %}{action_raise_error("SET_GCODE_VARIABLE refused on %s: firmware state and calibration are changed only in printer.cfg" % params.MACRO)}{% endif %}
    SET_GCODE_VARIABLE_BASE {rawparams}

# ---- W5 command audit: built-in commands that could move, set positions, change currents/limits or disable drivers ----
[gcode_macro RESTORE_GCODE_STATE]
rename_existing: RESTORE_GCODE_STATE_BASE
gcode:
    {action_raise_error("RESTORE_GCODE_STATE refused: MOVE=1 would move X/Y/Z past every guard and a restore could bring back relative mode or offsets")}

