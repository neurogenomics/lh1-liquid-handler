# LH-1 size file: L = LARGE: 6 rows F A B C D G (kit M->L adds row D; the balance D3 and the weighing nest D4 bring two module connectors).
# Included at the END of printer.cfg (shared core); everything that differs between the sizes is here and nowhere else.
# GENERATED by electronics/lh1/gen_size_files.py from cad/lh1/machine_family/out/L/family_L.json (travel.Y, dock
# 'printer_y_over_the_bays (dock_yf)' and dock_zone_yf, deck_positions, planner_rules, tip_parking); dock_exit_yf = dock_yf - 124.5
# (cr_answers, rev L ratio).  fw_render_check.py and check.py pin every value to that report.  PROVISIONAL until the
# commissioning dry run measures the dock row with the head camera (bay markers DMK-F).
# Klipper merges this [stepper_y] with the core's [stepper_y] (same section named twice: the later options are added).

[stepper_y]
position_max: 592.0            # family_L travel.Y travel_yf upper end (the gripper at the shelf slot OK at the dock row)

[gcode_macro _LH_SIZE]
variable_size: "L"
variable_y_max: 592.0               # = [stepper_y] position_max (check.py)
variable_dock_yf: 574.5            # printer Y with the coupling axes over the bay row (dock axis y 472.0 + 102.5)
variable_dock_zone_yf: 480.0        # at and beyond this printer Y the head is over the dock row (only LH_TOOL_* / LH_DOCK_LEAVE go there)
variable_dock_exit_yf: 450.0        # LH_DOCK_LEAVE target, in front of the dock zone
# deck-module places with a SAFE-line connector: place -> [x, y, connector]; A3 and A4 are one module zone on connector a3
variable_places: {"a3": [132.0, -165.0, "a3"], "a4": [264.0, -165.0, "a3"], "b2": [0.0, -55.0, "b2"], "d3": [132.0, 165.0, "d3"], "d4": [264.0, 165.0, "d4"], "g0": [-264.0, 275.0, "g0"], "g4": [264.0, 275.0, "g4"]}
# places only one carriage may serve (planner rule: none in this size): place -> [x, y, half x, half y, [carriages]]
variable_carriage_only: {}
# tip parking (CAD tip_parking: TPKS at B0, comb bounding box): place -> [x, y, half x, half y, [carriages], [tools], station, eight-channel sets,
#   random-access geometry {spots: [group, entry x, spot x] per spot, row_y, s_above, s_slide, s_seat, speeds, strip travel,
#   re-pick overtravel} or None where the CAD publishes no spot geometry (ADR-014: random access in S; M, L still LIFO TPK-1)];
# only these carriages, carrying one of these tools (tips mounted to set down, bare nozzles to re-pick), may descend there;
# the gripper never descends there (_LH_PLACE_GUARD TIP_PARKING)
variable_tip_parking: {"b0": [-290.7, -55.0, 45.0, 38.5, ["a", "b"], ["M300"], "TPKS", 6, {'spots': [[1, -315.5, -323.5], [1, -315.5, -307.5], [2, -290.7, -298.7], [2, -290.7, -282.7], [3, -265.9, -273.9], [3, -265.9, -257.9]], 'row_y': -55.0, 's_above': 193.4, 's_slide': 271.7, 's_seat': 273.0, 'z_mm_s': 10.0, 'slide_mm_s': 10.0, 'slide_accel': 250.0, 'strip_mm_s': 5.0, 'strip_mm': 9.6, 'repick_over': 1.0}]}
