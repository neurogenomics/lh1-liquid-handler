gcode:

# Row D module places (L only): balance D3 and weighing nest D4; these inputs are reserved and unwired in S and M.
[gcode_button safe_d3_a]
pin: ^!io:PE12
press_gcode:
    _LH_NOP
[gcode_button safe_d3_b]
pin: ^!io:PB1
press_gcode:
    _LH_NOP
[gcode_button safe_d4_a]
pin: ^!io:PE13
press_gcode:
    _LH_NOP
[gcode_button safe_d4_b]
pin: ^!io:PB2
press_gcode:
    _LH_NOP

# Edge hand-off H1 (M and L; the starter has NO open hand-off: blank plates at H1 and H2, integration 23 Nov 2026): shutter-closed
# switch, NO ('^!': PRESSED = closed); status for the gripper hand-off macros
[gcode_button shutter_h1]
pin: ^!io:PG2
press_gcode:
    _LH_NOP
release_gcode:
    _LH_NOP

# Second edge hand-off H2 (M and L; the starter has a blank plate there): shutter-closed switch, NO ('^!': PRESSED = closed)
[gcode_button shutter_h2]
pin: ^!io:PC13
press_gcode:
    _LH_NOP
release_gcode:
    _LH_NOP
