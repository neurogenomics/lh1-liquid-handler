# BR-1 bench rig (cad/lh1/bench_rig, mechanical G4): one Z axis, one pipette at a time, plunger actuator, cradle force
# switch, strip comb, eject finger, tip rack, plate nest and balance on a belt X module.  Klipper on a Raspberry Pi 4;
# ONE BigTreeTech MMB CAN V2.0 over USB with three EZ5160 Pro drivers (SPI; the machine's driver, ADR-003).  Firmware revision W (13 Nov 2026), revision L coupling and syringe additions (15 Nov 2026).
# Size family head parts (20 Nov 2026): the rig plunger IS the machine's pusher (NEMA14 34 mm captive linear, 1 mm lead,
# 0-35 mm, 0.7 A) driven through the machine's carriage-B cable (20-way 0.5 mm FFC, phases on two ways: the rig proves its
# current and flex life); the retracted, latch, force and bay switches are the sealed types with factory leads; the four
# Hall switches are the bought 6.5 mm leaded parts; the syringe prototype is the family DIRECT-DRIVE syringe on a second
# NEMA14 pusher (0-35 mm; the 60 mm lever drive is retired).
# Wiring: electronics/lh1/bench_rig_wiring.csv (check.py verifies every pin below against it).
# KLIPPER VERSION: Klipper master at or after the 20260214 Config_Changes entry (STOP_ON_ENDSTOP names) with
# [load_cell] HX711 support (v0.13.0+): electronics/lh1/system.yaml klipper_target.  If the installed Klipper lacks
# [load_cell], delete the five [load_cell] sections: every force-limited BR_ macro then refuses (see _BR_LC_READY).
# Balance: NOT read by Klipper.  MODE=operator: each call dispenses one replicate and prints a BR_WEIGH line; the
# operator records the reading.  MODE=serial: the macro loops and dwells; a bench host script (not part of this file)
# watches for 'BR_WEIGH_READY i' lines and reads the balance over RS232/USB with its stable-weight command (MT-SICS 'S').
# STATUS: written, not loaded by Klipper, no motor driven.  NOT SAFETY-ASSESSED: supervised bench use only, a person
# at the rig e-stop.
# Load cells (five [load_cell], HX711 on the MMBs): LC-1 rack nest (single-point platform 500 N), LC-2 comb nest
# (single-point platform 500 N, rev G3: was an S-type hanger), LC-3 pusher line (button 200 N, ADR-014 CT-0d), LC-4 eject finger
# (single-point bar 200 N), LC-5 rig dock lift pad (button 500 N, on rig2: CT-0a, CT-0b).
# WHAT THE GUARDS GUARANTEE (rig-specific code, modelled on the machine's but NOT the same):
#  - after a restart, a motors-off (M18/M84, also by the idle timeout) or a failed homing, every BR_ macro and every
#    rig move refuses until BR_HOME has completed (homing: home, back off until the switch opens, home again);
#  - the rig state (_BR and the BR_ macros' variables) cannot be changed with SET_GCODE_VARIABLE from the console;
#  - X moves (_BR_X) only with Z at its top by tracked position AND the Z-up switch (NO, closed at the top);
#  - the one X move with Z lowered (_BR_XSLIDE) starts only at the mounted pipette's comb station, at its comb depth,
#    and ends within comb_slide_mm of it;
#  - Z (_BR_Z) never deeper than the mounted pipette's depth limit (CAD ZHS-1 stop - 1 mm), never below 0 except
#    EJECT=1, which is accepted only with X at the eject station and not above z_ejector;
#  - force-limited sequences refuse unless their load cell reports is_calibrated, and they tare it at a known
#    unloaded position first, so an uncalibrated or drifted cell cannot read 0 N;
#  - built-in commands that move, set positions, change currents or disable drivers are refused or wrapped (W5 audit,
#    electronics/lh1/system.yaml firmware_command_audit).
#  These are firmware checks, not a safety function.  What they do NOT guarantee: the variables mounted / measured
#  strokes being set right by the operator; the renamed base commands (MANUAL_STEPPER_BASE, SET_GCODE_VARIABLE_BASE,
#  SET_TMC_CURRENT_BASE, ...) stay callable by name (Klipper rename_existing behaviour) and must not be typed.
# REVISION L ADDITIONS (15 Nov 2026, cad/lh1/head_l rig parts RCB-L/TPL-L/CRA-L/LS-L/DB-L2/BC-L/RP-L/SDM-L/SCB-L): one
# three-ball coupling with its spring latch on the rig Z (RCB-L on TP-1), a two-bay dock on the rig base (bays on the rig
# X), the carriage's latch switch, four Hall code switches and two bay-occupied switches on the spare MMB inputs, and the
# syringe dispense prototype on EZ4.  Coupling tests CT-1 to CT-9 (head_l report rig.tests): BR_CT_EXCHANGE (CT-1, CT-5),
# BR_CT_LOCK_READ (CT-3, CT-4: the latch must never read locked with a shim / debris / spring removed), BR_CT_CODE_READ
# (CT-8), BR_PICK with the push-rod force switch (CT-7, LC-1/LC-2), BR_PLUNGER_SWEEP and the yoke cell (CT-9 plunger),
# BR_DISPENSE after an exchange (CT-6), BR_SYRINGE (syringe prototype stroke and force).  CT-2 is a manual jack test
# (no firmware).  The latch input and the Hall inputs are NO / open-collector ('^!'): a broken wire reads 'not locked'
# and bit 0 (codes have even weight, so a lost bit is an invalid code, never another tool).  Bay switches NC ('^').
# Inputs: home, plunger, X-home and force switches are NC (^: broken wire = triggered = stop); the Z-up switch is NO
# closed at the top (^!: broken wire = 'not up' = no X move).
# ADR-014 (23 Nov 2026): the rig runs the FIRST tests of the redesign before any machine purchase list (head report rig.tests):
#  CT-0a latch release force  (BR_CT_RELEASE): rig carriage with the LTG-1 latch, a tool latched and seated on rig bay 1; the
#        rig dock lift (a second MMB, 'rig2', EZ1: the machine's NEMA17 48 + Tr8x2 at 1.3 A) raises its pad through the 500 N
#        button cell LC-5 in 0.2 mm steps, logging force against bar stroke; stops above lift thrust / 1.5 (156 N).
#  CT-0b re-latch force        (BR_CT_RELATCH): bar lowered in 0.2 mm steps with the stud seated, logging LC-5; the latch must
#        read LOCKED with the code every time (100 of 100, the operator hangs the 1/3-spring weight); preload by PLF-L (manual).
#  CT-1 / CT-5 exchanges        (BR_CT_EXCHANGE, READ=1): the machine's dock-lift drop-off and pick-up on the two-bay dock;
#        after each pick-up the nozzle reference pin is brought to z_measure and the run pauses for the two indicators.
#  CT-0c comb entry, real tips  (BR_CT_COMB): one TPK-S group (spot, entry, spot) on the rig X: park and re-pick one set of
#        p300 tips in random order; LC-2 under the comb logs every entry, slide and strip; a strike above strike_max_n, a
#        missed force-switch trip at the re-pick or a strip below strip_min_n stops the run.
#  CT-0d pusher force at 0.7 A  (BR_CT_PUSH_FORCE): the LGA35 rig pusher (the machine's part, 0.6096 mm lead, homing at
#        0.50 A <= the maker's 0.57 A) drives at 2 / 5 / 8 mm/s through a rated spring into the button cell LC-3 (now 200 N:
#        the CAD's 100 N cell cannot show the 120 N pass); lost steps are measured by re-homing from the end of the push.
#  CT-9 strip force              (BR_STRIP METHOD=tpks): eight-tip strip from a TPK-S spot at the force current, LC-2 peak:
#        the value the machine's LH_TIP_PARK strip_force_measured_n needs (limit 174 N).
# The rig latch is the machine's three-state ladder on rig2's ADC input PC2 (three analog buttons); the bar DOWN slot sensor
# and the bar OPEN-height switch are on rig2's endstop inputs.  rig2 shares the rig's switched 24 V and USB to the Pi.

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_REPLACE-if00

[mcu rig2]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_REPLACE_rig2-if00      # second MMB CAN V2.0 on USB (ADR-014 rig dock lift, latch ladder, LC-5)

[printer]
kinematics: none
max_velocity: 300
max_accel: 1000

[manual_stepper rig_z]
step_pin: PD4
dir_pin: PD3
enable_pin: !PD5
microsteps: 16
rotation_distance: 2              # Tr8x2, as LH-1
endstop_pin: ^PA15                # Z home KW10, NC
position_min: -12                 # = -Z_EJECT_TRAVEL: over-travel above the normal top, only _BR_Z EJECT=1 at the eject station
position_max: 200.0               # W7: bench report firmware_numbers_rev_g4.rig_z_position_max (small pipette's limit); the mounted pipette's depth_max_<pipette> below binds
velocity: 20
accel: 300

[tmc5160 manual_stepper rig_z]
cs_pin: PB5
spi_bus: spi1
sense_resistor: 0.075         # EZ5160 Pro (same driver as the machine, ADR-003): READ the resistor marking
run_current: 0.9
hold_current: 0.6

[manual_stepper rig_plunger]
step_pin: PC9
dir_pin: PC8
enable_pin: !PD2
microsteps: 16
rotation_distance: 0.6096         # ADR-014: the machine's pusher Nanotec LGA351S12-A-UIAP-038 (0.6096 mm lead, 38.1 mm stroke)
full_steps_per_rotation: 200
endstop_pin: ^PA10                # pusher RETRACTED switch (sealed, factory lead), NC; trips 0.5 mm before the internal stop
position_min: -0.6                # only _BR_PUSHER_HOME goes below 0 (at <= 0.50 A)
position_max: 37.0                # CAD soft limit 37.5 of actuator stroke (0 = the switch at 0.5)
velocity: 5                       # as the machine: force strokes <= 5 mm/s (CT-0d also runs 8 mm/s to show the drop)
accel: 50

[tmc5160 manual_stepper rig_plunger]
cs_pin: PB4
spi_bus: spi1
sense_resistor: 0.075         # EZ5160 Pro (same driver as the machine, ADR-003): READ the resistor marking
run_current: 0.7                  # = the machine's pusher run current (0.35 A per FFC conductor)
hold_current: 0.35

[manual_stepper rig_x]
step_pin: PC15
dir_pin: PC11
enable_pin: !PC10
microsteps: 16
rotation_distance: 40             # belt module: SET FROM THE MODULE BOUGHT (GT2 20T = 40)
endstop_pin: ^PD9                 # module home limit, NC
position_min: 0
position_max: 500
velocity: 100
accel: 1000

[tmc5160 manual_stepper rig_x]
cs_pin: PB3
spi_bus: spi1
sense_resistor: 0.075         # EZ5160 Pro (same driver as the machine, ADR-003): READ the resistor marking
run_current: 1.2
hold_current: 0.8

[gcode_button rig_force]
pin: ^PC2                         # cradle force switch NC: PRESSED = force reached (or broken wire)
press_gcode:
    RESPOND MSG="BR force switch tripped"

[gcode_button rig_zup]
pin: ^!PD8                        # Z top roller-lever switch, NO closed from the normal top to the eject top: PRESSED = Z up;
press_gcode:                      # a broken wire reads 'not up' (fail-safe)
    RESPOND MSG="BR Z at top"
release_gcode:
    RESPOND MSG="BR Z below top"

[load_cell lc_rack]
sensor_type: hx711
dout_pin: PC7
sclk_pin: PA9
gain: A-128
sample_rate: 80

[load_cell lc_comb]
sensor_type: hx711
dout_pin: PB12
sclk_pin: PB10
gain: A-128
sample_rate: 80

[load_cell lc_yoke]
sensor_type: hx711
dout_pin: PB1
sclk_pin: PC5
gain: A-128
sample_rate: 80

[load_cell lc_eject]
sensor_type: hx711
dout_pin: PC6
sclk_pin: PA8
gain: A-128
sample_rate: 80

# ---------------- revision L coupling, two-bay dock and syringe prototype (spare MMB pins) ----------------
[manual_stepper rig_syringe]
step_pin: PC13
dir_pin: PC12
enable_pin: !PC14
microsteps: 16
rotation_distance: 0.6096         # ADR-014: a second LGA351S12-A-UIAP-038 (the machine's pusher part)
full_steps_per_rotation: 200
endstop_pin: ^PC0                 # syringe pusher RETRACTED switch, NC (MMB I2C3 pin PC0 used as an input: header access UNVERIFIED)
position_min: -0.6
position_max: 37.0
velocity: 5
accel: 50

[tmc5160 manual_stepper rig_syringe]
cs_pin: PD6
spi_bus: spi1
sense_resistor: 0.075
run_current: 0.7                  # as the machine's pushers
hold_current: 0.35

# ---------------- ADR-014: rig dock lift, LTG-1 latch ladder, release-force cell (second MMB 'rig2') ----------------
[manual_stepper rig_lift]
step_pin: rig2:PD4
dir_pin: rig2:PD3
enable_pin: !rig2:PD5
microsteps: 16
rotation_distance: 2              # NEMA17 48 + integrated Tr8x2 (the machine's DLB-1 drive)
full_steps_per_rotation: 200
endstop_pin: ^!rig2:PA15          # bar DOWN optical slot sensor (output conducts with the flag in = home; broken wire = not home)
position_min: -1.0
position_max: 50.0
velocity: 5
accel: 100

[tmc5160 manual_stepper rig_lift]
cs_pin: rig2:PB5
spi_bus: spi1
sense_resistor: 0.075
run_current: 1.3                  # = the machine's dock lift current (the force audit's 1.3 A)
hold_current: 0.6
stealthchop_threshold: 0

[gcode_button rig_bar_open]
pin: ^!rig2:PA10                  # bar at the OPEN height (flag from rise + 2 mm), NO: PRESSED = at height; broken wire = not at height
press_gcode:
    _BR_NOP
release_gcode:
    _BR_NOP

# the machine's three-state latch: two sealed switches + the 1.0 k / 22 k / 4.7 k / 2.0 k ladder on rig2's thermistor input
[gcode_button rig_latch]
pin: rig2:PC2
analog_range: 3900, 6200          # LOCKED (4.87 k)
analog_pullup_resistor: 4700
press_gcode:
    _BR_NOP
release_gcode:
    _BR_NOP

[gcode_button rig_latch_empty]
pin: rig2:PC2
analog_range: 1800, 3100          # CLOSED-EMPTY (2.32 k: LOCK and EMPTY both made)
analog_pullup_resistor: 4700
press_gcode:
    _BR_NOP
release_gcode:
    _BR_NOP

[gcode_button rig_latch_open]
pin: rig2:PC2
analog_range: 15000, 35000        # NOT CLOSED (23.0 k); none of the three = wire fault
analog_pullup_resistor: 4700
press_gcode:
    _BR_NOP
release_gcode:
    _BR_NOP

[load_cell lc_lift]
sensor_type: hx711                # LC-5: 500 N button cell under the rig dock lift pad (CT-0a, CT-0b)
dout_pin: rig2:PC7
sclk_pin: rig2:PA9
gain: A-128
sample_rate: 80

[gcode_button rig_hall0]
pin: ^!PB2                        # Hall code bit 0: bought 6.5 mm leaded Hall switch (open collector, magnet = low = PRESSED = 1)
press_gcode:
    _BR_NOP
[gcode_button rig_hall1]
pin: ^!PB0
press_gcode:
    _BR_NOP
[gcode_button rig_hall2]
pin: ^!PC4
press_gcode:
    _BR_NOP
[gcode_button rig_hall3]
pin: ^!PA1
press_gcode:
    _BR_NOP

[gcode_button rig_bay1]
pin: ^PA0                         # bay-occupied switch, NC: PRESSED = occupied OR broken wire
press_gcode:
    _BR_NOP
[gcode_button rig_bay2]
pin: ^PC3
press_gcode:
    _BR_NOP

[gcode_macro _BR_NOP]
gcode:

[gcode_macro _BRL]
variable_x_bay1: 360.0            # MEASURE: rig X with the coupling axis over bay 1 (DB-L2 on the rig base)
variable_x_bay2: 438.0            # MEASURE: bay 1 + 78 mm (machine pitch)
variable_z_seat: 190.0            # MEASURE: rig stroke with the tool lugs on the bay pins (= the machine's dock_s step 1)
variable_park_lift: 35.0
variable_pick_lift: 8.0
variable_slow_mm: 15.0
# ADR-014 rig dock lift (head report dock_bay.dock_lift; same numbers as the machine's _LH_DOCK)
variable_lift: -1.0               # rig lift bar position, -1 = UNKNOWN until BR_HOME
variable_rise_mm: 31.1
variable_gap_mm: 3.0
variable_follow_mm: 13.0
variable_lift_speed: 5.0
variable_lift_home_current: 0.6
variable_lift_run_current: 1.3
variable_lift_step_mm: 0.2        # CT-0a / CT-0b logging step
variable_release_max_n: 156.0     # CT-0a stop: lift thrust 233.8 N / 1.5 (the pass limit for the peak)
variable_z_measure: 120.0         # MEASURE: CT-1 stroke where the nozzle reference pin touches both indicators
# CT-0c: one TPK-S group on the rig X (CAD tip_parking: spots at entry -/+ 8.0 mm, 1.3 mm detent, strip 9.6 mm)
variable_x_tpks_entry: 220.0      # MEASURE: rig X with the nozzle row over the group's entry holes
variable_tpks_dx: 8.0             # CAD: spot = entry +/- 8.0 mm
variable_z_tpks_above: 100.0      # MEASURE: tip ends 5 mm above the upper plate (machine s_above)
variable_z_tpks_slide: 178.0      # MEASURE: collars 0.3 mm above the lower plate (machine s_slide)
variable_tpks_seat_mm: 1.3        # CAD: s_seat - s_slide
variable_tpks_strip_mm: 9.6       # CAD mechanism audit: strip travel
variable_tpks_slide_speed: 10.0   # CAD <= 10 mm/s
variable_tpks_slide_accel: 250.0  # CAD <= 0.25 m/s2
variable_strike_max_n: 5.0        # CT-0c: LC-2 force during entry / slide above this = a strike
variable_strip_min_n: 1.0         # CT-0c: a strip below this = no tips came off (tip left on a strip / not parked)
variable_comb_done: 0
variable_comb_side: 0             # -1 / +1: the spot holding the parked set, 0 = none
variable_codes: {"M10": 3, "M50": 5, "M300": 6, "S10": 9, "S100": 10, "S1000": 12, "SYR": 15}
variable_ex_done: 0
variable_ex_detected: 0
variable_reads: 0
variable_misreads: 0
variable_syringe_homed: 0
# CT-0d pusher force (LGA35 at 0.7 A): contact with the spring-and-cell line, push travel, cell protection
variable_push_contact: 2.0        # MEASURE: pusher stroke where the pad meets the spring cap
variable_push_travel: 12.0        # spring travel giving about 150 N with the 12.5 N/mm die spring (rig BOM)
variable_push_max_n: 170.0        # stop: cell (200 N) protection
variable_pusher_home_current: 0.5 # <= 0.50 A (CAD), below the maker's 0.57 A for the internal stop
variable_pusher_home_speed: 2.0
variable_pusher_run_current: 0.7
gcode:

[respond]

# ---------------- state and station geometry (from the BR-1 report firmware_numbers_rev_g4 / measured rig) ----------------
[gcode_macro _BR]
variable_homed: 0
variable_zpos: 0.0
variable_xpos: -1.0               # tracked rig X (-1 = unknown until BR_HOME)
variable_peak: 0.0
variable_tripped: 0
variable_cycles_done: 0
variable_fail: 0
variable_x_rack: 0.0              # report firmware_numbers_rev_g4.station_x (rig X origin = tip rack)
variable_x_plate: 290.0
variable_x_balance: 480.0
variable_x_eject: 128.75          # eject_B: EJ-1 finger on BR-2 over LC-4, TW-5 hopper below
variable_x_comb_pipette_small: 177.0
variable_x_comb_pipette_8ch_50: 160.0
variable_x_comb_pipette_8ch_300: 160.0
variable_ej_speed: 2.0
variable_ej_current: 0.45
variable_run_current: 0.9             # = [tmc5160 manual_stepper rig_z] run_current
variable_force_current: 1.3           # A rms during the pick-up and comb-strip strokes only (system.yaml z_drive): the rig MEASURES the
                                      # real pick-up / strip forces at the machine's force current, so a stall shows as a plateau on LC-1/LC-2
variable_comb_slide_mm: 20.0      # sideways slide into the slot, +X from the comb station (set from the TW-4D slot geometry)
variable_z_pick_start: 150.0      # MEASURE: stroke where the nozzle is 5 mm above the tip collar
variable_z_pick_max: 175.0        # MEASURE: deepest allowed pick stroke (error beyond)
variable_z_comb_pipette_small: 188.0     # report comb_strip_stroke_nominal_s (worst 188.3)
variable_z_comb_pipette_8ch_50: 185.25   # (worst 185.55)
variable_z_comb_pipette_8ch_300: 185.5   # (worst 185.8)
variable_z_source: 170.0          # MEASURE: nozzle in the source liquid (plate nest)
variable_z_vial: 165.0            # MEASURE: tip in the trap vial on the balance
variable_z_ejector: -12.0         # = -params.Z_EJECT_TRAVEL (rev G): over-travel above the normal top onto the EJ-1 finger
variable_contact: 1.0             # plunger: rod meets the button
variable_first_stop: 14.0         # MEASURE per pipette with BR_PLUNGER_SWEEP
variable_blowout: 18.0
variable_ul_per_mm: 3.5714        # nominal; replaced by the gravimetric result
variable_settle_ms: 1020          # LH-1 keepouts K14
variable_mounted: "pipette_8ch_300"   # SET WHEN CHANGING THE PIPETTE (edit this file + RESTART): selects depth, comb x and comb z
variable_depth_max_pipette_small: 200.0   # report firmware_numbers_rev_g4 depth_max (ZHS-1 stop 201.5)
variable_depth_max_pipette_8ch_50: 187.0  # ZHS-1 stop 188.0 - 1
variable_depth_max_pipette_8ch_300: 187.5 # ZHS-1 stop 188.5 - 1
variable_depth_max_coupling: 195.0       # rev L coupling tests (mounted "coupling"): MEASURE, must stay below rig_z position_max 200
gcode:
    RESPOND MSG="BR homed={printer['gcode_macro _BR'].homed} cycles={printer['gcode_macro _BR'].cycles_done}"

[gcode_macro BR_HOME]
description: the rig dock lift bar DOWN first (ADR-014: it only lets a latch close), then Z up (home, back off until the switch opens, home again), the pusher at <= 0.50 A, then X
gcode:
    SET_GCODE_VARIABLE_BASE MACRO=_BR VARIABLE=homed VALUE=0
    SET_GCODE_VARIABLE_BASE MACRO=_BR VARIABLE=xpos VALUE=-1.0
    _BR_LIFT_HOME
    SET_TMC_CURRENT_BASE STEPPER=rig_z CURRENT={printer["gcode_macro _BR"].run_current}
    MANUAL_STEPPER_BASE STEPPER=rig_z SET_POSITION=202
    MANUAL_STEPPER_BASE STEPPER=rig_z SPEED=8 MOVE=0 STOP_ON_ENDSTOP=home
    _BR_REQUIRE_ZUP
    MANUAL_STEPPER_BASE STEPPER=rig_z SPEED=2 MOVE=3 STOP_ON_ENDSTOP=inverted_probe
    MANUAL_STEPPER_BASE STEPPER=rig_z SPEED=1 MOVE=0 STOP_ON_ENDSTOP=home
    _BR_PUSHER_HOME STEPPER=rig_plunger
    _BR_REQUIRE_ZUP
    MANUAL_STEPPER_BASE STEPPER=rig_x SET_POSITION=505
    MANUAL_STEPPER_BASE STEPPER=rig_x SPEED=40 MOVE=0 STOP_ON_ENDSTOP=home
    MANUAL_STEPPER_BASE STEPPER=rig_x SPEED=10 MOVE=5 STOP_ON_ENDSTOP=inverted_probe
    MANUAL_STEPPER_BASE STEPPER=rig_x SPEED=5 MOVE=0 STOP_ON_ENDSTOP=home
    SET_GCODE_VARIABLE_BASE MACRO=_BR VARIABLE=zpos VALUE=0.0
    SET_GCODE_VARIABLE_BASE MACRO=_BR VARIABLE=xpos VALUE=0.0
    SET_GCODE_VARIABLE_BASE MACRO=_BR VARIABLE=homed VALUE=1

[gcode_macro _BR_REQUIRE_ZUP]
gcode:
    {% if printer["gcode_button rig_zup"].state != "PRESSED" %}{action_raise_error("BR: Z-up switch reads 'not up' (Z not at its top, or switch/wire fault)")}{% endif %}

[gcode_macro _BR_Z]
description: internal: the only rig Z move.  TO=<stroke>.  Refuses beyond the mounted pipette's depth limit, and below 0 unless EJECT=1 with X at the eject station
gcode:
    {% set v = printer["gcode_macro _BR"] %}
    {% if not v.homed %}{action_raise_error("BR: run BR_HOME first")}{% endif %}
    {% set to = params.TO|float %}
    {% set ej = params.EJECT|default(0)|int == 1 %}
    {% if to < 0 and not ej %}{action_raise_error("BR: Z below 0 only for the ejector (EJECT=1)")}{% endif %}
    {% if to < 0 and (v.xpos - v.x_eject)|abs > 0.01 %}{action_raise_error("BR: Z below 0 only with X at the eject station (x %.2f, eject %.2f)" % (v.xpos, v.x_eject))}{% endif %}
    {% if to < v.z_ejector - 0.001 %}{action_raise_error("BR: Z %.2f above the eject over-travel %.2f" % (to, v.z_ejector))}{% endif %}
    {% if to > v["depth_max_" ~ v.mounted] %}{action_raise_error("BR: Z %.2f deeper than the %s depth limit %.2f" % (to, v.mounted, v["depth_max_" ~ v.mounted]))}{% endif %}
    MANUAL_STEPPER_BASE STEPPER=rig_z MOVE={to} SPEED={params.SPEED|default(10)|float} SYNC=1
    SET_GCODE_VARIABLE_BASE MACRO=_BR VARIABLE=zpos VALUE={to}

[gcode_macro _BR_X]
description: internal: the rig X move with Z up.  TO=<mm>.  Refuses unless Z is at its top (tracked position AND the Z-up switch)
gcode:
    {% set v = printer["gcode_macro _BR"] %}
    {% if not v.homed %}{action_raise_error("BR: run BR_HOME first")}{% endif %}
    {% if v.zpos|abs > 0.01 %}{action_raise_error("BR: X move refused: Z not at its top")}{% endif %}
    _BR_REQUIRE_ZUP
    MANUAL_STEPPER_BASE STEPPER=rig_x MOVE={params.TO|float} SPEED={params.SPEED|default(100)|float} SYNC=1
    SET_GCODE_VARIABLE_BASE MACRO=_BR VARIABLE=xpos VALUE={params.TO|float}

[gcode_macro _BR_XSLIDE]
description: internal: the only X move with Z lowered: the comb-slot slide.  Starts only at the mounted pipette's comb station and comb depth, ends within comb_slide_mm (+X) of it
gcode:
    {% set v = printer["gcode_macro _BR"] %}
    {% set to = params.TO|float %}
    {% set xc = v["x_comb_" ~ v.mounted] %}
    {% set zc = v["z_comb_" ~ v.mounted] %}
    {% if not v.homed %}{action_raise_error("BR: run BR_HOME first")}{% endif %}
    {% if (v.xpos - xc)|abs > 0.01 %}{action_raise_error("BR: slide refused: X %.2f is not at the comb station %.2f" % (v.xpos, xc))}{% endif %}
    {% if to < xc - 0.01 or to > xc + v.comb_slide_mm + 0.01 %}{action_raise_error("BR: slide refused: target %.2f outside the comb travel %.2f..%.2f" % (to, xc, xc + v.comb_slide_mm))}{% endif %}
    {% if (v.zpos - zc)|abs > 0.01 %}{action_raise_error("BR: slide refused: Z %.2f is not at the comb depth %.2f" % (v.zpos, zc))}{% endif %}
    MANUAL_STEPPER_BASE STEPPER=rig_x MOVE={to} SPEED=10 SYNC=1
    SET_GCODE_VARIABLE_BASE MACRO=_BR VARIABLE=xpos VALUE={to}

[gcode_macro _BR_NEED_HOME]
gcode:
    {% if not printer["gcode_macro _BR"].homed %}{action_raise_error("BR: run BR_HOME first")}{% endif %}

[gcode_macro _BR_GO]
description: internal: STATION=rack|comb|plate|balance|eject with Z up, then settle (comb: the mounted pipette's comb x)
gcode:
    {% set v = printer["gcode_macro _BR"] %}
    {% set key = "x_comb_" ~ v.mounted if params.STATION == "comb" else "x_" ~ params.STATION %}
    _BR_NEED_HOME
    _BR_Z TO=0 SPEED=20
    _BR_X TO={v[key]} SPEED=100
    G4 P{v.settle_ms}

[gcode_macro _BR_LC_READY]
description: internal: LC=<rack|comb|yoke|eject>.  Refuses unless that load cell is calibrated (Klipper status is_calibrated), then tares it here (call only at an unloaded position)
gcode:
    {% set lc = printer["load_cell lc_" ~ params.LC] %}
    {% if lc.is_calibrated is not defined or not lc.is_calibrated %}{action_raise_error("BR: load cell lc_%s is not calibrated (LOAD_CELL_CALIBRATE, SAVE_CONFIG): force-limited sequence refused" % params.LC)}{% endif %}
    LOAD_CELL_TARE LOAD_CELL=lc_{params.LC}

[gcode_macro _BR_FORCE]
description: internal: logs one reading of load cell LC=<rack|comb|yoke|eject> with a tag, and keeps the peak.  Refuses if the cell gives no force reading
gcode:
    {% set lc = printer["load_cell lc_" ~ params.LC] %}
    {% if lc.is_calibrated is not defined or not lc.is_calibrated or lc.force_g is not defined or lc.force_g is none %}{action_raise_error("BR: load cell lc_%s gives no calibrated force reading: stop" % params.LC)}{% endif %}
    {% set f = lc.force_g * 0.00980665 %}
    {% set p = printer["gcode_macro _BR"].peak %}
    {% if f > p %}SET_GCODE_VARIABLE_BASE MACRO=_BR VARIABLE=peak VALUE={f}{% endif %}
    RESPOND MSG="BR_LOG {params.TAG} {params.I|default(0)} pos={params.POS|default(0)} lc={params.LC} force_N={'%.2f' % f}"

# ---- 1. plunger force versus travel (pipette in air, no tip; LC-3 in the HP-5 yoke) ----
[gcode_macro BR_PLUNGER_SWEEP]
description: [STEP=0.1] [MAX=24].  Steps the plunger from released to MAX, logging yoke force at each step (first and second stop)
gcode:
    _BR_NEED_HOME
    {% set st = params.STEP|default(0.1)|float %}
    {% set mx = params.MAX|default(24.0)|float %}
    _BR_Z TO=0 SPEED=20
    MANUAL_STEPPER_BASE STEPPER=rig_plunger MOVE=0 SPEED=5 SYNC=1
    _BR_LC_READY LC=yoke
    {% for i in range((mx / st)|int + 1) %}
    MANUAL_STEPPER_BASE STEPPER=rig_plunger MOVE={i * st} SPEED=1 SYNC=1
    G4 P150
    _BR_FORCE LC=yoke TAG=sweep I={i} POS={i * st}
    {% endfor %}
    MANUAL_STEPPER_BASE STEPPER=rig_plunger MOVE=0 SPEED=5 SYNC=1

# ---- 2. dispenses of a set volume for weighing ----
[gcode_macro BR_DISPENSE]
description: UL=<uL> [N=1] [MODE=operator|serial] [DWELL=15].  Aspirate at the plate nest, dispense into the trap vial on the balance (with blow-out), then report for weighing
gcode:
    _BR_NEED_HOME
    {% set v = printer["gcode_macro _BR"] %}
    {% set ul = params.UL|float %}
    {% set n = params.N|default(1)|int if params.MODE|default("operator") == "serial" else 1 %}
    {% if ul <= 0 %}{action_raise_error("BR_DISPENSE: UL must be > 0")}{% endif %}
    {% for i in range(n) %}
    _BR_GO STATION=plate
    MANUAL_STEPPER_BASE STEPPER=rig_plunger MOVE={v.contact + v.first_stop} SPEED=2 SYNC=1
    _BR_Z TO={v.z_source} SPEED=10
    MANUAL_STEPPER_BASE STEPPER=rig_plunger MOVE={v.contact + v.first_stop - ul / v.ul_per_mm} SPEED=1 SYNC=1
    G4 P1000
    _BR_Z TO=0 SPEED=5
    _BR_GO STATION=balance
    _BR_Z TO={v.z_vial} SPEED=10
    MANUAL_STEPPER_BASE STEPPER=rig_plunger MOVE={v.contact + v.first_stop} SPEED=1 SYNC=1
    MANUAL_STEPPER_BASE STEPPER=rig_plunger MOVE={v.contact + v.blowout} SPEED=2 SYNC=1
    _BR_Z TO=0 SPEED=5
    MANUAL_STEPPER_BASE STEPPER=rig_plunger MOVE=0 SPEED=5 SYNC=1
    {% if params.MODE|default("operator") == "serial" %}
    RESPOND MSG="BR_WEIGH_READY {i} ul={ul}"
    G4 P{params.DWELL|default(15)|int * 1000}
    {% else %}
    RESPOND MSG="BR_WEIGH {i} ul={ul}: read the balance, record it, run BR_DISPENSE again for the next replicate"
    {% endif %}
    {% endfor %}

# ---- 3. tip pick-up (force-switch ended) and strip, logging peak forces ----
[gcode_macro BR_PICK]
description: [STEP=0.1].  At the rack: step down from z_pick_start until the cradle force switch trips (error at z_pick_max); logs LC-1 peak
gcode:
    _BR_GO STATION=rack
    {% set v = printer["gcode_macro _BR"] %}
    {% set st = params.STEP|default(0.1)|float %}
    _BR_LC_READY LC=rack
    SET_GCODE_VARIABLE_BASE MACRO=_BR VARIABLE=peak VALUE=0.0
    SET_GCODE_VARIABLE_BASE MACRO=_BR VARIABLE=tripped VALUE=0
    SET_TMC_CURRENT_BASE STEPPER=rig_z CURRENT={v.run_current}
    _BR_Z TO={v.z_pick_start} SPEED=10
    SET_TMC_CURRENT_BASE STEPPER=rig_z CURRENT={v.force_current}
    {% for i in range(((v.z_pick_max - v.z_pick_start) / st)|int + 1) %}
    _BR_PICK_STEP Z={v.z_pick_start + i * st} I={i}
    {% endfor %}
    SET_TMC_CURRENT_BASE STEPPER=rig_z CURRENT={v.run_current}
    _BR_Z TO=0 SPEED=10
    _BR_PICK_END

[gcode_macro _BR_PICK_STEP]
gcode:
    {% if printer["gcode_macro _BR"].tripped == 0 %}
    {% if printer["gcode_button rig_force"].state == "PRESSED" %}
    SET_GCODE_VARIABLE_BASE MACRO=_BR VARIABLE=tripped VALUE=1
    {% else %}
    _BR_Z TO={params.Z} SPEED=2
    _BR_FORCE LC=rack TAG=pick I={params.I} POS={params.Z}
    {% endif %}
    {% endif %}

[gcode_macro _BR_PICK_END]
gcode:
    {% set v = printer["gcode_macro _BR"] %}
    RESPOND MSG="BR_RESULT pick tripped={v.tripped} peak_N={'%.1f' % v.peak}"
    {% if v.tripped == 0 %}SET_GCODE_VARIABLE_BASE MACRO=_BR VARIABLE=fail VALUE=1{% endif %}

[gcode_macro BR_STRIP]
description: METHOD=comb|ejector [STEP=0.2].  comb: at the mounted pipette's comb station, lower to its comb depth, slide into the TW-4D slot and lift (LC-2 peak); ejector (method B): at the eject station, Z up to z_ejector onto EJ-1, slow and at reduced current (LC-4 peak).  (rerack removed: the rack has no slots)
gcode:
    {% set v = printer["gcode_macro _BR"] %}
    {% set m = params.METHOD|default("comb") %}
    {% if m not in ("comb", "ejector") %}{action_raise_error("BR_STRIP: METHOD must be comb or ejector")}{% endif %}
    {% set st = params.STEP|default(0.2)|float %}
    SET_GCODE_VARIABLE_BASE MACRO=_BR VARIABLE=peak VALUE=0.0
    {% if m == "ejector" %}
    _BR_GO STATION=eject
    _BR_LC_READY LC=eject
    SET_TMC_CURRENT_BASE STEPPER=rig_z CURRENT={v.ej_current}
    {% for i in range((-v.z_ejector / st)|int + 1) %}
    _BR_Z TO={[-i * st, v.z_ejector]|max} SPEED={v.ej_speed} EJECT=1
    _BR_FORCE LC=eject TAG=eject I={i} POS={[-i * st, v.z_ejector]|max}
    {% endfor %}
    _BR_Z TO=0 SPEED={v.ej_speed}
    SET_TMC_CURRENT_BASE STEPPER=rig_z CURRENT={v.run_current}
    {% else %}
    {% set xc = v["x_comb_" ~ v.mounted] %}
    {% set zc = v["z_comb_" ~ v.mounted] %}
    _BR_GO STATION=comb
    _BR_LC_READY LC=comb
    _BR_Z TO={zc} SPEED=10
    _BR_XSLIDE TO={xc + v.comb_slide_mm}
    SET_TMC_CURRENT_BASE STEPPER=rig_z CURRENT={v.force_current}
    {% for i in range((20.0 / st)|int + 1) %}
    _BR_Z TO={zc - i * st} SPEED=5
    _BR_FORCE LC=comb TAG=strip I={i} POS={zc - i * st}
    {% endfor %}
    SET_TMC_CURRENT_BASE STEPPER=rig_z CURRENT={v.run_current}
    _BR_Z TO=0 SPEED=10
    {% endif %}
    RESPOND MSG="BR_RESULT strip method={m} peak_N={'%.1f' % printer['gcode_macro _BR'].peak}"

# ---- 4. unattended endurance loop: stops on any force outside limits or a missed force-switch trip ----
[gcode_macro BR_ENDURANCE]
description: CYCLES=<n> [METHOD=comb|ejector] [PICK_MAX_N=150] [STRIP_MAX_N / STRIP_MIN_N]: strip limits default per method (comb 120 / 1 N, ejector 70 / 5 N: ejector force 20-45 N nominal, params EJECTOR)
gcode:
    _BR_NEED_HOME
    SET_GCODE_VARIABLE_BASE MACRO=_BR VARIABLE=fail VALUE=0
    {% for i in range(params.CYCLES|int) %}
    {% set m = params.METHOD|default("comb") %}
    {% if m not in ("comb", "ejector") %}{action_raise_error("BR_ENDURANCE: METHOD must be comb or ejector")}{% endif %}
    {% set lim = {"comb": (120, 1), "ejector": (70, 5)}[m] %}
    _BR_CYCLE I={i} METHOD={m} PICK_MAX_N={params.PICK_MAX_N|default(150)} STRIP_MAX_N={params.STRIP_MAX_N|default(lim[0])} STRIP_MIN_N={params.STRIP_MIN_N|default(lim[1])}
    {% endfor %}
    RESPOND MSG="BR_ENDURANCE complete: {params.CYCLES} cycles"

[gcode_macro _BR_CYCLE]
gcode:
    {% if printer["gcode_macro _BR"].fail == 0 %}
    BR_PICK
    _BR_LIMIT KIND=pick MAX={params.PICK_MAX_N} MIN=0
    BR_STRIP METHOD={params.METHOD}
    _BR_LIMIT KIND=strip MAX={params.STRIP_MAX_N} MIN={params.STRIP_MIN_N}
    _BR_COUNT I={params.I}
    {% endif %}

[gcode_macro _BR_LIMIT]
gcode:
    {% set v = printer["gcode_macro _BR"] %}
    {% if v.fail or v.peak > params.MAX|float or v.peak < params.MIN|float %}
    SET_GCODE_VARIABLE_BASE MACRO=_BR VARIABLE=fail VALUE=1
    _BR_Z TO=0 SPEED=10
    _BR_ABORT KIND={params.KIND} PEAK={v.peak} MIN={params.MIN} MAX={params.MAX}
    {% endif %}

[gcode_macro _BR_ABORT]
gcode:
    {action_raise_error("BR_ENDURANCE stopped (Z raised): %s peak %s N outside %s..%s N, or force switch not tripped, after %d cycles" % (params.KIND, params.PEAK, params.MIN, params.MAX, printer["gcode_macro _BR"].cycles_done))}

[gcode_macro _BR_COUNT]
gcode:
    SET_GCODE_VARIABLE_BASE MACRO=_BR VARIABLE=cycles_done VALUE={printer["gcode_macro _BR"].cycles_done + 1}
    RESPOND MSG="BR_CYCLE {params.I} ok"

# ---------------- revision L coupling tests, rebuilt for ADR-014 (latch LTG-1 opened by the dock lift) ----------------
[gcode_macro _BR_CODE]
description: internal: WANT=<tool|EMPTY|OPEN>.  Reads the three-state latch and the code; EMPTY = code 0000 and CLOSED-EMPTY; OPEN = NOT CLOSED (code any); a tool = its code with the latch LOCKED.  A mismatch is a DETECTED exchange failure: Z up (the jaw is closed or the tool stands on the bay pins) and stop
gcode:
    {% set l = printer["gcode_macro _BRL"] %}
    {% set ns = namespace(code=0) %}
    {% for i in range(4) %}{% if printer["gcode_button rig_hall" ~ i].state == "PRESSED" %}{% set ns.code = ns.code + 2 ** i %}{% endif %}{% endfor %}
    {% set lk = "locked" if printer["gcode_button rig_latch"].state == "PRESSED" else ("empty" if printer["gcode_button rig_latch_empty"].state == "PRESSED" else ("open" if printer["gcode_button rig_latch_open"].state == "PRESSED" else "fault")) %}
    {% set ok = (ns.code == 0 and lk == "empty") if params.WANT == "EMPTY" else ((lk == "open") if params.WANT == "OPEN" else (ns.code == l.codes[params.WANT] and lk == "locked")) %}
    RESPOND MSG="BR_CODE want={params.WANT} code={ns.code} latch={lk} ok={1 if ok else 0}"
    {% if not ok %}
    SET_GCODE_VARIABLE_BASE MACRO=_BRL VARIABLE=ex_detected VALUE={l.ex_detected + 1}
    {action_raise_error("BR: DETECTED exchange failure (want %s, code %d, latch %s) after %d exchanges: inspect, then BR_HOME" % (params.WANT, ns.code, lk, l.ex_done))}
    {% endif %}

[gcode_macro _BR_BAY]
description: internal: BAY=1|2 WANT=occupied|empty.  Bay switch check; a disagreement is a DETECTED failure
gcode:
    {% set occ = printer["gcode_button rig_bay" ~ params.BAY].state == "PRESSED" %}
    {% if occ != (params.WANT == "occupied") %}
    SET_GCODE_VARIABLE_BASE MACRO=_BRL VARIABLE=ex_detected VALUE={printer["gcode_macro _BRL"].ex_detected + 1}
    {action_raise_error("BR: DETECTED bay-switch disagreement: bay %s should be %s" % (params.BAY, params.WANT))}
    {% endif %}

[gcode_macro _BR_PUSHER_HOME]
description: internal: STEPPER=rig_plunger|rig_syringe.  The machine's pusher homing: <= 0.50 A and <= 2 mm/s onto the RETRACTED switch (never into the internal stop above the maker's 0.57 A), back off, re-touch, run current restored
gcode:
    {% set l = printer["gcode_macro _BRL"] %}
    {% set st = params.STEPPER %}
    {% if st not in ("rig_plunger", "rig_syringe") %}{action_raise_error("_BR_PUSHER_HOME: STEPPER must be rig_plunger or rig_syringe")}{% endif %}
    SET_TMC_CURRENT_BASE STEPPER={st} CURRENT={l.pusher_home_current}
    RESPOND MSG="BR_PUSHER_HOME {st} current={l.pusher_home_current} A (maker's internal-stop limit 0.57 A)"
    MANUAL_STEPPER_BASE STEPPER={st} SET_POSITION=38.0
    MANUAL_STEPPER_BASE STEPPER={st} SPEED={l.pusher_home_speed} MOVE=-0.6 STOP_ON_ENDSTOP=home
    MANUAL_STEPPER_BASE STEPPER={st} SET_POSITION=0
    MANUAL_STEPPER_BASE STEPPER={st} SPEED=1 MOVE=2 STOP_ON_ENDSTOP=inverted_probe
    MANUAL_STEPPER_BASE STEPPER={st} SPEED=1 MOVE=-0.6 STOP_ON_ENDSTOP=home
    MANUAL_STEPPER_BASE STEPPER={st} SET_POSITION=0
    SET_TMC_CURRENT_BASE STEPPER={st} CURRENT={l.pusher_run_current}

# ---- rig dock lift (the machine's DLB-1 drive on rig2) ----
[gcode_macro _BR_LIFT_HOME]
description: internal (BR_HOME): lower the rig lift bar onto its DOWN switch at the home current, then the run current; lift = 0
gcode:
    {% set l = printer["gcode_macro _BRL"] %}
    SET_GCODE_VARIABLE_BASE MACRO=_BRL VARIABLE=lift VALUE=-1.0
    SET_TMC_CURRENT_BASE STEPPER=rig_lift CURRENT={l.lift_home_current}
    MANUAL_STEPPER_BASE STEPPER=rig_lift SET_POSITION=53.0
    MANUAL_STEPPER_BASE STEPPER=rig_lift SPEED={l.lift_speed} MOVE=-1.0 STOP_ON_ENDSTOP=home
    MANUAL_STEPPER_BASE STEPPER=rig_lift SET_POSITION=0
    SET_TMC_CURRENT_BASE STEPPER=rig_lift CURRENT={l.lift_run_current}
    SET_GCODE_VARIABLE_BASE MACRO=_BRL VARIABLE=lift VALUE=0.0

[gcode_macro _BR_LIFT]
description: internal: TO=<mm 0..50> [SPEED=<= 5].  The only rig lift move up or to a height; refuses with the bar position unknown
gcode:
    {% set l = printer["gcode_macro _BRL"] %}
    {% set to = params.TO|float %}
    {% set v = params.SPEED|default(l.lift_speed)|float %}
    {% if not printer["gcode_macro _BR"].homed or l.lift < 0 %}{action_raise_error("BR: lift position unknown: BR_HOME first")}{% endif %}
    {% if to < 0 or to > 50.0 %}{action_raise_error("BR: lift target %.2f outside 0..50 mm" % to)}{% endif %}
    {% if v <= 0 or v > l.lift_speed %}{action_raise_error("BR: lift speed %.2f outside 0..%.1f mm/s" % (v, l.lift_speed))}{% endif %}
    MANUAL_STEPPER_BASE STEPPER=rig_lift MOVE={to} SPEED={v} SYNC=1
    SET_GCODE_VARIABLE_BASE MACRO=_BRL VARIABLE=lift VALUE={to}

[gcode_macro _BR_LIFT_DOWN]
description: internal: [LOG=1].  Lower the bar ONTO its DOWN switch (homing move); LOG=1 first lowers it in lift_step_mm steps logging LC-5 (CT-0b re-latch force)
gcode:
    {% set l = printer["gcode_macro _BRL"] %}
    {% if params.LOG|default(0)|int == 1 and l.lift > 0 %}
    {% for i in range(1, (l.lift / l.lift_step_mm)|int + 1) %}
    MANUAL_STEPPER_BASE STEPPER=rig_lift MOVE={[l.lift - i * l.lift_step_mm, 0.0]|max} SPEED=1 SYNC=1
    M400
    _BR_FORCE LC=lift TAG=relatch I={i} POS={[l.lift - i * l.lift_step_mm, 0.0]|max}
    {% endfor %}
    {% endif %}
    SET_GCODE_VARIABLE_BASE MACRO=_BRL VARIABLE=lift VALUE=-1.0
    MANUAL_STEPPER_BASE STEPPER=rig_lift SPEED={l.lift_speed} MOVE=-1.0 STOP_ON_ENDSTOP=home
    MANUAL_STEPPER_BASE STEPPER=rig_lift SET_POSITION=0
    SET_GCODE_VARIABLE_BASE MACRO=_BRL VARIABLE=lift VALUE=0.0

[gcode_macro _BR_OPEN_CHECK]
description: internal: after the bar went up (and an M400): bar at the OPEN height AND the latch NOT CLOSED, else lower the bar (the springs re-close the jaw) and stop (DETECTED)
gcode:
    {% if printer["gcode_button rig_bar_open"].state != "PRESSED" or printer["gcode_button rig_latch_open"].state != "PRESSED" %}
    SET_GCODE_VARIABLE_BASE MACRO=_BRL VARIABLE=ex_detected VALUE={printer["gcode_macro _BRL"].ex_detected + 1}
    _BR_LIFT_DOWN
    _BR_FAIL MSG="latch did not open (bar_open={1 if printer['gcode_button rig_bar_open'].state == 'PRESSED' else 0}): bar lowered, inspect"
    {% endif %}

[gcode_macro _BR_FAIL]
gcode:
    {action_raise_error("BR: %s" % params.MSG|default("stop"))}

[gcode_macro BR_CT_PARK]
description: BAY=1|2 TOOL=<code name> [LOG=0].  ADR-014 drop-off on the rig dock (the machine's sequence): seat on the bay pins, bar up to rise + gap, OPEN check, 13 x (bar +1, Z -1), bar down onto its switch, CLOSED-EMPTY and code 0000, bay occupied, Z up
gcode:
    {% set l = printer["gcode_macro _BRL"] %}
    {% set v = printer["gcode_macro _BR"] %}
    {% set up = l.rise_mm + l.gap_mm %}
    {% set nf = l.follow_mm|int %}
    _BR_NEED_HOME
    {% if v.mounted != "coupling" %}{action_raise_error("BR_CT_PARK: set variable mounted 'coupling' (coupling bracket fitted) and RESTART")}{% endif %}
    {% if params.BAY|int not in (1, 2) %}{action_raise_error("BR_CT_PARK: BAY must be 1 or 2")}{% endif %}
    {% if l.lift != 0 %}{action_raise_error("BR_CT_PARK: the lift bar is not down (BR_HOME)")}{% endif %}
    M400
    _BR_CODE WANT={params.TOOL}
    _BR_BAY BAY={params.BAY} WANT=empty
    _BR_Z TO=0 SPEED=20
    _BR_X TO={l["x_bay" ~ params.BAY]} SPEED=100
    G4 P{v.settle_ms}
    _BR_Z TO={l.z_seat - l.slow_mm} SPEED=20
    _BR_Z TO={l.z_seat} SPEED=5
    M400
    _BR_BAY BAY={params.BAY} WANT=occupied
    _BR_CODE WANT={params.TOOL}
    _BR_LIFT TO={up}
    M400
    _BR_OPEN_CHECK
    {% for i in range(1, nf + 1) %}
    _BR_LIFT TO={up + i}
    _BR_Z TO={l.z_seat - i} SPEED=5
    {% endfor %}
    _BR_LIFT_DOWN LOG={params.LOG|default(0)|int}
    M400
    _BR_CODE WANT=EMPTY
    _BR_BAY BAY={params.BAY} WANT=occupied
    _BR_Z TO=0 SPEED=20

[gcode_macro BR_CT_PICK]
description: BAY=1|2 TOOL=<code name> [LOG=0].  ADR-014 pick-up on the rig dock: Z to z_seat - 13 (stud head below the jaw), bar up to rise + gap + 13, OPEN check, 13 x (Z +1, bar -1), bar down onto its switch (LOG=1 logs LC-5: CT-0b), LOCKED with the code, Z up slowly, bay empty
gcode:
    {% set l = printer["gcode_macro _BRL"] %}
    {% set v = printer["gcode_macro _BR"] %}
    {% set up = l.rise_mm + l.gap_mm + l.follow_mm %}
    {% set nf = l.follow_mm|int %}
    {% set s0 = l.z_seat - l.follow_mm %}
    _BR_NEED_HOME
    {% if v.mounted != "coupling" %}{action_raise_error("BR_CT_PICK: set variable mounted 'coupling' and RESTART")}{% endif %}
    {% if params.BAY|int not in (1, 2) %}{action_raise_error("BR_CT_PICK: BAY must be 1 or 2")}{% endif %}
    {% if params.TOOL not in l.codes %}{action_raise_error("BR_CT_PICK: unknown TOOL %s" % params.TOOL)}{% endif %}
    {% if l.lift != 0 %}{action_raise_error("BR_CT_PICK: the lift bar is not down (BR_HOME)")}{% endif %}
    M400
    _BR_CODE WANT=EMPTY
    _BR_BAY BAY={params.BAY} WANT=occupied
    _BR_Z TO=0 SPEED=20
    _BR_X TO={l["x_bay" ~ params.BAY]} SPEED=100
    G4 P{v.settle_ms}
    _BR_Z TO={s0 - l.slow_mm} SPEED=20
    _BR_Z TO={s0} SPEED=5
    M400
    _BR_CODE WANT=EMPTY
    _BR_LIFT TO={up}
    M400
    _BR_OPEN_CHECK
    {% for i in range(1, nf + 1) %}
    _BR_Z TO={s0 + i} SPEED=5
    _BR_LIFT TO={up - i}
    {% endfor %}
    _BR_LIFT_DOWN LOG={params.LOG|default(0)|int}
    M400
    _BR_CODE WANT={params.TOOL}
    _BR_Z TO={l.z_seat - l.slow_mm} SPEED=5
    _BR_Z TO=0 SPEED=20
    M400
    _BR_BAY BAY={params.BAY} WANT=empty

[gcode_macro BR_CT_EXCHANGE]
description: N=<pairs, <= 50 per call> TOOL1=<tool in bay 1> TOOL2=<tool in bay 2> [READ=0|1] [DWELL=5].  CT-1 / CT-5: alternately pick and park the two tools with the dock lift (start with an empty coupling, both bays occupied); READ=1 brings the nozzle reference pin to the two indicators after every pick-up (z_measure) and pauses DWELL s (BR_CT1_READ n); stops at the first DETECTED failure
gcode:
    {% if params.N|int < 1 or params.N|int > 50 %}{action_raise_error("BR_CT_EXCHANGE: N must be 1..50 (the host repeats the call)")}{% endif %}
    {% for i in range(params.N|int) %}
    BR_CT_PICK BAY=1 TOOL={params.TOOL1}
    {% if params.READ|default(0)|int == 1 %}
    _BR_CT1_READ TOOL={params.TOOL1} DWELL={params.DWELL|default(5)|int}
    {% endif %}
    BR_CT_PARK BAY=1 TOOL={params.TOOL1}
    BR_CT_PICK BAY=2 TOOL={params.TOOL2}
    {% if params.READ|default(0)|int == 1 %}
    _BR_CT1_READ TOOL={params.TOOL2} DWELL={params.DWELL|default(5)|int}
    {% endif %}
    BR_CT_PARK BAY=2 TOOL={params.TOOL2}
    _BR_EX_COUNT N=2
    {% endfor %}

[gcode_macro _BR_CT1_READ]
description: internal: CT-1: nozzle reference pin to the indicators (z_measure, X unchanged), report, dwell, Z up
gcode:
    {% set l = printer["gcode_macro _BRL"] %}
    _BR_Z TO={l.z_measure} SPEED=5
    M400
    RESPOND MSG="BR_CT1_READ n={l.ex_done + 1} tool={params.TOOL}: read both indicators now"
    G4 P{params.DWELL|int * 1000}
    _BR_Z TO=0 SPEED=10

[gcode_macro BR_CT_RELEASE]
description: BAY=1|2 TOOL=<code name>.  CT-0a: seat the latched tool on the bay pins, raise the bar in lift_step_mm steps through LC-5 logging force vs stroke up to rise + gap (stop above release_max_n), OPEN check, then lower the bar (the latch re-closes on the stud: the tool stays) and lift Z.  Reply: BR_RESULT release peak_N=<n>
gcode:
    {% set l = printer["gcode_macro _BRL"] %}
    {% set v = printer["gcode_macro _BR"] %}
    {% set up = l.rise_mm + l.gap_mm %}
    _BR_NEED_HOME
    {% if v.mounted != "coupling" %}{action_raise_error("BR_CT_RELEASE: set variable mounted 'coupling' and RESTART")}{% endif %}
    {% if params.BAY|int not in (1, 2) %}{action_raise_error("BR_CT_RELEASE: BAY must be 1 or 2")}{% endif %}
    {% if l.lift != 0 %}{action_raise_error("BR_CT_RELEASE: the lift bar is not down (BR_HOME)")}{% endif %}
    M400
    _BR_CODE WANT={params.TOOL}
    _BR_BAY BAY={params.BAY} WANT=empty
    _BR_Z TO=0 SPEED=20
    _BR_X TO={l["x_bay" ~ params.BAY]} SPEED=100
    _BR_LC_READY LC=lift
    SET_GCODE_VARIABLE_BASE MACRO=_BR VARIABLE=peak VALUE=0.0
    G4 P{v.settle_ms}
    _BR_Z TO={l.z_seat - l.slow_mm} SPEED=20
    _BR_Z TO={l.z_seat} SPEED=5
    M400
    _BR_BAY BAY={params.BAY} WANT=occupied
    {% for i in range(1, (up / l.lift_step_mm)|int + 1) %}
    _BR_LIFT TO={[i * l.lift_step_mm, up]|min} SPEED=1
    M400
    _BR_FORCE LC=lift TAG=release I={i} POS={[i * l.lift_step_mm, up]|min}
    _BR_RELEASE_LIMIT
    {% endfor %}
    _BR_LIFT TO={up} SPEED=1
    M400
    _BR_OPEN_CHECK
    _BR_LIFT_DOWN
    M400
    _BR_CODE WANT={params.TOOL}
    _BR_Z TO=0 SPEED=20
    _BR_RELEASE_END

[gcode_macro _BR_RELEASE_LIMIT]
description: internal: the release force above release_max_n (lift thrust / 1.5): lower the bar and stop (CT-0a FAIL)
gcode:
    {% set v = printer["gcode_macro _BR"] %}
    {% if v.peak > printer["gcode_macro _BRL"].release_max_n %}
    _BR_LIFT_DOWN
    _BR_FAIL MSG="CT-0a FAIL: release force {'%.1f' % v.peak} N above {printer['gcode_macro _BRL'].release_max_n} N (lift thrust / 1.5): bar lowered"
    {% endif %}

[gcode_macro _BR_RELEASE_END]
gcode:
    RESPOND MSG="BR_RESULT release peak_N={'%.1f' % printer['gcode_macro _BR'].peak} limit_N={printer['gcode_macro _BRL'].release_max_n}"

[gcode_macro BR_CT_RELATCH]
description: N=<1..50> BAY=1|2 TOOL=<code name>.  CT-0b: N x (pick-up with the bar lowered in steps logging LC-5, LOCKED with the code; drop-off back into the bay); stops at the first latch that does not close (DETECTED)
gcode:
    {% if params.N|int < 1 or params.N|int > 50 %}{action_raise_error("BR_CT_RELATCH: N must be 1..50 (the host repeats the call to 100)")}{% endif %}
    _BR_LC_READY LC=lift
    {% for i in range(params.N|int) %}
    BR_CT_PICK BAY={params.BAY} TOOL={params.TOOL} LOG=1
    BR_CT_PARK BAY={params.BAY} TOOL={params.TOOL}
    _BR_EX_COUNT N=2
    {% endfor %}

[gcode_macro BR_CT_LOCK_READ]
description: CT-3 / CT-4: report latch state and code NOW (the operator applies the pull, the shim, the debris or removes a closing spring); prints LOCKED=1 only with the latch LOCKED AND a valid code.  Pass: LOCKED never 1 in a half-lock
gcode:
    {% set l = printer["gcode_macro _BRL"] %}
    {% set ns = namespace(code=0) %}
    {% for i in range(4) %}{% if printer["gcode_button rig_hall" ~ i].state == "PRESSED" %}{% set ns.code = ns.code + 2 ** i %}{% endif %}{% endfor %}
    {% set lk = "LOCKED" if printer["gcode_button rig_latch"].state == "PRESSED" else ("EMPTY" if printer["gcode_button rig_latch_empty"].state == "PRESSED" else ("OPEN" if printer["gcode_button rig_latch_open"].state == "PRESSED" else "FAULT")) %}
    RESPOND MSG="BR_LOCK LOCKED={1 if lk == 'LOCKED' and ns.code in l.codes.values() else 0} LATCH={lk} CODE={ns.code} TAG={params.TAG|default('')}"

# ---- CT-0d: the LGA35 pusher's force at 0.7 A (spring + 200 N button cell LC-3 in the pusher line) ----
[gcode_macro BR_CT_PUSH_FORCE]
description: SPEED=2|5|8.  CT-0d: home the pusher (0.50 A), tare LC-3, move to the spring cap, push push_travel at SPEED and 0.7 A, read the force (pass >= 120 N at 5 mm/s), retract to 1 mm, then a homing move measures the steps lost under load.  Reply: BR_RESULT push speed=<v> force_N=<n> lost_mm=<x>
gcode:
    {% set l = printer["gcode_macro _BRL"] %}
    {% set sp = params.SPEED|default(5)|float %}
    _BR_NEED_HOME
    {% if sp not in (2.0, 5.0, 8.0) %}{action_raise_error("BR_CT_PUSH_FORCE: SPEED must be 2, 5 or 8 mm/s (CAD CT-0d)")}{% endif %}
    {% if l.push_contact + l.push_travel > 35.0 %}{action_raise_error("BR_CT_PUSH_FORCE: contact + travel beyond the 35 mm stroke")}{% endif %}
    _BR_PUSHER_HOME STEPPER=rig_plunger
    _BR_LC_READY LC=yoke
    SET_GCODE_VARIABLE_BASE MACRO=_BR VARIABLE=peak VALUE=0.0
    MANUAL_STEPPER_BASE STEPPER=rig_plunger MOVE={l.push_contact} SPEED=2 SYNC=1
    MANUAL_STEPPER_BASE STEPPER=rig_plunger MOVE={l.push_contact + l.push_travel} SPEED={sp} SYNC=1
    M400
    _BR_FORCE LC=yoke TAG=push_{sp|int} POS={l.push_contact + l.push_travel}
    MANUAL_STEPPER_BASE STEPPER=rig_plunger MOVE=1.0 SPEED=2 SYNC=1
    SET_TMC_CURRENT_BASE STEPPER=rig_plunger CURRENT={l.pusher_home_current}
    MANUAL_STEPPER_BASE STEPPER=rig_plunger SPEED={l.pusher_home_speed} MOVE=-0.6 STOP_ON_ENDSTOP=home
    SET_TMC_CURRENT_BASE STEPPER=rig_plunger CURRENT={l.pusher_run_current}
    M400
    _BR_PUSH_END SPEED={sp}

[gcode_macro _BR_PUSH_END]
description: internal: report the CT-0d result; the recorded position where the RETRACTED switch tripped is the motion lost under load (0 = no lost steps); re-zero
gcode:
    {% set lost = printer["manual_stepper rig_plunger"].position %}
    RESPOND MSG="BR_RESULT push speed={params.SPEED} force_N={'%.1f' % printer['gcode_macro _BR'].peak} lost_mm={'%.3f' % lost} (pass at 5 mm/s: >= 120 N and lost < 0.05 mm)"
    MANUAL_STEPPER_BASE STEPPER=rig_plunger SET_POSITION=0

# ---- CT-0c and CT-9: one TPK-S group on the rig X (entry, spot at -dx and +dx) ----
[gcode_macro _BR_TSLIDE]
description: internal: TO=<rig X>.  The TPK-S slide with Z lowered: only between the group's entry and one of its two spots, only at z_tpks_slide, at <= 10 mm/s and <= 0.25 m/s2
gcode:
    {% set l = printer["gcode_macro _BRL"] %}
    {% set v = printer["gcode_macro _BR"] %}
    {% set to = params.TO|float %}
    {% set e = l.x_tpks_entry %}
    {% set ok = [e, e - l.tpks_dx, e + l.tpks_dx] %}
    {% if not v.homed %}{action_raise_error("BR: run BR_HOME first")}{% endif %}
    {% if (v.zpos - l.z_tpks_slide)|abs > 0.01 %}{action_raise_error("BR: TPK-S slide refused: Z %.2f is not at the slide depth %.2f" % (v.zpos, l.z_tpks_slide))}{% endif %}
    {% if v.xpos not in ok or to not in ok or (v.xpos != e and to != e) %}{action_raise_error("BR: TPK-S slide refused: only between the entry %.2f and a spot (from %.2f to %.2f)" % (e, v.xpos, to))}{% endif %}
    MANUAL_STEPPER_BASE STEPPER=rig_x MOVE={to} SPEED={l.tpks_slide_speed} ACCEL={l.tpks_slide_accel} SYNC=1
    SET_GCODE_VARIABLE_BASE MACRO=_BR VARIABLE=xpos VALUE={to}

[gcode_macro _BR_COMB_PARK]
description: internal: SIDE=-1|1.  Set the mounted eight-channel tips down in the spot entry + SIDE x dx: entry, above, slide depth, slide, seat in the detent, strip at the force current in 0.2 mm steps logging LC-2
gcode:
    {% set l = printer["gcode_macro _BRL"] %}
    {% set v = printer["gcode_macro _BR"] %}
    {% set sd = params.SIDE|int %}
    {% set zs = l.z_tpks_slide + l.tpks_seat_mm %}
    {% if sd not in (-1, 1) %}{action_raise_error("BR: SIDE must be -1 or 1")}{% endif %}
    {% if l.comb_side != 0 %}{action_raise_error("BR: a set is already parked (side %d): re-pick it first" % l.comb_side)}{% endif %}
    _BR_Z TO=0 SPEED=20
    _BR_X TO={l.x_tpks_entry} SPEED=100
    _BR_LC_READY LC=comb
    SET_GCODE_VARIABLE_BASE MACRO=_BR VARIABLE=peak VALUE=0.0
    G4 P{v.settle_ms}
    _BR_Z TO={l.z_tpks_above} SPEED=20
    _BR_Z TO={l.z_tpks_slide} SPEED=10
    M400
    _BR_FORCE LC=comb TAG=entry
    _BR_TSLIDE TO={l.x_tpks_entry + sd * l.tpks_dx}
    M400
    _BR_FORCE LC=comb TAG=slide
    _BR_STRIKE_CHECK
    _BR_Z TO={zs} SPEED=5
    SET_GCODE_VARIABLE_BASE MACRO=_BR VARIABLE=peak VALUE=0.0
    SET_TMC_CURRENT_BASE STEPPER=rig_z CURRENT={v.force_current}
    {% for j in range(1, (l.tpks_strip_mm / 0.2 + 0.5)|int + 1) %}
    _BR_Z TO={zs - j * 0.2} SPEED=5
    M400
    _BR_FORCE LC=comb TAG=strip I={j} POS={zs - j * 0.2}
    {% endfor %}
    SET_TMC_CURRENT_BASE STEPPER=rig_z CURRENT={v.run_current}
    _BR_STRIP_CHECK
    _BR_Z TO=0 SPEED=20
    SET_GCODE_VARIABLE_BASE MACRO=_BRL VARIABLE=comb_side VALUE={sd}

[gcode_macro _BR_STRIKE_CHECK]
gcode:
    {% if printer["gcode_macro _BR"].peak > printer["gcode_macro _BRL"].strike_max_n %}
    _BR_FAIL MSG="CT-0c STRIKE: {'%.1f' % printer['gcode_macro _BR'].peak} N on LC-2 during the entry or slide (> {printer['gcode_macro _BRL'].strike_max_n} N): tips in the comb, inspect"
    {% endif %}

[gcode_macro _BR_STRIP_CHECK]
gcode:
    {% set v = printer["gcode_macro _BR"] %}
    RESPOND MSG="BR_RESULT strip_tpks peak_N={'%.1f' % v.peak} (machine LH_TIP_PARK strip_force_measured_n; limit 174 N)"
    {% if v.peak < printer["gcode_macro _BRL"].strip_min_n %}
    _BR_FAIL MSG="CT-0c: strip force {'%.1f' % v.peak} N: the tips did not come off at the strip (tip left on a nozzle)"
    {% endif %}

[gcode_macro _BR_COMB_REPICK]
description: internal: re-pick the parked set: bare nozzles over its spot, force-switch-ended pick-up in 0.1 mm steps (window 6 mm, ends 0.5 mm past the seat), Z up to the slide depth, slide to the entry, up
gcode:
    {% set l = printer["gcode_macro _BRL"] %}
    {% set v = printer["gcode_macro _BR"] %}
    {% set sd = l.comb_side %}
    {% set zs = l.z_tpks_slide + l.tpks_seat_mm %}
    {% if sd == 0 %}{action_raise_error("BR: nothing parked in the rig comb")}{% endif %}
    _BR_Z TO=0 SPEED=20
    _BR_X TO={l.x_tpks_entry + sd * l.tpks_dx} SPEED=100
    G4 P{v.settle_ms}
    _BR_Z TO={l.z_tpks_above} SPEED=20
    _BR_Z TO={zs + 0.5 - 6.0} SPEED=10
    SET_GCODE_VARIABLE_BASE MACRO=_BR VARIABLE=tripped VALUE=0
    SET_TMC_CURRENT_BASE STEPPER=rig_z CURRENT={v.force_current}
    M400
    {% for i in range(1, 61) %}
    _BR_TPICK_STEP Z={zs + 0.5 - 6.0 + i * 0.1} I={i}
    {% endfor %}
    SET_TMC_CURRENT_BASE STEPPER=rig_z CURRENT={v.run_current}
    _BR_TPICK_END
    _BR_Z TO={l.z_tpks_slide} SPEED=5
    M400
    _BR_TSLIDE TO={l.x_tpks_entry}
    _BR_Z TO={l.z_tpks_above} SPEED=10
    _BR_Z TO=0 SPEED=20
    SET_GCODE_VARIABLE_BASE MACRO=_BRL VARIABLE=comb_side VALUE=0

[gcode_macro _BR_TPICK_STEP]
gcode:
    {% if printer["gcode_macro _BR"].tripped == 0 %}
    {% if printer["gcode_button rig_force"].state == "PRESSED" %}
    SET_GCODE_VARIABLE_BASE MACRO=_BR VARIABLE=tripped VALUE=1
    {% else %}
    _BR_Z TO={params.Z} SPEED=2
    M400
    {% endif %}
    {% endif %}

[gcode_macro _BR_TPICK_END]
gcode:
    {% if printer["gcode_macro _BR"].tripped == 0 %}
    _BR_FAIL MSG="CT-0c: no force-switch trip at the re-pick (collar not in its pocket, or a strike): inspect"
    {% endif %}

[gcode_macro BR_CT_COMB]
description: N=<1..50>.  CT-0c: N park / re-pick cycles of the mounted set of real p300 tips in RANDOM spot order (Jinja random per cycle); stops at a strike, a missed re-pick trip or a strip that took no tips
gcode:
    {% set v = printer["gcode_macro _BR"] %}
    _BR_NEED_HOME
    {% if v.mounted not in ("coupling", "pipette_8ch_300") %}{action_raise_error("BR_CT_COMB: mount the M300 (coupling or pipette_8ch_300) with tips on")}{% endif %}
    {% if params.N|int < 1 or params.N|int > 50 %}{action_raise_error("BR_CT_COMB: N must be 1..50 (the host repeats the call to 500)")}{% endif %}
    {% for i in range(params.N|int) %}
    _BR_COMB_CYCLE I={i}
    {% endfor %}

[gcode_macro _BR_COMB_CYCLE]
gcode:
    {% set sd = [-1, 1]|random %}
    _BR_COMB_PARK SIDE={sd}
    _BR_COMB_REPICK
    _BR_COMB_COUNT SIDE={sd}

[gcode_macro _BR_COMB_COUNT]
gcode:
    {% set l = printer["gcode_macro _BRL"] %}
    SET_GCODE_VARIABLE_BASE MACRO=_BRL VARIABLE=comb_done VALUE={l.comb_done + 1}
    RESPOND MSG="BR_COMB_CYCLE n={l.comb_done + 1} spot={params.SIDE} ok"

[gcode_macro BR_CT_STRIP_TPKS]
description: [SIDE=1].  CT-9 strip force for the machine: park the mounted set in one TPK-S spot (strip logged on LC-2 at the force current), re-pick it.  Reply: BR_RESULT strip_tpks peak_N=<n> (enter it as LH_TIP_PARK strip_force_measured_n)
gcode:
    _BR_NEED_HOME
    _BR_COMB_PARK SIDE={params.SIDE|default(1)|int}
    _BR_COMB_REPICK

[gcode_macro _BR_EX_COUNT]
gcode:
    {% set l = printer["gcode_macro _BRL"] %}
    SET_GCODE_VARIABLE_BASE MACRO=_BRL VARIABLE=ex_done VALUE={l.ex_done + params.N|int}
    RESPOND MSG="BR_EXCHANGES done={l.ex_done + params.N|int} detected={l.ex_detected}"

[gcode_macro BR_CT_CODE_READ]
description: CT-8: EXPECT=<tool>.  One read after an insertion; counts reads and misreads (pass: no misread in 1,000)
gcode:
    {% set l = printer["gcode_macro _BRL"] %}
    {% if params.EXPECT|default("") not in l.codes %}{action_raise_error("BR_CT_CODE_READ: EXPECT must be a tool code name")}{% endif %}
    {% set ns = namespace(code=0) %}
    {% for i in range(4) %}{% if printer["gcode_button rig_hall" ~ i].state == "PRESSED" %}{% set ns.code = ns.code + 2 ** i %}{% endif %}{% endfor %}
    {% set bad = ns.code != l.codes[params.EXPECT] %}
    SET_GCODE_VARIABLE_BASE MACRO=_BRL VARIABLE=reads VALUE={l.reads + 1}
    {% if bad %}
    SET_GCODE_VARIABLE_BASE MACRO=_BRL VARIABLE=misreads VALUE={l.misreads + 1}
    {% endif %}
    RESPOND MSG="BR_CODE_READ n={l.reads + 1} expect={params.EXPECT} code={ns.code} misreads={l.misreads + (1 if bad else 0)}"

[gcode_macro BR_SYRINGE_HOME]
description: Retract the syringe prototype pusher to its switch (back off and home again)
gcode:
    _BR_NEED_HOME
    _BR_PUSHER_HOME STEPPER=rig_syringe
    SET_GCODE_VARIABLE_BASE MACRO=_BRL VARIABLE=syringe_homed VALUE=1

[gcode_macro BR_SYRINGE]
description: TO=<mm 0..35> [SPEED=<mm/s>, max 5].  Direct-drive syringe stroke (non-contact dispense tests, CT-SYR: smallest clean volume, refill by the plunger return spring, contact window); refuses until homed and outside 0..35 mm
gcode:
    {% set l = printer["gcode_macro _BRL"] %}
    _BR_NEED_HOME
    {% if not l.syringe_homed %}{action_raise_error("BR_SYRINGE: run BR_SYRINGE_HOME first")}{% endif %}
    {% if params.TO|float < 0 or params.TO|float > 35 %}{action_raise_error("BR_SYRINGE: TO outside 0..35 mm (the pusher stroke)")}{% endif %}
    {% if params.SPEED|default(2)|float > 5 %}{action_raise_error("BR_SYRINGE: SPEED above 5 mm/s")}{% endif %}
    MANUAL_STEPPER_BASE STEPPER=rig_syringe MOVE={params.TO|float} SPEED={params.SPEED|default(2)|float} SYNC=1

# ---------------- W5 command audit (electronics/lh1/system.yaml firmware_command_audit, column 'rig') ----------------
[gcode_macro MANUAL_STEPPER]
rename_existing: MANUAL_STEPPER_BASE
gcode:
    {action_raise_error("MANUAL_STEPPER refused on the rig: use BR_ macros (_BR_Z / _BR_X carry the guards)")}

[gcode_macro SET_GCODE_VARIABLE]
rename_existing: SET_GCODE_VARIABLE_BASE
gcode:
    {action_raise_error("SET_GCODE_VARIABLE refused on the rig: the rig state is changed only by the BR_ macros (edit bench_rig.cfg and RESTART for settings)")}

[gcode_macro RESTORE_GCODE_STATE]
rename_existing: RESTORE_GCODE_STATE_BASE
gcode:
    {action_raise_error("RESTORE_GCODE_STATE refused on the rig")}

[gcode_macro MANUAL_PROBE]
rename_existing: MANUAL_PROBE_BASE
gcode:
    {action_raise_error("MANUAL_PROBE refused on the rig")}

[gcode_macro STEPPER_BUZZ]
rename_existing: STEPPER_BUZZ_BASE
gcode:
    {action_raise_error("STEPPER_BUZZ refused on the rig: it moves an axis outside the guards")}

[gcode_macro FORCE_MOVE]
gcode:
    {action_raise_error("FORCE_MOVE refused: [force_move] enable_force_move stays False")}

[gcode_macro SET_KINEMATIC_POSITION]
gcode:
    {action_raise_error("SET_KINEMATIC_POSITION refused: [force_move] enable_force_move stays False")}

[gcode_macro SET_TMC_CURRENT]
rename_existing: SET_TMC_CURRENT_BASE
gcode:
    {action_raise_error("SET_TMC_CURRENT refused on the rig: currents are set only in bench_rig.cfg")}

[gcode_macro SET_TMC_FIELD]
rename_existing: SET_TMC_FIELD_BASE
gcode:
    {action_raise_error("SET_TMC_FIELD refused on the rig")}

[gcode_macro SET_STEPPER_ENABLE]
rename_existing: SET_STEPPER_ENABLE_BASE
gcode:
    {action_raise_error("SET_STEPPER_ENABLE refused on the rig: use M84 (clears the homed state)")}

[gcode_macro M18]
rename_existing: M18.1
gcode:
    _BR_MOTORS_OFF
    M18.1

[gcode_macro M84]
rename_existing: M84.1
gcode:
    _BR_MOTORS_OFF
    M84.1

[gcode_macro _BR_MOTORS_OFF]
gcode:
    SET_GCODE_VARIABLE_BASE MACRO=_BR VARIABLE=homed VALUE=0
    SET_GCODE_VARIABLE_BASE MACRO=_BR VARIABLE=xpos VALUE=-1.0
    SET_GCODE_VARIABLE_BASE MACRO=_BRL VARIABLE=syringe_homed VALUE=0
    RESPOND MSG="BR motors off: homed state cleared, BR_HOME needed"
