rules:
- id: K1_C1_lid_parked
  rule: no tool below z 129 over nest C1 unless the TC-1 lid is parked (OPEN)
  numbers:
    lid_closed_top_z_over_C1: 127.0
    lid_raised_top_z: 127.0
    interlock_class_overlaps_found: 55
- id: K2_lid_moves_only_clear
  rule: the TC-1 lid may move (lift, slide, clamp) only while no tool part is below z_min inside the x/y box
  numbers:
    z_min: 140.0
    x:
    - -255.0
    - -60.0
    y:
    - -10.0
    - 230.0
    lid_group_max_z_any_state: 127.0
    strip_parts_x:
    - -249.0
    - -193.5
- id: K2b_parked_lid_volume
  rule: 'with the lid parked (OPEN) this box beside D2 is occupied: treat it as a fixed obstacle'
  numbers:
    box_xyz:
    - -249.0
    - -66.0
    - 93.8
    - 213.3
    - 5.0
    - 127.0
- id: K10_x_endstop
  rule: 'X homes to +X: position_endstop = position_max = X_ENDSTOP_TRIP_X (flag tip 155.5 local, lever trips at 295)'
  numbers:
    X_ENDSTOP_TRIP_X: 295.0
    flag_tip_local_x: 155.5
    carriage_x_collision_free:
    - -303.34
    - 303.34
- id: K3_D1_park
  rule: nothing placed in D1; no tool below z 129 over D1
  numbers:
    parked_lid_top_z: 127.0
- id: K4_C2_overhang
  rule: labware in C2 must not overhang x < -66 (TC-1 lid skirt)
  numbers:
    TC1_LID_SKIRT_X: -66.0
- id: K5_8ch_edge_columns
  rule: an eight-channel tool working column 1 (or 12) of a nest keeps its manifold bottom (nozzle z + nozzle length) at least 2 mm above the
    labware top in the -X (or +X) neighbour nest
  numbers:
    pipette_8ch_50:
      manifold_half_width_x: 16.0
      nozzle_length_below_manifold: 14.0
      lateral_gap_to_neighbour_labware_footprint_mm: 2.62
    pipette_8ch_300:
      manifold_half_width_x: 18.0
      nozzle_length_below_manifold: 18.0
      lateral_gap_to_neighbour_labware_footprint_mm: 0.62
- id: K6_neighbour_heights
  rule: for any lowered tool, at each height band the body envelope (tools.*.body_envelope_by_height_above_working_end) must stay 2 mm from every
    neighbouring labware footprint whose top is above that band
  numbers:
    MAX_LABWARE_H: 150.0
- id: K7_tip_strip
  rule: tips are stripped only at A1 on the TW-4D comb with the listed moves (enter below the comb at nozzle z, slide x0 -> x1, lift)
  numbers:
    pipette_8ch_50:
      nozzle_z: 44.75
      nest_x0: -22.0
      nest_x1: 9.0
      nest_y: 0.0
    pipette_8ch_300:
      nozzle_z: 44.5
      nest_x0: -22.0
      nest_x1: 9.0
      nest_y: 0.0
    pipette_small:
      nozzle_z: 42.0
      nest_x0: 46.0
      nest_x1: 26.0
      nest_y: 0.0
- id: K8_B3_C3_under_deck
  rule: 'rev J: a module in B3 or C3 must not reach below z -93 (TEC-1166 cold-block controller on the CEP plate; the D3 board reservation is
    retired)'
  numbers:
    reserved_box:
    - 66.0
    - 176.0
    - -362.0
    - -182.0
    - -133.0
    - -93.0
- id: K9_transit
  rule: XY moves only with every Z axis up; lowest point then z 160 (tips 179); deck objects <= 150
  numbers:
    tc1_max_z: 127.0
- id: KN_11
  rule: 'head:pipette@3 within 0.62 mm of deck:C2_tipframe in: pipette_8ch_300 lowered at C3 col1 x=-24 yf=+158 s=188; software keeps the tool
    2 mm higher than that position or avoids it'
  numbers:
    min_clearance_mm: 0.62
    at_xyz:
    - 64.2
    - 12.3
    - 69.0
