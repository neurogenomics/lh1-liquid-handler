geometry_changed:
  head:
    CP-1_carriage_plate: 16 X-block holes + 4 XBC-1 clamp holes now ISO 10642 M3 countersunk from the front; 2 holes for MBB-1, 2 for XFL-1; plate
      back face at local y -15 (on XSP-1 spacers)
    XBC-1_x_belt_clamp: 3 mm to the beam face and to the free upper belt run (y -15..-3, z 33..54); groove open to the back; 4 x M3 tapped from
      the front
    CCA-1_cable_chain_anchor: chain attach face raised to local z 90 (50 mm bend height, CR-01)
    ZMB-1/ZBH-1/ZC-1/ZSW-1/TP-1: whole Z-axis set 2 mm forward with the plate (screw axis = plate front - 12)
    GR-1_gripper_bracket: arm shortened to tool-frame y -107 (front-member clearance)
    HP-1_cradle_back_plate_small: 'slimmed: bottom edge at tool-frame z -27 (was -70)'
    HP-1/2/3/4/5 small: 'single-channel handle at x +1.5 and y -31 (tool frame): nozzle on the tool reference (local -109.5, -80)'
    hand_pipette_small (envelope): lowest 20 mm modelled as a 4.5 mm tip cone (measure)
    HP-4 (all three): no geometry change; HP-6 post and switch added on its strip
  deck_modules:
    DK-1_deck_plate: TC bay sub-plate region (x <= -41, 0 <= y <= 225) removed; bay window front edge y 13 (was 16); y=0 joint holes moved to
      x -205/-58; shared csk hole at (-41,110); 2 x M4 TC-1 strip holes
    TW-1_tip_waste_insert_plate: 4 x M3 tapped for the TW-4D comb feet (old TW-4 M3 taps removed)
    TW-2_tip_funnel: bin rails 1 mm lower (rail z -51)
    TW-3_tip_bin: 1 mm lower (top z -48.5, 2.5 mm under the y=-225 beam)
    deck_assembly: RES_tec_board_C3 reserved under D3 (x 72..192, y 100..188, z -136..-102)
  thermocycler:
    TC-02_heat_sink: 1 mm relief on the base top outside the deck window (2 mm to the deck)
    TC-04_fan_duct: top 1 mm lower
    TC-05_electronics_tray: 4 x M3 for the TCB1 board standoffs
    TC-22_bridge: lowered to z 87
    TC-23_ymotor_bracket: foot starts x -238 (was -242)
    B_guide_pins_D8: top z 93 (was 96)
    B_clamp_motor_Tr8x2: NEMA17 x 34 body (was x 40)
    B_drag_chain: inner 6 x 8, outer 9.5 x 12 (CR-11)
    TC-01_top_plate: unchanged since rev C (M4 strip clearance holes)
  frame_gantry:
    YC_y_carriage: 8 beam bolts moved inboard to x 405..450
    TUBE_X_beam: 4 x D8 access holes through both walls over the rear-block screws
    DP_deck_post: 2 x M5 tapped in the +X face
    ESY_y_endstop_bracket: qty 2 (mirror at front right)
    RES_y_cable_chain: top z 442 (CR-02)
    RES_electronics_bay: replaced by the CR-07 control bay (CBP, VBP, CBC)
    params-derived: Y travel window beam-front y -120..280 (tool reference -80); X bracket faces follow X_BELT_LOCAL_Y -7.5
