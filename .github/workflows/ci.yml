name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    # the organisation's own runner; GitHub-hosted only for pull requests from forks
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","lab-sandbox"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Private-content checker
        run: python tools/check_no_private_content.py
      - name: Electrical design check
        run: python electronics/lh1/check.py > /dev/null
      - name: Firmware guard-case check
        run: python electronics/lh1/fw_render_check.py > /dev/null
      - name: Tests
        run: pytest -q tests
