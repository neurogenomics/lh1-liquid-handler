name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Private-content checker
        run: python tools/check_no_private_content.py
      - name: Electrical design check
        run: python electronics/lh1/check.py > /dev/null
      - name: Firmware guard-case check
        run: python electronics/lh1/fw_render_check.py > /dev/null
      - name: Tests
        run: pytest -q tests
